            deleteHistory(id) {
                const e = this.loadHistory().find(x => x.id === id);
                if (!e) return;
                this.askConfirm(`¿Eliminar del histórico el partido ${e.match.homeTeam} ${e.homeGoals}-${e.awayGoals} ${e.match.awayTeam}? Esta acción no se puede deshacer.`, () => {
                    this.history = this.loadHistory().filter(x => x.id !== id);
                    this.persistHistory();
                    this.historyDetailId = null;
                    this.render();
                    this.showToast('Partido eliminado del histórico');
                }, 'Eliminar');
            }

            exportHistoryCSV(id) {
                const e = this.loadHistory().find(x => x.id === id);
                if (!e) return;
                const m = e.match;
                const header = ['Competicion', 'EquipoLocal', 'EquipoVisitante', 'Jornada', 'Fecha', 'Jugador', 'Dorsal', 'Posicion',
                    'Capitan', 'MinutosJugados', 'Goles', 'Asistencias', 'TarjetasAmarillas', 'TarjetaRoja'].join(',');
                const rows = e.players.map(p => [
                    csvCell(m.competition), csvCell(m.homeTeam), csvCell(m.awayTeam), csvCell(m.matchday), csvCell(m.date),
                    csvCell(p.name), p.number, p.position, p.captain ? 'Sí' : 'No', p.mins, p.goals, p.assists, p.yellow, p.red ? 'Sí' : 'No'
                ].join(','));
                const fileName = 'Historico_' + safeFile(m.date) + '_' + safeFile(m.homeTeam) + '_vs_' + safeFile(m.awayTeam) + '.csv';
                this.downloadCSV(fileName, [header, ...rows].join('\r\n') + '\r\n');
            }

            exportHistoryJSON() {
                const list = this.loadHistory();
                if (list.length === 0) { alert('No hay partidos en el histórico para exportar.'); return; }
                const data = { app: 'StatBench360', version: 1, exportedAt: new Date().toISOString(), matches: list };
                this.downloadFile('historico_statbench_' + localDate() + '.json', JSON.stringify(data, null, 1), 'application/json');
            }

            importHistoryJSON(event) {
                const input = event.target;
                const file = input.files && input.files[0];
                input.value = '';
                if (!file) return;
                if (file.size > 5 * 1024 * 1024) { alert('El archivo es demasiado grande (máximo 5 MB).'); return; }
                const reader = new FileReader();
                reader.onerror = () => alert('No se pudo leer el archivo.');
                reader.onload = e => {
                    let incoming;
                    try {
                        const data = JSON.parse(String(e.target.result));
                        incoming = Array.isArray(data) ? data : data && data.matches;
                    } catch (err) { incoming = null; }
                    if (!Array.isArray(incoming)) { alert('El archivo no es una copia válida del histórico de StatBench360.'); return; }
                    const list = this.loadHistory();
                    const ids = new Set(list.map(x => x.id));
                    let added = 0;
                    incoming.slice(0, MAX_HISTORY).map(sanitizeHistoryEntry).filter(Boolean).forEach(entry => {
                        if (!ids.has(entry.id) && list.length < MAX_HISTORY) { list.push(entry); ids.add(entry.id); added++; }
                    });
                    if (added > 0) this.persistHistory();
                    this.render();
                    this.showToast(added > 0 ? `Se han importado ${added} partidos` : 'No había partidos nuevos que importar');
                };
                reader.readAsText(file);
            }

            // ============================ IMPORTAR LISTA PEGADA ============================
            isMatchLive() { return this.state.match.status !== 'setup'; }

            openPasteSquadModal() {
                if (this.isMatchLive()) {
                    alert('No se puede cambiar la plantilla con un partido en curso o terminado. Pulsa "Resetear / Nuevo" primero.');
                    return;
                }
                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 flex items-center justify-center p-3">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-md max-h-[92vh] overflow-y-auto rounded-3xl p-5 shadow-2xl relative space-y-3">
                            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            <h3 class="font-bold text-base text-white pr-6">Pegar lista de jugadores</h3>
                            <p class="text-xs text-slate-300 leading-relaxed">Copia la lista desde donde la tengas (una web, Excel, un documento, WhatsApp…) y pégala aquí. Antes de importarla podrás revisarla.</p>
                            <div class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-[11px] text-slate-300 leading-relaxed">
                                <b class="text-lasalle-yellow">Formatos válidos</b><br>
                                • Un jugador por línea: <code class="text-lasalle-yellow">9 Juan Pérez</code><br>
                                • Una tabla copiada con columnas Dorsal, Jugador y Posición.<br>
                                • Nombres como "Pérez García, Juan" se convierten en "Juan Pérez García".
                            </div>
                            <textarea id="paste-squad" maxlength="100000" placeholder="Pega aquí la lista de jugadores…" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white h-44 resize-none"></textarea>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="app.closeModal()" class="bg-slate-800 text-slate-200 font-bold py-2.5 rounded-xl text-sm">Cancelar</button>
                                <button onclick="app.reviewPastedSquad()" class="bg-lasalle-yellow text-lasalle-darkblue font-black py-2.5 rounded-xl text-sm">Revisar lista</button>
                            </div>
                        </div>
                    </div>`;
            }

            reviewPastedSquad() {
                const ta = document.getElementById('paste-squad');
                const src = ta ? ta.value : '';
                if (!src || src.trim().length < 3) { alert('Pega primero la lista de jugadores.'); return; }
                const players = parseSquadText(src);
                if (players.length === 0) {
                    alert('No se han encontrado jugadores. Escribe un jugador por línea con su dorsal, por ejemplo: 9 Juan Pérez.');
                    return;
                }
                this._pendingSquad = players;
                const auto = players.some(p => p.auto);
                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 flex items-center justify-center p-3">
                        <div class="bg-slate-900 border border-lasalle-yellow/40 w-full max-w-md max-h-[92vh] rounded-3xl p-5 shadow-2xl flex flex-col space-y-3">
                            <h3 class="font-bold text-base text-white">Confirmar importación</h3>
                            <p class="text-xs text-slate-300">Se han detectado <b class="text-lasalle-yellow">${players.length} jugadores</b>. Revisa los nombres y dorsales:</p>
                            <div class="flex-1 overflow-y-auto space-y-1 min-h-[6rem]">
                                ${players.map(p => `
                                    <div class="flex items-center justify-between bg-slate-950 px-2.5 py-1.5 rounded-xl text-xs">
                                        <span class="font-bold text-lasalle-yellow w-9">#${p.num}${p.auto ? '*' : ''}</span>
                                        <span class="flex-1 text-slate-200 truncate font-semibold">${esc(p.name)}</span>
                                        <span class="text-[10px] text-slate-400">${esc(p.pos)}</span>
                                    </div>`).join('')}
                            </div>
                            ${auto ? '<p class="text-[10px] text-slate-400">* La lista no traía dorsal (o estaba repetido) y se ha asignado uno automático.</p>' : ''}
                            <div class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-[11px] text-slate-300 leading-relaxed">
                                <b>Sustituir</b>: reemplaza los ${this.state.squad.length} jugadores actuales y deja a los nuevos en el banquillo.<br>
                                <b>Añadir</b>: suma solo los que aún no estén en la plantilla actual.
                            </div>
                            <div class="grid grid-cols-1 gap-2">
                                <button onclick="app.applyPastedSquad('replace')" class="bg-lasalle-yellow text-lasalle-darkblue font-black py-2.5 rounded-xl text-sm">Sustituir plantilla</button>
                                <button onclick="app.applyPastedSquad('add')" class="bg-slate-800 text-lasalle-yellow font-bold py-2.5 rounded-xl text-sm">Añadir a la plantilla actual</button>
                                <button onclick="app.cancelPastedSquad()" class="bg-slate-900 border border-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-sm">Cancelar</button>
                            </div>
                        </div>
                    </div>`;
            }

            cancelPastedSquad() {
                this._pendingSquad = null;
                this.closeModal();
            }

            applyPastedSquad(mode) {
                const pending = this._pendingSquad;
                this._pendingSquad = null;
                this.closeModal();
                if (!pending) return;
                if (this.isMatchLive()) { alert('No se puede cambiar la plantilla con un partido en curso o terminado.'); return; }
                const make = (p, num, status) => ({
                    id: newId('p'), name: p.name, number: num, position: p.pos, status,
                    inMinute: null, outMinute: null, goals: 0, goalMinutes: [], goalTypes: [], assists: 0, yellowCards: 0, redCard: false, captain: false
                });

                if (mode === 'replace') {
                    this.state.squad = pending.map(p => make(p, p.num, 'bench'));
                    this.state.selectedPlayerIds.clear();
                    this.render();
                    this.showToast(`Plantilla sustituida: ${pending.length} jugadores en el banquillo. Elige ahora los titulares.`);
                    return;
                }

                const names = new Set(this.state.squad.map(p => p.name.toLowerCase()));
                const used = new Set(this.state.squad.map(p => p.number));
                let added = 0, already = 0, renumbered = 0;
                pending.forEach(p => {
                    if (names.has(p.name.toLowerCase())) { already++; return; }
                    if (this.state.squad.length >= 100) return;
                    let num = p.num;
                    if (used.has(num)) {
                        num = 1;
                        while (used.has(num) && num <= 99) num++;
                        if (num > 99) return;
                        renumbered++;
                    }
                    used.add(num);
                    names.add(p.name.toLowerCase());
                    this.state.squad.push(make(p, num, 'unconvoked'));
                    added++;
                });
                this.render();
                this.showToast(`Añadidos ${added} jugadores` + (already ? ` · ${already} ya estaban` : '') + (renumbered ? ` · ${renumbered} con dorsal nuevo` : ''));
            }

            downloadSquadCSV() {
                if (this.state.squad.length === 0) {
                    alert('No hay jugadores en la plantilla para descargar.');
                    return;
                }
                const csv = this.state.squad.map(p => [p.number, csvCell(p.name)].join(',')).join('\r\n') + '\r\n';
                this.downloadCSV('plantilla_statbench_' + (safeFile(this.state.match.homeTeam) || 'equipo') + '.csv', csv);
            }

            downloadCSV(fileName, csv) {
                this.downloadFile(fileName, '\uFEFF' + csv, 'text/csv;charset=utf-8;');
            }

            updateAudioSettings() {
                const enabledEl = document.getElementById('audio-enabled');
                const intervalEl = document.getElementById('audio-interval');
                if (enabledEl) this.state.audioAlerts.enabled = enabledEl.value === 'true';
                if (intervalEl) this.state.audioAlerts.intervalMinutes = parseInt(intervalEl.value);
                this.saveToStorage();
            }

            updateMatchMeta() {
                const val = id => { const el = document.getElementById(id); return el ? el.value : null; };
                const m = this.state.match;
                const home = val('set-home'), away = val('set-away'), comp = val('set-competition');
                const day = val('set-matchday'), date = val('set-date'), dur = val('set-duration');
                if (home !== null) m.homeTeam = cleanText(home, 40);
                if (away !== null) m.awayTeam = cleanText(away, 40);
                if (comp !== null) m.competition = cleanText(comp, 60);
                if (day !== null) m.matchday = cleanText(day, 10);
                if (date !== null && /^\d{4}-\d{2}-\d{2}$/.test(date)) m.date = date;
                if (dur !== null) {
                    const d = parseInt(dur, 10);
                    if (d >= 1 && d <= 120) m.halfDuration = d;
                }
                this.saveToStorage();
            }

            setMatchCondition(isHome) {
                this.state.match.isHome = isHome;
                this.render();
            }

            startMatch() {
                if (!this.state.matchResetted) {
                    alert('Debes resetear los valores o iniciar un nuevo partido antes de continuar.');
                    return;
                }

                const startersCount = this.state.squad.filter(p => p.status === 'starter').length;
                if (startersCount !== 11) {
                    if (!confirm(`Atención: Hay ${startersCount} jugadores titulares seleccionados en lugar de 11. ¿Deseas iniciar el partido de todas formas?`)) {
                        return;
                    }
                }

                const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
                const duration = parseInt(val('set-duration'), 10);
                const date = val('set-date');
                const m = this.state.match;

                m.homeTeam = cleanText(val('set-home'), 40) || 'Equipo Local';
                m.awayTeam = cleanText(val('set-away'), 40) || 'Equipo Visitante';
                m.competition = cleanText(val('set-competition'), 60) || 'Liga Oficial';
                m.matchday = cleanText(val('set-matchday'), 10) || '1';
                m.date = /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : localDate();
                m.halfDuration = (duration >= 1 && duration <= 120) ? duration : 45;
                m.status = 'first_half';
                m.currentHalf = 1;
                m.timerSeconds = 0;
                m.halftimeSeconds = 0;
                m.halftimeStartMs = null;
                m.timerRunning = true;
                m.lastTickMs = Date.now();
                this.state.matchResetted = false;
                this.state.undoStack = [];
                m.matchId = newId('m');
                // Guarda la convocatoria inicial para poder empezar otro partido con la misma plantilla
                this.state.squad.forEach(p => { p.initialStatus = p.status; });

                this.startTimerInterval();
                this.switchTab('dashboard');
            }

            // El cronómetro se calcula con la hora real (Date.now) y no cuenta "ticks":
            // así no se desfasa si el móvil ralentiza el temporizador o bloquea la pantalla.
            syncTimer() {
                const m = this.state.match;
                if (!m.timerRunning || m.status === 'setup' || m.status === 'halftime' || m.status === 'finished') {
                    m.lastTickMs = null;
                    return;
                }
                const now = Date.now();
                if (!m.lastTickMs || now < m.lastTickMs) { m.lastTickMs = now; return; }
                const delta = Math.floor((now - m.lastTickMs) / 1000);
                if (delta <= 0) return;
                m.lastTickMs += delta * 1000;
                const prev = m.timerSeconds;
                m.timerSeconds += delta;
                this.checkAudioAlerts(prev);
            }

            syncHalftime() {
                const m = this.state.match;
                if (m.status !== 'halftime') return;
                if (!m.halftimeStartMs) m.halftimeStartMs = Date.now() - m.halftimeSeconds * 1000;
                m.halftimeSeconds = Math.max(0, Math.floor((Date.now() - m.halftimeStartMs) / 1000));
            }

            refreshTimerDisplay() {
                const t = document.getElementById('match-timer');
                if (t) t.textContent = this.formatTime(this.state.match.timerSeconds);
                const h = document.getElementById('halftime-timer');
                if (h) {
                    this.syncHalftime();
                    h.textContent = this.formatTime(this.state.match.halftimeSeconds);
                }
            }

            startTimerInterval() {
                if (this.timerHandle) clearInterval(this.timerHandle);
                this.timerHandle = setInterval(() => {
                    this.syncTimer();
                    this.refreshTimerDisplay();
                    if (this.state.match.timerRunning) this.saveToStorage();
                }, 1000);
            }

            goToHalftime() {
                const m = this.state.match;
                if (m.status !== 'first_half') return;
                this.syncTimer();
                m.status = 'halftime';
                m.timerRunning = false;
                m.lastTickMs = null;
                if (this.timerHandle) { clearInterval(this.timerHandle); this.timerHandle = null; }
                // El cronómetro del descanso arranca automáticamente
                m.halftimeSeconds = 0;
                m.halftimeStartMs = Date.now();
                this.startHalftimeInterval();
                this.saveToStorage();
                this.render();
            }

            // Por si se pulsa "Ir al descanso" por error: vuelve a la 1ª parte donde se quedó
            cancelHalftime() {
                const m = this.state.match;
                if (m.status !== 'halftime') return;
                if (this.halftimeHandle) { clearInterval(this.halftimeHandle); this.halftimeHandle = null; }
                m.status = 'first_half';
                m.currentHalf = 1;
                m.halftimeSeconds = 0;
                m.halftimeStartMs = null;
                m.timerRunning = true;
                m.lastTickMs = Date.now();
                this.startTimerInterval();
                this.saveToStorage();
                this.render();
            }

            startHalftimeInterval() {
                if (this.halftimeHandle) clearInterval(this.halftimeHandle);
                this.halftimeHandle = setInterval(() => {
                    this.refreshTimerDisplay();
                    this.saveToStorage();
                }, 1000);
            }

            startSecondHalf() {
                this.askConfirm('¿Iniciar la 2ª parte?', () => {
                    if (this.halftimeHandle) { clearInterval(this.halftimeHandle); this.halftimeHandle = null; }
                    const m = this.state.match;
                    m.status = 'second_half';
                    m.currentHalf = 2;
                    m.timerSeconds = m.halfDuration * 60;
                    m.timerRunning = true;
                    m.lastTickMs = Date.now();
                    m.halftimeStartMs = null;
                    this.startTimerInterval();
                    this.render();
                }, 'Iniciar 2ª parte');
            }

            toggleTimer() {
                const m = this.state.match;
                if (m.timerRunning) {
                    this.syncTimer();
                    m.timerRunning = false;
                    m.lastTickMs = null;
                } else {
                    m.timerRunning = true;
                    m.lastTickMs = Date.now();
                    if (!this.timerHandle) this.startTimerInterval();
                }
                this.render();
            }

            finishMatch() {
                this.askConfirm('¿Finalizar el encuentro definitivamente?', () => {
                    this.syncTimer();
                    const m = this.state.match;
                    m.status = 'finished';
                    m.timerRunning = false;
                    m.lastTickMs = null;
                    this.stopTimers();
                    const saved = this.saveMatchToHistory(true);
                    this.switchTab('stats');
                    if (saved) this.showToast('Partido guardado en el histórico');
                }, 'Finalizar');
            }

                }
                const secTarget = min * 60;

                    alert('El minuto debe ser posterior al momento actual del partido.');

                if (!this.state.audioAlerts.customAlarms) this.state.audioAlerts.customAlarms = [];

            handleFileOCR(event) {
                const input = event.target;
                const file = input.files && input.files[0];
                input.value = '';
                if (!file) return;

                const isImage = file.type.startsWith('image/');
                const isText = /\.(txt|csv)$/i.test(file.name) || file.type === 'text/plain' || file.type === 'text/csv';
                if (!isImage && !isText) {
                    alert('Formato no admitido. Usa un archivo .txt, .csv o una imagen.');
                    return;
                }
                if (file.size > (isImage ? 8 : 1) * 1024 * 1024) {
                    alert(`El archivo es demasiado grande (máximo ${isImage ? 8 : 1} MB).`);
                    return;
                }

                const loadingEl = document.getElementById('ocr-loading');
                const done = () => { if (loadingEl) loadingEl.classList.add('hidden'); };
                if (loadingEl) loadingEl.classList.remove('hidden');

                if (isImage) {
                    if (typeof Tesseract === 'undefined') {
                        done();
                        alert('El lector de fotos (OCR) no está disponible. Prepáralo con conexión en Inicio > Uso sin conexión.');
                        return;
                    }
                    Tesseract.recognize(file, 'spa').then(({ data: { text } }) => {
                        done();
                        this.parseOCRTextToSquad(text);
                    }).catch(() => {
                        done();
                        alert('Error al procesar la imagen.');
                    });
                } else {
                    const reader = new FileReader();
                    reader.onload = (e) => { done(); this.parseOCRTextToSquad(String(e.target.result)); };
                    reader.onerror = () => { done(); alert('No se pudo leer el archivo.'); };
                    reader.readAsText(file);
                }
            }

            parseOCRTextToSquad(text) {
                const taken = new Set(this.state.squad.map(p => p.number));
                const found = [];
                String(text).replace(/^\uFEFF/, '').split(/\r?\n/).slice(0, 300).forEach(line => {
                    const match = line.match(/^\s*(\d{1,2})(?!\d)\s*[\.\-,;\t]?\s*(.+)/);
                    if (!match) return;
                    const num = parseInt(match[1], 10);
                    let name = match[2].trim().replace(/^[,;]+/, '').trim();
                    name = name.replace(/^"(.*)"$/, '$1').replace(/""/g, '"').replace(/^'(?=[=+\-@])/, '');
                    name = cleanText(name, 40);
                    if (name.length > 2 && !taken.has(num)) {
                        taken.add(num);
                        found.push({ num, name });
                    }
                });
                found.length = Math.min(found.length, Math.max(0, 100 - this.state.squad.length));

                if (found.length === 0) {
                    alert('No se han detectado jugadores nuevos. Formato esperado: dorsal y nombre en cada línea (ej: 9 Juan Pérez).');
                    return;
                }
                const preview = found.slice(0, 25).map(f => `#${f.num} ${f.name}`).join('\n')
                    + (found.length > 25 ? `\n… y ${found.length - 25} más` : '');
                if (!confirm(`Se han detectado ${found.length} jugadores nuevos:\n\n${preview}\n\n¿Añadirlos a la plantilla?`)) return;

                found.forEach(f => {
                    this.state.squad.push({
                        id: newId('p'),
                        name: f.name, number: f.num, position: f.num === 1 ? 'POR' : 'MED',
                        status: 'unconvoked',
                        inMinute: null, outMinute: null, goals: 0, goalMinutes: [], goalTypes: [], assists: 0, yellowCards: 0, redCard: false, captain: false
                    });
                });
                alert(`¡Plantilla actualizada! Se han incorporado ${found.length} jugadores.`);
                this.render();
            }

                                    <option value="normal">Jugada Normal</option>
                                    <option value="penalty">Penalti</option>
                                    <option value="own">Propia Puerta (suma para nosotros)</option>
                                    <option value="freekick">Falta Directa</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-xs text-slate-400">Minuto</label>
                                <input type="number" id="away-goal-min" value="${currentMin}" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                            </div>
                            <button onclick="app.submitGoalRival()" class="w-full bg-rose-600 text-white font-bold py-3 rounded-xl text-sm">Guardar Gol Rival</button>
                        </div>
                    `;
                } else if (type === 'note') {
                    content = `
                        <h3 class="font-bold text-base text-white mb-3">Anotación / Comentario</h3>
                        <div class="space-y-3">
                            <div>
                                <label class="text-xs text-slate-400">Comentario</label>
                                <textarea id="note-text" maxlength="300" placeholder="Ej: Buena presión alta..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white mt-1 h-28 resize-none"></textarea>
                            </div>
                            <div>
                                <label class="text-xs text-slate-400">Minuto</label>
                                <input type="number" id="note-min" value="${currentMin}" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                            </div>
                            <button onclick="app.submitNote()" class="w-full bg-slate-700 text-white font-bold py-3 rounded-xl text-sm">Guardar Nota</button>
                        </div>
                    `;
                }

                container.innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl relative">
                            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            ${content}
                        </div>
                    </div>
                `;

                if (type === 'card_home') {
                    const cardStarters = this.state.squad.filter(p => p.status === 'starter');
                    if (cardStarters.length > 0) this.updateCardTypeOptions(cardStarters[0].id);
                }
                if (type === 'sub_home') this.addSubRow();
                if (type === 'sub_away') this.addAwaySubRow();
            }

            updateCardTypeOptions(playerId) {
                const selectType = document.getElementById('card-type');
                if (!selectType) return;
                const player = this.state.squad.find(p => p.id === playerId);
                if (!player) return;

                if (player.yellowCards > 0) {
                    selectType.innerHTML = `<option value="second_yellow">Doble Amarilla (Expulsión)</option>`;
                } else {
                    selectType.innerHTML = `
                        <option value="yellow">Amarilla</option>
                        <option value="red">Roja Directa</option>
                    `;
                }
            }

            closeModal() { document.getElementById('modal-container').innerHTML = ''; }

            readMinute(id) {
                const el = document.getElementById(id);
                return toInt(el ? el.value : 0, 0, 0, 200);
            }

            homeScore() { return this.state.match.isHome ? this.state.score.local : this.state.score.rival; }
            awayScore() { return this.state.match.isHome ? this.state.score.rival : this.state.score.local; }

            rivalName() {
                return this.state.match.isHome ? this.state.match.awayTeam : this.state.match.homeTeam;
            }

            submitGoalLasalle() {
                const scorerEl = document.getElementById('goal-scorer');
                const scorer = this.state.squad.find(p => p.id === (scorerEl ? scorerEl.value : ''));
                if (!scorer) {
                    alert('No hay ningún titular disponible para anotar el gol.');
                    return;
                }
                const typeVal = document.getElementById('goal-type').value;
                const goalType = GOAL_TYPES.includes(typeVal) ? typeVal : 'normal';
                const isOwn = goalType === 'own';
                const assistId = isOwn ? '' : document.getElementById('goal-assist').value;
                const min = this.readMinute('goal-min');

                if (assistId && scorer.id === assistId) {
                    alert('Error: Un mismo jugador no puede anotar el gol y darse la asistencia a sí mismo.');
                    return;
                }
                const assist = assistId ? this.state.squad.find(p => p.id === assistId) : null;
                const snap = this.takeSnapshot();

                let ev;
                if (isOwn) {
                    // Gol en propia puerta: suma para el rival y no cuenta como gol del jugador
                    this.state.score.rival++;
                    ev = {
                        id: newId('ev'), minute: min, type: 'own_goal', team: 'rival',
                        title: `Gol en propia puerta de #${scorer.number} ${scorer.name} (suma para el rival)`,
                        detail: `Minuto ${min}'`
                    };
                } else {
                    scorer.goals++;
                    scorer.goalMinutes.push(min);
                    scorer.goalTypes.push(goalType);
                    if (assist) assist.assists++;
                    this.state.score.local++;

                    let typeLabel = '';
                    if (goalType === 'penalty') typeLabel = ' (Penalti)';
                    else if (goalType === 'freekick') typeLabel = ' (Falta Directa)';

                    ev = {
                        id: newId('ev'), minute: min, type: 'goal', team: 'local',
                        title: `Gol #${scorer.number} ${scorer.name}${typeLabel}`,
                        detail: assist ? `Asistencia: #${assist.number} ${assist.name}` : 'Sin asistencia'
                    };
                }
                this.commitEvent(ev, snap);
                this.closeModal();
                this.render();
            }

            submitGoalRival() {
                const num = cleanText(document.getElementById('away-goal-num').value, 3);
                const typeVal = document.getElementById('away-goal-type').value;
                const goalType = GOAL_TYPES.includes(typeVal) ? typeVal : 'normal';
                const min = this.readMinute('away-goal-min');
                const snap = this.takeSnapshot();
                const who = `${this.rivalName()} ${num ? '(#' + num + ')' : ''}`.trim();

                let ev;
                if (goalType === 'own') {
                    // Gol en propia puerta de un jugador rival: suma para nuestro equipo
                    this.state.score.local++;
                    ev = {
                        id: newId('ev'), minute: min, type: 'own_goal_away', team: 'local',
                        title: `Gol en propia puerta de ${who} (suma para nuestro equipo)`,
                        detail: `Minuto ${min}'`
                    };
                } else {
                    this.state.score.rival++;
                    let typeLabel = '';
                    if (goalType === 'penalty') typeLabel = ' (Penalti)';
                    else if (goalType === 'freekick') typeLabel = ' (Falta Directa)';
                    ev = {
                        id: newId('ev'), minute: min, type: 'goal_away', team: 'rival',
                        title: `Gol de ${who}${typeLabel}`,
                        detail: `Minuto ${min}'`
                    };
                }
                this.commitEvent(ev, snap);
                this.closeModal();
                this.render();
            }

            submitCardHome() {
                const playerEl = document.getElementById('card-player');
                const player = this.state.squad.find(p => p.id === (playerEl ? playerEl.value : ''));
                const type = document.getElementById('card-type').value;
                const min = this.readMinute('card-min');
                if (!player || !['yellow', 'second_yellow', 'red'].includes(type)) {
                    alert('Selecciona un jugador y un tipo de tarjeta.');
                    return;
                }
                const snap = this.takeSnapshot();

                if (type === 'yellow') player.yellowCards++;
                if (type === 'second_yellow') {
                    player.yellowCards++;
                    player.redCard = true;
                    player.status = 'out';
                    player.outMinute = min;
                }
                if (type === 'red') {
                    player.redCard = true;
                    player.status = 'out';
                    player.outMinute = min;
                }

                let cardLabel = 'Tarjeta Amarilla';
                if (type === 'second_yellow') cardLabel = 'Doble Amarilla (Expulsión)';
                if (type === 'red') cardLabel = 'Roja Directa';

                this.commitEvent({
                    id: newId('ev'), minute: min, type: 'card', team: 'home',
                    title: `${cardLabel} a #${player.number} ${player.name}`,
                    detail: `Minuto ${min}'`
                }, snap);
                this.closeModal();
                this.render();
            }

            submitCardAway() {
                const num = cleanText(document.getElementById('away-card-num').value, 3);
                const typeVal = document.getElementById('away-card-type').value;
                const type = ['Amarilla', 'Roja Directa'].includes(typeVal) ? typeVal : 'Amarilla';
                const min = this.readMinute('away-card-min');
                const snap = this.takeSnapshot();

                this.commitEvent({
                    id: newId('ev'), minute: min, type: 'card_away', team: 'away',
                    title: `Tarjeta ${type} a ${this.rivalName()} ${num ? '(#' + num + ')' : ''}`,
                    detail: `Minuto ${min}'`
                }, snap);
                this.closeModal();
                this.render();
            }

            subOptionsHtml(list) {
                return list.map(p => `<option value="${p.id}">#${esc(p.number)} ${esc(p.name)}</option>`).join('');
            }

            // Añade una fila "Sale / Entra" al cambio (varios cambios dentro de la misma ventana)
            addSubRow() {
                const wrap = document.getElementById('sub-rows');
                if (!wrap) return;
                const starters = this.state.squad.filter(p => p.status === 'starter');
                const bench = this.state.squad.filter(p => p.status === 'bench');
                const rows = Array.from(wrap.querySelectorAll('.sub-row'));
                if (starters.length === 0 || bench.length === 0) {
                    if (rows.length === 0) wrap.innerHTML = '<p class="text-xs text-rose-300">No hay titulares o suplentes disponibles para hacer un cambio.</p>';
                    return;
                }
                if (rows.length >= Math.min(starters.length, bench.length)) {
                    alert('No quedan más jugadores disponibles para añadir otro cambio.');
                    return;
                }
                const usedOut = rows.map(r => r.querySelector('.sub-out').value);
                const usedIn = rows.map(r => r.querySelector('.sub-in').value);
                const row = document.createElement('div');
                row.className = 'sub-row grid grid-cols-2 gap-2 items-end';
                row.innerHTML = `
                    <div>
                        <label class="text-xs text-slate-400">Sale (Titular)</label>
                        <select class="sub-out w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">${this.subOptionsHtml(starters)}</select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">Entra (Banquillo)</label>
                        <select class="sub-in w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">${this.subOptionsHtml(bench)}</select>
                    </div>
                    ${rows.length > 0 ? `<button type="button" onclick="this.closest('.sub-row').remove()" class="col-span-2 text-[11px] text-rose-300 underline text-left">Quitar este cambio</button>` : ''}
                `;
                wrap.appendChild(row);
                const firstOut = starters.find(p => !usedOut.includes(p.id));
                const firstIn = bench.find(p => !usedIn.includes(p.id));
                if (firstOut) row.querySelector('.sub-out').value = firstOut.id;
                if (firstIn) row.querySelector('.sub-in').value = firstIn.id;
            }

            addAwaySubRow() {
                const wrap = document.getElementById('away-sub-rows');
                if (!wrap) return;
                const count = wrap.querySelectorAll('.away-sub-row').length;
                if (count >= 11) return;
                const row = document.createElement('div');
                row.className = 'away-sub-row grid grid-cols-2 gap-2 items-end';
                row.innerHTML = `
                    <div>
                        <label class="text-xs text-slate-400">Dorsal sale</label>
                        <input type="text" class="away-sub-out w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1" maxlength="3" placeholder="Ej: 10">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">Dorsal entra</label>
                        <input type="text" class="away-sub-in w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1" maxlength="3" placeholder="Ej: 14">
                    </div>
                    ${count > 0 ? `<button type="button" onclick="this.closest('.away-sub-row').remove()" class="col-span-2 text-[11px] text-rose-300 underline text-left">Quitar este cambio</button>` : ''}
                `;
                wrap.appendChild(row);
            }

            submitSubHome() {
                const isHalftime = this.state.match.status === 'halftime';
                const countsEl = document.getElementById('sub-counts');
                const counts = !!(countsEl && countsEl.checked);
                if (counts && this.state.windows.home.used >= 3) {
                    alert('Ya se han usado las 3 ventanas de cambios. Si este cambio no debe contar como ventana, desmarca "Cuenta como ventana de cambios".');
                    return;
                }

                const rows = Array.from(document.querySelectorAll('#sub-rows .sub-row'));
                const pairs = rows.map(r => ({
                    pOut: this.state.squad.find(p => p.id === r.querySelector('.sub-out').value),
                    pIn: this.state.squad.find(p => p.id === r.querySelector('.sub-in').value)
                }));
                const outIds = pairs.map(x => x.pOut && x.pOut.id);
                const inIds = pairs.map(x => x.pIn && x.pIn.id);
                if (pairs.length === 0 || pairs.some(x => !x.pOut || !x.pIn)
                    || new Set(outIds).size !== outIds.length || new Set(inIds).size !== inIds.length) {
                    alert('Revisa los cambios: cada fila necesita un jugador que sale y otro que entra, sin repetir jugadores.');
                    return;
                }
                const min = this.readMinute('sub-min');
                const snap = this.takeSnapshot();

                pairs.forEach(({ pOut, pIn }) => {
                    pOut.status = 'substituted';
                    pOut.outMinute = min;
                    pIn.status = 'starter';
                    pIn.inMinute = min;
                });
                if (counts) this.state.windows.home.used++;

                const lines = pairs.map(({ pOut, pIn }) => `Entra #${pIn.number} ${pIn.name} / Sale #${pOut.number} ${pOut.name}`);
                const title = pairs.length === 1 ? `Cambio: ${lines[0]}` : `Cambio múltiple (${pairs.length}): ${lines.join(' · ')}`;
                let detail;
                if (counts) detail = `${isHalftime ? 'Descanso · ' : ''}Ventana Local #${this.state.windows.home.used}`;
                else detail = isHalftime ? 'Descanso (sin ventana)' : 'Cambio sin ventana';

                this.commitEvent({ id: newId('ev'), minute: min, type: 'sub', team: 'home', title, detail }, snap);
                this.closeModal();
                this.render();
            }

            submitSubAway() {
                const isHalftime = this.state.match.status === 'halftime';
                const countsEl = document.getElementById('away-sub-counts');
                const counts = !!(countsEl && countsEl.checked);
                if (counts && this.state.windows.away.used >= 3) {
                    alert('Ya se han usado las 3 ventanas rivales. Si este cambio no debe contar como ventana, desmarca "Cuenta como ventana de cambios".');
                    return;
                }

                const rows = Array.from(document.querySelectorAll('#away-sub-rows .away-sub-row'));
                const pairs = rows.map(r => ({
                    out: cleanText(r.querySelector('.away-sub-out').value, 3),
                    inn: cleanText(r.querySelector('.away-sub-in').value, 3)
                }));
                if (pairs.length === 0) pairs.push({ out: '', inn: '' });
                const min = this.readMinute('away-sub-min');
                const snap = this.takeSnapshot();

                if (counts) this.state.windows.away.used++;

                const lines = pairs.map(x => `Entra #${x.inn || '?'} / Sale #${x.out || '?'}`);
                const title = pairs.length === 1
                    ? `Cambio ${this.rivalName()}: ${lines[0]}`
                    : `Cambio múltiple ${this.rivalName()} (${pairs.length}): ${lines.join(' · ')}`;
                let detail;
                if (counts) detail = isHalftime ? `Descanso · Ventana Rival #${this.state.windows.away.used}` : `Ventana Rival #${this.state.windows.away.used} (Min ${min}')`;
                else detail = isHalftime ? 'Descanso (sin ventana)' : `Cambio sin ventana (Min ${min}')`;

                this.commitEvent({ id: newId('ev'), minute: min, type: 'sub_away', team: 'away', title, detail }, snap);
                this.closeModal();
                this.render();
            }

            submitNote() {
                const text = cleanText(document.getElementById('note-text').value, 300);
                const min = this.readMinute('note-min');
                if (!text) return;
                const snap = this.takeSnapshot();

                this.commitEvent({
                    id: newId('ev'), minute: min, type: 'note', team: 'home',
                    title: 'Nota / Comentario',
                    detail: `${text} (Min ${min}')`
                }, snap);
                this.closeModal();
                this.render();
            }

            changePlayerStatus(id, newStatus) {
                if (this.state.match.status !== 'setup') {
                    alert('La plantilla no se puede modificar una vez iniciado el partido.');
                    return;
                }
                const p = this.state.squad.find(x => x.id === id);
                if (!p) return;
                if (newStatus === 'starter') {
                    const startersCount = this.state.squad.filter(x => x.status === 'starter').length;
                    if (startersCount >= 11 && p.status !== 'starter') {
                        alert('Ya hay 11 titulares.');
                        return;
                    }
                    p.status = 'starter';
                    p.inMinute = 0;
                } else {
                    p.status = newStatus;
                    if (p.captain) p.captain = false;
                }
                this.render();
            }

            toggleCaptain(id) {
                if (this.state.match.status !== 'setup') {
                    alert('El capitán debe asignarse antes de empezar el partido.');
                    return;
                }
                this.state.squad.forEach(p => p.captain = false);
                const p = this.state.squad.find(x => x.id === id);
                if (p) {
                    if (p.status !== 'starter') {
                        alert('El capitán debe ser un jugador titular.');
                        return;
                    }
                    p.captain = true;
                }
                this.render();
            }

            openPlayerModal() {
                if (this.state.match.status !== 'setup') {
                    alert('No se pueden añadir jugadores una vez iniciado el partido.');
                    return;
                }
                const container = document.getElementById('modal-container');
                container.innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl relative">
                            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            <h3 class="font-bold text-base text-white mb-3">Nuevo Jugador</h3>
                            <div class="space-y-3">
                                <div>
                                    <label class="text-xs text-slate-400">Nombre Completo</label>
                                    <input type="text" id="new-p-name" maxlength="40" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1" placeholder="Ej: Pedro Ruiz">
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="text-xs text-slate-400">Dorsal</label>
                                        <input type="number" id="new-p-num" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1" placeholder="15">
                                    </div>
                                    <div>
                                        <label class="text-xs text-slate-400">Posición</label>
                                        <select id="new-p-pos" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                                            <option value="POR">POR</option>
                                            <option value="DEF">DEF</option>
                                            <option value="MED">MED</option>
                                            <option value="DEL">DEL</option>
                                        </select>
                                    </div>
                                </div>
                                <button onclick="app.submitNewPlayer()" class="w-full bg-lasalle-yellow text-lasalle-darkblue font-bold py-3 rounded-xl text-sm">Guardar Jugador</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            editPlayerModal(id) {
                if (this.state.match.status !== 'setup') {
                    alert('La plantilla no se puede editar una vez iniciado el partido.');
                    return;
                }
                const p = this.state.squad.find(x => x.id === id);
                if (!p) return;
                const container = document.getElementById('modal-container');
                container.innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl relative">
                            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            <h3 class="font-bold text-base text-white mb-3">Modificar Jugador</h3>
                            <div class="space-y-3">
                                <div>
                                    <label class="text-xs text-slate-400">Nombre Completo</label>
                                    <input type="text" id="edit-p-name" maxlength="40" value="${esc(p.name)}" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="text-xs text-slate-400">Dorsal</label>
                                        <input type="number" id="edit-p-num" value="${p.number}" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                                    </div>
                                    <div>
                                        <label class="text-xs text-slate-400">Posición</label>
                                        <select id="edit-p-pos" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                                            <option value="POR" ${p.position === 'POR' ? 'selected' : ''}>POR</option>
                                            <option value="DEF" ${p.position === 'DEF' ? 'selected' : ''}>DEF</option>
                                            <option value="MED" ${p.position === 'MED' ? 'selected' : ''}>MED</option>
                                            <option value="DEL" ${p.position === 'DEL' ? 'selected' : ''}>DEL</option>
                                        </select>
                                    </div>
                                </div>
                                <button onclick="app.submitEditPlayer('${p.id}')" class="w-full bg-lasalle-yellow text-lasalle-darkblue font-bold py-3 rounded-xl text-sm">Actualizar</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            readPlayerForm(prefix, ignoreId) {
                const name = cleanText(document.getElementById(prefix + '-name').value, 40);
                const num = parseInt(document.getElementById(prefix + '-num').value, 10);
                const posVal = document.getElementById(prefix + '-pos').value;
                const pos = POSITIONS.includes(posVal) ? posVal : 'MED';
                if (!name || isNaN(num)) {
                    alert('Introduce nombre y dorsal válidos.');
                    return null;
                }
                if (num < 0 || num > 99) {
                    alert('El dorsal debe estar entre 0 y 99.');
                    return null;
                }
                if (this.state.squad.some(p => p.number === num && p.id !== ignoreId)) {
                    alert(`El dorsal ${num} ya está asignado a otro jugador.`);
                    return null;
                }
                return { name, num, pos };
            }

            submitNewPlayer() {
                const f = this.readPlayerForm('new-p', null);
                if (!f) return;
                this.state.squad.push({
                    id: newId('p'), name: f.name, number: f.num, position: f.pos,
                    status: 'unconvoked',
                    inMinute: null, outMinute: null,
                    goals: 0, goalMinutes: [], goalTypes: [], assists: 0, yellowCards: 0, redCard: false, captain: false
                });
                this.closeModal();
                this.render();
            }

            submitEditPlayer(id) {
                const p = this.state.squad.find(x => x.id === id);
                if (!p) return;
                const f = this.readPlayerForm('edit-p', id);
                if (!f) return;
                p.name = f.name;
                p.number = f.num;
                p.position = f.pos;
                this.closeModal();
                this.render();
            }

            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }

            calculatePlayerMinutes(p) {
                if (p.status === 'unconvoked') return 0;
                let total = 0;
                const totalMatchDuration = this.state.match.halfDuration * 2;
                
                if (p.status === 'starter') {
                    const outMin = p.outMinute !== null ? p.outMinute : totalMatchDuration;
                    const inMin = p.inMinute !== null ? p.inMinute : 0;
                    total += (outMin - inMin);
                } else if (p.status === 'substituted' || p.status === 'out') {
                    const outMin = p.outMinute !== null ? p.outMinute : 0;
                    const inMin = p.inMinute !== null ? p.inMinute : 0;
                    total += (outMin - inMin);
                } else if (p.status === 'bench' && p.inMinute !== null) {
                    const outMin = p.outMinute !== null ? p.outMinute : totalMatchDuration;
                    total += (outMin - p.inMinute);
                }
                return Math.max(0, total);
            }

            async generateWhatsAppPDF() {
                if (!window.jspdf) {
                    alert('El generador de PDF no está disponible. Abre la app una vez con conexión a internet (Inicio > Uso sin conexión) y vuelve a intentarlo. Mientras tanto puedes exportar el CSV.');
                    return;
                }
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                doc.setFillColor(0, 43, 102);
                doc.rect(0, 0, 210, 40, 'F');
                
                doc.setTextColor(255, 204, 0);
                doc.setFontSize(18);
                doc.text("STATBENCH 360", 20, 25);
                
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(11);
                doc.text(`ACTA OFICIAL - ${this.state.match.competition || 'LIGA'} (JORNADA ${this.state.match.matchday})`, 75, 25);

                doc.setTextColor(30, 30, 30);
                doc.setFontSize(11);
                doc.text(`Encuentro: ${this.state.match.homeTeam} vs ${this.state.match.awayTeam}`, 14, 50);
                doc.text(`Fecha: ${this.state.match.date} | Competición: ${this.state.match.competition}`, 14, 57);
                doc.text(`Resultado Final: ${this.state.match.homeTeam} ${this.homeScore()} - ${this.awayScore()} ${this.state.match.awayTeam}`, 14, 64);

                doc.setFontSize(12);
                doc.setTextColor(0, 43, 102);
                doc.text("ESTADÍSTICAS DETALLADAS DE JUGADORES", 14, 78);

                let y = 86;
                doc.setFontSize(9);
                doc.setTextColor(50, 50, 50);

                const activePlayers = this.state.squad.filter(p => p.status !== 'unconvoked');
                activePlayers.forEach(p => {
                    if (y > 270) { doc.addPage(); y = 20; }
                    const mins = this.calculatePlayerMinutes(p);
                    const capTxt = p.captain ? ' (Capitán)' : '';
                    const infoLine = `#${p.number} ${p.name}${capTxt} | Mins: ${mins}' | Goles: ${p.goals} | Asist: ${p.assists} | Amarillas: ${p.yellowCards} | Roja: ${p.redCard ? 'Sí' : 'No'}`;
                    doc.splitTextToSize(infoLine, 182).forEach(l => {
                        if (y > 280) { doc.addPage(); y = 20; }
                        doc.text(l, 14, y);
                        y += 5;
                    });
                    y += 2;
                });

                y += 5;
                if (y > 260) { doc.addPage(); y = 20; }
                doc.setFontSize(12);
                doc.setTextColor(0, 43, 102);
                doc.text("CRONOLOGÍA DE INCIDENCIAS", 14, y);
                y += 8;
                doc.setFontSize(9);
                doc.setTextColor(50, 50, 50);

                const sortedEvents = [...this.state.events].sort((a, b) => a.minute - b.minute);
                sortedEvents.forEach(ev => {
                    if (y > 270) { doc.addPage(); y = 20; }
                    doc.splitTextToSize(`[Minuto ${ev.minute}'] ${ev.title} - ${ev.detail}`, 182).forEach(l => {
                        if (y > 280) { doc.addPage(); y = 20; }
                        doc.text(l, 14, y);
                        y += 5;
                    });
                    y += 1;
                });

                const sanitizedHome = safeFile(this.state.match.homeTeam) || 'Local';
                const sanitizedAway = safeFile(this.state.match.awayTeam) || 'Rival';
                const jornadaNum = safeFile(this.state.match.matchday) || '1';
                const fechaStr = this.state.match.date || 'fecha';
                const pdfFileName = `Acta_${jornadaNum}_${fechaStr}_${sanitizedHome}_${sanitizedAway}.pdf`;

                const pdfBlob = doc.output('blob');
                const file = new File([pdfBlob], pdfFileName, { type: 'application/pdf' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            title: 'Acta StatBench360',
                            text: `Acta del partido ${this.state.match.homeTeam} vs ${this.state.match.awayTeam}. Resultado: ${this.homeScore()}-${this.awayScore()}`,
                            files: [file]
                        });
                        return;
                    } catch (error) {
                        console.log('Error en share nativo:', error);
                    }
                }

                const link = document.createElement('a');
                link.href = URL.createObjectURL(pdfBlob);
                link.download = pdfFileName;
                link.click();
                alert('Acta generada y descargada. Adjúntala manualmente en WhatsApp.');
            }

            exportGoogleDriveSheet() {
                const m = this.state.match;
                const header = ['Competicion', 'EquipoLocal', 'EquipoRival', 'Jornada', 'Fecha', 'Jugador', 'Dorsal', 'Posicion',
                    'Capitan', 'MinutosJugados', 'Goles', 'MinutosGoles', 'Asistencias', 'TarjetasAmarillas', 'TarjetaRoja'].join(',');
                const rows = this.state.squad.filter(p => p.status !== 'unconvoked').map(p => [
                    csvCell(m.competition), csvCell(m.homeTeam), csvCell(m.awayTeam), csvCell(m.matchday), csvCell(m.date),
                    csvCell(p.name), p.number, p.position, p.captain ? 'Sí' : 'No', this.calculatePlayerMinutes(p),
                    p.goals, csvCell(p.goalMinutes.join('-')), p.assists, p.yellowCards, p.redCard ? 'Sí' : 'No'
                ].join(','));

                const fileName = 'Estadisticas_' + safeFile(m.homeTeam) + '_vs_' + safeFile(m.awayTeam) + '_J' + safeFile(m.matchday) + '.csv';
                this.downloadCSV(fileName, [header, ...rows].join('\r\n') + '\r\n');
                alert('¡Estadísticas exportadas con éxito!');
            }
        }

        const app = new FutStatApp();
        app.initOffline();
    </script>
