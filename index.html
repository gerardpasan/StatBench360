<body class="bg-lasalle-navy text-slate-100 min-h-screen flex flex-col selection:bg-lasalle-yellow selection:text-lasalle-darkblue">

    <div id="app" class="flex-1 flex flex-col max-w-md mx-auto w-full bg-lasalle-darkblue shadow-2xl relative overflow-hidden border-x border-slate-800 pb-16">

                    <i class="fa-solid fa-shield-halved text-lasalle-darkblue"></i>

                        STATBENCH <span class="text-lasalle-yellow text-[10px] font-black">360</span>

            Generated by GpM1978

        <!-- Modals Container -->

    <!-- Application Logic -->
    <script>
        // ===== Utilidades de seguridad y validación =====
        const STORAGE_KEY = 'statbench360_global_v3';
        const POSITIONS = ['POR', 'DEF', 'MED', 'DEL'];
        const PLAYER_STATUSES = ['starter', 'bench', 'unconvoked', 'substituted', 'out'];
        const MATCH_STATUSES = ['setup', 'first_half', 'halftime', 'second_half', 'finished'];
        const TABS = ['setup', 'dashboard', 'lineup', 'timeline', 'stats', 'history'];
        const GOAL_TYPES = ['normal', 'penalty', 'own', 'freekick'];

        // Escapa texto antes de insertarlo en HTML (contenido y atributos)
        const esc = s => String(s ?? '').replace(/[&<>"']/g,
            c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        // Normaliza texto libre: sin caracteres de control, espacios colapsados y longitud limitada
        const cleanText = (s, max = 60) => String(s ?? '')
            .replace(/[\u0000-\u001F\u007F]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max);

        const toInt = (v, def = 0, min = 0, max = 100000) => {
            const n = Math.floor(Number(v));
            return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : def;
        };

        // Fecha local (toISOString devuelve UTC y falla cerca de medianoche)
        const localDate = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        const newId = prefix => `${prefix}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
        const isSafeId = s => typeof s === 'string' && /^[A-Za-z0-9_-]{1,40}$/.test(s);

        // Celda CSV segura: comillas escapadas y protección contra inyección de fórmulas
        const csvCell = v => {
            let s = String(v ?? '');
            if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
            return '"' + s.replace(/"/g, '""') + '"';
        };

        const safeFile = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40);

        function sanitizePlayer(p) {
            if (!p || typeof p !== 'object') return null;
            const minute = v => (v === null || v === undefined) ? null : toInt(v, 0, 0, 300);
            const nums = a => Array.isArray(a) ? a.slice(0, 50).map(x => toInt(x, 0, 0, 300)) : [];
            return {
                id: isSafeId(p.id) ? p.id : newId('p'),
                name: cleanText(p.name, 40) || 'Jugador',
                number: toInt(p.number, 0, 0, 99),
                position: POSITIONS.includes(p.position) ? p.position : 'MED',
                status: PLAYER_STATUSES.includes(p.status) ? p.status : 'unconvoked',
                initialStatus: PLAYER_STATUSES.includes(p.initialStatus) ? p.initialStatus : undefined,
                inMinute: minute(p.inMinute),
                outMinute: minute(p.outMinute),
                goals: toInt(p.goals, 0, 0, 99),
                goalMinutes: nums(p.goalMinutes),
                goalTypes: Array.isArray(p.goalTypes)
                    ? p.goalTypes.slice(0, 50).map(t => GOAL_TYPES.includes(t) ? t : 'normal') : [],
                assists: toInt(p.assists, 0, 0, 99),
                yellowCards: toInt(p.yellowCards, 0, 0, 2),
                redCard: !!p.redCard,
                captain: !!p.captain
            };
        }

        function sanitizeEvent(e) {
            if (!e || typeof e !== 'object') return null;
            return {
                id: isSafeId(e.id) ? e.id : newId('ev'),
                minute: toInt(e.minute, 0, 0, 300),
                type: cleanText(e.type, 20),
                team: cleanText(e.team, 10),
                title: cleanText(e.title, 200),
                detail: cleanText(e.detail, 400)
            };
        }

        const sanitizeScore = s => ({ local: toInt(s && s.local, 0, 0, 99), rival: toInt(s && s.rival, 0, 0, 99) });
        const sanitizeWindows = w => ({
            home: { used: toInt(w && w.home && w.home.used, 0, 0, 3), max: 3 },
            away: { used: toInt(w && w.away && w.away.used, 0, 0, 3), max: 3 }
        });
        const sanitizeSquad = arr => {
            const seen = new Set();
            return (Array.isArray(arr) ? arr.slice(0, 100) : []).map(sanitizePlayer).filter(Boolean).map(p => {
                if (seen.has(p.id)) p.id = newId('p');
                seen.add(p.id);
                return p;
            });
        };

        // Valida y reconstruye todo el estado leído de localStorage (nunca se confía en él)
        function sanitizeState(raw) {
            if (!raw || typeof raw !== 'object') return null;
            const m = (raw.match && typeof raw.match === 'object') ? raw.match : {};
            const a = (raw.audioAlerts && typeof raw.audioAlerts === 'object') ? raw.audioAlerts : {};
            const ts = v => (Number.isFinite(Number(v)) && Number(v) > 0) ? Number(v) : null;
            const squad = sanitizeSquad(raw.squad);
            const ids = new Set(squad.map(p => p.id));
            const undoStack = (Array.isArray(raw.undoStack) ? raw.undoStack.slice(-10) : [])
                .filter(u => u && isSafeId(u.eventId) && u.snap && typeof u.snap === 'object')
                .map(u => ({
                    eventId: u.eventId,
                    snap: { squad: sanitizeSquad(u.snap.squad), score: sanitizeScore(u.snap.score), windows: sanitizeWindows(u.snap.windows) }
                }));
            return {
                currentTab: TABS.includes(raw.currentTab) ? raw.currentTab : 'setup',
                selectedPlayerIds: new Set((Array.isArray(raw.selectedPlayerIds) ? raw.selectedPlayerIds : []).filter(id => ids.has(id))),
                matchResetted: raw.matchResetted !== false,
                audioAlerts: {
                    enabled: a.enabled !== false,
                    intervalMinutes: toInt(a.intervalMinutes, 5, 1, 60),
                    customAlarms: (Array.isArray(a.customAlarms) ? a.customAlarms.slice(0, 50) : []).map(x => toInt(x, 0, 0, 20000))
                },
                match: {
                    isHome: m.isHome !== false,
                    homeTeam: cleanText(m.homeTeam, 40) || 'Equipo Local',
                    awayTeam: cleanText(m.awayTeam, 40) || 'Equipo Visitante',
                    date: /^\d{4}-\d{2}-\d{2}$/.test(m.date) ? m.date : localDate(),
                    matchday: cleanText(m.matchday, 10) || '1',
                    competition: cleanText(m.competition, 60) || 'Liga Oficial',
                    halfDuration: toInt(m.halfDuration, 45, 1, 120),
                    status: MATCH_STATUSES.includes(m.status) ? m.status : 'setup',
                    currentHalf: m.currentHalf === 2 ? 2 : 1,
                    timerSeconds: toInt(m.timerSeconds, 0, 0, 20000),
                    halftimeSeconds: toInt(m.halftimeSeconds, 0, 0, 20000),
                    timerRunning: !!m.timerRunning,
                    lastTickMs: ts(m.lastTickMs),
                    halftimeStartMs: ts(m.halftimeStartMs),
                    matchId: isSafeId(m.matchId) ? m.matchId : null
                },
                score: sanitizeScore(raw.score),
                windows: sanitizeWindows(raw.windows),
                squad,
                events: (Array.isArray(raw.events) ? raw.events.slice(0, 500) : []).map(sanitizeEvent).filter(Boolean),
                undoStack
            };
        }

        // ===== Histórico de partidos =====
        const HISTORY_KEY = 'statbench360_history_v1';
        const MAX_HISTORY = 200;

        function sanitizeHistoryEntry(e) {
            if (!e || typeof e !== 'object' || !isSafeId(e.id)) return null;
            const m = (e.match && typeof e.match === 'object') ? e.match : {};
            return {
                id: e.id,
                savedAt: toInt(e.savedAt, Date.now(), 0, 8.64e15),
                match: {
                    homeTeam: cleanText(m.homeTeam, 40) || 'Equipo Local',
                    awayTeam: cleanText(m.awayTeam, 40) || 'Equipo Visitante',
                    isHome: m.isHome !== false,
                    date: /^\d{4}-\d{2}-\d{2}$/.test(m.date) ? m.date : '1970-01-01',
                    matchday: cleanText(m.matchday, 10) || '-',
                    competition: cleanText(m.competition, 60) || '-',
                    halfDuration: toInt(m.halfDuration, 45, 1, 120)
                },
                homeGoals: toInt(e.homeGoals, 0, 0, 99),
                awayGoals: toInt(e.awayGoals, 0, 0, 99),
                windows: { home: toInt(e.windows && e.windows.home, 0, 0, 3), away: toInt(e.windows && e.windows.away, 0, 0, 3) },
                players: (Array.isArray(e.players) ? e.players.slice(0, 100) : []).filter(p => p && typeof p === 'object').map(p => ({
                    number: toInt(p.number, 0, 0, 99),
                    name: cleanText(p.name, 40) || 'Jugador',
                    position: POSITIONS.includes(p.position) ? p.position : 'MED',
                    captain: !!p.captain,
                    mins: toInt(p.mins, 0, 0, 300),
                    goals: toInt(p.goals, 0, 0, 99),
                    assists: toInt(p.assists, 0, 0, 99),
                    yellow: toInt(p.yellow, 0, 0, 2),
                    red: !!p.red,
                    inMinute: (p.inMinute === null || p.inMinute === undefined) ? null : toInt(p.inMinute, 0, 0, 300),
                    outMinute: (p.outMinute === null || p.outMinute === undefined) ? null : toInt(p.outMinute, 0, 0, 300)
                })),
                events: (Array.isArray(e.events) ? e.events.slice(0, 500) : []).map(sanitizeEvent).filter(Boolean)
            };
        }

        // ---------- Lectura de listas de jugadores pegadas (el texto externo NUNCA se inserta como HTML) ----------
        const LETTERS = /[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]{2,}/;
        const looksLikeHtml = s => /<\s*(html|body|table|tr|td|a|div|ul|li)\b/i.test(s);

        function prettyName(s) {
            let n = cleanText(s, 60);
            if (/^[^,]+,[^,]+$/.test(n)) { const [a, b] = n.split(','); n = b.trim() + ' ' + a.trim(); }
            if (n === n.toUpperCase()) {
                n = n.toLocaleLowerCase('es').replace(/(^|[\s\-'’])(\p{L})/gu, (m, p, c) => p + c.toLocaleUpperCase('es'));
            }
            return cleanText(n, 40);
        }

        // Líneas de texto -> filas de celdas (con tabuladores se respetan las celdas vacías para no desplazar columnas)
        function textRows(str) {
            const rows = [];
            String(str).replace(/^\uFEFF/, '').split(/\r?\n/).slice(0, 3000).forEach(line => {
                const cells = (line.includes('\t') ? line.split('\t') : line.split(/ {2,}/)).map(c => cleanText(c, 120));
                if (!line.includes('\t')) { for (let i = cells.length - 1; i >= 0; i--) if (!cells[i]) cells.splice(i, 1); }
                if (cells.some(Boolean)) rows.push({ cells, header: false });
            });
            return rows;
        }

        // Convierte lo pegado (texto, tabla copiada o HTML) en filas de celdas; DOMParser no ejecuta scripts ni carga recursos
        function extractRows(src) {
            if (!looksLikeHtml(src)) return textRows(src);
            const doc = new DOMParser().parseFromString(src, 'text/html');
            const rows = [];
            doc.querySelectorAll('tr').forEach(tr => {
                if (tr.querySelector('table')) return;
                const cells = Array.from(tr.querySelectorAll('th,td'));
                if (!cells.length) return;
                rows.push({ cells: cells.map(c => cleanText(c.textContent, 120)), header: cells.every(c => c.tagName === 'TH') });
            });
            return rows.length ? rows : textRows(doc.body ? doc.body.textContent : '');
        }

        function parseSquadText(src) {
            const rows = extractRows(src);
            const POS_MAP = [[/porter[oa]|guardameta|\bPOR\b/i, 'POR'], [/defensa|central|lateral|\bDEF\b/i, 'DEF'],
                [/centrocamp|medio|pivote|\bMED\b/i, 'MED'], [/delanter[oa]|extrem[oa]|punta|\bDEL\b/i, 'DEL']];
            const posOf = t => { for (const [re, v] of POS_MAP) if (re.test(t)) return v; return null; };
            const STAFF = /entrenador|delegad|auxiliar|t[eé]cnico|fisio|preparador|m[eé]dico|utiller/i;
            const NOT_NAME = /^(total|jugadores?|jugadoras?|plantilla|equipo|nombre|dorsal|posici[oó]n|licencia|fecha|baja|alta|activo|activa)$/i;
            const players = [];
            const seenNames = new Set();
            let cols = null;

            const push = (num, rawName, pos) => {
                if (!rawName || NOT_NAME.test(rawName) || /\d{2}[\/.-]\d{2}[\/.-]\d{2,4}/.test(rawName)) return;
                const name = prettyName(rawName);
                if (name.length < 3 || !LETTERS.test(name)) return;
                const key = name.toLowerCase();
                if (seenNames.has(key)) return;
                seenNames.add(key);
                players.push({ num, name, pos });
            };

            rows.forEach(r => {
                const cells = r.cells;
                const iName = cells.findIndex(t => /^(jugador|jugadora|nombre|nombre y apellidos|apellidos y nombre|apellidos)$/i.test(t));
                if (iName >= 0) {
                    cols = {
                        name: iName,
                        num: cells.findIndex(t => /^(dorsal|n[º°o]\.?|n[úu]m(ero)?\.?|#)$/i.test(t)),
                        pos: cells.findIndex(t => /posici[oó]n|demarcaci[oó]n/i.test(t))
                    };
                    return;
                }
                if (r.header || cells.some(t => STAFF.test(t))) return;

                if (cells.length === 1) {   // texto sencillo: "9 Juan Pérez"
                    const m = cells[0].match(/^(\d{1,2})(?!\d)\s*[.\-,;)]?\s*(.+)$/);
                    if (m) push(parseInt(m[1], 10), m[2], posOf(m[2]));
                    return;
                }
                let num = null, name = '', pos = null;
                if (cols && cells.length > cols.name) {
                    if (cols.num >= 0 && /^\d{1,2}$/.test(cells[cols.num] || '')) num = parseInt(cells[cols.num], 10);
                    name = cells[cols.name];
                    if (cols.pos >= 0) pos = posOf(cells[cols.pos] || '');
                } else {
                    const iN = cells.findIndex(t => /^\d{1,2}$/.test(t));
                    if (iN >= 0) num = parseInt(cells[iN], 10);
                    const cand = cells.filter((t, i) => i !== iN && LETTERS.test(t) && !posOf(t) && !/^\d/.test(t));
                    name = cand.sort((a, b) => b.length - a.length)[0] || '';
                    for (const t of cells) pos = pos || posOf(t);
                }
                push(num, name, pos);
            });

            // Dorsales: se respetan los de la lista; si faltan o se repiten se asignan los primeros libres
            const used = new Set();
            const out = players.slice(0, 60);
            out.forEach(p => { p.auto = false; if (p.num !== null && p.num <= 99 && !used.has(p.num)) used.add(p.num); else p.num = null; });
            let next = 1;
            out.forEach(p => {
                if (p.num === null) {
                    while (used.has(next) && next < 99) next++;
                    p.num = next; used.add(next); p.auto = true;
                }
                if (!p.pos) p.pos = p.num === 1 ? 'POR' : 'MED';
            });
            return out;
        }

        class FutStatApp {
            constructor() {
                this.state = {
                    currentTab: 'setup',
                    selectedPlayerIds: new Set(),
                    matchResetted: true,
                    audioAlerts: {
                        enabled: true,
                        intervalMinutes: 5,
                        customAlarms: []
                    },
                    match: {
                        isHome: true,
                        homeTeam: 'Equipo Local',
                        awayTeam: 'Equipo Visitante',
                        date: localDate(),
                        matchday: '1',
                        competition: 'Liga Oficial',
                        halfDuration: 45,
                        status: 'setup',
                        currentHalf: 1,
                        timerSeconds: 0,
                        halftimeSeconds: 0,
                        timerRunning: false,
                        lastTickMs: null,
                        halftimeStartMs: null,
                        matchId: null
                    },
                    score: { local: 0, rival: 0 },
                    windows: {
                        home: { used: 0, max: 3 },
                        away: { used: 0, max: 3 }
                    },
                    squad: [],
                    events: [],
                    undoStack: []
                };

                this.timerHandle = null;
                this.halftimeHandle = null;
                // Al volver a la app (pantalla bloqueada, otra pestaña) el cronómetro se pone al día
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) { this.syncTimer(); this.refreshTimerDisplay(); }
                });

                this.loadFromStorage();
                this.initApp();
            }

            initApp() {
                const st = this.state.match.status;
                if (st !== 'setup') {
                    this.switchTab(st === 'finished' ? 'stats' : 'dashboard');
                    if (st === 'first_half' || st === 'second_half') this.startTimerInterval();
                    if (st === 'halftime') this.startHalftimeInterval();
                } else {
                    this.switchTab('setup');
                }
            }

            saveToStorage() {
                try {
                    const toSave = { ...this.state, selectedPlayerIds: Array.from(this.state.selectedPlayerIds) };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
                } catch (e) { console.error(e); }
            }

            loadFromStorage() {
                try { localStorage.removeItem('statbench360_ffib_v1'); } catch (e) { /* se ignora */ }
                let saved = null;
                try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) { console.error(e); }
                if (saved) {
                    try {
                        const clean = sanitizeState(JSON.parse(saved));
                        if (clean) { this.state = clean; return; }
                    } catch (e) { console.error('Datos guardados no válidos, se usan los de ejemplo.', e); }
                }
                this.state.selectedPlayerIds = new Set();
                this.loadDefaultData();
            }

            loadDefaultData() {
                const defaultNames = Array.from({length: 22}, (_, i) => ({
                    name: `Jugador ${i + 1}`,
                    pos: i === 0 ? 'POR' : (i < 5 ? 'DEF' : (i < 12 ? 'MED' : 'DEL')),
                    num: i + 1
                }));

                this.state.squad = defaultNames.map((p, i) => ({
                    id: 'p_' + i,
                    name: p.name,
                    number: p.num,
                    position: p.pos,
                    status: i < 11 ? 'starter' : (i < 18 ? 'bench' : 'unconvoked'),
                    inMinute: i < 11 ? 0 : null,
                    outMinute: null,
                    goals: 0, 
                    goalMinutes: [], 
                    goalTypes: [],
                    assists: 0, 
                    yellowCards: 0, 
                    redCard: false, 
                    captain: i === 0
                }));
                this.state.match.homeTeam = 'Equipo Local';
                this.state.match.awayTeam = 'Equipo Visitante';
                this.state.match.matchday = '1';
                this.state.match.competition = 'Liga Oficial';
                this.state.matchResetted = true;
            }

            speak(text) {
                if (!('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }

            checkAudioAlerts(prevSecs) {
                const m = this.state.match;
                if (m.status === 'setup' || m.status === 'halftime') return;

                const cur = m.timerSeconds;
                const alerts = this.state.audioAlerts;
                const messages = [];

                // Aviso periódico: se dispara al cruzar un minuto múltiplo del intervalo (aunque se pierda algún tick)
                const curMin = Math.floor(cur / 60);
                const interval = parseInt(alerts.intervalMinutes) || 5;
                if (alerts.enabled && curMin > 0 && curMin !== Math.floor(prevSecs / 60) && curMin % interval === 0) {
                    messages.push(`Minuto ${curMin}`);
                }

                // Alarmas puntuales: se disparan al alcanzar o superar el segundo programado
                if (Array.isArray(alerts.customAlarms) && alerts.customAlarms.length > 0) {
                    const due = alerts.customAlarms.filter(s => s <= cur);
                    if (due.length > 0) {
                        alerts.customAlarms = alerts.customAlarms.filter(s => s > cur);
                        messages.push(`Atención. Alerta programada en el minuto ${Math.floor(Math.max(...due) / 60)}`);
                    }
                }

                if (messages.length > 0) this.speak(messages.join('. '));
            }

            goHomeTab() {
                this.state.currentTab = 'setup';
                this.render();
            }

            resetCurrentValues() {
                if (!confirm('¿Resetear el partido actual (marcador, eventos, cronómetro y estadísticas)?')) return;
                const keepSquad = !confirm('¿Quieres también BORRAR la plantilla y volver a la de ejemplo?\n\nAceptar = borrar la plantilla\nCancelar = mantener la plantilla');

                this.stopTimers();
                const m = this.state.match;
                m.status = 'setup';
                m.currentHalf = 1;
                m.timerSeconds = 0;
                m.halftimeSeconds = 0;
                m.timerRunning = false;
                m.lastTickMs = null;
                m.halftimeStartMs = null;
                m.matchId = null;

                this.state.score = { local: 0, rival: 0 };
                this.state.windows = { home: { used: 0, max: 3 }, away: { used: 0, max: 3 } };
                this.state.events = [];
                this.state.undoStack = [];
                this.state.audioAlerts.customAlarms = [];
                m.homeTeam = 'Equipo Local';
                m.awayTeam = 'Equipo Visitante';
                m.matchday = '1';
                m.competition = 'Liga Oficial';
                m.date = localDate();
                this.state.selectedPlayerIds.clear();
                this.state.matchResetted = true;

                if (keepSquad) this.resetSquadStats();
                else this.loadDefaultData();
                this.switchTab('setup');
            }

            // Nuevo partido conservando la plantilla: vuelve a la convocatoria inicial y pone las estadísticas a cero
            resetSquadStats() {
                this.state.squad.forEach(p => {
                    const status = p.initialStatus || (['substituted', 'out'].includes(p.status) ? 'bench' : p.status);
                    p.status = status;
                    p.inMinute = status === 'starter' ? 0 : null;
                    p.outMinute = null;
                    p.goals = 0;
                    p.goalMinutes = [];
                    p.goalTypes = [];
                    p.assists = 0;
                    p.yellowCards = 0;
                    p.redCard = false;
                    delete p.initialStatus;
                });
            }

            askConfirm(message, onYes, yesLabel = 'Aceptar') {
                this._confirmCb = onYes;
                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl">
                            <p class="text-sm text-white mb-4">${esc(message)}</p>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="app.closeModal()" class="bg-slate-800 text-slate-200 font-bold py-2.5 rounded-xl text-sm">Cancelar</button>
                                <button onclick="app.runConfirm()" class="bg-lasalle-yellow text-lasalle-darkblue font-black py-2.5 rounded-xl text-sm">${esc(yesLabel)}</button>
                            </div>
                        </div>
                    </div>`;
            }

            runConfirm() {
                const cb = this._confirmCb;
                this._confirmCb = null;
                this.closeModal();
                if (cb) cb();
            }

            stopTimers() {
                if (this.timerHandle) { clearInterval(this.timerHandle); this.timerHandle = null; }
                if (this.halftimeHandle) { clearInterval(this.halftimeHandle); this.halftimeHandle = null; }
            }

            // ----- Deshacer -----
            takeSnapshot() {
                return {
                    squad: JSON.parse(JSON.stringify(this.state.squad)),
                    score: { ...this.state.score },
                    windows: JSON.parse(JSON.stringify(this.state.windows))
                };
            }

            commitEvent(ev, snap) {
                this.state.events.push(ev);
                this.state.undoStack.push({ eventId: ev.id, snap });
                if (this.state.undoStack.length > 10) this.state.undoStack.shift();
            }

            renderUndoButton() {
                const last = this.state.undoStack[this.state.undoStack.length - 1];
                if (!last || this.state.match.status === 'finished') return '';
                const ev = this.state.events.find(e => e.id === last.eventId);
                return `<button onclick="app.undoLastEvent()" class="w-full bg-slate-900 border border-rose-500/40 text-rose-300 font-bold py-2 px-3 rounded-xl text-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-left"></i> Deshacer último: <span class="truncate max-w-[200px]">${esc(ev ? ev.title : 'evento')}</span>
                </button>`;
            }

            undoLastEvent() {
                const last = this.state.undoStack[this.state.undoStack.length - 1];
                if (!last) return;
                const ev = this.state.events.find(e => e.id === last.eventId);
                this.askConfirm(`¿Deshacer "${ev ? ev.title : 'el último evento'}"?`, () => {
                    this.state.undoStack.pop();
                    this.state.squad = last.snap.squad;
                    this.state.score = last.snap.score;
                    this.state.windows = last.snap.windows;
                    this.state.events = this.state.events.filter(e => e.id !== last.eventId);
                    this.render();
                }, 'Deshacer');
            }

            startNewMatch() {
                this.resetCurrentValues();
            }

            switchTab(tab) {
                this.state.currentTab = tab;
                this.render();
            }

            render() {
                this.syncTimer();
                const main = document.getElementById('main-content');
                const bottomNav = document.getElementById('bottom-nav');
                const subtitle = document.getElementById('header-match-subtitle');

                if (this.state.currentTab === 'setup') {
                    bottomNav.classList.add('hidden');
                    subtitle.textContent = 'Seguimiento & Estadisticas';
                    main.innerHTML = this.renderSetupScreen();
                } else if (this.state.currentTab === 'history') {
                    bottomNav.classList.add('hidden');
                    subtitle.textContent = 'Histórico de partidos';
                    main.innerHTML = this.renderHistoryScreen();
                } else {
                    bottomNav.classList.remove('hidden');
                    subtitle.textContent = `J${this.state.match.matchday}: ${this.state.match.homeTeam} vs ${this.state.match.awayTeam}`;
                    
                    ['dashboard', 'lineup', 'timeline', 'stats'].forEach(t => {
                        const el = document.getElementById(`nav-${t}`);
                        if (el) {
                            el.className = t === this.state.currentTab 
                                ? "flex flex-col items-center text-lasalle-yellow py-1 px-3 rounded-xl font-bold scale-105"
                                : "flex flex-col items-center text-slate-300 hover:text-white py-1 px-3 rounded-xl";
                        }
                    });

                    if (this.state.currentTab === 'dashboard') main.innerHTML = this.renderDashboardScreen();
                    else if (this.state.currentTab === 'lineup') main.innerHTML = this.renderLineupScreen();
                    else if (this.state.currentTab === 'timeline') main.innerHTML = this.renderTimelineScreen();
                    else if (this.state.currentTab === 'stats') main.innerHTML = this.renderStatsScreen();
                }
                this.saveToStorage();
            }

                        </div>

                            </div>

                                <label class="text-[11px] text-slate-300 font-bold">Voz Activada</label>
                                <select id="audio-enabled" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-white" onchange="app.updateAudioSettings()">
                                    <option value="true" ${this.state.audioAlerts.enabled ? 'selected' : ''}>Sí</option>

                                    <option value="1" ${this.state.audioAlerts.intervalMinutes == 1 ? 'selected' : ''}>Cada 1 min</option>
                                    <option value="2" ${this.state.audioAlerts.intervalMinutes == 2 ? 'selected' : ''}>Cada 2 min</option>

                            <strong>Formato requerido (.txt o .csv):</strong> Dorsal seguido del nombre (Ej: <code class="text-lasalle-yellow bg-slate-950 px-1.5 py-0.5 rounded">9 Juan Pérez</code>). También puedes subir foto para OCR.

                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <label class="bg-lasalle-yellow hover:bg-lasalle-yellowhover text-lasalle-darkblue font-extrabold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 cursor-pointer shadow-md">
                                <i class="fa-solid fa-upload"></i> Subir Fichero / Foto

                                    <div class="flex items-center justify-between bg-slate-950 px-2.5 py-1.5 rounded-xl text-xs">

                                            <button onclick="app.editPlayerModal('${p.id}')" class="px-1.5 py-0.5 bg-slate-800 text-lasalle-yellow rounded text-[10px]"><i class="fa-solid fa-pen"></i></button>

                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div>
                            <div class="text-xs font-bold text-lasalle-yellow mb-1">Banquillo (${subs.length})</div>
                            <div class="space-y-1 max-h-28 overflow-y-auto">

                                            <button onclick="app.changePlayerStatus('${p.id}', 'unconvoked')" class="px-1.5 py-0.5 bg-slate-800 text-rose-400 rounded text-[10px]">Fuera</button>
                                        </div>
                                    </div>

                        <div>
                            <div class="text-xs font-bold text-rose-400 mb-1">Desconvocados (${unconv.length})</div>
                            <div class="space-y-1 max-h-24 overflow-y-auto">
                                ${unconv.map(p => `
                                    <div class="flex items-center justify-between bg-slate-950/60 px-2.5 py-1 rounded-xl text-xs opacity-75">
                                        <span class="font-bold text-slate-400 w-7">#${esc(p.number)}</span>
                                        <span class="flex-1 text-slate-300 truncate">${esc(p.name)}</span>
                                        <div class="flex gap-1">
                                            <button onclick="app.editPlayerModal('${p.id}')" class="px-1.5 py-0.5 bg-slate-800 text-lasalle-yellow rounded text-[10px]"><i class="fa-solid fa-pen"></i></button>

            renderLineupScreen() {

                            if (p.yellowCards === 1) cardsHtml += '<span class="px-1.5 py-0.5 bg-amber-400 text-slate-950 font-bold rounded text-[10px]" title="Tarjeta Amarilla">🟨</span>';

                            return `
                            <div class="bg-slate-900 p-2.5 rounded-xl flex justify-between text-xs items-center">
                                <div class="flex items-center gap-2 flex-1 truncate">
                                    <span class="font-bold text-lasalle-yellow w-6">#${esc(p.number)}</span>
                                    <span class="font-bold text-white truncate">${esc(p.name)} ${p.captain ? '<span class="text-lasalle-yellow font-bold">(C)</span>' : ''}</span>
                                </div>
                                <div class="flex items-center gap-1.5 flex-wrap justify-end">
                                    ${p.goals > 0 ? `<span class="px-1.5 py-0.5 bg-emerald-500 text-slate-950 font-bold rounded text-[10px]" title="Goles: ${p.goals}"><i class="fa-solid fa-futbol"></i> ${p.goals}</span>` : ''}
                                    ${p.assists > 0 ? `<span class="px-1.5 py-0.5 bg-teal-500 text-slate-950 font-bold rounded text-[10px]" title="Asistencias: ${p.assists}"><i class="fa-solid fa-shoe-prints"></i> ${p.assists}</span>` : ''}
                                    
                                    ${cardsHtml}
                                    ${p.inMinute !== null && p.inMinute > 0 ? `<span class="text-[10px] text-teal-300 font-semibold" title="Entró en min ${p.inMinute}"><i class="fa-solid fa-arrow-right-to-bracket"></i> ${p.inMinute}'</span>` : ''}

                                    ${!isMatchStarted ? `<button onclick="app.toggleCaptain('${p.id}')" class="px-2 py-0.5 bg-slate-800 text-lasalle-yellow rounded text-[10px]">${p.captain ? 'Quitar (C)' : 'Hacer (C)'}</button>` : ''}
                                    ${!isMatchStarted ? `<button onclick="app.editPlayerModal('${p.id}')" class="text-slate-400"><i class="fa-solid fa-pen"></i></button>` : ''}

                            if (p.yellowCards >= 2) cardsHtml += '<span class="px-1.5 py-0.5 bg-amber-600 text-white font-bold rounded text-[10px]">🟨🟨</span>';
                            if (p.redCard && p.yellowCards < 2) cardsHtml += '<span class="px-1.5 py-0.5 bg-rose-600 text-white font-bold rounded text-[10px]">🟥</span>';

                            return `
                            <div class="bg-slate-900 p-2.5 rounded-xl flex justify-between text-xs items-center">
                                <div class="flex items-center gap-2 flex-1 truncate">
                                    <span class="font-bold text-lasalle-yellow w-6">#${esc(p.number)}</span>

                                </div>

                    </div>

                    <!-- Sustituidos / Fuera -->
                    <div class="space-y-2">
                        <h3 class="text-xs font-bold text-rose-400 uppercase">Sustituidos / Fuera / Expulsados</h3>
                        ${outPlayers.map(p => {
                            let cardsHtml = '';
                            if (p.yellowCards === 1) cardsHtml += '<span class="px-1.5 py-0.5 bg-amber-400 text-slate-950 font-bold rounded text-[10px]" title="Amarilla">🟨</span>';
                            if (p.yellowCards >= 2) cardsHtml += '<span class="px-1.5 py-0.5 bg-amber-600 text-white font-bold rounded text-[10px]" title="Doble Amarilla">🟨🟨</span>';

                            return `
                            <div class="bg-slate-950 p-2.5 rounded-xl flex justify-between text-xs opacity-85 items-center">
                                <div class="flex items-center gap-2 flex-1 truncate">
                                    <span class="font-bold text-slate-500 w-6">#${esc(p.number)}</span>
                                    <span class="line-through text-slate-400 truncate">${esc(p.name)}</span>

                                <div>

                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-2">

            // ============================ AVISOS ============================
            showToast(msg) {
                let el = document.getElementById('toast');
                if (!el) {
                    el = document.createElement('div');
                    el.id = 'toast';
                    el.className = 'fixed left-1/2 -translate-x-1/2 bottom-16 z-[60] bg-slate-800 border border-lasalle-yellow/40 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-2xl max-w-[90vw] text-center';
                    document.body.appendChild(el);
                }
                el.textContent = msg;
                el.style.display = 'block';
                clearTimeout(this._toastTimer);
                this._toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3500);
            }

            downloadFile(fileName, content, mime) {
                const blob = new Blob([content], { type: mime });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }

            // ============================ USO SIN CONEXIÓN ============================
            offlineSupported() {
                return 'serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:' && 'caches' in window;
            }

            initOffline() {
                this.offline = { ready: false, active: false, missing: 0, total: 0, checking: true, ocrReady: false, persisted: null, msg: '' };
                this.deferredInstall = null;
                window.addEventListener('online', () => this.onNetworkChange());
                window.addEventListener('offline', () => this.onNetworkChange());
                window.addEventListener('beforeinstallprompt', e => {
                    e.preventDefault();
                    this.deferredInstall = e;
                    this.updateOfflineUI();
                });
                window.addEventListener('appinstalled', () => { this.deferredInstall = null; this.updateOfflineUI(); });
                this.onNetworkChange();
                if (!this.offlineSupported()) { this.offline.checking = false; this.updateOfflineUI(); return; }

                navigator.serviceWorker.addEventListener('controllerchange', () => this.refreshOfflineStatus());
                const start = () => {
                    navigator.serviceWorker.register('sw.js')
                        .then(() => navigator.serviceWorker.ready)
                        .then(() => {
                            this.refreshOfflineStatus();
                            setTimeout(() => this.refreshOfflineStatus(), 5000);
                        })
                        .catch(e => {
                            console.error(e);
                            this.offline.checking = false;
                            this.offline.msg = 'No se pudo activar el modo sin conexión en este navegador.';
                            this.updateOfflineUI();
                        });
                };
                if (document.readyState === 'complete') start();
                else window.addEventListener('load', start);
            }

            onNetworkChange() {
                const badge = document.getElementById('net-badge');
                if (badge) badge.classList.toggle('hidden', navigator.onLine);
                this.updateOfflineUI();
            }

            // Comprueba qué recursos están realmente guardados en el dispositivo
            async refreshOfflineStatus() {
                if (!this.offlineSupported() || !this.offline) return;
                const o = this.offline;
                try {
                    const reg = await navigator.serviceWorker.getRegistration();
                    const scope = reg ? reg.scope : location.href;
                    const shell = ['index.html', 'manifest.webmanifest', 'icons/icon-192.png', 'icons/icon-512.png', 'icons/apple-touch-icon.png']
                        .map(p => new URL(p, scope).href);
                    const css = Array.from(document.querySelectorAll('style')).map(s => s.textContent).join('\n');
                    const imports = Array.from(css.matchAll(/@import\s+url\(\s*['"]?(https?:\/\/[^'")\s]+)/gi)).map(m => m[1]);
                    const ext = Array.from(document.querySelectorAll('script[src],link[rel="stylesheet"][href]'))
                        .map(e => e.src || e.href)
                        .filter(u => /^https?:\/\//.test(u) && new URL(u).origin !== location.origin)
                        .concat(imports);
                    const urls = Array.from(new Set(shell.concat(ext)));
                    const found = await Promise.all(urls.map(u => caches.match(u, { ignoreVary: true }).then(Boolean).catch(() => false)));
                    o.total = urls.length;
                    o.missing = found.filter(f => !f).length;
                    o.active = !!(reg && reg.active);
                    o.ready = o.active && o.missing === 0;

                    let ocr = false;
                    for (const name of await caches.keys()) {
                        if (!name.startsWith('statbench360-')) continue;
                        const keys = await (await caches.open(name)).keys();
                        if (keys.some(k => /tesseract[^/]*core|tesseract-core/i.test(k.url))) { ocr = true; break; }
                    }
                    o.ocrReady = ocr;
                } catch (e) { console.error(e); }
                o.checking = false;
                this.updateOfflineUI();
            }

            renderOfflineCard() {
                const o = this.offline || { checking: true, missing: 0, total: 0, ready: false, ocrReady: false, msg: '' };
                const supported = this.offlineSupported();
                const isApple = /iPhone|iPad|iPod/.test(navigator.userAgent);
                let tone, icon, title, text;
                if (!supported) {
                    tone = 'amber'; icon = 'fa-triangle-exclamation';
                    title = 'Uso sin conexión no disponible en este modo';
                    text = 'Para usarla sin cobertura, abre la app desde una dirección segura (https://), por ejemplo alojada en tu web, e instálala en el móvil. Desde un archivo local no es posible.';
                } else if (o.ready) {
                    tone = 'emerald'; icon = 'fa-circle-check';
                    title = 'Lista para usar sin conexión';
                    text = 'Todo lo necesario está guardado en este dispositivo. Los partidos y el histórico se guardan siempre en local.';
                } else {
                    tone = 'amber'; icon = 'fa-cloud-arrow-down';
                    title = 'Aún no está lista para usar sin conexión';
                    text = o.checking ? 'Comprobando…' : (o.missing > 0
                        ? `Faltan ${o.missing} de ${o.total} recursos por guardar. Conéctate a internet y pulsa "Preparar uso sin conexión".`
                        : 'Pulsa "Preparar uso sin conexión" con internet disponible.');
                }
                const toneBox = tone === 'emerald' ? 'bg-emerald-500/10 border-emerald-500/40' : 'bg-amber-500/10 border-amber-500/40';
                const toneText = tone === 'emerald' ? 'text-emerald-300' : 'text-amber-300';
                return `
                    <div class="${toneBox} border rounded-2xl p-4 space-y-2.5">
                        <h2 class="text-xs font-black ${toneText} uppercase tracking-wider flex items-center gap-1.5">
                            <i class="fa-solid ${icon}"></i> ${title}
                        </h2>
                        <p class="text-[11px] text-slate-300 leading-relaxed">${text}</p>
                        ${supported ? `
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="app.prepareOffline()" class="bg-slate-800 hover:bg-slate-700 text-lasalle-yellow font-bold py-2.5 rounded-xl text-[11px] flex items-center justify-center gap-1.5">
                                    <i class="fa-solid fa-download"></i> Preparar uso sin conexión
                                </button>
                                ${this.deferredInstall ? `
                                    <button onclick="app.installApp()" class="bg-lasalle-yellow text-lasalle-darkblue font-black py-2.5 rounded-xl text-[11px] flex items-center justify-center gap-1.5">
                                        <i class="fa-solid fa-mobile-screen"></i> Instalar app
                                    </button>` : `
                                    <button onclick="app.prepareOcr()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2.5 rounded-xl text-[11px] flex items-center justify-center gap-1.5">
                                        <i class="fa-solid fa-image"></i> Preparar lector de fotos
                                    </button>`}
                            </div>
                            ${this.deferredInstall ? `
                                <button onclick="app.prepareOcr()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2 rounded-xl text-[11px]">
                                    <i class="fa-solid fa-image mr-1"></i> Preparar lector de fotos (OCR)
                                </button>` : ''}
                            <p class="text-[10px] text-slate-400">
                                Lector de fotos (OCR): ${o.ocrReady ? '<b class="text-emerald-300">preparado</b>' : '<b class="text-amber-300">no preparado</b> (necesita descargarse una vez con conexión, unos 15 MB)'}.
                                ${o.persisted === true ? ' Almacenamiento protegido.' : ''}
                            </p>
                            ${isApple ? '<p class="text-[10px] text-slate-400">En iPhone/iPad: pulsa Compartir y "Añadir a pantalla de inicio". Abre siempre la app desde ese icono.</p>' : ''}
                            ${o.msg ? `<p class="text-[11px] text-lasalle-yellow font-bold">${esc(o.msg)}</p>` : ''}` : ''}
                    </div>`;
            }

            updateOfflineUI() {
                const wrap = document.getElementById('offline-card-wrap');
                if (wrap) wrap.innerHTML = this.renderOfflineCard();
            }

            setOfflineMsg(msg) {
                if (this.offline) this.offline.msg = msg;
                this.updateOfflineUI();
            }

            async prepareOffline() {
                if (!navigator.onLine) { alert('Necesitas conexión a internet para preparar el uso sin conexión.'); return; }
                if (!this.offlineSupported()) return;
                this.setOfflineMsg('Guardando recursos en el dispositivo…');
                try {
                    const reg = await navigator.serviceWorker.getRegistration();
                    if (reg) { await reg.update().catch(() => {}); }
                    const worker = reg && (reg.active || reg.waiting || reg.installing);
                    if (worker) worker.postMessage('REFRESH_ASSETS');
                    if (navigator.storage && navigator.storage.persist) {
                        this.offline.persisted = await navigator.storage.persist().catch(() => null);
                    }
                } catch (e) { console.error(e); }
                for (let i = 0; i < 12; i++) {
                    await new Promise(r => setTimeout(r, 1500));
                    await this.refreshOfflineStatus();
                    if (this.offline.ready) break;
                }
                this.setOfflineMsg(this.offline.ready ? '¡Listo! Ya puedes usarla sin conexión.' : 'No se ha podido guardar todo. Comprueba la conexión e inténtalo de nuevo.');
            }

            prepareOcr() {
                if (!navigator.onLine) { alert('Necesitas conexión a internet para preparar el lector de fotos.'); return; }
                if (typeof Tesseract === 'undefined') { alert('El lector de fotos no se ha cargado. Recarga la app con conexión e inténtalo de nuevo.'); return; }
                this.askConfirm('Se descargarán unos 15 MB para poder leer fotos de plantillas sin conexión. ¿Continuar?', async () => {
                    this.setOfflineMsg('Descargando lector de fotos… puede tardar un minuto.');
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = 300; canvas.height = 80;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 300, 80);
                        ctx.fillStyle = '#000'; ctx.font = 'bold 40px sans-serif'; ctx.fillText('9 Juan', 10, 55);
                        await Tesseract.recognize(canvas, 'spa');
                        await this.refreshOfflineStatus();
                        this.setOfflineMsg(this.offline.ocrReady ? 'Lector de fotos listo para usar sin conexión.' : 'El lector se ha descargado, pero no se pudo guardar para uso sin conexión.');
                    } catch (e) {
                        console.error(e);
                        this.setOfflineMsg('No se pudo preparar el lector de fotos.');
                    }
                }, 'Descargar');
            }

            async installApp() {
                const ev = this.deferredInstall;
                if (!ev) return;
                ev.prompt();
                try { await ev.userChoice; } catch (e) { /* se ignora */ }
                this.deferredInstall = null;
                this.updateOfflineUI();
            }

            // ============================ HISTÓRICO ============================
            loadHistory() {
                if (this.history) return this.history;
                let list = [];
                try {
                    const raw = localStorage.getItem(HISTORY_KEY);
                    if (raw) {
                        const arr = JSON.parse(raw);
                        if (Array.isArray(arr)) list = arr.slice(0, MAX_HISTORY).map(sanitizeHistoryEntry).filter(Boolean);
                    }
                } catch (e) { console.error('Histórico no válido', e); }
                this.history = list;
                return list;
            }

            persistHistory() {
                try {
                    localStorage.setItem(HISTORY_KEY, JSON.stringify(this.history));
                    return true;
                } catch (e) {
                    alert('No se ha podido guardar el histórico (almacenamiento lleno). Exporta una copia y elimina partidos antiguos.');
                    return false;
                }
            }

            buildHistoryEntry() {
                const m = this.state.match;
                return {
                    id: m.matchId,
                    savedAt: Date.now(),
                    match: { homeTeam: m.homeTeam, awayTeam: m.awayTeam, isHome: m.isHome, date: m.date, matchday: m.matchday, competition: m.competition, halfDuration: m.halfDuration },
                    homeGoals: this.homeScore(),
                    awayGoals: this.awayScore(),
                    windows: { home: this.state.windows.home.used, away: this.state.windows.away.used },
                    players: this.state.squad.filter(p => p.status !== 'unconvoked').map(p => ({
                        number: p.number, name: p.name, position: p.position, captain: p.captain,
                        mins: this.calculatePlayerMinutes(p), goals: p.goals, assists: p.assists,
                        yellow: p.yellowCards, red: p.redCard, inMinute: p.inMinute, outMinute: p.outMinute
                    })),
                    events: this.state.events.map(e => ({ id: e.id, minute: e.minute, type: e.type, team: e.team, title: e.title, detail: e.detail }))
                };
            }

            saveMatchToHistory(silent) {
                const m = this.state.match;
                if (!m.matchId) m.matchId = newId('m');
                const entry = sanitizeHistoryEntry(this.buildHistoryEntry());
                if (!entry) return false;
                const list = this.loadHistory();
                const i = list.findIndex(e => e.id === entry.id);
                if (i >= 0) list[i] = entry;
                else {
                    if (list.length >= MAX_HISTORY) {
                        alert(`El histórico está lleno (${MAX_HISTORY} partidos). Exporta una copia y elimina partidos antiguos.`);
                        return false;
                    }
                    list.unshift(entry);
                }
                const ok = this.persistHistory();
                if (ok && !silent) this.showToast(i >= 0 ? 'Partido actualizado en el histórico' : 'Partido guardado en el histórico');
                this.saveToStorage();
                return ok;
            }

            openHistory() {
                this.historyDetailId = null;
                this.switchTab('history');
            }

            openHistoryDetail(id) {
                this.historyDetailId = id;
                this.render();
                const main = document.getElementById('main-content');
                if (main) main.scrollTop = 0;
            }

            ownGoals(e) { return e.match.isHome ? [e.homeGoals, e.awayGoals] : [e.awayGoals, e.homeGoals]; }

            renderHistoryScreen() {
                const list = this.loadHistory().slice().sort((a, b) => b.match.date.localeCompare(a.match.date) || b.savedAt - a.savedAt);
                if (this.historyDetailId) {
                    const e = list.find(x => x.id === this.historyDetailId);
                    if (e) return this.renderHistoryDetail(e);
                    this.historyDetailId = null;
                }
                let w = 0, d = 0, l = 0, gf = 0, gc = 0;
                list.forEach(e => {
                    const [a, b] = this.ownGoals(e);
                    gf += a; gc += b;
                    if (a > b) w++; else if (a < b) l++; else d++;

                const stat = (label, value, cls) => `<div class="bg-slate-900 border border-slate-800 rounded-xl py-2"><div class="text-base font-black ${cls}">${value}</div><div class="text-[10px] text-slate-400">${label}</div></div>`;

                        <button onclick="app.switchTab('setup')" class="bg-slate-800 text-lasalle-yellow px-2.5 py-1 rounded-lg text-xs font-bold border border-lasalle-yellow/30"><i class="fa-solid fa-arrow-left"></i> Inicio</button>

                        </div>` : ''}

                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="app.exportHistoryJSON()" class="bg-slate-800 hover:bg-slate-700 text-lasalle-yellow font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-download"></i> Exportar copia
                        </button>
                        <label class="bg-slate-800 hover:bg-slate-700 text-lasalle-yellow font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 cursor-pointer">
                            <i class="fa-solid fa-upload"></i> Importar copia
                            <input type="file" accept=".json,application/json" class="hidden" onchange="app.importHistoryJSON(event)">
                        </label>
                    </div>

                    ${list.length === 0 ? `
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 text-center text-xs text-slate-400 leading-relaxed">

                        </div>` : `
                        <div class="space-y-2">
                            ${list.map(e => {
                                const [a, b] = this.ownGoals(e);
                                const res = a > b ? ['V', 'bg-emerald-600'] : (a < b ? ['D', 'bg-rose-600'] : ['E', 'bg-amber-500']);
                                return `
                                <button onclick="app.openHistoryDetail('${e.id}')" class="w-full text-left bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-2xl p-3 space-y-1">
                                    <div class="flex items-center justify-between text-[10px] text-slate-400">
                                        <span>Jornada ${esc(e.match.matchday)} · ${esc(e.match.date)}</span>
                                        <span class="${res[1]} text-white font-black px-2 py-0.5 rounded">${res[0]}</span>
                                    </div>
                                    <div class="text-sm font-bold text-white">${esc(e.match.homeTeam)} <span class="text-lasalle-yellow">${e.homeGoals} - ${e.awayGoals}</span> ${esc(e.match.awayTeam)}</div>
                                    <div class="text-[10px] text-slate-400">${esc(e.match.competition)}</div>
                                </button>`;
                            }).join('')}
                        </div>`}
                </div>`;
            }

            renderHistoryDetail(e) {

                    </div>

                    <div class="bg-gradient-to-br from-lasalle-blue via-lasalle-darkblue to-slate-950 border-2 border-lasalle-yellow/40 rounded-3xl p-4 text-center space-y-1">
                        <div class="text-[10px] text-slate-300">Jornada ${esc(e.match.matchday)} · ${esc(e.match.date)} · ${esc(e.match.competition)}</div>
                        <div class="grid grid-cols-7 items-center">
                            <div class="col-span-3 text-xs font-bold text-slate-200 truncate">${esc(e.match.homeTeam)}</div>
                            <div class="col-span-1 text-2xl font-black text-lasalle-yellow">${e.homeGoals}-${e.awayGoals}</div>

                        </div>
                        <div class="text-[10px] text-slate-400">Nuestro equipo: ${esc(e.match.isHome ? e.match.homeTeam : e.match.awayTeam)} · Ventanas usadas: ${e.windows.home}/3</div>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl space-y-2">
                        <h3 class="text-xs font-bold text-lasalle-yellow uppercase">Estadísticas de jugadores</h3>

                            <table class="w-full text-[11px] text-slate-300">
                                <thead><tr class="text-slate-400 text-left"><th class="py-1 pr-1">#</th><th class="pr-1">Jugador</th><th class="px-1">Min</th><th class="px-1">G</th><th class="px-1">A</th><th class="px-1">Am</th><th class="px-1">Rj</th></tr></thead>
                                <tbody>
                                    ${players.map(p => `<tr class="border-t border-slate-800"><td class="py-1 pr-1 text-lasalle-yellow font-bold">${p.number}</td><td class="pr-1">${esc(p.name)}${p.captain ? ' (C)' : ''}</td><td class="px-1">${p.mins}'</td><td class="px-1">${p.goals}</td><td class="px-1">${p.assists}</td><td class="px-1">${p.yellow}</td><td class="px-1">${p.red ? 1 : 0}</td></tr>`).join('')}
                                </tbody>
                            </table>

                    <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl space-y-2">
                        <h3 class="text-xs font-bold text-lasalle-yellow uppercase">Cronología</h3>
                        ${events.length === 0 ? '<p class="text-xs text-slate-400">Sin eventos registrados.</p>' : events.map(ev => `
                            <div class="border-l-2 border-lasalle-yellow/50 pl-2 text-xs">
                                <div class="font-bold text-white">${ev.minute}' · ${esc(ev.title)}</div>
                                <div class="text-slate-400">${esc(ev.detail)}</div>

                    <div class="grid grid-cols-2 gap-2">

                        <button onclick="app.deleteHistory('${e.id}')" class="bg-rose-600/30 text-rose-300 border border-rose-500/40 font-bold py-3 rounded-xl text-xs flex items-center justify-center gap-1.5"><i class="fa-solid fa-trash"></i> Eliminar</button>
                    </div>
