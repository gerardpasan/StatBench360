<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StatBench360</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lasalle: {
                            blue: '#002B66',
                            darkblue: '#001A40',
                            navy: '#00122E',
                            yellow: '#FFCC00',
                            yellowhover: '#E6B800',
                            gold: '#D4AF37'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF & jsPDF-AutoTable & Tesseract.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #00122E; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-lasalle-navy text-slate-100 min-h-screen flex flex-col selection:bg-lasalle-yellow selection:text-lasalle-darkblue">

    <!-- App Container -->
    <div id="app" class="flex-1 flex flex-col max-w-md mx-auto w-full bg-lasalle-darkblue shadow-2xl relative overflow-hidden border-x border-slate-800 pb-16">
        
        <!-- Header (Sticky) -->
        <header class="bg-lasalle-blue/95 backdrop-blur-md border-b border-lasalle-yellow/30 px-4 py-3 flex items-center justify-between sticky top-0 z-50 shadow-md">
            <div class="flex items-center space-x-3">
                <div class="bg-lasalle-yellow text-lasalle-darkblue p-2 rounded-xl font-black text-lg flex items-center justify-center w-10 h-10 shadow-lg shadow-lasalle-yellow/20 overflow-hidden border border-lasalle-gold">
                    <i class="fa-solid fa-shield-halved text-lasalle-darkblue"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-base tracking-tight leading-none text-white flex items-center gap-1.5">
                        STATBENCH <span class="text-lasalle-yellow text-[10px] font-black">360</span>
                    </h1>
                    <span id="header-match-subtitle" class="text-xs text-slate-300 font-medium">Seguimiento & Estadisticas</span>
                </div>
            </div>
            <div id="header-actions" class="flex items-center space-x-2">
                <button onclick="app.goHomeTab()" class="px-2.5 py-1.5 rounded-xl bg-lasalle-darkblue hover:bg-slate-800 text-lasalle-yellow text-xs font-bold transition-all border border-lasalle-yellow/30 flex items-center gap-1 shadow">
                    <i class="fa-solid fa-house"></i> Inicio
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="flex-1 overflow-y-auto pb-24">
            <!-- Rendered dynamically -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav id="bottom-nav" class="hidden fixed bottom-6 left-0 right-0 max-w-md mx-auto bg-lasalle-blue/95 backdrop-blur-lg border-t border-lasalle-yellow/20 px-4 py-2 flex justify-around items-center z-40 shadow-2xl">
            <button onclick="app.switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center text-lasalle-yellow py-1 px-3 rounded-xl transition-all">
                <i class="fa-solid fa-gauge-high text-lg"></i>
                <span class="text-[10px] font-semibold mt-1">Directo</span>
            </button>
            <button onclick="app.switchTab('lineup')" id="nav-lineup" class="flex flex-col items-center text-slate-300 hover:text-white py-1 px-3 rounded-xl transition-all">
                <i class="fa-solid fa-users text-lg"></i>
                <span class="text-[10px] font-semibold mt-1">Plantilla</span>
            </button>
            <button onclick="app.switchTab('timeline')" id="nav-timeline" class="flex flex-col items-center text-slate-300 hover:text-white py-1 px-3 rounded-xl transition-all">
                <i class="fa-solid fa-timeline text-lg"></i>
                <span class="text-[10px] font-semibold mt-1">Cronología</span>
            </button>
            <button onclick="app.switchTab('stats')" id="nav-stats" class="flex flex-col items-center text-slate-300 hover:text-white py-1 px-3 rounded-xl transition-all">
                <i class="fa-solid fa-tv text-lg"></i>
                <span class="text-[10px] font-semibold mt-1">Acta / PDF</span>
            </button>
        </nav>

        <!-- Fixed Footer Signature -->
        <footer class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-lasalle-navy border-t border-slate-800 py-1.5 text-center text-[10px] text-slate-400 font-bold z-50 tracking-wider shadow-inner">
            Generated by GpM1978
        </footer>

        <!-- Modals Container -->
        <div id="modal-container"></div>
    </div>

    <!-- Application Logic -->
    <script>
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function sanitizeCSVField(field) {
            if (field === null || field === undefined) return '';
            let str = String(field);
            if (/^[=+\-@]/.test(str)) {
                str = "'" + str;
            }
            if (str.includes(',') || str.includes('"') || str.includes('\n')) {
                str = '"' + str.replace(/"/g, '""') + '"';
            }
            return str;
        }

        class FutStatApp {
            constructor() {
                this.state = {
                    version: 6,
                    currentTab: 'setup',
                    selectedPlayerIds: new Set(),
                    matchResetted: true,
                    audioAlerts: {
                        enabled: true,
                        intervalMinutes: 5,
                        customAlarms: []
                    },
                    match: {
                        isHome: true, // true = Mi equipo es Local, false = Mi equipo es Visitante
                        homeTeam: 'Equipo Local',
                        awayTeam: 'Equipo Visitante',
                        date: new Date().toISOString().split('T')[0],
                        matchday: '1',
                        competition: 'Liga Oficial',
                        halfDuration: 45,
                        status: 'setup',
                        currentHalf: 1,
                        timerSeconds: 0,
                        halftimeSeconds: 0,
                        timerRunning: false,
                        timerStartTimestamp: null,
                        halftimeStartTimestamp: null,
                        timerInterval: null,
                        halftimeInterval: null
                    },
                    score: { local: 0, rival: 0 },
                    windows: {
                        home: { used: 0, max: 3 },
                        away: { used: 0, max: 3 }
                    },
                    squad: [],
                    events: []
                };

                this.loadFromStorage();
                this.initApp();
            }

            initApp() {
                if (this.state.match.status !== 'setup') {
                    this.switchTab(this.state.match.status === 'finished' ? 'stats' : 'dashboard');
                    if (this.state.match.timerRunning) {
                        this.startTimerInterval();
                    }
                    if (this.state.match.status === 'halftime') {
                        this.startHalftimeInterval();
                    }
                } else {
                    this.switchTab('setup');
                }
            }

            saveToStorage() {
                try {
                    const dataToSave = {
                        ...this.state,
                        selectedPlayerIds: Array.from(this.state.selectedPlayerIds)
                    };
                    localStorage.setItem('statbench360_secure_v6', JSON.stringify(dataToSave));
                } catch(e) { console.error('Error saving state:', e); }
            }

            loadFromStorage() {
                const saved = localStorage.getItem('statbench360_secure_v6');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed && parsed.version === 6 && Array.isArray(parsed.squad)) {
                            this.state = {
                                ...parsed,
                                selectedPlayerIds: new Set(parsed.selectedPlayerIds || [])
                            };
                            return;
                        }
                    } catch(e) { console.error('Corrupted state, resetting:', e); }
                }
                this.state.selectedPlayerIds = new Set();
                this.loadDefaultData();
            }

            loadDefaultData() {
                const defaultNames = Array.from({length: 22}, (_, i) => ({
                    name: `Jugador ${i + 1}`,
                    pos: i === 0 ? 'POR' : (i < 5 ? 'DEF' : (i < 12 ? 'MED' : 'DEL')),
                    num: i + 1
                }));

                this.state.squad = defaultNames.map((p, i) => ({
                    id: 'p_' + i,
                    name: p.name,
                    number: p.num,
                    position: p.pos,
                    status: i < 11 ? 'starter' : (i < 18 ? 'bench' : 'unconvoked'),
                    inMinute: i < 11 ? 0 : null,
                    outMinute: null,
                    goals: 0, 
                    goalMinutes: [], 
                    goalTypes: [],
                    assists: 0, 
                    yellowCards: 0, 
                    redCard: false, 
                    captain: i === 0
                }));
                this.state.match.homeTeam = 'Equipo Local';
                this.state.match.awayTeam = 'Equipo Visitante';
                this.state.match.matchday = '1';
                this.state.match.competition = 'Liga Oficial';
                this.state.matchResetted = true;
            }

            speak(text) {
                if (!('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }

            checkAudioAlerts() {
                if (this.state.match.status === 'setup' || this.state.match.status === 'halftime') return;

                const currentSecs = this.state.match.timerSeconds;
                const currentMins = Math.floor(currentSecs / 60);

                if (this.state.audioAlerts.enabled && currentSecs > 0 && currentSecs % 60 === 0) {
                    const interval = parseInt(this.state.audioAlerts.intervalMinutes) || 5;
                    if (currentMins % interval === 0) {
                        this.speak(`Minuto ${currentMins}`);
                    }
                }

                if (this.state.audioAlerts.customAlarms && this.state.audioAlerts.customAlarms.length > 0) {
                    const matchIndex = this.state.audioAlerts.customAlarms.findIndex(alarmSec => alarmSec === currentSecs);
                    if (matchIndex !== -1) {
                        this.speak(`Atención. Alerta programada en el minuto ${currentMins}`);
                        this.state.audioAlerts.customAlarms.splice(matchIndex, 1);
                    }
                }
            }

            goHomeTab() {
                this.state.currentTab = 'setup';
                this.render();
            }

            resetCurrentValues() {
                if (!confirm('¿Estás seguro de resetear todos los valores actuales de configuración y partido?')) return;
                
                this.state.match.status = 'setup';
                this.state.match.timerSeconds = 0;
                this.state.match.halftimeSeconds = 0;
                this.state.match.timerRunning = false;
                this.state.match.timerStartTimestamp = null;
                this.state.match.halftimeStartTimestamp = null;
                if (this.state.match.timerInterval) clearInterval(this.state.match.timerInterval);
                if (this.state.match.halftimeInterval) clearInterval(this.state.match.halftimeInterval);
                
                this.state.score = { local: 0, rival: 0 };
                this.state.windows = { home: { used: 0, max: 3 }, away: { used: 0, max: 3 } };
                this.state.events = [];
                this.state.audioAlerts.customAlarms = [];
                this.state.selectedPlayerIds.clear();
                this.state.matchResetted = true;

                this.loadDefaultData();
                this.switchTab('setup');
            }

            switchTab(tab) {
                this.state.currentTab = tab;
                this.render();
            }

            render() {
                const main = document.getElementById('main-content');
                const bottomNav = document.getElementById('bottom-nav');
                const subtitle = document.getElementById('header-match-subtitle');

                if (this.state.currentTab === 'setup') {
                    bottomNav.classList.add('hidden');
                    subtitle.textContent = 'Seguimiento & Estadisticas';
                    main.innerHTML = this.renderSetupScreen();
                } else {
                    bottomNav.classList.remove('hidden');
                    subtitle.textContent = `J${escapeHTML(this.state.match.matchday)}: ${escapeHTML(this.state.match.homeTeam)} vs ${escapeHTML(this.state.match.awayTeam)}`;
                    
                    ['dashboard', 'lineup', 'timeline', 'stats'].forEach(t => {
                        const el = document.getElementById(`nav-${t}`);
                        if (el) {
                            el.className = t === this.state.currentTab 
                                ? "flex flex-col items-center text-lasalle-yellow py-1 px-3 rounded-xl font-bold scale-105"
                                : "flex flex-col items-center text-slate-300 hover:text-white py-1 px-3 rounded-xl";
                        }
                    });

                    if (this.state.currentTab === 'dashboard') main.innerHTML = this.renderDashboardScreen();
                    else if (this.state.currentTab === 'lineup') main.innerHTML = this.renderLineupScreen();
                    else if (this.state.currentTab === 'timeline') main.innerHTML = this.renderTimelineScreen();
                    else if (this.state.currentTab === 'stats') main.innerHTML = this.renderStatsScreen();
                }
                this.saveToStorage();
            }

            renderSetupScreen() {
                const starters = this.state.squad.filter(p => p.status === 'starter');
                const subs = this.state.squad.filter(p => p.status === 'bench');
                const unconv = this.state.squad.filter(p => p.status === 'unconvoked');
                const isMatchActive = this.state.match.status !== 'setup' && this.state.match.status !== 'finished';
                const isFinished = this.state.match.status === 'finished';

                const todayFormatted = new Date().toISOString().split('T')[0];
                if (!this.state.match.date) {
                    this.state.match.date = todayFormatted;
                }

                const isReadyToStart = this.state.matchResetted === true;

                return `
                <div class="p-5 space-y-5 pb-16">
                    ${isMatchActive ? `
                        <div class="bg-emerald-600/20 border border-emerald-500/50 p-3 rounded-2xl flex items-center justify-between">
                            <span class="text-xs text-emerald-300 font-bold"><i class="fa-solid fa-play mr-1"></i> Partido en curso activo</span>
                            <button onclick="app.switchTab('dashboard')" class="bg-emerald-500 text-slate-950 font-black px-3 py-1.5 rounded-xl text-xs shadow">
                                Volver al Partido
                            </button>
                        </div>
                    ` : ''}

                    ${isFinished ? `
                        <div class="bg-amber-600/20 border border-amber-500/50 p-3 rounded-2xl flex items-center justify-between">
                            <span class="text-xs text-amber-300 font-bold"><i class="fa-solid fa-flag-checkered mr-1"></i> Partido finalizado. Resetea para iniciar otro.</span>
                            <button onclick="app.switchTab('stats')" class="bg-amber-500 text-slate-950 font-black px-3 py-1.5 rounded-xl text-xs shadow">
                                Ver Acta
                            </button>
                        </div>
                    ` : ''}

                    <!-- Botones de Guía y Acciones -->
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="app.openManualModal()" class="bg-lasalle-blue hover:bg-slate-800 text-lasalle-yellow border border-lasalle-yellow/40 font-black p-3 rounded-2xl text-xs flex items-center justify-center gap-2 shadow transition-all">
                            <i class="fa-solid fa-circle-question text-base"></i> ¿Cómo se usa?
                        </button>
                        ${!isMatchActive ? `
                            <button onclick="app.resetCurrentValues()" class="bg-rose-600/30 hover:bg-rose-600/50 text-rose-300 border border-rose-500/40 font-bold p-3 rounded-2xl text-xs flex items-center justify-center gap-2 shadow">
                                <i class="fa-solid fa-rotate-right"></i> Resetear / Nuevo
                            </button>
                        ` : '<div class="bg-slate-900 border border-slate-800 rounded-2xl p-2 text-center text-[10px] text-slate-400 flex items-center justify-center">Partido en curso</div>'}
                    </div>

                    <!-- DATOS DEL PARTIDO -->
                    <div class="bg-lasalle-blue/40 border border-lasalle-yellow/30 rounded-2xl p-4 space-y-3">
                        <h2 class="text-xs font-black text-lasalle-yellow uppercase tracking-wider">Datos del Partido</h2>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" onclick="app.setMatchCondition(true)" class="py-2 rounded-xl font-bold text-xs border ${this.state.match.isHome ? 'bg-lasalle-yellow text-lasalle-darkblue border-lasalle-yellow' : 'bg-slate-900 text-slate-300 border-slate-700'}">LOCAL (Mi Equipo)</button>
                            <button type="button" onclick="app.setMatchCondition(false)" class="py-2 rounded-xl font-bold text-xs border ${!this.state.match.isHome ? 'bg-lasalle-yellow text-lasalle-darkblue border-lasalle-yellow' : 'bg-slate-900 text-slate-300 border-slate-700'}">VISITANTE (Mi Equipo)</button>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[11px] text-slate-300 font-bold">Equipo Local (Izquierda)</label>
                                <input type="text" id="set-home" value="${escapeHTML(this.state.match.homeTeam)}" placeholder="Equipo Local" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-white" oninput="app.updateMatchMeta()">
                            </div>
                            <div>
                                <label class="text-[11px] text-slate-300 font-bold">Equipo Visitante (Derecha)</label>
                                <input type="text" id="set-away" value="${escapeHTML(this.state.match.awayTeam)}" placeholder="Equipo Visitante" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-white" oninput="app.updateMatchMeta()">
                            </div>
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-300 font-bold">Liga / Competición</label>
                            <input type="text" id="set-competition" value="${escapeHTML(this.state.match.competition)}" placeholder="Liga Oficial" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-white mt-1" oninput="app.updateMatchMeta()">
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="text-[11px] text-slate-300 font-bold">Jornada</label>
                                <input type="text" id="set-matchday" value="${escapeHTML(this.state.match.matchday)}" placeholder="1" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-white" oninput="app.updateMatchMeta()">
                            </div>
                            <div>
                                <label class="text-[11px] text-slate-300 font-bold">Fecha</label>
                                <input type="date" id="set-date" value="${escapeHTML(this.state.match.date || todayFormatted)}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-white" onchange="app.updateMatchMeta()">
                            </div>
                            <div>
                                <label class="text-[11px] text-slate-300 font-bold">Duración (min)</label>
                                <input type="number" id="set-duration" value="${this.state.match.halfDuration}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-white">
                            </div>
                        </div>
                    </div>

                    <!-- AVISO SONORO POR VOZ -->
                    <div class="bg-slate-900 border border-lasalle-yellow/30 rounded-2xl p-4 space-y-3">
                        <h2 class="text-xs font-black text-lasalle-yellow uppercase tracking-wider flex items-center gap-1.5">
                            <i class="fa-solid fa-volume-high"></i> Aviso Sonoro por Voz (Minutaje)
                        </h2>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[11px] text-slate-300 font-bold">Voz Activada</label>
                                <select id="audio-enabled" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-white" onchange="app.updateAudioSettings()">
                                    <option value="true" ${this.state.audioAlerts.enabled ? 'selected' : ''}>Sí</option>
                                    <option value="false" ${!this.state.audioAlerts.enabled ? 'selected' : ''}>No</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[11px] text-slate-300 font-bold">Frecuencia Aviso</label>
                                <select id="audio-interval" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-white" onchange="app.updateAudioSettings()">
                                    <option value="1" ${this.state.audioAlerts.intervalMinutes == 1 ? 'selected' : ''}>Cada 1 min</option>
                                    <option value="2" ${this.state.audioAlerts.intervalMinutes == 2 ? 'selected' : ''}>Cada 2 min</option>
                                    <option value="5" ${this.state.audioAlerts.intervalMinutes == 5 ? 'selected' : ''}>Cada 5 min</option>
                                    <option value="10" ${this.state.audioAlerts.intervalMinutes == 10 ? 'selected' : ''}>Cada 10 min</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- GESTIÓN DE EQUIPO, CARGA Y DESCARGA -->
                    <div class="bg-gradient-to-r from-lasalle-blue to-slate-900 border border-lasalle-yellow/40 rounded-2xl p-4 space-y-3 shadow-xl">
                        <h2 class="text-xs font-black text-lasalle-yellow uppercase tracking-wider flex items-center justify-between">
                            <span><i class="fa-solid fa-file-arrow-up mr-1"></i> Cargar Plantilla & Descarga</span>
                        </h2>
                        <p class="text-[11px] text-slate-300 leading-relaxed">
                            <strong>Formato requerido (.txt o .csv):</strong> Dorsal seguido del nombre (Ej: <code class="text-lasalle-yellow bg-slate-950 px-1.5 py-0.5 rounded">9 Juan Pérez</code>). También puedes subir foto para OCR.
                        </p>
                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <label class="bg-lasalle-yellow hover:bg-lasalle-yellowhover text-lasalle-darkblue font-extrabold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 cursor-pointer shadow-md">
                                <i class="fa-solid fa-upload"></i> Subir Fichero / Foto
                                <input type="file" accept="image/*,.txt,.csv" class="hidden" onchange="app.handleFileOCR(event)">
                            </label>
                            <button onclick="app.downloadSquadCSV()" class="bg-slate-800 hover:bg-slate-700 text-lasalle-yellow font-bold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 border border-lasalle-yellow/30 shadow">
                                <i class="fa-solid fa-download"></i> Descargar Plantilla
                            </button>
                        </div>
                        <div class="pt-1">
                            <button onclick="app.openLargeSquadModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-lasalle-yellow border border-lasalle-yellow/30 font-extrabold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow">
                                <i class="fa-solid fa-expand"></i> Gestión Ampliada de Plantilla (${this.state.squad.length} jug.)
                            </button>
                        </div>
                        <div id="ocr-loading" class="hidden text-center text-xs text-lasalle-yellow mt-2 font-bold animate-pulse">
                            <i class="fa-solid fa-spinner fa-spin mr-1"></i> Leyendo datos...
                        </div>
                    </div>

                    <div class="bg-lasalle-blue/40 border border-lasalle-yellow/30 rounded-2xl p-4 space-y-3">
                        <h3 class="text-xs font-black text-lasalle-yellow uppercase">Alineación, Convocatoria y Capitán</h3>

                        <div>
                            <div class="text-xs font-bold text-emerald-400 mb-1">Titulares (${starters.length}/11) - Selecciona Capitán (C)</div>
                            <div class="space-y-1 max-h-40 overflow-y-auto">
                                ${starters.map(p => `
                                    <div class="flex items-center justify-between bg-slate-950 px-2.5 py-1.5 rounded-xl text-xs">
                                        <span class="font-bold text-lasalle-yellow w-7">#${p.number}</span>
                                        <span class="flex-1 text-slate-200 truncate font-semibold">${escapeHTML(p.name)}</span>
                                        <div class="flex items-center gap-1.5">

                const starters = this.state.squad.filter(p => p.status === 'starter');

                return `

                        ${starters.map(p => {
                            let cardsHtml = '';
                            if (p.yellowCards === 1) cardsHtml += '<span class="px-1.5 py-0.5 bg-amber-400 text-slate-950 font-bold rounded text-[10px]" title="Tarjeta Amarilla">🟨 Amarilla</span>';

                                <div class="flex items-center gap-1.5 flex-wrap justify-end">

                                    ${p.assists > 0 ? `<span class="px-1.5 py-0.5 bg-teal-500 text-slate-950 font-bold rounded text-[10px]" title="Asistencias: ${p.assists}"><i class="fa-solid fa-shoe-prints"></i> ${p.assists}</span>` : ''}
                                    
                                    ${cardsHtml}
                                    ${p.inMinute !== null && p.inMinute > 0 ? `<span class="text-[10px] text-teal-300 font-semibold" title="Entró en min ${p.inMinute}"><i class="fa-solid fa-arrow-right-to-bracket"></i> ${p.inMinute}'</span>` : ''}

                            let cardsHtml = '';
                            if (p.yellowCards === 1) cardsHtml += '<span class="px-1.5 py-0.5 bg-amber-400 text-slate-950 font-bold rounded text-[10px]">🟨 Amarilla</span>';
                            if (p.yellowCards >= 2) cardsHtml += '<span class="px-1.5 py-0.5 bg-amber-600 text-white font-bold rounded text-[10px]">🟨🟨 Expulsado</span>';

                                <div>

                        <div class="space-y-2 max-h-60 overflow-y-auto">
                            ${activePlayers.map(p => {
                                const mins = this.calculatePlayerMinutes(p);

                                const exitInfo = p.outMinute !== null ? ` | Salió: ${p.outMinute}'` : '';
                                const historySub = `${entryInfo}${exitInfo}`;

";

`;

            startMatch() {
                if (!this.state.matchResetted) {
                    alert('Debes resetear los valores o iniciar un nuevo partido antes de continuar.');
                    return;
                }

                const startersCount = this.state.squad.filter(p => p.status === 'starter').length;
                if (startersCount !== 11) {
                    if (!confirm(`Atención: Hay ${startersCount} jugadores titulares seleccionados en lugar de 11. ¿Deseas iniciar el partido de todas formas?`)) {
                        return;
                    }
                }

                const duration = parseInt(document.getElementById('set-duration').value) || 45;

                this.state.match.halfDuration = duration;
                this.state.match.status = 'first_half';
                this.state.match.currentHalf = 1;
                this.state.match.timerSeconds = 0;
                this.state.match.timerRunning = true;
                this.state.match.timerStartTimestamp = Date.now();
                this.state.matchResetted = false;

                this.startTimerInterval();
                this.switchTab('dashboard');
            }

            startTimerInterval() {
                if (this.state.match.timerInterval) clearInterval(this.state.match.timerInterval);
                
                if (!this.state.match.timerStartTimestamp && this.state.match.timerRunning) {
                    this.state.match.timerStartTimestamp = Date.now() - (this.state.match.timerSeconds * 1000);
                }

                this.state.match.timerInterval = setInterval(() => {
                    if (this.state.match.timerRunning && this.state.match.status !== 'finished' && this.state.match.status !== 'halftime') {
                        const elapsed = Math.floor((Date.now() - this.state.match.timerStartTimestamp) / 1000);
                        this.state.match.timerSeconds = Math.max(0, elapsed);
                        const timerEl = document.querySelector('.font-mono');
                        if (timerEl) timerEl.textContent = this.formatTime(this.state.match.timerSeconds);
                        this.checkAudioAlerts();
                    }
                }, 1000);
            }

            goToHalftime() {
                if (confirm('¿Detener 1ª parte e iniciar el descanso?')) {
                    this.state.match.status = 'halftime';
                    this.state.match.timerRunning = false;
                    this.state.match.timerStartTimestamp = null;
                    if (this.state.match.timerInterval) clearInterval(this.state.match.timerInterval);
                    this.state.match.halftimeSeconds = 0;
                    this.state.match.halftimeStartTimestamp = Date.now();
                    this.startHalftimeInterval();
                    this.render();
                }
            }

            startHalftimeInterval() {
                if (this.state.match.halftimeInterval) clearInterval(this.state.match.halftimeInterval);
                if (!this.state.match.halftimeStartTimestamp) {
                    this.state.match.halftimeStartTimestamp = Date.now();
                }
                this.state.match.halftimeInterval = setInterval(() => {
                    if (this.state.match.status === 'halftime') {
                        const elapsed = Math.floor((Date.now() - this.state.match.halftimeStartTimestamp) / 1000);
                        this.state.match.halftimeSeconds = Math.max(0, elapsed);
                        const halftimeEl = document.querySelector('.text-2xl.font-mono');
                        if (halftimeEl) halftimeEl.textContent = this.formatTime(this.state.match.halftimeSeconds);
                    }
                }, 1000);
            }

            startSecondHalf() {
                if (confirm('¿Iniciar la 2ª Parte?')) {
                    if (this.state.match.halftimeInterval) clearInterval(this.state.match.halftimeInterval);
                    this.state.match.status = 'second_half';
                    this.state.match.currentHalf = 2;
                    this.state.match.timerSeconds = this.state.match.halfDuration * 60;
                    this.state.match.timerStartTimestamp = Date.now() - (this.state.match.timerSeconds * 1000);
                    this.state.match.timerRunning = true;
                    this.startTimerInterval();
                    this.render();
                }
            }

            toggleTimer() {
                this.state.match.timerRunning = !this.state.match.timerRunning;
                if (this.state.match.timerRunning) {
                    this.state.match.timerStartTimestamp = Date.now() - (this.state.match.timerSeconds * 1000);
                    this.startTimerInterval();
                } else {
                    if (this.state.match.timerInterval) clearInterval(this.state.match.timerInterval);
                }
                this.render();
            }

            finishMatch() {
                if (confirm('¿Finalizar el encuentro definitivamente?')) {
                    this.state.match.status = 'finished';
                    this.state.match.timerRunning = false;

                    if (this.state.match.halftimeInterval) clearInterval(this.state.match.halftimeInterval);

            }

            handleFileOCR(event) {
                const file = event.target.files[0];
                if (!file) return;

                if (file.size > 5 * 1024 * 1024) {
                    alert('El fichero es demasiado grande (máx 5MB).');
                    return;
                }

                const loadingEl = document.getElementById('ocr-loading');
                if (loadingEl) loadingEl.classList.remove('hidden');

                if (file.type.includes('image')) {
                    Tesseract.recognize(file, 'spa').then(({ data: { text } }) => {
                        if (loadingEl) loadingEl.classList.add('hidden');
                        this.parseOCRTextToSquad(text);
                    }).catch(() => {
                        if (loadingEl) loadingEl.classList.add('hidden');
                        alert('Error al procesar la imagen.');
                    });
                } else {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        if (loadingEl) loadingEl.classList.add('hidden');
                        this.parseOCRTextToSquad(e.target.result);
                    };
                    reader.readAsText(file);
                }
            }

            parseOCRTextToSquad(text) {
                const lines = text.split('\n');
                let count = 0;
                lines.forEach(line => {
                    const match = line.match(/^(\d{1,2})\s*[\.\-,\t]?\s*(.+)/);
                    if (match) {
                        const num = parseInt(match[1]);
                        const name = match[2].trim().replace(/^,+/, '').trim();
                        if (name.length > 1 && !isNaN(num)) {
                            const exists = this.state.squad.find(p => p.number === num);
                            if (!exists) {
                                this.state.squad.push({
                                    id: 'p_' + Date.now() + '_' + num,
                                    name: name.slice(0, 40),
                                    number: num,
                                    position: num === 1 ? 'POR' : 'MED',
                                    status: 'unconvoked',
                                    inMinute: null, outMinute: null, goals: 0, goalMinutes: [], goalTypes: [], assists: 0, yellowCards: 0, redCard: false, captain: false
                                });
                                count++;
                            }
                        }
                    }
                });
                alert(`¡Plantilla actualizada! Se han incorporado ${count} jugadores.`);
                this.render();
            }

                                <label class="text-xs text-slate-400">Minuto</label>

                            <button onclick="app.submitSubAway()" class="w-full bg-slate-800 text-white font-bold py-3 rounded-xl text-sm">Guardar Cambios Rival</button>

                } else if (type === 'goal_away') {
                    const rivalTeamName = this.state.match.isHome ? this.state.match.awayTeam : this.state.match.homeTeam;

                                <label class="text-xs text-slate-400">Minuto</label>

            updateCardTypeOptions(playerId) {
                const selectType = document.getElementById('card-type');
                if (!selectType) return;
                const player = this.state.squad.find(p => p.id === playerId);
                if (!player) return;

                if (player.yellowCards >= 1) {
                    selectType.innerHTML = `
                        <option value="second_yellow">🟨🟨 Doble Amarilla (Expulsión)</option>
                        <option value="red">🟥 Roja Directa (Expulsión)</option>
                    `;
                } else {
                    selectType.innerHTML = `
                        <option value="yellow">🟨 Tarjeta Amarilla</option>
                        <option value="red">🟥 Roja Directa (Expulsión)</option>
                    `;
                }
            }

            closeModal() { document.getElementById('modal-container').innerHTML = ''; }

            submitGoalLasalle() {
                const scorerId = document.getElementById('goal-scorer').value;
                const goalType = document.getElementById('goal-type').value;
                const assistId = document.getElementById('goal-assist').value;
                const min = parseInt(document.getElementById('goal-min').value) || 0;

                if (assistId && scorerId === assistId) {
                    alert('Error: Un mismo jugador no puede anotar el gol y darse la asistencia a sí mismo.');
                    return;
                }

                const scorer = this.state.squad.find(p => p.id === scorerId);
                const assist = this.state.squad.find(p => p.id === assistId);
                
                const isOurTeamHome = this.state.match.isHome;

                if (goalType === 'own') {
                    // Gol en propia puerta de nuestro jugador suma al rival
                    if (isOurTeamHome) {
                        this.state.score.rival++;
                    } else {
                        this.state.score.local++;
                    }
                    this.state.events.push({
                        id: 'ev_' + Date.now(), minute: min, type: 'goal', team: isOurTeamHome ? 'local' : 'away',
                        title: `Autogol / Propia puerta (#${scorer?.number} ${scorer?.name})`,
                        detail: `Minuto ${min}' - Suma al rival`
                    });
                } else {
                    if (scorer) {
                        scorer.goals++;
                        scorer.goalMinutes.push(min);
                        if (!scorer.goalTypes) scorer.goalTypes = [];
                        scorer.goalTypes.push(goalType);
                    }
                    if (assist) assist.assists++;

                    if (isOurTeamHome) {
                        this.state.score.local++;
                    } else {
                        this.state.score.rival++;
                    }

                    let typeLabel = '';
                    if (goalType === 'penalty') typeLabel = ' (Penalti)';
                    else if (goalType === 'freekick') typeLabel = ' (Falta Directa)';

                    this.state.events.push({
                        id: 'ev_' + Date.now(), minute: min, type: 'goal', team: isOurTeamHome ? 'local' : 'away',
                        title: `Gol #${scorer?.number} ${scorer?.name}${typeLabel}`,
                        detail: assist ? `Asistencia: #${assist.number} ${assist.name}` : `Sin asistencia`
                    });
                }

                this.closeModal();
                this.render();
            }

            submitGoalRival() {
                const numEl = document.getElementById('away-goal-num');
                const num = numEl ? numEl.value.trim() : '';
                const minEl = document.getElementById('away-goal-min');
                const min = parseInt(minEl ? minEl.value : 0) || 0;

                const isOurTeamHome = this.state.match.isHome;
                if (isOurTeamHome) {
                    this.state.score.rival++;
                } else {
                    this.state.score.local++;
                }

                const rivalTeamName = isOurTeamHome ? this.state.match.awayTeam : this.state.match.homeTeam;
                this.state.events.push({
                    id: 'ev_' + Date.now(), minute: min, type: 'goal_away', team: isOurTeamHome ? 'away' : 'local',
                    title: `Gol de ${rivalTeamName} ${num ? '(#' + num + ')' : ''}`,
                    detail: `Minuto ${min}'`
                });
                this.closeModal();
                this.render();
            }

            submitCardHome() {
                const playerId = document.getElementById('card-player').value;
                const type = document.getElementById('card-type').value;
                const min = parseInt(document.getElementById('card-min').value) || 0;

                const player = this.state.squad.find(p => p.id === playerId);
                if (player) {
                    if (player.redCard) {
                        alert('Este jugador ya está expulsado.');
                        return;
                    }

                    let cardLabel = '🟨 Tarjeta Amarilla';

                    if (type === 'yellow') {
                        player.yellowCards++;
                        if (player.yellowCards >= 2) {
                            player.redCard = true;
                            player.status = 'out';
                            player.outMinute = min;
                            cardLabel = '🟨🟨 Doble Amarilla (Expulsión automática)';
                        }
                    } else if (type === 'second_yellow') {
                        player.yellowCards++;
                        player.redCard = true;
                        player.status = 'out';
                        player.outMinute = min;
                        cardLabel = '🟨🟨 Doble Amarilla (Expulsión)';
                    } else if (type === 'red') {
                        player.redCard = true;
                        player.status = 'out';
                        player.outMinute = min;
                        cardLabel = '🟥 Roja Directa (Expulsión)';
                    }

                    this.state.events.push({
                        id: 'ev_' + Date.now(), minute: min, type: 'card', team: 'home',
                        title: `${cardLabel} a #${player.number} ${player.name}`,
                        detail: `Minuto ${min}'`
                    });
                }
                this.closeModal();
                this.render();
            }

            submitCardAway() {
                const numEl = document.getElementById('away-card-num');
                const num = numEl ? numEl.value.trim() : '';
                const typeEl = document.getElementById('away-card-type');
                const type = typeEl ? typeEl.value : 'Amarilla';
                const minEl = document.getElementById('away-card-min');
                const min = parseInt(minEl ? minEl.value : 0) || 0;

                const rivalTeamName = this.state.match.isHome ? this.state.match.awayTeam : this.state.match.homeTeam;
                this.state.events.push({
                    id: 'ev_' + Date.now(), minute: min, type: 'card_away', team: 'away',
                    title: `Tarjeta ${type} a ${rivalTeamName} ${num ? '(#' + num + ')' : ''}`,
                    detail: `Minuto ${min}'`
                });
                this.closeModal();
                this.render();
            }

            submitSubHome() {
                const isHalftime = this.state.match.status === 'halftime';
                const consumeCheckbox = document.getElementById('consume-window');
                const consumeWindow = consumeCheckbox ? consumeCheckbox.checked : false;

                const outCheckboxes = document.querySelectorAll('input[name="sub-out-chk"]:checked');
                const inCheckboxes = document.querySelectorAll('input[name="sub-in-chk"]:checked');
                const min = parseInt(document.getElementById('sub-min').value) || 0;

                if (outCheckboxes.length === 0 && inCheckboxes.length === 0) {
                    alert('Debes seleccionar al menos un jugador que sale o que entra.');
                    return;
                }

                if (!isHalftime && consumeWindow && this.state.windows.home.used >= 3) {
                    alert('Atención: Se han consumido las 3 ventanas de cambios.');
                    return;
                }

                const outPlayers = Array.from(outCheckboxes).map(chk => this.state.squad.find(p => p.id === chk.value)).filter(Boolean);
                const inPlayers = Array.from(inCheckboxes).map(chk => this.state.squad.find(p => p.id === chk.value)).filter(Boolean);

                outPlayers.forEach(p => {
                    p.status = 'substituted';
                    p.outMinute = min;
                });

                inPlayers.forEach(p => {
                    p.status = 'starter';
                    p.inMinute = min;
                });

                if (!isHalftime && consumeWindow) {
                    this.state.windows.home.used++;
                }

                const outNames = outPlayers.map(p => `#${p.number} ${p.name}`).join(', ');
                const inNames = inPlayers.map(p => `#${p.number} ${p.name}`).join(', ');

                this.state.events.push({
                    id: 'ev_' + Date.now(), minute: min, type: 'sub', team: 'home',
                    title: `Cambios Múltiples: Entran [${inNames || 'Ninguno'}] / Salen [${outNames || 'Ninguno'}]`,
                    detail: isHalftime ? 'Descanso' : `Ventana Local #${this.state.windows.home.used}`
                });

                this.closeModal();
                this.render();
            }

            submitSubAway() {
                const isHalftime = this.state.match.status === 'halftime';
                const consumeCheckbox = document.getElementById('consume-window-away');
                const consumeWindow = consumeCheckbox ? consumeCheckbox.checked : false;

                if (!isHalftime && consumeWindow && this.state.windows.away.used >= 3) {
                    alert('Atención: Ventanas de cambios del rival consumidas.');
                    return;
                }

                const outNumEl = document.getElementById('away-sub-out');
                const outNums = outNumEl ? outNumEl.value.trim() : '';
                const inNumEl = document.getElementById('away-sub-in');
                const inNums = inNumEl ? inNumEl.value.trim() : '';
                const minEl = document.getElementById('away-sub-min');
                const min = parseInt(minEl ? minEl.value : 0) || 0;

                if (!isHalftime && consumeWindow) {
                    this.state.windows.away.used++;
                }

                const rivalTeamName = this.state.match.isHome ? this.state.match.awayTeam : this.state.match.homeTeam;
                this.state.events.push({
                    id: 'ev_' + Date.now(), minute: min, type: 'sub_away', team: 'away',
                    title: `Cambios ${rivalTeamName}: Entran #${inNums || '?'} / Salen #${outNums || '?'}`,
                    detail: isHalftime ? 'Descanso' : `Ventana Rival #${this.state.windows.away.used} (Min ${min}')`
                });
                this.closeModal();
                this.render();
            }

            submitNote() {
                const textEl = document.getElementById('note-text');
                const text = textEl ? textEl.value.trim() : '';
                const minEl = document.getElementById('note-min');
                const min = parseInt(minEl ? minEl.value : 0) || 0;
                if (!text) return;

                this.state.events.push({
                    id: 'ev_' + Date.now(), minute: min, type: 'note', team: 'home',
                    title: `Nota / Comentario`,
                    detail: `${text} (Min ${min}')`
                });
                this.closeModal();
                this.render();
            }

            changePlayerStatus(id, newStatus) {
                if (this.state.match.status !== 'setup') {
                    alert('La plantilla no se puede modificar una vez iniciado el partido.');
                    return;
                }
                const p = this.state.squad.find(x => x.id === id);
                if (!p) return;
                if (newStatus === 'starter') {
                    const startersCount = this.state.squad.filter(x => x.status === 'starter').length;
                    if (startersCount >= 11 && p.status !== 'starter') {
                        alert('Ya hay 11 titulares.');
                        return;
                    }
                    p.status = 'starter';
                    p.inMinute = 0;
                } else {
                    p.status = newStatus;
                    if (p.captain) p.captain = false;
                }
                this.render();
            }

            toggleCaptain(id) {
                if (this.state.match.status !== 'setup') {
                    alert('El capitán debe asignarse antes de empezar el partido.');
                    return;
                }
                this.state.squad.forEach(p => p.captain = false);
                const p = this.state.squad.find(x => x.id === id);
                if (p) {
                    if (p.status !== 'starter') {
                        alert('El capitán debe ser un jugador titular.');
                        return;
                    }
                    p.captain = true;
                }
                this.render();
            }

            openPlayerModal() {
                if (this.state.match.status !== 'setup') {
                    alert('No se pueden añadir jugadores una vez iniciado el partido.');
                    return;
                }
                const container = document.getElementById('modal-container');
                container.innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl relative">
                            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            <h3 class="font-bold text-base text-white mb-3">Nuevo Jugador</h3>
                            <div class="space-y-3">
                                <div>
                                    <label class="text-xs text-slate-400">Nombre Completo</label>
                                    <input type="text" id="new-p-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1" placeholder="Ej: Pedro Ruiz">
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="text-xs text-slate-400">Dorsal</label>
                                        <input type="number" id="new-p-num" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1" placeholder="15">
                                    </div>
                                    <div>
                                        <label class="text-xs text-slate-400">Posición</label>
                                        <select id="new-p-pos" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                                            <option value="POR">POR</option>
                                            <option value="DEF">DEF</option>
                                            <option value="MED">MED</option>
                                            <option value="DEL">DEL</option>
                                        </select>
                                    </div>
                                </div>
                                <button onclick="app.submitNewPlayer()" class="w-full bg-lasalle-yellow text-lasalle-darkblue font-bold py-3 rounded-xl text-sm">Guardar Jugador</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            editPlayerModal(id) {
                if (this.state.match.status !== 'setup') {
                    alert('La plantilla no se puede editar una vez iniciado el partido.');
                    return;
                }
                const p = this.state.squad.find(x => x.id === id);
                if (!p) return;
                const container = document.getElementById('modal-container');
                container.innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl relative">
                            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            <h3 class="font-bold text-base text-white mb-3">Modificar Jugador</h3>
                            <div class="space-y-3">
                                <div>
                                    <label class="text-xs text-slate-400">Nombre Completo</label>
                                    <input type="text" id="edit-p-name" value="${escapeHTML(p.name)}" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="text-xs text-slate-400">Dorsal</label>
                                        <input type="number" id="edit-p-num" value="${p.number}" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                                    </div>
                                    <div>
                                        <label class="text-xs text-slate-400">Posición</label>
                                        <select id="edit-p-pos" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                                            <option value="POR" ${p.position === 'POR' ? 'selected' : ''}>POR</option>
                                            <option value="DEF" ${p.position === 'DEF' ? 'selected' : ''}>DEF</option>
                                            <option value="MED" ${p.position === 'MED' ? 'selected' : ''}>MED</option>
                                            <option value="DEL" ${p.position === 'DEL' ? 'selected' : ''}>DEL</option>
                                        </select>
                                    </div>
                                </div>
                                <button onclick="app.submitEditPlayer('${escapeHTML(p.id)}')" class="w-full bg-lasalle-yellow text-lasalle-darkblue font-bold py-3 rounded-xl text-sm">Actualizar</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            submitNewPlayer() {
                const nameEl = document.getElementById('new-p-name');
                const name = nameEl ? nameEl.value.trim() : '';
                const numEl = document.getElementById('new-p-num');
                const num = parseInt(numEl ? numEl.value : NaN);
                const posEl = document.getElementById('new-p-pos');
                const pos = posEl ? posEl.value : 'MED';

                if (!name || isNaN(num)) {
                    alert('Introduce nombre y dorsal válidos.');
                    return;
                }
                this.state.squad.push({
                    id: 'p_' + Date.now(),
                    name: name.slice(0, 40),
                    number: num,
                    position: pos,
                    status: 'unconvoked',
                    inMinute: null, outMinute: null,
                    goals: 0, goalMinutes: [], goalTypes: [], assists: 0, yellowCards: 0, redCard: false, captain: false
                });
                this.closeModal();
                this.render();
            }

            submitEditPlayer(id) {
                const p = this.state.squad.find(x => x.id === id);
                if (!p) return;
                const nameEl = document.getElementById('edit-p-name');
                const name = nameEl ? nameEl.value.trim() : '';
                const numEl = document.getElementById('edit-p-num');
                const num = parseInt(numEl ? numEl.value : NaN);
                const posEl = document.getElementById('edit-p-pos');
                const pos = posEl ? posEl.value : p.position;

                if (!name || isNaN(num)) {
                    alert('Introduce nombre y dorsal válidos.');
                    return;
                }
                p.name = name.slice(0, 40);
                p.number = num;
                p.position = pos;
                this.closeModal();
                this.render();
            }

            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }

            calculatePlayerMinutes(p) {
                if (p.status === 'unconvoked') return 0;
                let total = 0;
                const totalMatchDuration = this.state.match.halfDuration * 2;
                
                if (p.status === 'starter') {
                    const outMin = p.outMinute !== null ? p.outMinute : totalMatchDuration;
                    const inMin = p.inMinute !== null ? p.inMinute : 0;
                    total += (outMin - inMin);
                } else if (p.status === 'substituted' || p.status === 'out') {
                    const outMin = p.outMinute !== null ? p.outMinute : 0;
                    const inMin = p.inMinute !== null ? p.inMinute : 0;
                    total += (outMin - inMin);
                } else if (p.status === 'bench' && p.inMinute !== null) {
                    const outMin = p.outMinute !== null ? p.outMinute : totalMatchDuration;
                    total += (outMin - p.inMinute);
                }
                return Math.max(0, total);
            }

            async generateWhatsAppPDF() {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                doc.setFillColor(0, 43, 102);
                doc.rect(0, 0, 210, 40, 'F');
                
                doc.setTextColor(255, 204, 0);
                doc.setFontSize(18);
                doc.text("STATBENCH 360", 20, 25);
                
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(11);
                doc.text(`ACTA OFICIAL - ${this.state.match.competition || 'LIGA'} (JORNADA ${this.state.match.matchday})`, 75, 25);

                doc.setTextColor(30, 30, 30);
                doc.setFontSize(11);
                doc.text(`Encuentro: ${this.state.match.homeTeam} vs ${this.state.match.awayTeam}`, 14, 50);
                doc.text(`Fecha: ${this.state.match.date} | Competición: ${this.state.match.competition}`, 14, 57);
                doc.text(`Resultado Final: ${this.state.match.homeTeam} ${this.state.score.local} - ${this.state.score.rival} ${this.state.match.awayTeam}`, 14, 64);

                doc.setFontSize(12);
                doc.setTextColor(0, 43, 102);
                doc.text("ESTADÍSTICAS DETALLADAS DE JUGADORES", 14, 76);

                const activePlayers = this.state.squad.filter(p => p.status !== 'unconvoked');
                const playerTableData = activePlayers.map(p => {
                    const mins = this.calculatePlayerMinutes(p);
                    const capTxt = p.captain ? ' (C)' : '';
                    return [
                        `#${p.number} ${p.name}${capTxt}`,
                        p.position,
                        `${mins}'`,
                        p.goals,
                        p.assists,
                        p.yellowCards,
                        p.redCard ? 'Sí' : 'No'
                    ];
                });

                // Cabecera indicando la estadística en cada columna
                doc.autoTable({
                    startY: 80,
                    head: [['Jugadores (Nombre y Dorsal)', 'Posición', 'Minutos Jugados', 'Goles Anotados', 'Asistencias', 'Tarjetas Amarillas', 'Tarjeta Roja']],
                    body: playerTableData,
                    theme: 'grid',
                    headStyles: { fillColor: [0, 43, 102], textColor: [255, 204, 0], fontStyle: 'bold' },
                    styles: { fontSize: 8, cellPadding: 2 }
                });

                let finalY = doc.lastAutoTable.finalY + 10;
                if (finalY > 250) { doc.addPage(); finalY = 20; }

                doc.setFontSize(12);
                doc.setTextColor(0, 43, 102);
                doc.text("CRONOLOGÍA DE INCIDENCIAS", 14, finalY);

                const sortedEvents = [...this.state.events].sort((a, b) => a.minute - b.minute);
                const eventTableData = sortedEvents.map(ev => [
                    `Min ${ev.minute}'`,
                    ev.title,
                    ev.detail
                ]);

                doc.autoTable({
                    startY: finalY + 4,
                    head: [['Minuto del Suceso', 'Acontecimiento Principal', 'Detalle de la Incidencia']],
                    body: eventTableData,
                    theme: 'grid',
                    headStyles: { fillColor: [0, 43, 102], textColor: [255, 204, 0], fontStyle: 'bold' },
                    styles: { fontSize: 8, cellPadding: 2 }
                });

                const sanitizedHome = (this.state.match.homeTeam || 'Local').replace(/[^a-zA-Z0-9]/g, '_');
                const sanitizedAway = (this.state.match.awayTeam || 'Rival').replace(/[^a-zA-Z0-9]/g, '_');
                const jornadaNum = this.state.match.matchday || '1';
                const fechaStr = this.state.match.date || 'fecha';
                const pdfFileName = `Acta_${jornadaNum}_${fechaStr}_${sanitizedHome}_${sanitizedAway}.pdf`;

                const pdfBlob = doc.output('blob');
                const file = new File([pdfBlob], pdfFileName, { type: 'application/pdf' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            title: 'Acta StatBench360',
                            text: `Acta del partido ${this.state.match.homeTeam} vs ${this.state.match.awayTeam}. Resultado: ${this.state.score.local}-${this.state.score.rival}`,
                            files: [file]
                        });
                        return;
                    } catch (error) {
                        console.log('Error en share nativo:', error);
                    }
                }

                const link = document.createElement('a');
                link.href = URL.createObjectURL(pdfBlob);
                link.download = pdfFileName;
                link.click();
                alert('Acta generada con cabeceras estadísticas y descargada. Adjúntala manualmente en WhatsApp.');
            }

            exportGoogleDriveSheet() {
                let csvContent = "data:text/csv;charset=utf-8,Competicion,EquipoLocal,EquipoRival,Jornada,Fecha,Jugador,Dorsal,Posicion,Capitan,MinutosJugados,Goles,MinutosGoles,Asistencias,TarjetasAmarillas,TarjetaRoja\n";
                this.state.squad.forEach(p => {
                    if (p.status !== 'unconvoked') {
                        const mins = this.calculatePlayerMinutes(p);
                        csvContent += `${sanitizeCSVField(this.state.match.competition)},${sanitizeCSVField(this.state.match.homeTeam)},${sanitizeCSVField(this.state.match.awayTeam)},${sanitizeCSVField(this.state.match.matchday)},${sanitizeCSVField(this.state.match.date)},${sanitizeCSVField(p.name)},${sanitizeCSVField(p.number)},${sanitizeCSVField(p.position)},${sanitizeCSVField(p.captain ? 'Sí' : 'No')},${mins},${sanitizeCSVField(p.goals)},${sanitizeCSVField(p.goalMinutes.join('-'))},${sanitizeCSVField(p.assists)},${sanitizeCSVField(p.yellowCards)},${sanitizeCSVField(p.redCard ? 'Sí' : 'No')}\n`;
                    }
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Estadisticas_${sanitizeCSVField(this.state.match.homeTeam)}_vs_${sanitizeCSVField(this.state.match.awayTeam)}_J${sanitizeCSVField(this.state.match.matchday)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                alert('¡Estadísticas exportadas con éxito!');
            }
        }

        const app = new FutStatApp();
    </script>
</body>
