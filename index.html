                                    <input type="text" id="away-sub-in" placeholder="Ej: 14" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                                </div>
                            </div>
                            <div>
                                <label class="text-xs text-slate-400">Minuto</label>
                                <input type="number" id="away-sub-min" value="${currentMin}" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                            </div>
                            <button onclick="app.submitSubAway()" class="w-full bg-slate-800 text-white font-bold py-3 rounded-xl text-sm">Guardar Cambio Rival</button>
                        </div>
                    `;
                } else if (type === 'goal_away') {
                    content = `
                        <h3 class="font-bold text-base text-white mb-3">Gol de (${this.state.match.awayTeam})</h3>
                        <div class="space-y-3">
                            <div>
                                <label class="text-xs text-slate-400">Dorsal del Rival (Opcional)</label>
                                <input type="text" id="away-goal-num" placeholder="Ej: 9" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                            </div>
                            <div>
                                <label class="text-xs text-slate-400">Minuto</label>
                                <input type="number" id="away-goal-min" value="${currentMin}" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                            </div>
                            <button onclick="app.submitGoalRival()" class="w-full bg-rose-600 text-white font-bold py-3 rounded-xl text-sm">Guardar Gol Rival</button>
                        </div>
                    `;
                } else if (type === 'note') {
                    content = `
                        <h3 class="font-bold text-base text-white mb-3">Anotación / Comentario</h3>
                        <div class="space-y-3">
                            <div>
                                <label class="text-xs text-slate-400">Comentario</label>
                                <textarea id="note-text" placeholder="Ej: Buena presión alta..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white mt-1 h-28 resize-none"></textarea>
                            </div>
                            <div>
                                <label class="text-xs text-slate-400">Minuto</label>
                                <input type="number" id="note-min" value="${currentMin}" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                            </div>
                            <button onclick="app.submitNote()" class="w-full bg-slate-700 text-white font-bold py-3 rounded-xl text-sm">Guardar Nota</button>
                        </div>
                    `;
                }


                container.innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl relative">
                            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            ${content}
                        </div>
                    </div>
                `;
            }


            closeModal() { document.getElementById('modal-container').innerHTML = ''; }


            submitGoalLasalle() {
                const scorerId = document.getElementById('goal-scorer').value;
                const assistId = document.getElementById('goal-assist').value;
                const min = parseInt(document.getElementById('goal-min').value) || 0;


                if (assistId && scorerId === assistId) {
                    alert('Error: Un mismo jugador no puede anotar el gol y darse la asistencia a sí mismo.');
                    return;
                }


                const scorer = this.state.squad.find(p => p.id === scorerId);
                const assist = this.state.squad.find(p => p.id === assistId);
                if (scorer) {
                    scorer.goals++;
                    scorer.goalMinutes.push(min);
                }
                if (assist) assist.assists++;


                this.state.score.lasalle++;
                this.state.events.push({
                    id: 'ev_' + Date.now(), minute: min, type: 'goal', team: 'lasalle',
                    title: `Gol SD La Salle (#${scorer?.number} ${scorer?.name})`,
                    detail: assist ? `Asistencia: #${assist.number} ${assist.name}` : `Sin asistencia`
                });
                this.closeModal();
                this.render();
            }


            submitGoalRival() {
                const num = document.getElementById('away-goal-num').value.trim();
                const min = parseInt(document.getElementById('away-goal-min').value) || 0;


                this.state.score.rival++;
                this.state.events.push({
                    id: 'ev_' + Date.now(), minute: min, type: 'goal_away', team: 'rival',
                    title: `Gol de ${this.state.match.awayTeam} ${num ? '(#' + num + ')' : ''}`,
                    detail: `Minuto ${min}'`
                });
                this.closeModal();
                this.render();
            }


            submitCardHome() {
                const playerId = document.getElementById('card-player').value;
                const type = document.getElementById('card-type').value;
                const min = parseInt(document.getElementById('card-min').value) || 0;


                const player = this.state.squad.find(p => p.id === playerId);
                if (player) {
                    if (type === 'yellow') player.yellowCards++;
                    if (type === 'second_yellow') {
                        player.yellowCards++;
                        player.redCard = true;
                        player.status = 'out';
                        player.outMinute = min;
                    }
                    if (type === 'red') {
                        player.redCard = true;
                        player.status = 'out';
                        player.outMinute = min;
                    }
                }


                this.state.events.push({
                    id: 'ev_' + Date.now(), minute: min, type: 'card', team: 'home',
                    title: `Tarjeta ${type === 'yellow' ? 'Amarilla' : (type === 'second_yellow' ? 'Doble Amarilla' : 'Roja')} a #${player?.number} ${player?.name}`,
                    detail: `Minuto ${min}'`
                });
                this.closeModal();
                this.render();
            }


            submitCardAway() {
                const num = document.getElementById('away-card-num').value.trim();
                const type = document.getElementById('away-card-type').value;
                const min = parseInt(document.getElementById('away-card-min').value) || 0;


                this.state.events.push({
                    id: 'ev_' + Date.now(), minute: min, type: 'card_away', team: 'away',
                    title: `Tarjeta ${type} a ${this.state.match.awayTeam} ${num ? '(#' + num + ')' : ''}`,
                    detail: `Minuto ${min}'`
                });
                this.closeModal();
                this.render();
            }


            submitSubHome() {
                const isHalftime = this.state.match.status === 'halftime';
                if (!isHalftime && this.state.windows.home.used >= 3) {
                    alert('Atención: Se han consumido las 3 ventanas de cambios.');
                    return;
                }


                const outId = document.getElementById('sub-out').value;
                const inId = document.getElementById('sub-in').value;
                const min = parseInt(document.getElementById('sub-min').value) || 0;


                const pOut = this.state.squad.find(p => p.id === outId);
                const pIn = this.state.squad.find(p => p.id === inId);


                if (pOut) { pOut.status = 'substituted'; pOut.outMinute = min; }
                if (pIn) { pIn.status = 'starter'; pIn.inMinute = min; }


                if (!isHalftime) this.state.windows.home.used++;


                this.state.events.push({
                    id: 'ev_' + Date.now(), minute: min, type: 'sub', team: 'home',
                    title: `Cambio La Salle: Entra #${pIn?.number} ${pIn?.name} / Sale #${pOut?.number} ${pOut?.name}`,
                    detail: isHalftime ? 'Descanso' : `Ventana La Salle #${this.state.windows.home.used}`
                });
                this.closeModal();
                this.render();
            }


            submitSubAway() {
                const isHalftime = this.state.match.status === 'halftime';
                if (!isHalftime && this.state.windows.away.used >= 3) {
                    alert(`Atención: ${this.state.match.awayTeam} ha consumido sus 3 ventanas de cambios.`);
                    return;
                }


                const outNum = document.getElementById('away-sub-out').value.trim();
                const inNum = document.getElementById('away-sub-in').value.trim();
                const min = parseInt(document.getElementById('away-sub-min').value) || 0;


                if (!isHalftime) this.state.windows.away.used++;


                this.state.events.push({
                    id: 'ev_' + Date.now(), minute: min, type: 'sub_away', team: 'away',
                    title: `Cambio ${this.state.match.awayTeam}: Entra #${inNum || '?'} / Sale #${outNum || '?'}`,
                    detail: isHalftime ? 'Descanso' : `Ventana Rival #${this.state.windows.away.used} (Min ${min}')`
                });
                this.closeModal();
                this.render();
            }


            submitNote() {
                const text = document.getElementById('note-text').value.trim();
                const min = parseInt(document.getElementById('note-min').value) || 0;
                if (!text) return;


                this.state.events.push({
                    id: 'ev_' + Date.now(), minute: min, type: 'note', team: 'home',
                    title: `Nota / Comentario`,
                    detail: `${text} (Min ${min}')`
                });
                this.closeModal();
                this.render();
            }


            changePlayerStatus(id, newStatus) {
                if (this.state.match.status !== 'setup') {
                    alert('La plantilla no se puede modificar una vez iniciado el partido.');
                    return;
                }
                const p = this.state.squad.find(x => x.id === id);
                if (!p) return;
                if (newStatus === 'starter') {
                    const startersCount = this.state.squad.filter(x => x.status === 'starter').length;
                    if (startersCount >= 11 && p.status !== 'starter') {
                        alert('Ya hay 11 titulares.');
                        return;
                    }
                    p.status = 'starter';
                    p.inMinute = 0;
                } else {
                    p.status = newStatus;
                    if (p.captain) p.captain = false;
                }
                this.render();
            }


            toggleCaptain(id) {
                if (this.state.match.status !== 'setup') {
                    alert('El capitán debe asignarse antes de empezar el partido.');
                    return;
                }
                this.state.squad.forEach(p => p.captain = false);
                const p = this.state.squad.find(x => x.id === id);
                if (p) {
                    if (p.status !== 'starter') {
                        alert('El capitán debe ser un jugador titular.');
                        return;
                    }
                    p.captain = true;
                }
                this.render();
            }


            openPlayerModal() {
                if (this.state.match.status !== 'setup') {
                    alert('No se pueden añadir jugadores una vez iniciado el partido.');
                    return;
                }
                const container = document.getElementById('modal-container');
                container.innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl relative">
                            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            <h3 class="font-bold text-base text-white mb-3">Nuevo Jugador</h3>
                            <div class="space-y-3">
                                <div>
                                    <label class="text-xs text-slate-400">Nombre Completo</label>
                                    <input type="text" id="new-p-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1" placeholder="Ej: Pedro Ruiz">
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="text-xs text-slate-400">Dorsal</label>
                                        <input type="number" id="new-p-num" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1" placeholder="15">
                                    </div>
                                    <div>
                                        <label class="text-xs text-slate-400">Posición</label>
                                        <select id="new-p-pos" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                                            <option value="POR">POR</option>
                                            <option value="DEF">DEF</option>
                                            <option value="MED">MED</option>
                                            <option value="DEL">DEL</option>
                                        </select>
                                    </div>
                                </div>
                                <button onclick="app.submitNewPlayer()" class="w-full bg-lasalle-yellow text-lasalle-darkblue font-bold py-3 rounded-xl text-sm">Guardar Jugador</button>
                            </div>
                        </div>
                    </div>
                `;
            }


            editPlayerModal(id) {
                if (this.state.match.status !== 'setup') {
                    alert('La plantilla no se puede editar una vez iniciado el partido.');
                    return;
                }
                const p = this.state.squad.find(x => x.id === id);
                if (!p) return;
                const container = document.getElementById('modal-container');
                container.innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl relative">
                            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            <h3 class="font-bold text-base text-white mb-3">Modificar Jugador</h3>
                            <div class="space-y-3">
                                <div>
                                    <label class="text-xs text-slate-400">Nombre Completo</label>
                                    <input type="text" id="edit-p-name" value="${p.name}" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="text-xs text-slate-400">Dorsal</label>
                                        <input type="number" id="edit-p-num" value="${p.number}" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                                    </div>
                                    <div>
                                        <label class="text-xs text-slate-400">Posición</label>
                                        <select id="edit-p-pos" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                                            <option value="POR" ${p.position === 'POR' ? 'selected' : ''}>POR</option>
                                            <option value="DEF" ${p.position === 'DEF' ? 'selected' : ''}>DEF</option>
                                            <option value="MED" ${p.position === 'MED' ? 'selected' : ''}>MED</option>
                                            <option value="DEL" ${p.position === 'DEL' ? 'selected' : ''}>DEL</option>
                                        </select>
                                    </div>
                                </div>
                                <button onclick="app.submitEditPlayer('${p.id}')" class="w-full bg-lasalle-yellow text-lasalle-darkblue font-bold py-3 rounded-xl text-sm">Actualizar</button>
                            </div>
                        </div>
                    </div>
                `;
            }


            submitNewPlayer() {
                const name = document.getElementById('new-p-name').value.trim();
                const num = parseInt(document.getElementById('new-p-num').value);
                const pos = document.getElementById('new-p-pos').value;
                if (!name || isNaN(num)) {
                    alert('Introduce nombre y dorsal válidos.');
                    return;
                }
                this.state.squad.push({
                    id: 'p_' + Date.now(), name, number: num, position: pos,
                    status: 'unconvoked',
                    inMinute: null, outMinute: null,
                    goals: 0, goalMinutes: [], assists: 0, yellowCards: 0, redCard: false, captain: false
                });
                this.closeModal();
                this.render();
            }


            submitEditPlayer(id) {
                const p = this.state.squad.find(x => x.id === id);
                if (!p) return;
                const name = document.getElementById('edit-p-name').value.trim();
                const num = parseInt(document.getElementById('edit-p-num').value);
                const pos = document.getElementById('edit-p-pos').value;
                if (!name || isNaN(num)) {
                    alert('Introduce nombre y dorsal válidos.');
                    return;
                }
                p.name = name;
                p.number = num;
                p.position = pos;
                this.closeModal();
                this.render();
            }


            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }


            calculatePlayerMinutes(p) {
                if (p.status === 'unconvoked') return 0;
                let total = 0;
                const totalMatchDuration = this.state.match.halfDuration * 2;
                
                if (p.status === 'starter') {
                    const outMin = p.outMinute !== null ? p.outMinute : totalMatchDuration;
                    const inMin = p.inMinute !== null ? p.inMinute : 0;
                    total += (outMin - inMin);
                } else if (p.status === 'substituted' || p.status === 'out') {
                    const outMin = p.outMinute !== null ? p.outMinute : 0;
                    const inMin = p.inMinute !== null ? p.inMinute : 0;
                    total += (outMin - inMin);
                } else if (p.status === 'bench' && p.inMinute !== null) {
                    const outMin = p.outMinute !== null ? p.outMinute : totalMatchDuration;
                    total += (outMin - p.inMinute);
                }
                return Math.max(0, total);
            }


            async generateWhatsAppPDF() {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();


                doc.setFillColor(0, 43, 102);
                doc.rect(0, 0, 210, 40, 'F');
                
                doc.setTextColor(255, 204, 0);
                doc.setFontSize(18);
                doc.text("SD LA SALLE", 20, 25);
                
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(11);
                doc.text(`ACTA OFICIAL - ${this.state.match.competition || 'LIGA'} (JORNADA ${this.state.match.matchday})`, 65, 25);


                doc.setTextColor(30, 30, 30);
                doc.setFontSize(11);
                doc.text(`Rival: ${this.state.match.awayTeam}`, 14, 50);
                doc.text(`Fecha: ${this.state.match.date} | Competición: ${this.state.match.competition}`, 14, 57);
                doc.text(`Resultado Final: ${this.state.match.homeTeam} ${this.state.score.lasalle} - ${this.state.score.rival} ${this.state.match.awayTeam}`, 14, 64);


                doc.setFontSize(12);
                doc.setTextColor(0, 43, 102);
                doc.text("ESTADÍSTICAS DETALLADAS DE JUGADORES", 14, 78);


                let y = 86;
                doc.setFontSize(9);
                doc.setTextColor(50, 50, 50);


                const activePlayers = this.state.squad.filter(p => p.status !== 'unconvoked');
                activePlayers.forEach(p => {
                    if (y > 270) { doc.addPage(); y = 20; }
                    const mins = this.calculatePlayerMinutes(p);
                    const capTxt = p.captain ? ' (Capitán)' : '';
                    const infoLine = `#${p.number} ${p.name}${capTxt} | Mins: ${mins}' | Goles: ${p.goals} | Asist: ${p.assists} | Amarillas: ${p.yellowCards} | Roja: ${p.redCard ? 'Sí' : 'No'}`;
                    doc.text(infoLine, 14, y);
                    y += 7;
                });


                y += 5;
                if (y > 260) { doc.addPage(); y = 20; }
                doc.setFontSize(12);
                doc.setTextColor(0, 43, 102);
                doc.text("CRONOLOGÍA DE INCIDENCIAS", 14, y);
                y += 8;
                doc.setFontSize(9);
                doc.setTextColor(50, 50, 50);


                const sortedEvents = [...this.state.events].sort((a, b) => a.minute - b.minute);
                sortedEvents.forEach(ev => {
                    if (y > 270) { doc.addPage(); y = 20; }
                    doc.text(`[Minuto ${ev.minute}'] ${ev.title} - ${ev.detail}`, 14, y);
                    y += 6;
                });


                const sanitizedHome = (this.state.match.homeTeam || 'Local').replace(/[^a-zA-Z0-9]/g, '_');
                const sanitizedAway = (this.state.match.awayTeam || 'Rival').replace(/[^a-zA-Z0-9]/g, '_');
                const jornadaNum = this.state.match.matchday || '1';
                const fechaStr = this.state.match.date || 'fecha';
                const pdfFileName = `Acta_${jornadaNum}_${fechaStr}_${sanitizedHome}_${sanitizedAway}.pdf`;


                const pdfBlob = doc.output('blob');
                const file = new File([pdfBlob], pdfFileName, { type: 'application/pdf' });


                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            title: 'Acta SD La Salle',
                            text: `Acta del partido ${this.state.match.homeTeam} vs ${this.state.match.awayTeam}. Resultado: ${this.state.score.lasalle}-${this.state.score.rival}`,
                            files: [file]
                        });
                        return;
                    } catch (error) {
                        console.log('Error en share nativo:', error);
                    }
                }


                const link = document.createElement('a');
                link.href = URL.createObjectURL(pdfBlob);
                link.download = pdfFileName;
                link.click();
                alert('Acta generada y descargada. Adjúntala manualmente en WhatsApp.');
            }


            exportGoogleDriveSheet() {
                let csvContent = "data:text/csv;charset=utf-8,Competicion,EquipoLocal,EquipoRival,Jornada,Fecha,Jugador,Dorsal,Posicion,Capitan,MinutosJugados,Goles,MinutosGoles,Asistencias,TarjetasAmarillas,TarjetaRoja\n";
                this.state.squad.forEach(p => {
                    if (p.status !== 'unconvoked') {
                        const mins = this.calculatePlayerMinutes(p);
                        csvContent += `"${this.state.match.competition}","${this.state.match.homeTeam}","${this.state.match.awayTeam}",${this.state.match.matchday},${this.state.match.date},"${p.name}",${p.number},${p.position},${p.captain ? 'Sí' : 'No'},${mins},${p.goals},"${p.goalMinutes.join('-')}",${p.assists},${p.yellowCards},${p.redCard ? 'Sí' : 'No'}\n`;
                    }
                });


                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `Estadisticas_${this.state.match.homeTeam}_vs_${this.state.match.awayTeam}_J${this.state.match.matchday}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);


                alert('¡Estadísticas completas incluyendo el equipo rival exportadas con éxito!');
            }
        }


        const app = new FutStatApp();
    </script>
