<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SalleApp360 V71126v8 - SD La Salle</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lasalle: {
                            blue: '#002B66',
                            darkblue: '#001A40',
                            navy: '#00122E',
                            yellow: '#FFCC00',
                            yellowhover: '#E6B800',
                            gold: '#D4AF37'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF & Tesseract.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #00122E; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-lasalle-navy text-slate-100 min-h-screen flex flex-col selection:bg-lasalle-yellow selection:text-lasalle-darkblue">


    <!-- App Container -->
    <div id="app" class="flex-1 flex flex-col max-w-md mx-auto w-full bg-lasalle-darkblue shadow-2xl relative overflow-hidden border-x border-slate-800 pb-10">
        
        <!-- Header -->
        <header class="bg-lasalle-blue/95 backdrop-blur-md border-b border-lasalle-yellow/30 px-4 py-3 flex items-center justify-between sticky top-0 z-40">
            <div class="flex items-center space-x-3">
                <div class="bg-lasalle-yellow text-lasalle-darkblue p-2 rounded-xl font-black text-lg flex items-center justify-center w-10 h-10 shadow-lg shadow-lasalle-yellow/20 overflow-hidden border border-lasalle-gold">
                    <i class="fa-solid fa-shield-halved text-lasalle-darkblue"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-base tracking-tight leading-none text-white flex items-center gap-1.5">
                        SALLEAPP360 <span class="text-lasalle-yellow text-[10px] font-black">V71126v8</span>
                    </h1>
                    <span id="header-match-subtitle" class="text-xs text-slate-300 font-medium">Banquillo & Estadística</span>
                </div>
            </div>
            <div id="header-actions" class="flex items-center space-x-2">
                <button onclick="app.goHomeTab()" class="px-2.5 py-1.5 rounded-xl bg-lasalle-darkblue hover:bg-slate-800 text-lasalle-yellow text-xs font-bold transition-all border border-lasalle-yellow/30 flex items-center gap-1">
                    <i class="fa-solid fa-house"></i> Inicio
                </button>
            </div>
        </header>


        <!-- Main Content Area -->
        <main id="main-content" class="flex-1 overflow-y-auto pb-24">
            <!-- Rendered dynamically by JS -->
        </main>


        <!-- Bottom Navigation Bar -->
        <nav id="bottom-nav" class="hidden absolute bottom-6 left-0 right-0 bg-lasalle-blue/95 backdrop-blur-lg border-t border-lasalle-yellow/20 px-4 py-2 flex justify-around items-center z-40 shadow-2xl">
            <button onclick="app.switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center text-lasalle-yellow py-1 px-3 rounded-xl transition-all">
                <i class="fa-solid fa-gauge-high text-lg"></i>
                <span class="text-[10px] font-semibold mt-1">Directo</span>
            </button>
            <button onclick="app.switchTab('lineup')" id="nav-lineup" class="flex flex-col items-center text-slate-300 hover:text-white py-1 px-3 rounded-xl transition-all">
                <i class="fa-solid fa-users text-lg"></i>
                <span class="text-[10px] font-semibold mt-1">Plantilla</span>
            </button>
            <button onclick="app.switchTab('timeline')" id="nav-timeline" class="flex flex-col items-center text-slate-300 hover:text-white py-1 px-3 rounded-xl transition-all">
                <i class="fa-solid fa-timeline text-lg"></i>
                <span class="text-[10px] font-semibold mt-1">Cronología</span>
            </button>
            <button onclick="app.switchTab('stats')" id="nav-stats" class="flex flex-col items-center text-slate-300 hover:text-white py-1 px-3 rounded-xl transition-all">
                <i class="fa-solid fa-tv text-lg"></i>
                <span class="text-[10px] font-semibold mt-1">Acta / PDF</span>
            </button>
        </nav>


        <!-- Fixed Footer Signature -->
        <footer class="absolute bottom-0 left-0 right-0 bg-lasalle-navy border-t border-slate-800 py-1 text-center text-[10px] text-slate-400 font-bold z-50 tracking-wider">
            Generated by GpM1978
        </footer>


        <!-- Modals Container -->
        <div id="modal-container"></div>
    </div>


    <!-- Application Logic -->
    <script>
        class FutStatApp {
            constructor() {
                this.state = {
                    currentTab: 'setup',
                    selectedPlayerIds: new Set(),
                    audioAlerts: {
                        enabled: true,
                        intervalMinutes: 5,
                        customAlarms: []
                    },
                    match: {
                        isHome: true,
                        kitColor: 'Azul SD La Salle',
                        homeTeam: '',
                        awayTeam: '',
                        date: new Date().toISOString().split('T')[0],
                        matchday: '',
                        competition: 'Liga Cadete Regional',
                        stadium: 'Polideportivo La Salle',
                        halfDuration: 40,
                        status: 'setup',
                        currentHalf: 1,
                        timerSeconds: 0,
                        halftimeSeconds: 0,
                        timerRunning: false,
                        timerInterval: null,
                        halftimeInterval: null,
                        halftimeScore: { lasalle: 0, rival: 0 }
                    },
                    score: { lasalle: 0, rival: 0 },
                    windows: {
                        home: { used: 0, max: 3 },
                        away: { used: 0, max: 3 }
                    },
                    squad: [],
                    staff: [],
                    events: []
                };


                this.loadFromStorage();
                this.initApp();
            }


            initApp() {
                if (this.state.match.status !== 'setup') {
                    this.switchTab(this.state.match.status === 'finished' ? 'stats' : 'dashboard');
                    if (this.state.match.timerRunning) this.startTimerInterval();
                    if (this.state.match.status === 'halftime') this.startHalftimeInterval();
                } else {
                    this.switchTab('setup');
                }
            }


            saveToStorage() {
                try {
                    localStorage.setItem('salleapp360_v71126v8', JSON.stringify(this.state));
                } catch(e) { console.error(e); }
            }


            loadFromStorage() {
                const saved = localStorage.getItem('salleapp360_v71126v8');
                if (saved) {
                    try {
                        this.state = JSON.parse(saved);
                        if (!this.state.selectedPlayerIds) {
                            this.state.selectedPlayerIds = new Set();
                        } else {
                            this.state.selectedPlayerIds = new Set(Array.from(this.state.selectedPlayerIds));
                        }
                    } catch(e) { console.error(e); }
                } else {
                    this.state.selectedPlayerIds = new Set();
                    this.loadDefaultData();
                }
            }


            loadDefaultData() {
                const defaultNames = [
                    { name: 'Daniel Gándara Muñoz', pos: 'DEL', num: 9 },
                    { name: 'David Diéguez Peradejordi', pos: 'MED', num: 8 },
                    { name: 'Gabriel Morales Crespí', pos: 'DEF', num: 4 },
                    { name: 'Iván Carrasco Plamenov', pos: 'MED', num: 6 },
                    { name: 'Jaime Carbó Serra', pos: 'DEL', num: 11 },
                    { name: 'Joan Rubí Clar', pos: 'DEF', num: 3 },
                    { name: 'Jorge Ferreiro Castillo', pos: 'DEF', num: 5 },
                    { name: 'José Matheu Asensio (Pepo)', pos: 'DEL', num: 7 },
                    { name: 'Miquel Febrer Ventayol', pos: 'MED', num: 10 },
                    { name: 'Luis Morell Mir', pos: 'DEF', num: 2 },
                    { name: 'Luuk Krause', pos: 'MED', num: 14 },
                    { name: 'Marc Chanla La Hoz', pos: 'DEL', num: 15 },
                    { name: 'Marc Comas Martínez', pos: 'DEF', num: 12 },
                    { name: 'Miguel Bermúdez Rodríguez', pos: 'MED', num: 16 },
                    { name: 'Santiago Silva Giorgio', pos: 'DEL', num: 17 },
                    { name: 'Raúl Tejada Sabater', pos: 'DEF', num: 18 },
                    { name: 'Thiago Torres Gordenko', pos: 'MED', num: 19 },
                    { name: 'Gabriel Stevens Torres', pos: 'DEL', num: 20 },
                    { name: 'Alberto Torrens Matas', pos: 'POR', num: 1 },
                    { name: 'Muyz Olamide Usaman Salomon', pos: 'DEF', num: 21 },
                    { name: 'Álex Fuster Edwards', pos: 'MED', num: 22 },
                    { name: 'Yuhao Huang Xiang', pos: 'DEL', num: 23 }
                ];


                this.state.squad = defaultNames.map((p, i) => ({
                    id: 'p_' + i,
                    name: p.name,
                    number: p.num,
                    position: p.pos,
                    status: 'unconvoked',
                    inMinute: null,
                    outMinute: null,
                    goals: 0, 
                    goalMinutes: [], 
                    assists: 0, 
                    yellowCards: 0, 
                    redCard: false, 
                    captain: false
                }));
                this.state.match.homeTeam = 'SD La Salle Cadete A';
                this.state.match.awayTeam = 'Rival FC';
                this.state.match.matchday = '1';
                this.state.match.competition = 'Liga Cadete Regional';
            }


            speak(text) {
                if (!('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }


            checkAudioAlerts() {
                if (this.state.match.status === 'setup' || this.state.match.status === 'halftime') return;


                const currentSecs = this.state.match.timerSeconds;
                const currentMins = Math.floor(currentSecs / 60);


                if (this.state.audioAlerts.enabled && currentSecs > 0 && currentSecs % 60 === 0) {
                    const interval = parseInt(this.state.audioAlerts.intervalMinutes) || 5;
                    if (currentMins % interval === 0) {
                        this.speak(`Minuto ${currentMins}`);
                    }
                }


                if (this.state.audioAlerts.customAlarms && this.state.audioAlerts.customAlarms.length > 0) {
                    const matchIndex = this.state.audioAlerts.customAlarms.findIndex(alarmSec => alarmSec === currentSecs);
                    if (matchIndex !== -1) {
                        this.speak(`Atención. Alerta programada en el minuto ${currentMins}`);
                        this.state.audioAlerts.customAlarms.splice(matchIndex, 1);
                    }
                }
            }


            goHomeTab() {
                this.state.currentTab = 'setup';
                this.render();
            }


            resetCurrentValues() {
                if (!confirm('¿Estás seguro de resetear todos los valores actuales de configuración y partido?')) return;
                
                this.state.match.status = 'setup';
                this.state.match.timerSeconds = 0;
                this.state.match.halftimeSeconds = 0;
                this.state.match.timerRunning = false;
                if (this.state.match.timerInterval) clearInterval(this.state.match.timerInterval);
                if (this.state.match.halftimeInterval) clearInterval(this.state.match.halftimeInterval);
                
                this.state.score = { lasalle: 0, rival: 0 };
                this.state.windows = { home: { used: 0, max: 3 }, away: { used: 0, max: 3 } };
                this.state.events = [];
                this.state.audioAlerts.customAlarms = [];
                this.state.match.homeTeam = '';
                this.state.match.awayTeam = '';
                this.state.match.matchday = '';
                this.state.match.competition = '';
                this.state.selectedPlayerIds.clear();


                this.state.squad.forEach(p => {
                    p.goals = 0;
                    p.goalMinutes = [];
                    p.assists = 0;
                    p.yellowCards = 0;
                    p.redCard = false;
                    p.captain = false;
                    p.status = 'unconvoked';
                    p.inMinute = null;
                    p.outMinute = null;
                });


                this.switchTab('setup');
            }


            startNewMatch() {
                this.resetCurrentValues();
            }


            switchTab(tab) {
                this.state.currentTab = tab;
                this.render();
            }


            render() {
                const main = document.getElementById('main-content');
                const bottomNav = document.getElementById('bottom-nav');
                const subtitle = document.getElementById('header-match-subtitle');


                if (this.state.currentTab === 'setup') {
                    bottomNav.classList.add('hidden');
                    subtitle.textContent = 'Configuración y Convocatoria';
                    main.innerHTML = this.renderSetupScreen();
                } else {
                    bottomNav.classList.remove('hidden');
                    subtitle.textContent = `J${this.state.match.matchday}: ${this.state.match.homeTeam} vs ${this.state.match.awayTeam}`;
                    
                    ['dashboard', 'lineup', 'timeline', 'stats'].forEach(t => {
                        const el = document.getElementById(`nav-${t}`);
                        if (el) {
                            el.className = t === this.state.currentTab 
                                ? "flex flex-col items-center text-lasalle-yellow py-1 px-3 rounded-xl font-bold scale-105"
                                : "flex flex-col items-center text-slate-300 hover:text-white py-1 px-3 rounded-xl";
                        }
                    });


                    if (this.state.currentTab === 'dashboard') main.innerHTML = this.renderDashboardScreen();
                    else if (this.state.currentTab === 'lineup') main.innerHTML = this.renderLineupScreen();
                    else if (this.state.currentTab === 'timeline') main.innerHTML = this.renderTimelineScreen();
                    else if (this.state.currentTab === 'stats') main.innerHTML = this.renderStatsScreen();
                }
                this.saveToStorage();
            }


            renderSetupScreen() {
                const starters = this.state.squad.filter(p => p.status === 'starter');
                const subs = this.state.squad.filter(p => p.status === 'bench');
                const unconv = this.state.squad.filter(p => p.status === 'unconvoked');
                const isMatchActive = this.state.match.status !== 'setup' && this.state.match.status !== 'finished';
                const isFinished = this.state.match.status === 'finished';


                return `
                <div class="p-5 space-y-5 pb-12">
                    ${isMatchActive ? `
                        <div class="bg-emerald-600/20 border border-emerald-500/50 p-3 rounded-2xl flex items-center justify-between">
                            <span class="text-xs text-emerald-300 font-bold"><i class="fa-solid fa-play mr-1"></i> Partido en curso activo</span>
                            <button onclick="app.switchTab('dashboard')" class="bg-emerald-500 text-slate-950 font-black px-3 py-1.5 rounded-xl text-xs shadow">
                                Volver al Partido
                            </button>
                        </div>
                    ` : ''}


                    ${isFinished ? `
                        <div class="bg-amber-600/20 border border-amber-500/50 p-3 rounded-2xl flex items-center justify-between">
                            <span class="text-xs text-amber-300 font-bold"><i class="fa-solid fa-flag-checkered mr-1"></i> Partido finalizado guardado</span>
                            <button onclick="app.switchTab('stats')" class="bg-amber-500 text-slate-950 font-black px-3 py-1.5 rounded-xl text-xs shadow">
                                Ver Acta / Datos
                            </button>
                        </div>
                    ` : ''}


                    <div class="flex justify-between items-center bg-slate-900/80 border border-slate-800 p-3 rounded-2xl">
                        <span class="text-xs text-slate-300 font-bold"><i class="fa-solid fa-users text-lasalle-yellow mr-1"></i> Plantilla (${this.state.squad.length} jug.)</span>
                        <div class="flex gap-2">
                            <button onclick="app.openLargeSquadModal()" class="bg-lasalle-yellow hover:bg-lasalle-yellowhover text-lasalle-darkblue font-extrabold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1 shadow">
                                <i class="fa-solid fa-expand"></i> Gestión Plantilla
                            </button>
                            <button onclick="app.resetCurrentValues()" class="bg-rose-600/30 hover:bg-rose-600/50 text-rose-300 border border-rose-500/40 font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5">
                                <i class="fa-solid fa-trash-can"></i> Resetear
                            </button>
                        </div>
                    </div>


                    <a href="https://www.ffib.es" target="_blank" class="block bg-slate-900 hover:bg-slate-800 border border-lasalle-yellow/30 p-3.5 rounded-2xl text-center transition-all shadow">
                        <div class="text-xs font-black text-lasalle-yellow uppercase flex items-center justify-center gap-2">
                            <i class="fa-solid fa-book-open"></i> Consultar Normativa FFBI (Fútbol Base)
                        </div>
                        <span class="text-[10px] text-slate-400">Acceso directo a la web oficial de la federación</span>
                    </a>


                    <div class="bg-slate-900 border border-lasalle-yellow/30 rounded-2xl p-4 space-y-3">
                        <h2 class="text-xs font-black text-lasalle-yellow uppercase tracking-wider flex items-center gap-1.5">
                            <i class="fa-solid fa-volume-high"></i> Aviso Sonoro por Voz (Minutaje)
                        </h2>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[11px] text-slate-300 font-bold">Voz Activada</label>
                                <select id="audio-enabled" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-white" onchange="app.updateAudioSettings()">
                                    <option value="true" ${this.state.audioAlerts.enabled ? 'selected' : ''}>Sí</option>
                                    <option value="false" ${!this.state.audioAlerts.enabled ? 'selected' : ''}>No</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[11px] text-slate-300 font-bold">Frecuencia Aviso</label>
                                <select id="audio-interval" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-white" onchange="app.updateAudioSettings()">
                                    <option value="1" ${this.state.audioAlerts.intervalMinutes == 1 ? 'selected' : ''}>Cada 1 min</option>
                                    <option value="2" ${this.state.audioAlerts.intervalMinutes == 2 ? 'selected' : ''}>Cada 2 min</option>
                                    <option value="5" ${this.state.audioAlerts.intervalMinutes == 5 ? 'selected' : ''}>Cada 5 min</option>
                                    <option value="10" ${this.state.audioAlerts.intervalMinutes == 10 ? 'selected' : ''}>Cada 10 min</option>
                                </select>
                            </div>
                        </div>
                    </div>


                    <div class="bg-gradient-to-r from-lasalle-blue to-slate-900 border border-lasalle-yellow/40 rounded-2xl p-4 space-y-2 shadow-xl">
                        <h2 class="text-xs font-black text-lasalle-yellow uppercase tracking-wider flex items-center justify-between">
                            <span><i class="fa-solid fa-file-arrow-up mr-1"></i> Cargar Plantilla (Fichero o Foto)</span>
                        </h2>
                        <p class="text-[11px] text-slate-300 leading-relaxed">
                            <strong>Formato requerido para ficheros (.txt o .csv):</strong> Cada línea debe contener el dorsal seguido del nombre del jugador (Ej: <code class="text-lasalle-yellow bg-slate-950 px-1.5 py-0.5 rounded">9 Daniel Gándara</code> o <code class="text-lasalle-yellow bg-slate-950 px-1.5 py-0.5 rounded">11, Jaime Carbó</code>). También puedes subir una foto del acta/plantilla para lectura automática OCR.
                        </p>
                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <label class="bg-lasalle-yellow hover:bg-lasalle-yellowhover text-lasalle-darkblue font-extrabold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 cursor-pointer shadow-md">
                                <i class="fa-solid fa-upload"></i> Subir Fichero / Foto
                                <input type="file" accept="image/*,.txt,.csv" class="hidden" onchange="app.handleFileOCR(event)">
                            </label>
                            <button onclick="app.openPlayerModal()" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 border border-slate-700">
                                <i class="fa-solid fa-plus text-lasalle-yellow"></i> + Jugador
                            </button>
                        </div>
                        <div id="ocr-loading" class="hidden text-center text-xs text-lasalle-yellow mt-2 font-bold animate-pulse">
                            <i class="fa-solid fa-spinner fa-spin mr-1"></i> Leyendo datos...
                        </div>
                    </div>


                    <div class="bg-lasalle-blue/40 border border-lasalle-yellow/30 rounded-2xl p-4 space-y-3">
                        <h2 class="text-xs font-black text-lasalle-yellow uppercase tracking-wider">Datos del Partido</h2>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" onclick="app.setMatchCondition(true)" class="py-2 rounded-xl font-bold text-xs border ${this.state.match.isHome ? 'bg-lasalle-yellow text-lasalle-darkblue border-lasalle-yellow' : 'bg-slate-900 text-slate-300 border-slate-700'}">LOCAL (La Salle)</button>
                            <button type="button" onclick="app.setMatchCondition(false)" class="py-2 rounded-xl font-bold text-xs border ${!this.state.match.isHome ? 'bg-lasalle-yellow text-lasalle-darkblue border-lasalle-yellow' : 'bg-slate-900 text-slate-300 border-slate-700'}">VISITANTE (La Salle)</button>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[11px] text-slate-300 font-bold">Equipo Local</label>
                                <input type="text" id="set-home" value="${this.state.match.homeTeam}" placeholder="Ej: SD La Salle" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-white" oninput="app.updateMatchMeta()">
                            </div>
                            <div>
                                <label class="text-[11px] text-slate-300 font-bold">Equipo Visitante</label>
                                <input type="text" id="set-away" value="${this.state.match.awayTeam}" placeholder="Ej: CD Rival" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-white" oninput="app.updateMatchMeta()">
                            </div>
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-300 font-bold">Liga / Competición</label>
                            <input type="text" id="set-competition" value="${this.state.match.competition}" placeholder="Ej: Liga Cadete Regional" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-white mt-1" oninput="app.updateMatchMeta()">
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="text-[11px] text-slate-300 font-bold">Jornada</label>
                                <input type="text" id="set-matchday" value="${this.state.match.matchday}" placeholder="Ej: 1" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-white" oninput="app.updateMatchMeta()">
                            </div>
                            <div>
                                <label class="text-[11px] text-slate-300 font-bold">Fecha</label>
                                <input type="date" id="set-date" value="${this.state.match.date}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-white" onchange="app.updateMatchMeta()">
                            </div>
                            <div>
                                <label class="text-[11px] text-slate-300 font-bold">Duración (min)</label>
                                <input type="number" id="set-duration" value="${this.state.match.halfDuration}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-white">
                            </div>
                        </div>
                    </div>


                    <div class="bg-lasalle-blue/40 border border-lasalle-yellow/30 rounded-2xl p-4 space-y-3">
                        <h3 class="text-xs font-black text-lasalle-yellow uppercase">Alineación, Convocatoria y Capitán</h3>


                        <div>
                            <div class="text-xs font-bold text-emerald-400 mb-1">Titulares (${starters.length}/11) - Selecciona Capitán (C)</div>
                            <div class="space-y-1 max-h-40 overflow-y-auto">
                                ${starters.map(p => `
                                    <div class="flex items-center justify-between bg-slate-950 px-2.5 py-1.5 rounded-xl text-xs">
                                        <span class="font-bold text-lasalle-yellow w-7">#${p.number}</span>
                                        <span class="flex-1 text-slate-200 truncate font-semibold">${p.name}</span>
                                        <div class="flex items-center gap-1.5">
                                            <button onclick="app.toggleCaptain('${p.id}')" class="px-2 py-0.5 rounded text-[10px] font-bold ${p.captain ? 'bg-lasalle-yellow text-lasalle-darkblue' : 'bg-slate-800 text-slate-400'}">${p.captain ? 'Capitán (C)' : 'Hacer (C)'}</button>
                                            <button onclick="app.editPlayerModal('${p.id}')" class="px-1.5 py-0.5 bg-slate-800 text-lasalle-yellow rounded text-[10px]"><i class="fa-solid fa-pen"></i></button>
                                            <button onclick="app.changePlayerStatus('${p.id}', 'bench')" class="px-1.5 py-0.5 bg-slate-800 text-slate-300 rounded text-[10px]">Banq</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>


                        <div>
                            <div class="text-xs font-bold text-lasalle-yellow mb-1">Banquillo (${subs.length})</div>
                            <div class="space-y-1 max-h-28 overflow-y-auto">
                                ${subs.map(p => `
                                    <div class="flex items-center justify-between bg-slate-950 px-2.5 py-1.5 rounded-xl text-xs">
                                        <span class="font-bold text-lasalle-yellow w-7">#${p.number}</span>
                                        <span class="flex-1 text-slate-200 truncate font-semibold">${p.name}</span>
                                        <div class="flex gap-1">
                                            <button onclick="app.editPlayerModal('${p.id}')" class="px-1.5 py-0.5 bg-slate-800 text-lasalle-yellow rounded text-[10px]"><i class="fa-solid fa-pen"></i></button>
                                            <button onclick="app.changePlayerStatus('${p.id}', 'starter')" class="px-1.5 py-0.5 bg-emerald-600/40 text-emerald-300 rounded text-[10px]">Titular</button>
                                            <button onclick="app.changePlayerStatus('${p.id}', 'unconvoked')" class="px-1.5 py-0.5 bg-slate-800 text-rose-400 rounded text-[10px]">Fuera</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>


                        <div>
                            <div class="text-xs font-bold text-rose-400 mb-1">Desconvocados (${unconv.length})</div>
                            <div class="space-y-1 max-h-24 overflow-y-auto">
                                ${unconv.map(p => `
                                    <div class="flex items-center justify-between bg-slate-950/60 px-2.5 py-1 rounded-xl text-xs opacity-75">
                                        <span class="font-bold text-slate-400 w-7">#${p.number}</span>
                                        <span class="flex-1 text-slate-300 truncate">${p.name}</span>
                                        <div class="flex gap-1">
                                            <button onclick="app.editPlayerModal('${p.id}')" class="px-1.5 py-0.5 bg-slate-800 text-lasalle-yellow rounded text-[10px]"><i class="fa-solid fa-pen"></i></button>
                                            <button onclick="app.changePlayerStatus('${p.id}', 'bench')" class="px-1.5 py-0.5 bg-slate-800 text-lasalle-yellow rounded text-[10px]">Convocar</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>


                    <button onclick="app.startMatch()" class="w-full bg-lasalle-yellow hover:bg-lasalle-yellowhover text-lasalle-darkblue font-black py-4 rounded-2xl shadow-xl text-sm uppercase tracking-wider">
                        <i class="fa-solid fa-play mr-2"></i> INICIAR PARTIDO
                    </button>
                </div>
                `;
            }


            renderDashboardScreen() {
                const starters = this.state.squad.filter(p => p.status === 'starter');
                const isHalftime = this.state.match.status === 'halftime';


                const leftTeamName = this.state.match.homeTeam;
                const leftScore = this.state.match.isHome ? this.state.score.lasalle : this.state.score.rival;
                
                const rightTeamName = this.state.match.awayTeam;
                const rightScore = this.state.match.isHome ? this.state.score.rival : this.state.score.lasalle;


                return `
                <div class="p-4 space-y-4 pb-12">
                    <div class="bg-gradient-to-br from-lasalle-blue via-lasalle-darkblue to-slate-950 border-2 border-lasalle-yellow/40 rounded-3xl p-4 shadow-2xl relative">
                        <div class="flex justify-between items-center mb-2">
                            <span class="px-3 py-0.5 rounded-full bg-lasalle-yellow text-lasalle-darkblue text-[10px] font-black uppercase">
                                JOR ${this.state.match.matchday} • ${this.state.match.currentHalf === 1 ? '1ª PARTE' : (isHalftime ? 'DESCANSO' : '2ª PARTE')}
                            </span>
                            <div class="flex items-center gap-2 bg-slate-950/90 px-3 py-1 rounded-xl border border-slate-800">
                                <span class="w-2.5 h-2.5 rounded-full ${this.state.match.timerRunning ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}"></span>
                                <span class="font-mono font-black text-sm tracking-widest text-white">${this.formatTime(this.state.match.timerSeconds)}</span>
                            </div>
                        </div>


                        <div class="grid grid-cols-7 items-center text-center my-2">
                            <div class="col-span-3">
                                <div class="text-xs font-bold text-slate-300 truncate">${leftTeamName}</div>
                                <div class="text-4xl font-black text-lasalle-yellow mt-1">${leftScore}</div>
                            </div>
                            <div class="col-span-1 text-slate-500 font-black text-base">VS</div>
                            <div class="col-span-3">
                                <div class="text-xs font-bold text-slate-300 truncate">${rightTeamName}</div>
                                <div class="text-4xl font-black text-white mt-1">${rightScore}</div>
                            </div>
                        </div>


                        ${isHalftime ? `
                            <div class="mt-3 p-3 bg-amber-500/20 border border-amber-500/40 rounded-2xl text-center space-y-2">
                                <div class="text-xs font-bold text-amber-300 uppercase">Descanso en Curso</div>
                                <div class="text-2xl font-mono font-black text-amber-400">${this.formatTime(this.state.match.halftimeSeconds)}</div>
                                <button onclick="app.startSecondHalf()" class="w-full bg-emerald-500 text-slate-950 font-black py-2.5 rounded-xl text-xs shadow-lg">
                                    <i class="fa-solid fa-play mr-1"></i> INICIAR 2ª PARTE (MIN ${this.state.match.halfDuration}')
                                </button>
                            </div>
                        ` : `
                            <div class="flex items-center gap-2 mt-3 pt-3 border-t border-slate-800">
                                <button onclick="app.toggleTimer()" class="flex-1 bg-slate-800 text-white py-2 rounded-xl text-xs font-bold">
                                    <i class="fa-solid ${this.state.match.timerRunning ? 'fa-pause text-amber-400' : 'fa-play text-emerald-400'}"></i>
                                    ${this.state.match.timerRunning ? 'Pausar' : 'Reanudar'}
                                </button>
                                ${this.state.match.currentHalf === 1 ? `
                                    <button onclick="app.goToHalftime()" class="flex-1 bg-amber-500/20 text-amber-300 border border-amber-500/40 py-2 rounded-xl text-xs font-bold">
                                        <i class="fa-solid fa-mug-hot mr-1"></i> Ir al Descanso
                                    </button>
                                ` : `
                                    <button onclick="app.finishMatch()" class="flex-1 bg-rose-600/30 text-rose-300 border border-rose-500/40 py-2 rounded-xl text-xs font-bold">
                                        <i class="fa-solid fa-flag-checkered mr-1"></i> Finalizar
                                    </button>
                                `}
                            </div>
                        `}
                    </div>


                    <div class="flex justify-between items-center bg-slate-900 border border-slate-800 p-3 rounded-2xl">
                        <div class="text-xs font-bold text-slate-300">
                            <i class="fa-solid fa-bell text-lasalle-yellow mr-1"></i> Alarma de Voz Puntual
                        </div>
                        <button onclick="app.openCustomAlarmModal()" class="bg-lasalle-yellow hover:bg-lasalle-yellowhover text-lasalle-darkblue font-extrabold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1 shadow">
                            <i class="fa-solid fa-clock"></i> Fijar Alarma
                        </button>
                    </div>


                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-lasalle-blue/40 border border-slate-800 p-3 rounded-2xl flex items-center justify-between">
                            <div>
                                <div class="text-[10px] uppercase font-bold text-slate-400">Ventanas La Salle</div>
                                <div class="text-lg font-black text-lasalle-yellow">${this.state.windows.home.used} / 3 usadas</div>
                            </div>
                            <i class="fa-solid fa-right-left text-lasalle-yellow text-sm"></i>
                        </div>
                        <div class="bg-lasalle-blue/40 border border-slate-800 p-3 rounded-2xl flex items-center justify-between">
                            <div>
                                <div class="text-[10px] uppercase font-bold text-slate-400">Ventanas Rival (${this.state.match.awayTeam})</div>
                                <div class="text-lg font-black text-rose-400">${this.state.windows.away.used} / 3 usadas</div>
                            </div>
                            <i class="fa-solid fa-right-left text-rose-400 text-sm"></i>
                        </div>
                    </div>


                    <div>
                        <h4 class="text-xs font-extrabold text-lasalle-yellow uppercase tracking-wider mb-2">Acciones SD La Salle</h4>
                        <div class="grid grid-cols-4 gap-2">
                            <button onclick="app.openModal('goal_home')" class="bg-emerald-600 text-white p-3 rounded-2xl flex flex-col items-center justify-center font-black text-[10px]">
                                <i class="fa-solid fa-futbol text-lg mb-1"></i> Gol La Salle
                            </button>
                            <button onclick="app.openModal('sub_home')" class="bg-teal-600 text-white p-3 rounded-2xl flex flex-col items-center justify-center font-black text-[10px]">
                                <i class="fa-solid fa-right-left text-lg mb-1"></i> Cambio
                            </button>
                            <button onclick="app.openModal('card_home')" class="bg-amber-500 text-slate-950 p-3 rounded-2xl flex flex-col items-center justify-center font-black text-[10px]">
                                <i class="fa-solid fa-square text-lg mb-1"></i> Tarjeta
                            </button>
                            <button onclick="app.openModal('note')" class="bg-slate-800 text-white p-3 rounded-2xl flex flex-col items-center justify-center font-black text-[10px]">
                                <i class="fa-solid fa-pen text-lg mb-1"></i> Nota
                            </button>
                        </div>


                        <h4 class="text-xs font-extrabold text-rose-400 uppercase tracking-wider mt-3 mb-2">Acciones del Rival (${this.state.match.awayTeam})</h4>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="app.openModal('goal_away')" class="bg-rose-900/60 border border-rose-700/50 text-rose-100 p-2 rounded-xl font-bold text-xs">
                                <i class="fa-solid fa-futbol text-rose-400"></i> Gol Rival
                            </button>
                            <button onclick="app.openModal('card_away')" class="bg-amber-900/40 border border-amber-600/50 text-amber-200 p-2 rounded-xl font-bold text-xs">
                                <i class="fa-solid fa-square text-amber-400"></i> Tarjeta Rival
                            </button>
                            <button onclick="app.openModal('sub_away')" class="bg-slate-800 border border-slate-700 text-slate-200 p-2 rounded-xl font-bold text-xs">
                                <i class="fa-solid fa-right-left text-slate-400"></i> Cambio Rival
                            </button>
                        </div>
                    </div>


                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3">
                        <h4 class="text-xs font-bold text-lasalle-yellow uppercase mb-2">En Juego (${starters.length})</h4>
                        <div class="grid grid-cols-2 gap-1.5">
                            ${starters.map(p => `
                                <div class="bg-slate-950 px-2 py-1 rounded-lg text-xs border border-slate-800 flex justify-between">
                                    <span class="font-bold text-lasalle-yellow">#${p.number} ${p.name} ${p.captain ? '(C)' : ''}</span>
                                    <span class="text-[10px] text-slate-400">${p.position}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>


                    <div class="flex gap-2">
                        <button onclick="app.finishMatch()" class="flex-1 bg-rose-600 text-white font-black py-3 rounded-2xl text-xs uppercase tracking-wider">
                            <i class="fa-solid fa-flag-checkered mr-1"></i> Finalizar y Guardar
                        </button>
                        <button onclick="app.startNewMatch()" class="bg-slate-800 hover:bg-slate-700 text-lasalle-yellow border border-lasalle-yellow/40 font-bold px-4 py-3 rounded-2xl text-xs uppercase tracking-wider">
                            <i class="fa-solid fa-rotate-right"></i> Nuevo Partido
                        </button>
                    </div>
                </div>
                `;
            }


            renderLineupScreen() {
                const starters = this.state.squad.filter(p => p.status === 'starter');
                const subs = this.state.squad.filter(p => p.status === 'bench');
                const outPlayers = this.state.squad.filter(p => p.status === 'substituted' || p.status === 'out');
                const isMatchStarted = this.state.match.status !== 'setup';


                return `
                <div class="p-4 space-y-4 pb-12">
                    <div class="flex justify-between items-center">
                        <h2 class="text-base font-extrabold text-lasalle-yellow">Plantilla, Goles y Minutos</h2>
                        ${!isMatchStarted ? `<button onclick="app.openLargeSquadModal()" class="bg-lasalle-yellow text-lasalle-darkblue px-2.5 py-1 rounded-lg text-xs font-black">Gestionar Plantilla</button>` : '<span class="text-[10px] text-amber-400 font-bold">Plantilla bloqueada en partido</span>'}
                    </div>


                    <!-- Titulares -->
                    <div class="space-y-2">
                        <h3 class="text-xs font-bold text-emerald-400 uppercase">Titulares (${starters.length})</h3>
                        ${starters.map(p => `
                            <div class="bg-slate-900 p-2.5 rounded-xl flex justify-between text-xs items-center">
                                <div class="flex items-center gap-2 flex-1 truncate">
                                    <span class="font-bold text-lasalle-yellow w-6">#${p.number}</span>
                                    <span class="font-bold text-white truncate">${p.name} ${p.captain ? '<span class="text-lasalle-yellow font-bold">(C)</span>' : ''}</span>
                                </div>
                                <div class="flex items-center gap-1.5 flex-wrap justify-end">
                                    ${p.goals > 0 ? `<span class="px-1.5 py-0.5 bg-emerald-500 text-slate-950 font-bold rounded text-[10px]" title="Goles: ${p.goals}"><i class="fa-solid fa-futbol"></i> ${p.goals} (${p.goalMinutes.join(', ')}')</span>` : ''}
                                    ${p.assists > 0 ? `<span class="px-1.5 py-0.5 bg-teal-500 text-slate-950 font-bold rounded text-[10px]" title="Asistencias: ${p.assists}"><i class="fa-solid fa-shoe-prints"></i> ${p.assists}</span>` : ''}
                                    
                                    ${p.yellowCards === 1 ? '<span class="px-1.5 py-0.5 bg-amber-400 text-slate-950 font-bold rounded text-[10px]" title="Tarjeta Amarilla">🟨</span>' : ''}
                                    ${p.yellowCards >= 2 ? '<span class="px-1.5 py-0.5 bg-amber-600 text-white font-bold rounded text-[10px]" title="Doble Amarilla">🟨🟨</span>' : ''}
                                    ${p.redCard ? '<span class="px-1.5 py-0.5 bg-rose-600 text-white font-bold rounded text-[10px]" title="Roja">🟥</span>' : ''}
                                    ${p.inMinute !== null && p.inMinute > 0 ? `<span class="text-[10px] text-teal-300 font-semibold" title="Entró en min ${p.inMinute}"><i class="fa-solid fa-arrow-right-to-bracket"></i> ${p.inMinute}'</span>` : ''}


                                    ${!isMatchStarted ? `<button onclick="app.toggleCaptain('${p.id}')" class="px-2 py-0.5 bg-slate-800 text-lasalle-yellow rounded text-[10px]">${p.captain ? 'Quitar (C)' : 'Hacer (C)'}</button>` : ''}
                                    ${!isMatchStarted ? `<button onclick="app.editPlayerModal('${p.id}')" class="text-slate-400"><i class="fa-solid fa-pen"></i></button>` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>


                    <!-- Banquillo -->
                    <div class="space-y-2">
                        <h3 class="text-xs font-bold text-lasalle-yellow uppercase">Banquillo (${subs.length})</h3>
                        ${subs.map(p => `
                            <div class="bg-slate-900 p-2.5 rounded-xl flex justify-between text-xs items-center">
                                <div class="flex items-center gap-2 flex-1 truncate">
                                    <span class="font-bold text-lasalle-yellow w-6">#${p.number}</span>
                                    <span class="font-bold text-slate-300 truncate">${p.name}</span>
                                </div>
                                <div class="flex items-center gap-1.5">
                                    ${p.goals > 0 ? `<span class="px-1.5 py-0.5 bg-emerald-500 text-slate-950 font-bold rounded text-[10px]" title="Goles: ${p.goals}"><i class="fa-solid fa-futbol"></i> ${p.goals} (${p.goalMinutes.join(', ')}')</span>` : ''}
                                    ${p.assists > 0 ? `<span class="px-1.5 py-0.5 bg-teal-500 text-slate-950 font-bold rounded text-[10px]" title="Asistencias: ${p.assists}"><i class="fa-solid fa-shoe-prints"></i> ${p.assists}</span>` : ''}
                                    ${p.yellowCards > 0 ? `<span class="px-1.5 py-0.5 bg-amber-400 text-slate-950 font-bold rounded text-[10px]">🟨</span>` : ''}
                                    ${p.redCard ? `<span class="px-1.5 py-0.5 bg-rose-600 text-white font-bold rounded text-[10px]">🟥</span>` : ''}
                                    ${!isMatchStarted ? `<button onclick="app.editPlayerModal('${p.id}')" class="text-slate-400"><i class="fa-solid fa-pen"></i></button>` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>


                    <!-- Sustituidos / Fuera -->
                    <div class="space-y-2">
                        <h3 class="text-xs font-bold text-rose-400 uppercase">Sustituidos / Fuera / Expulsados</h3>
                        ${outPlayers.map(p => `
                            <div class="bg-slate-950 p-2.5 rounded-xl flex justify-between text-xs opacity-75 items-center">
                                <div class="flex items-center gap-2 flex-1 truncate">
                                    <span class="font-bold text-slate-500 w-6">#${p.number}</span>
                                    <span class="line-through text-slate-400 truncate">${p.name}</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    ${p.goals > 0 ? `<span class="px-1.5 py-0.5 bg-emerald-500 text-slate-950 font-bold rounded text-[10px]" title="Goles: ${p.goals}"><i class="fa-solid fa-futbol"></i> ${p.goals} (${p.goalMinutes.join(', ')}')</span>` : ''}
                                    ${p.assists > 0 ? `<span class="px-1.5 py-0.5 bg-teal-500 text-slate-950 font-bold rounded text-[10px]" title="Asistencias: ${p.assists}"><i class="fa-solid fa-shoe-prints"></i> ${p.assists}</span>` : ''}
                                    ${p.outMinute !== null ? `<span class="text-[10px] text-rose-400 font-bold bg-rose-950 px-2 py-0.5 rounded-lg"><i class="fa-solid fa-arrow-right-from-bracket"></i> Salió min ${p.outMinute}'</span>` : ''}
                                    ${p.redCard ? '<span class="px-1.5 py-0.5 bg-rose-600 text-white font-bold rounded text-[10px]">🟥 Expulsado</span>' : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                `;
            }


            renderTimelineScreen() {
                const sortedEvents = [...this.state.events].sort((a, b) => a.minute - b.minute);


                return `
                <div class="p-4 space-y-4 pb-12">
                    <h2 class="text-base font-extrabold text-lasalle-yellow">Cronología del Partido</h2>
                    <div class="space-y-2">
                        ${sortedEvents.length === 0 ? '<div class="text-center py-10 text-slate-500 text-xs">Sin acontecimientos registrados.</div>' : ''}
                        ${sortedEvents.map(ev => `
                            <div class="bg-slate-900 p-3 rounded-xl flex items-center justify-between text-xs border border-slate-800">
                                <div>
                                    <div class="font-bold text-white"><span class="text-lasalle-yellow font-mono mr-1.5">[Min ${ev.minute}']</span> ${ev.title}</div>
                                    <div class="text-[11px] text-slate-400">${ev.detail}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                `;
            }


            renderStatsScreen() {
                const activePlayers = this.state.squad.filter(p => p.status !== 'unconvoked');


                return `
                <div class="p-4 space-y-4 bg-slate-950 pb-12">
                    <h2 class="text-base font-extrabold text-lasalle-yellow flex items-center justify-between">
                        <span><i class="fa-solid fa-file-pdf mr-1"></i> Acta Oficial SD La Salle</span>
                        ${this.state.match.status === 'finished' ? `<button onclick="app.switchTab('setup')" class="bg-slate-800 text-lasalle-yellow px-2.5 py-1 rounded-lg text-xs font-bold border border-lasalle-yellow/30"><i class="fa-solid fa-arrow-left"></i> Configuración / Nuevo</button>` : ''}
                    </h2>


                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-2">
                        <div class="text-xs font-bold text-lasalle-yellow">RESUMEN DEL ENCUENTRO (${this.state.match.competition || 'Competición'})</div>
                        <div class="text-sm font-bold text-white">${this.state.match.homeTeam} ${this.state.score.lasalle} - ${this.state.score.rival} ${this.state.match.awayTeam}</div>
                        <div class="text-xs text-slate-400">Jornada: ${this.state.match.matchday} | Fecha: ${this.state.match.date}</div>
                    </div>


                    <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl space-y-3">
                        <h3 class="text-xs font-bold text-lasalle-yellow uppercase">Estadísticas Detalladas de la Plantilla</h3>
                        <div class="space-y-2 max-h-60 overflow-y-auto">
                            ${activePlayers.map(p => {
                                const mins = this.calculatePlayerMinutes(p);
                                const entryInfo = p.inMinute !== null ? `Entró: ${p.inMinute}'` : 'Titular';
                                const exitInfo = p.outMinute !== null ? ` | Salió: ${p.outMinute}'` : '';
                                const historySub = `${entryInfo}${exitInfo}`;


                                return `
                                    <div class="bg-slate-950 p-2.5 rounded-xl text-xs space-y-1 border border-slate-800/60">
                                        <div class="flex justify-between font-bold text-white">
                                            <span>#${p.number} ${p.name} ${p.captain ? '<span class="text-lasalle-yellow">(C)</span>' : ''}</span>
                                            <span class="text-lasalle-yellow">${mins}' jugados</span>
                                        </div>
                                        <div class="flex flex-wrap gap-2 text-[10px] text-slate-300">
                                            <span><i class="fa-solid fa-futbol text-emerald-400"></i> Goles: ${p.goals} ${p.goalMinutes.length ? '('+p.goalMinutes.join(', ')+'\')' : ''}</span>
                                            <span><i class="fa-solid fa-shoe-prints text-teal-400"></i> Asist: ${p.assists}</span>
                                            <span><i class="fa-solid fa-square text-amber-400"></i> Amarillas: ${p.yellowCards}</span>
                                            <span><i class="fa-solid fa-square text-rose-500"></i> Rojas: ${p.redCard ? '1' : '0'}</span>
                                        </div>
                                        <div class="text-[10px] text-slate-400 italic">
                                            <i class="fa-solid fa-right-left"></i> Cambios: ${historySub}
                                        </div>
                                    </div>
                                `;

            updateAudioSettings() {
                const enabledEl = document.getElementById('audio-enabled');
                const intervalEl = document.getElementById('audio-interval');

                if (intervalEl) this.state.audioAlerts.intervalMinutes = parseInt(intervalEl.value);
                this.saveToStorage();
            }


            updateMatchMeta() {
                const homeInput = document.getElementById('set-home');
                const awayInput = document.getElementById('set-away');
                const compInput = document.getElementById('set-competition');
                const matchdayInput = document.getElementById('set-matchday');
                const dateInput = document.getElementById('set-date');
                if (homeInput) this.state.match.homeTeam = homeInput.value;
                if (awayInput) this.state.match.awayTeam = awayInput.value;
                if (compInput) this.state.match.competition = compInput.value;
                if (matchdayInput) this.state.match.matchday = matchdayInput.value;
                if (dateInput) this.state.match.date = dateInput.value;
                this.saveToStorage();
            }


            setMatchCondition(isHome) {
                this.state.match.isHome = isHome;
                if (isHome) {
                    this.state.match.homeTeam = 'SD La Salle Cadete A';
                    this.state.match.awayTeam = this.state.match.awayTeam !== 'SD La Salle Cadete A' ? this.state.match.awayTeam : 'Rival FC';
                } else {
                    this.state.match.homeTeam = this.state.match.homeTeam !== 'SD La Salle Cadete A' ? this.state.match.homeTeam : 'Rival FC';
                    this.state.match.awayTeam = 'SD La Salle Cadete A';
                }
                this.render();
            }


            startMatch() {
                const startersCount = this.state.squad.filter(p => p.status === 'starter').length;
                if (startersCount !== 11) {
                    if (!confirm(`Atención: Hay ${startersCount} jugadores titulares seleccionados en lugar de 11. ¿Deseas iniciar el partido de todas formas?`)) {
                        return;
                    }
                }


                const h = document.getElementById('set-home').value;
                const a = document.getElementById('set-away').value;
                const comp = document.getElementById('set-competition').value;
                const matchday = document.getElementById('set-matchday').value;
                const date = document.getElementById('set-date').value;
                const duration = parseInt(document.getElementById('set-duration').value) || 40;


                this.state.match.homeTeam = h || 'SD La Salle Cadete A';
                this.state.match.awayTeam = a || 'Rival FC';
                this.state.match.competition = comp || 'Liga Cadete Regional';
                this.state.match.matchday = matchday || '1';
                this.state.match.date = date;
                this.state.match.halfDuration = duration;
                this.state.match.status = 'first_half';
                this.state.match.currentHalf = 1;
                this.state.match.timerSeconds = 0;
                this.state.match.timerRunning = true;


                this.startTimerInterval();
                this.switchTab('dashboard');
            }


            startTimerInterval() {
                if (this.state.match.timerInterval) clearInterval(this.state.match.timerInterval);
                this.state.match.timerInterval = setInterval(() => {
                    if (this.state.match.timerRunning && this.state.match.status !== 'finished' && this.state.match.status !== 'halftime') {
                        this.state.match.timerSeconds++;
                        const timerEl = document.querySelector('.font-mono');
                        if (timerEl) timerEl.textContent = this.formatTime(this.state.match.timerSeconds);
                        this.checkAudioAlerts();
                    }
                }, 1000);
            }


            goToHalftime() {
                if (confirm('¿Detener 1ª parte e iniciar el descanso?')) {
                    this.state.match.status = 'halftime';
                    this.state.match.timerRunning = false;
                    clearInterval(this.state.match.timerInterval);
                    this.state.match.halftimeSeconds = 0;
                    this.startHalftimeInterval();
                    this.render();
                }
            }


            startHalftimeInterval() {
                if (this.state.match.halftimeInterval) clearInterval(this.state.match.halftimeInterval);
                this.state.match.halftimeInterval = setInterval(() => {
                    if (this.state.match.status === 'halftime') {
                        this.state.match.halftimeSeconds++;
                        const halftimeEl = document.querySelector('.text-2xl.font-mono');
                        if (halftimeEl) halftimeEl.textContent = this.formatTime(this.state.match.halftimeSeconds);
                    }
                }, 1000);
            }


            startSecondHalf() {
                if (confirm('¿Iniciar la 2ª Parte?')) {
                    clearInterval(this.state.match.halftimeInterval);
                    this.state.match.status = 'second_half';
                    this.state.match.currentHalf = 2;
                    this.state.match.timerSeconds = this.state.match.halfDuration * 60;
                    this.state.match.timerRunning = true;
                    this.startTimerInterval();
                    this.render();
                }
            }


            toggleTimer() {
                this.state.match.timerRunning = !this.state.match.timerRunning;
                this.render();
            }


            finishMatch() {
                if (confirm('¿Finalizar el encuentro definitivamente?')) {
                    this.state.match.status = 'finished';
                    this.state.match.timerRunning = false;
                    clearInterval(this.state.match.timerInterval);
                    clearInterval(this.state.match.halftimeInterval);
                    this.switchTab('stats');
                }
            }


            openCustomAlarmModal() {
                const currentMin = Math.floor(this.state.match.timerSeconds / 60);
                const container = document.getElementById('modal-container');
                container.innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl relative">
                            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            <h3 class="font-bold text-base text-white mb-2 flex items-center gap-1.5"><i class="fa-solid fa-bell text-lasalle-yellow"></i> Alarma de Voz en Partido</h3>
                            <p class="text-xs text-slate-400 mb-3">La aplicación avisará mediante voz al alcanzar el minuto especificado.</p>
                            <div class="space-y-3">
                                <div>
                                    <label class="text-xs text-slate-400">Avisar en el Minuto Exacto</label>
                                    <input type="number" id="alarm-target-min" value="${currentMin + 5}" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                                </div>
                                <button onclick="app.submitCustomAlarm()" class="w-full bg-lasalle-yellow text-lasalle-darkblue font-black py-3 rounded-xl text-sm uppercase">Programar Alarma</button>
                            </div>
                        </div>
                    </div>
                `;
            }


            submitCustomAlarm() {
                const min = parseInt(document.getElementById('alarm-target-min').value);
                if (isNaN(min) || min < 0) {
                    alert('Minuto no válido');
                    return;
                }
                const secTarget = min * 60;
                if (!this.state.audioAlerts.customAlarms) this.state.audioAlerts.customAlarms = [];
                this.state.audioAlerts.customAlarms.push(secTarget);
                alert(`Alarma de voz fijada para el minuto ${min}.`);
                this.closeModal();
            }


            handleFileOCR(event) {
                const file = event.target.files[0];
                if (!file) return;


                const loadingEl = document.getElementById('ocr-loading');
                if (loadingEl) loadingEl.classList.remove('hidden');


                if (file.type.includes('image')) {
                    Tesseract.recognize(file, 'spa').then(({ data: { text } }) => {
                        if (loadingEl) loadingEl.classList.add('hidden');
                        this.parseOCRTextToSquad(text);
                    }).catch(() => {
                        if (loadingEl) loadingEl.classList.add('hidden');
                        alert('Error al procesar la imagen.');
                    });
                } else {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        if (loadingEl) loadingEl.classList.add('hidden');
                        this.parseOCRTextToSquad(e.target.result);
                    };
                    reader.readAsText(file);
                }
            }


            parseOCRTextToSquad(text) {
                const lines = text.split('\n');
                let count = 0;
                lines.forEach(line => {
                    const match = line.match(/^(\d{1,2})\s*[\.\-]?\s*(.+)/);
                    if (match) {
                        const num = parseInt(match[1]);
                        const name = match[2].trim();
                        if (name.length > 2 && !isNaN(num)) {
                            const exists = this.state.squad.find(p => p.number === num);
                            if (!exists) {
                                this.state.squad.push({
                                    id: 'p_' + Date.now() + '_' + num,
                                    name: name, number: num, position: num === 1 ? 'POR' : 'MED',
                                    status: 'unconvoked',
                                    inMinute: null, outMinute: null, goals: 0, goalMinutes: [], assists: 0, yellowCards: 0, redCard: false, captain: false
                                });
                                count++;
                            }
                        }
                    }
                });
                alert(`¡Plantilla actualizada! Se han incorporado ${count} jugadores.`);
                this.render();
            }
