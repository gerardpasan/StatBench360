                            <button onclick="app.openModal('note')" class="bg-slate-800 text-white p-3 rounded-2xl flex flex-col items-center justify-center font-black text-[10px]">
                                <i class="fa-solid fa-pen text-lg mb-1"></i> Nota
                            </button>
                        </div>

                        <h4 class="text-xs font-extrabold text-rose-400 uppercase tracking-wider mt-3 mb-2">Acciones del Rival</h4>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="app.openModal('goal_away')" class="bg-rose-900/60 border border-rose-700/50 text-rose-100 p-2 rounded-xl font-bold text-xs">
                                <i class="fa-solid fa-futbol text-rose-400"></i> Gol Rival
                            </button>
                            <button onclick="app.openModal('card_away')" class="bg-amber-900/40 border border-amber-600/50 text-amber-200 p-2 rounded-xl font-bold text-xs">
                                <i class="fa-solid fa-square text-amber-400"></i> Tarjeta Rival
                            </button>
                            <button onclick="app.openModal('sub_away')" class="bg-slate-800 border border-slate-700 text-slate-200 p-2 rounded-xl font-bold text-xs">
                                <i class="fa-solid fa-right-left text-slate-400"></i> Cambio Rival
                            </button>
                        </div>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3">
                        <div class="flex items-center justify-between mb-2">
                            <h4 class="text-xs font-bold text-lasalle-yellow uppercase">En Juego (${starters.length}) · toca un jugador</h4>
                            <button onclick="app.switchTab('field')" class="text-[10px] text-lasalle-yellow underline">Vista de campo</button>
                        </div>
                        <div class="grid grid-cols-2 gap-1.5">
                            ${starters.map(p => `
                                <button onclick="app.openPlayerMenu('${p.id}')" class="bg-slate-950 active:bg-slate-800 px-2 py-2 rounded-lg text-xs border border-slate-800 flex justify-between items-center gap-1 text-left min-h-[40px]">
                                    <span class="font-bold text-lasalle-yellow truncate">#${esc(p.number)} ${esc(p.name)}${p.captain ? ' (C)' : ''}</span>
                                    <span class="text-[10px] text-slate-300 shrink-0">${p.goals ? '⚽' + p.goals + ' ' : ''}${p.assists ? '🅰' + p.assists + ' ' : ''}${p.yellowCards ? '🟨' : ''}${p.subIn ? '<i class="fa-solid fa-arrow-up text-emerald-400"></i>' : ''}</span>
                                </button>
                            `).join('')}
                        </div>
                        ${this.state.squad.some(p => p.status === 'bench') ? `
                        <h4 class="text-[10px] font-bold text-slate-400 uppercase mt-3 mb-1.5">Banquillo (toca para meterlo)</h4>
                        <div class="grid grid-cols-2 gap-1.5">
                            ${this.state.squad.filter(p => p.status === 'bench').map(p => `
                                <button onclick="app.openPlayerMenu('${p.id}')" class="bg-slate-950/60 px-2 py-2 rounded-lg text-xs border border-slate-800 flex justify-between gap-1 text-left min-h-[40px]">
                                    <span class="font-bold text-slate-300 truncate">#${esc(p.number)} ${esc(p.name)}</span>
                                    <span class="text-[10px] text-slate-500 shrink-0">${esc(p.position)}</span>
                                </button>`).join('')}
                        </div>` : ''}
                    </div>

                    <div class="flex gap-2">
                        <button onclick="app.finishMatch()" class="flex-1 bg-rose-600 text-white font-black py-3 rounded-2xl text-xs uppercase tracking-wider">
                            <i class="fa-solid fa-flag-checkered mr-1"></i> Finalizar y Guardar
                        </button>
                    </div>
                </div>
                `;
            }

            renderLineupScreen() {
                const starters = this.state.squad.filter(p => p.status === 'starter');
                const subs = this.state.squad.filter(p => p.status === 'bench');
                const outPlayers = this.state.squad.filter(p => p.status === 'substituted' || p.status === 'out');
                const isMatchStarted = this.state.match.status !== 'setup';

                return `
                <div class="p-4 space-y-4 pb-16">
                    <div class="flex justify-between items-center">
                        <h2 class="text-base font-extrabold text-lasalle-yellow">Plantilla, Goles y Minutos</h2>
                        ${!isMatchStarted ? `<button onclick="app.openLargeSquadModal()" class="bg-lasalle-yellow text-lasalle-darkblue px-2.5 py-1 rounded-lg text-xs font-black">Gestionar Plantilla</button>` : '<span class="text-[10px] text-amber-400 font-bold">Plantilla bloqueada en partido</span>'}
                    </div>

                    <!-- Titulares -->
                    <div class="space-y-2">
                        <h3 class="text-xs font-bold text-emerald-400 uppercase">Titulares (${starters.length})</h3>
                        ${starters.map(p => {
                            let cardsHtml = '';
                            if (p.yellowCards === 1) cardsHtml += '<span class="px-1.5 py-0.5 bg-amber-400 text-slate-950 font-bold rounded text-[10px]" title="Tarjeta Amarilla">🟨</span>';
                            if (p.yellowCards >= 2 || (p.yellowCards === 1 && p.redCard)) cardsHtml += '<span class="px-1.5 py-0.5 bg-amber-600 text-white font-bold rounded text-[10px]" title="Doble Amarilla">🟨🟨</span>';
                            if (p.redCard && p.yellowCards < 2) cardsHtml += '<span class="px-1.5 py-0.5 bg-rose-600 text-white font-bold rounded text-[10px]" title="Roja Directa">🟥</span>';

                            return `
                            <div class="bg-slate-900 p-2.5 rounded-xl flex justify-between text-xs items-center">
                                <div class="flex items-center gap-2 flex-1 truncate">
                                    <span class="font-bold text-lasalle-yellow w-6">#${esc(p.number)}</span>
                                    <span class="font-bold text-white truncate">${esc(p.name)} ${p.captain ? '<span class="text-lasalle-yellow font-bold">(C)</span>' : ''}</span>
                                </div>
                                <div class="flex items-center gap-1.5 flex-wrap justify-end">
                                    ${p.goals > 0 ? `<span class="px-1.5 py-0.5 bg-emerald-500 text-slate-950 font-bold rounded text-[10px]" title="Goles: ${p.goals}"><i class="fa-solid fa-futbol"></i> ${p.goals}</span>` : ''}
                                    ${p.assists > 0 ? `<span class="px-1.5 py-0.5 bg-teal-500 text-slate-950 font-bold rounded text-[10px]" title="Asistencias: ${p.assists}"><i class="fa-solid fa-shoe-prints"></i> ${p.assists}</span>` : ''}
                                    
                                    ${cardsHtml}
                                    ${(p.subIn || (p.inMinute !== null && p.inMinute > 0)) ? (p.subInHt
                                        ? `<span class="text-[10px] text-teal-300 font-semibold bg-teal-950 px-1.5 py-0.5 rounded" title="Entró en el descanso"><i class="fa-solid fa-arrow-right-to-bracket"></i> Entró en el descanso</span>`
                                        : `<span class="text-[10px] text-teal-300 font-semibold" title="Entró en min ${p.inMinute}"><i class="fa-solid fa-arrow-right-to-bracket"></i> ${p.inMinute}'</span>`) : ''}

                                    ${!isMatchStarted ? `<button onclick="app.toggleCaptain('${p.id}')" class="px-2 py-0.5 bg-slate-800 text-lasalle-yellow rounded text-[10px]">${p.captain ? 'Quitar (C)' : 'Hacer (C)'}</button>` : ''}
                                    ${!isMatchStarted ? `<button onclick="app.editPlayerModal('${p.id}')" class="text-slate-400"><i class="fa-solid fa-pen"></i></button>` : ''}
                                </div>
                            </div>
                        `;}).join('')}
                    </div>

                    <!-- Banquillo -->
                    <div class="space-y-2">
                        <h3 class="text-xs font-bold text-lasalle-yellow uppercase">Banquillo (${subs.length})</h3>
                        ${subs.map(p => {
                            let cardsHtml = '';
                            if (p.yellowCards === 1) cardsHtml += '<span class="px-1.5 py-0.5 bg-amber-400 text-slate-950 font-bold rounded text-[10px]">🟨</span>';
                            if (p.yellowCards >= 2) cardsHtml += '<span class="px-1.5 py-0.5 bg-amber-600 text-white font-bold rounded text-[10px]">🟨🟨</span>';
                            if (p.redCard && p.yellowCards < 2) cardsHtml += '<span class="px-1.5 py-0.5 bg-rose-600 text-white font-bold rounded text-[10px]">🟥</span>';

                            return `
                            <div class="bg-slate-900 p-2.5 rounded-xl flex justify-between text-xs items-center">
                                <div class="flex items-center gap-2 flex-1 truncate">
                                    <span class="font-bold text-lasalle-yellow w-6">#${esc(p.number)}</span>
                                    <span class="font-bold text-slate-300 truncate">${esc(p.name)}</span>
                                </div>
                                <div class="flex items-center gap-1.5">
                                    ${p.goals > 0 ? `<span class="px-1.5 py-0.5 bg-emerald-500 text-slate-950 font-bold rounded text-[10px]"><i class="fa-solid fa-futbol"></i> ${p.goals}</span>` : ''}
                                    ${p.assists > 0 ? `<span class="px-1.5 py-0.5 bg-teal-500 text-slate-950 font-bold rounded text-[10px]"><i class="fa-solid fa-shoe-prints"></i> ${p.assists}</span>` : ''}
                                    ${cardsHtml}
                                    ${!isMatchStarted ? `<button onclick="app.editPlayerModal('${p.id}')" class="text-slate-400"><i class="fa-solid fa-pen"></i></button>` : ''}
                                </div>
                            </div>
                        `;}).join('')}
                    </div>

                    <!-- Sustituidos / Fuera -->
                    <div class="space-y-2">
                        <h3 class="text-xs font-bold text-rose-400 uppercase">Sustituidos / Fuera / Expulsados</h3>
                        ${outPlayers.map(p => {
                            let cardsHtml = '';
                            if (p.yellowCards === 1) cardsHtml += '<span class="px-1.5 py-0.5 bg-amber-400 text-slate-950 font-bold rounded text-[10px]" title="Amarilla">🟨</span>';
                            if (p.yellowCards >= 2) cardsHtml += '<span class="px-1.5 py-0.5 bg-amber-600 text-white font-bold rounded text-[10px]" title="Doble Amarilla">🟨🟨</span>';
                            if (p.redCard && p.yellowCards < 2) cardsHtml += '<span class="px-1.5 py-0.5 bg-rose-600 text-white font-bold rounded text-[10px]" title="Roja">🟥</span>';

                            return `
                            <div class="bg-slate-950 p-2.5 rounded-xl flex justify-between text-xs opacity-85 items-center">
                                <div class="flex items-center gap-2 flex-1 truncate">
                                    <span class="font-bold text-slate-500 w-6">#${esc(p.number)}</span>
                                    <span class="line-through text-slate-400 truncate">${esc(p.name)}</span>
                                </div>
                                <div class="flex items-center gap-1.5 flex-wrap justify-end">
                                    ${p.goals > 0 ? `<span class="px-1.5 py-0.5 bg-emerald-500 text-slate-950 font-bold rounded text-[10px]"><i class="fa-solid fa-futbol"></i> ${p.goals}</span>` : ''}
                                    ${cardsHtml}
                                    ${(p.subIn && p.inMinute !== null) ? (p.subInHt
                                        ? `<span class="text-[10px] text-teal-300 font-semibold" title="Entró en el descanso"><i class="fa-solid fa-arrow-right-to-bracket"></i> Desc.</span>`
                                        : `<span class="text-[10px] text-teal-300 font-semibold" title="Entró en min ${p.inMinute}"><i class="fa-solid fa-arrow-right-to-bracket"></i> ${p.inMinute}'</span>`) : ''}
                                    ${p.outMinute !== null ? (p.subOutHt
                                        ? `<span class="text-[10px] text-rose-400 font-bold bg-rose-950 px-2 py-0.5 rounded-lg" title="Sustituido en el descanso"><i class="fa-solid fa-arrow-right-from-bracket"></i> Salió en el descanso</span>`
                                        : `<span class="text-[10px] text-rose-400 font-bold bg-rose-950 px-2 py-0.5 rounded-lg"><i class="fa-solid fa-arrow-right-from-bracket"></i> ${p.outMinute}'</span>`) : ''}
                                </div>
                            </div>
                        `;}).join('')}
                    </div>
                </div>
                `;
            }

            renderTimelineScreen() {
                const sortedEvents = [...this.state.events].sort((a, b) => a.minute - b.minute);

                return `
                <div class="p-4 space-y-4 pb-16">
                    <h2 class="text-base font-extrabold text-lasalle-yellow">Cronología del Partido</h2>
                    ${this.renderUndoButton()}
                    ${sortedEvents.length ? '<p class="text-[11px] text-slate-400"><i class="fa-solid fa-pen"></i> edita o <i class="fa-solid fa-trash"></i> borra cualquier suceso: el marcador y las estadísticas se recalculan solos.</p>' : ''}
                    <div class="space-y-2">
                        ${sortedEvents.length === 0 ? '<div class="text-center py-10 text-slate-500 text-xs">Sin acontecimientos registrados.</div>' : ''}
                        ${sortedEvents.map(ev => `
                            <div class="bg-slate-900 p-3 rounded-xl flex items-center justify-between gap-2 text-xs border border-slate-800">
                                <div class="min-w-0">
                                    <div class="font-bold text-white"><span class="text-lasalle-yellow font-mono mr-1.5">[Min ${ev.minute}']</span> ${esc(ev.title)}</div>
                                    <div class="text-[11px] text-slate-400">${esc(ev.detail)}</div>
                                </div>
                                <div class="flex gap-1.5 shrink-0">
                                    <button onclick="app.openEditEvent('${ev.id}')" class="w-9 h-9 bg-slate-800 text-lasalle-yellow rounded-lg" aria-label="Editar"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="app.deleteEvent('${ev.id}')" class="w-9 h-9 bg-rose-600/20 text-rose-400 border border-rose-500/30 rounded-lg" aria-label="Borrar"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                `;
            }

            renderStatsScreen() {
                const activePlayers = this.state.squad.filter(p => p.status !== 'unconvoked');

                return `
                <div class="p-4 space-y-4 bg-slate-950 pb-16">
                    <h2 class="text-base font-extrabold text-lasalle-yellow flex items-center justify-between">
                        <span><i class="fa-solid fa-file-pdf mr-1"></i> Acta Oficial del Encuentro</span>
                        ${this.state.match.status === 'finished' ? `<button onclick="app.switchTab('setup')" class="bg-slate-800 text-lasalle-yellow px-2.5 py-1 rounded-lg text-xs font-bold border border-lasalle-yellow/30"><i class="fa-solid fa-arrow-left"></i> Configuración</button>` : ''}
                    </h2>

                    <button onclick="app.openShare(null)" class="w-full bg-emerald-600 text-white font-black py-3 rounded-xl text-xs flex items-center justify-center gap-1.5"><i class="fa-solid fa-share-nodes"></i> Compartir resumen (WhatsApp)</button>

                    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-2">
                        <div class="text-xs font-bold text-lasalle-yellow">RESUMEN DEL ENCUENTRO (${esc(this.state.match.competition || 'Competición')})</div>
                        <div class="text-sm font-bold text-white">${esc(this.state.match.homeTeam)} ${this.homeScore()} - ${this.awayScore()} ${esc(this.state.match.awayTeam)}</div>
                        <div class="text-xs text-slate-400">Jornada: ${esc(this.state.match.matchday)} | Fecha: ${esc(this.state.match.date)}</div>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl space-y-3">
                        <h3 class="text-xs font-bold text-lasalle-yellow uppercase">Estadísticas Detalladas de la Plantilla</h3>
                        <div class="space-y-2 max-h-60 overflow-y-auto">
                            ${activePlayers.map(p => {
                                const mins = this.calculatePlayerMinutes(p);
                                const entryInfo = (p.subIn || (p.inMinute !== null && p.inMinute > 0)) ? (p.subInHt ? `Entró: descanso (${p.inMinute}')` : `Entró: ${p.inMinute}'`) : 'Titular';
                                const exitInfo = p.outMinute !== null ? ` | Salió: ${p.subOutHt ? 'descanso (' + p.outMinute + "')" : p.outMinute + "'"}` : '';
                                const historySub = `${entryInfo}${exitInfo}`;

                                return `
                                    <div class="bg-slate-950 p-2.5 rounded-xl text-xs space-y-1 border border-slate-800/60">
                                        <div class="flex justify-between font-bold text-white">
                                            <span>#${esc(p.number)} ${esc(p.name)} ${p.captain ? '<span class="text-lasalle-yellow">(C)</span>' : ''}</span>
                                            <span class="text-lasalle-yellow">${mins}' jugados</span>
                                        </div>
                                        <div class="flex flex-wrap gap-2 text-[10px] text-slate-300">
                                            <span><i class="fa-solid fa-futbol text-emerald-400"></i> Goles: ${p.goals}</span>
                                            <span><i class="fa-solid fa-shoe-prints text-teal-400"></i> Asist: ${p.assists}</span>
                                            <span><i class="fa-solid fa-square text-amber-400"></i> Amarillas: ${p.yellowCards}</span>
                                            <span><i class="fa-solid fa-square text-rose-500"></i> Rojas: ${p.redCard ? '1' : '0'}</span>
                                        </div>
                                        <div class="text-[10px] text-slate-400 italic">
                                            <i class="fa-solid fa-right-left"></i> Cambios: ${historySub}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <div class="space-y-3">
                        <button onclick="app.generateWhatsAppPDF()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3.5 rounded-xl text-xs flex items-center justify-center gap-2 shadow-lg">
                            <i class="fa-brands fa-whatsapp text-lg"></i> Compartir Acta PDF por WhatsApp
                        </button>
                        <button onclick="app.exportGoogleDriveSheet()" class="w-full bg-lasalle-yellow hover:bg-lasalle-yellowhover text-lasalle-darkblue font-black py-3.5 rounded-xl text-xs flex items-center justify-center gap-2 shadow-lg">
                            <i class="fa-solid fa-file-excel"></i> Exportar Datos y Estadísticas (Sheet)
                        </button>
                        ${this.state.match.status === 'finished' ? `
                        <button onclick="app.saveMatchToHistory(false)" class="w-full bg-slate-800 hover:bg-slate-700 text-lasalle-yellow border border-lasalle-yellow/30 font-black py-3.5 rounded-xl text-xs flex items-center justify-center gap-2">
                            <i class="fa-solid fa-floppy-disk"></i> Guardar en el histórico
                        </button>` : ''}
                    </div>
                </div>
                `;
            }

            openManualModal() {
                const section = (icon, title, body, open) => `
                    <details class="bg-slate-950 rounded-2xl border border-slate-800" ${open ? 'open' : ''}>
                        <summary class="cursor-pointer select-none p-3 font-bold text-lasalle-yellow text-sm flex items-center gap-2">
                            <i class="fa-solid ${icon} w-5 text-center"></i> ${title}
                        </summary>
                        <div class="px-3 pb-3 space-y-2 text-xs text-slate-300 leading-relaxed">${body}</div>
                    </details>`;
                const steps = items => `<ol class="list-decimal pl-5 space-y-1">${items.map(i => `<li>${i}</li>`).join('')}</ol>`;
                const bullets = items => `<ul class="list-disc pl-5 space-y-1">${items.map(i => `<li>${i}</li>`).join('')}</ul>`;

                const body = [
                    section('fa-futbol', 'Qué es StatBench360', `
                        <p>Es una herramienta para <b>seguir las estadísticas de un partido de fútbol en directo</b>: marcador, goles, asistencias, tarjetas, cambios, minutos jugados y cronología. Al terminar genera el acta en PDF, una hoja de datos y guarda el partido en el histórico.</p>
                        <p>Funciona en el móvil o el ordenador. Los datos se guardan <b>en tu propio dispositivo</b>.</p>`, true),

                    section('fa-list-check', '1. Antes del partido (pantalla Inicio)', steps([
                        '<b>Datos del partido:</b> pulsa <b>LOCAL</b> o <b>VISITANTE</b> según jueguen <i>tu equipo</i>. Escribe el nombre del equipo local y del visitante, la competición, la jornada, la fecha y los minutos de cada parte.',
                        '<b>Plantilla:</b> añade jugadores a mano en "Gestión Ampliada de Plantilla", sube un archivo .txt/.csv con el formato <code class="text-lasalle-yellow">9 Juan Pérez</code> (dorsal y nombre en cada línea), o <b>pega una lista</b> copiada de cualquier sitio (botón "Pegar lista de jugadores").',
                        '<b>Convocatoria:</b> pasa a cada jugador a <b>Titular</b>, <b>Banquillo</b> o <b>Fuera</b>. Lo normal son 11 titulares. Marca la <b>C</b> en el capitán.',
                        '<b>Voz:</b> elige si quieres avisos por voz del minuto y cada cuánto.',
                        'Pulsa <b>Iniciar Partido</b>. El cronómetro empieza en ese momento.'
                    ]) + `<p class="text-slate-400">Si el partido anterior ya terminó, pulsa antes <b>Resetear / Nuevo</b>: te preguntará si quieres conservar la plantilla (recomendado) o volver a la de ejemplo.</p>`),

                    section('fa-paste', '2. Cargar la plantilla del equipo', bullets([
                        '<b>Pegar lista:</b> copia los jugadores desde donde los tengas (una web, Excel, un documento, WhatsApp) y pulsa <b>Pegar lista de jugadores</b>. Revisa la lista que aparece y elige <b>Sustituir plantilla</b> o <b>Añadir a la plantilla actual</b>.',
                        '<b>Archivo:</b> con <b>Subir Fichero</b> puedes cargar un .txt o un .csv con la lista de jugadores.',
                        '<b>A mano:</b> en <b>Gestión Ampliada de Plantilla</b> añades, editas o borras jugadores.',
                        '<b>Formatos válidos:</b> basta con <b>el nombre</b>, uno por línea (<code class="text-lasalle-yellow">Juan Pérez</code>). También vale con dorsal (<code class="text-lasalle-yellow">9 Juan Pérez</code>) o una tabla con columnas Dorsal, Jugador y Posición. "Pérez García, Juan" se convierte en "Juan Pérez García".',
                        '<b>Completar antes de empezar:</b> los jugadores sin dorsal o posición llevan un <b>⚠</b>. Pulsa el lápiz de cada uno para poner su dorsal y posición; el aviso desaparece al guardar. Si inicias el partido con ⚠, la app te lo recordará.'
                    ]) + `<p class="text-slate-400">Comprueba los nombres antes de confirmar: si la lista no trae dorsal, la app asigna uno provisional (marcado con *) que debes corregir.</p>`),

                    section('fa-gauge-high', '3. Durante el partido (pestaña Directo)', bullets([
                        '<b>Cronómetro:</b> botón <b>Pausar / Reanudar</b>. Sigue contando aunque el móvil se bloquee.',
                        '<b>Gol nuestro:</b> elige goleador, tipo (normal, penalti, falta directa, propia puerta), asistencia (opcional) y minuto. En <i>propia puerta</i> el gol suma para el rival y no cuenta al jugador.',
                        '<b>Gol rival:</b> indica dorsal (opcional), tipo y minuto. Si es <i>propia puerta</i> del rival, el gol suma para tu equipo.',
                        '<b>Tarjetas:</b> amarilla, doble amarilla (expulsión) o roja directa. Un jugador con una amarilla solo puede recibir la doble amarilla o la roja. El expulsado sale del campo.',
                        '<b>Cambios:</b> pulsa <b>Añadir otro cambio</b> para hacer varios cambios a la vez; todos cuentan como <u>una</u> ventana. La casilla <b>"Cuenta como ventana"</b> permite hacer un cambio sin consumir ventana (en el descanso viene desmarcada). Hay 3 ventanas por equipo.',
                        '<b>Cambios, tarjetas y goles del rival:</b> se anotan con el dorsal, sin necesidad de tener su plantilla.',

            // ============================ AVISOS ============================
            showToast(msg) {
                let el = document.getElementById('toast');
                if (!el) {
                    el = document.createElement('div');
                    el.id = 'toast';
                    el.className = 'fixed left-1/2 -translate-x-1/2 bottom-16 z-[60] bg-slate-800 border border-lasalle-yellow/40 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-2xl max-w-[90vw] text-center';
                    document.body.appendChild(el);
                }
                el.textContent = msg;
                el.style.display = 'block';
                clearTimeout(this._toastTimer);
                this._toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3500);
            }

            // Guarda un archivo dejando elegir dónde: selector del sistema (escritorio), hoja de compartir/guardar (móvil)
            // o, si no hay otra opción, descarga normal. Devuelve true si el archivo se ha guardado/enviado.
            async saveFile(fileName, content, mime, plain) {
                const baseMime = String(mime).split(';')[0];
                const blob = new Blob([content], { type: mime });
                const ext = (fileName.match(/\.[a-z0-9]+$/i) || ['.txt'])[0].toLowerCase();
                const cancelled = e => e && e.name === 'AbortError';
                if (!plain && window.showSaveFilePicker) {
                    try {
                        const h = await window.showSaveFilePicker({ suggestedName: fileName, types: [{ description: 'Archivo', accept: { [baseMime]: [ext] } }] });
                        const w = await h.createWritable();
                        await w.write(blob);
                        await w.close();
                        this.showToast('Archivo guardado');
                        return true;
                    } catch (e) {
                        if (cancelled(e)) { this.showToast('Guardado cancelado'); return false; }
                    }
                }
                if (!plain && navigator.share && navigator.canShare) {
                    try {
                        let file = new File([blob], fileName, { type: baseMime });
                        if (!navigator.canShare({ files: [file] })) file = new File([blob], fileName, { type: 'text/plain' });
                        if (navigator.canShare({ files: [file] })) {
                            await navigator.share({ files: [file], title: fileName });
                            this.showToast('Archivo guardado o enviado');
                            return true;
                        }
                    } catch (e) {
                        if (cancelled(e)) { this.showToast('Guardado cancelado'); return false; }
                    }
                }
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                this.showToast('Archivo descargado (carpeta de descargas)');
                return true;
            }

            downloadFile(fileName, content, mime) {
                return this.saveFile(fileName, content, mime, false);
            }

            // ============================ USO SIN CONEXIÓN ============================
            offlineSupported() {
                return 'serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:' && 'caches' in window;
            }

            initOffline() {
                this.offline = { ready: false, active: false, missing: 0, total: 0, checking: true, ocrReady: false, persisted: null, msg: '' };
                this.deferredInstall = null;
                window.addEventListener('online', () => this.onNetworkChange());
                window.addEventListener('offline', () => this.onNetworkChange());
                window.addEventListener('beforeinstallprompt', e => {
                    e.preventDefault();
                    this.deferredInstall = e;
                    this.updateOfflineUI();
                });
                window.addEventListener('appinstalled', () => { this.deferredInstall = null; this.updateOfflineUI(); });
                this.onNetworkChange();
                if (!this.offlineSupported()) { this.offline.checking = false; this.updateOfflineUI(); return; }

                navigator.serviceWorker.addEventListener('controllerchange', () => this.refreshOfflineStatus());
                const start = () => {
                    navigator.serviceWorker.register('sw.js')
                        .then(() => navigator.serviceWorker.ready)
                        .then(() => {
                            this.refreshOfflineStatus();
                            setTimeout(() => this.refreshOfflineStatus(), 5000);
                        })
                        .catch(e => {
                            console.error(e);
                            this.offline.checking = false;
                            this.offline.msg = 'No se pudo activar el modo sin conexión en este navegador.';
                            this.updateOfflineUI();
                        });
                };
                if (document.readyState === 'complete') start();
                else window.addEventListener('load', start);
            }

            onNetworkChange() {
                const badge = document.getElementById('net-badge');
                if (badge) badge.classList.toggle('hidden', navigator.onLine);
                this.updateOfflineUI();
            }

            // Comprueba qué recursos están realmente guardados en el dispositivo
            async refreshOfflineStatus() {
                if (!this.offlineSupported() || !this.offline) return;
                const o = this.offline;
                try {
                    const reg = await navigator.serviceWorker.getRegistration();
                    const scope = reg ? reg.scope : location.href;
                    const shell = ['index.html', 'manifest.webmanifest', 'icons/icon-192.png', 'icons/icon-512.png', 'icons/apple-touch-icon.png']
                        .map(p => new URL(p, scope).href);
                    const css = Array.from(document.querySelectorAll('style')).map(s => s.textContent).join('\n');
                    const imports = Array.from(css.matchAll(/@import\s+url\(\s*['"]?(https?:\/\/[^'")\s]+)/gi)).map(m => m[1]);
                    const ext = Array.from(document.querySelectorAll('script[src],link[rel="stylesheet"][href]'))
                        .map(e => e.src || e.href)
                        .filter(u => /^https?:\/\//.test(u) && new URL(u).origin !== location.origin)
                        .concat(imports);
                    const urls = Array.from(new Set(shell.concat(ext)));
                    const found = await Promise.all(urls.map(u => caches.match(u, { ignoreVary: true }).then(Boolean).catch(() => false)));
                    o.total = urls.length;
                    o.missing = found.filter(f => !f).length;
                    o.active = !!(reg && reg.active);
                    o.ready = o.active && o.missing === 0;

                    let ocr = false;
                    for (const name of await caches.keys()) {
                        if (!name.startsWith('statbench360-')) continue;
                        const keys = await (await caches.open(name)).keys();
                        if (keys.some(k => /tesseract[^/]*core|tesseract-core/i.test(k.url))) { ocr = true; break; }
                    }
                    o.ocrReady = ocr;
                } catch (e) { console.error(e); }
                o.checking = false;
                this.updateOfflineUI();
            }

            isStandalone() {
                return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
            }

            platform() {
                const ua = navigator.userAgent || '';
                if (/iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'ios';
                if (/Android/i.test(ua)) return 'android';
                return 'desktop';
            }

                        </div>

                    </div>`;
                const li = arr => '<ol class="list-decimal pl-5 space-y-1 text-[12px] text-slate-200 leading-relaxed">' + arr.map(x => `<li>${x}</li>`).join('') + '</ol>';
                if (!supported) {
                    return `<div class="bg-amber-500/10 border border-amber-500/40 rounded-2xl p-4 space-y-2">
                        <h4 class="text-sm font-black text-amber-300"><i class="fa-solid fa-triangle-exclamation mr-1"></i> No se puede descargar desde aquí</h4>
                        <p class="text-[12px] text-slate-200 leading-relaxed">Abre la app desde su dirección web (empieza por <b>https://</b>) en el navegador del móvil. Desde un archivo guardado en el móvil no se puede instalar.</p>
                    </div>`;
                }
                const prepared = !!o.ready;
                const s1 = step(1, prepared, 'Guardar la app en el móvil', `
                    <p class="text-[12px] text-slate-300 leading-relaxed">${prepared
                        ? '<b class="text-emerald-300">Hecho.</b> Ya está guardada y funcionará sin cobertura.'
                        : (o.checking ? 'Comprobando…' : 'Con internet (mejor con Wi-Fi), pulsa el botón y espera unos segundos.')}</p>
                    ${prepared ? '' : `<button onclick="app.prepareOffline()" class="w-full bg-lasalle-yellow text-lasalle-darkblue font-black py-3 rounded-xl text-sm flex items-center justify-center gap-2"><i class="fa-solid fa-cloud-arrow-down"></i> Guardar la app</button>`}
                    ${o.msg ? `<p class="text-[11px] text-lasalle-yellow font-bold">${esc(o.msg)}</p>` : ''}`);
                let s2;
                if (standalone) {
                    s2 = step(2, true, 'Instalar el icono', '<p class="text-[12px] text-slate-300"><b class="text-emerald-300">Hecho.</b> Ya estás usando la app instalada.</p>');
                } else if (plat === 'ios') {
                    s2 = step(2, false, 'Instalar el icono en iPhone / iPad', `
                        <p class="text-[11px] text-amber-300">En iPhone no hay botón de instalar: se hace desde el menú de Safari.</p>
                        ${li(['Abre esta web en <b>Safari</b> (no en Chrome ni en otro navegador).',
                              'Pulsa el botón <b>Compartir</b> (cuadrado con una flecha hacia arriba <i class="fa-solid fa-arrow-up-from-bracket"></i>), abajo en iPhone o arriba en iPad.',
                              'Baja en el menú y pulsa <b>"Añadir a pantalla de inicio"</b>.',
                              'Pulsa <b>Añadir</b>. Abre siempre la app desde el nuevo icono.'])}`);
                } else if (plat === 'android') {
                    s2 = step(2, false, 'Instalar el icono en Android', `
                        ${this.deferredInstall
                            ? `<button onclick="app.installApp()" class="w-full bg-lasalle-yellow text-lasalle-darkblue font-black py-3 rounded-xl text-sm flex items-center justify-center gap-2"><i class="fa-solid fa-mobile-screen-button"></i> Instalar app</button>
                               <p class="text-[11px] text-slate-400">Se abrirá un aviso del móvil: pulsa <b>Instalar</b>.</p>`
                            : li(['Abre esta web en <b>Chrome</b>.', 'Pulsa el menú <b>⋮</b> (tres puntos, arriba a la derecha).',
                                  'Pulsa <b>"Instalar aplicación"</b> (o "Añadir a la pantalla de inicio").', 'Confirma con <b>Instalar</b>. Abre siempre la app desde el nuevo icono.'])}`);
                } else {
                    s2 = step(2, false, 'Instalar en el ordenador (opcional)', `
                        ${this.deferredInstall
                            ? `<button onclick="app.installApp()" class="w-full bg-lasalle-yellow text-lasalle-darkblue font-black py-3 rounded-xl text-sm flex items-center justify-center gap-2"><i class="fa-solid fa-download"></i> Instalar app</button>`
                            : '<p class="text-[12px] text-slate-300 leading-relaxed">En Chrome o Edge, pulsa el icono de instalar que aparece a la derecha de la barra de direcciones, o menú ⋮ → "Instalar StatBench360".</p>'}`);
                }
                const s3 = step(3, false, 'Comprobar', '<p class="text-[12px] text-slate-300 leading-relaxed">Pon el móvil en <b>modo avión</b> y abre la app desde su icono. En la cabecera debe aparecer <b>SIN CONEXIÓN</b> y todo debe funcionar.</p>');
                return `<div class="space-y-3">${s1}${s2}${s3}
                    ${plat === 'ios' ? '<p class="text-[10px] text-slate-500">iPhone: si no instalas la app en la pantalla de inicio, Safari puede borrar los datos de webs que no usas en 7 días.</p>' : ''}
                </div>`;
            }

            updateOfflineUI() {
                const wrap = document.getElementById('offline-card-wrap');
                if (wrap) wrap.innerHTML = this.renderOfflineCard();
                const btn = document.getElementById('btn-download-app');
                if (btn) btn.classList.toggle('hidden', this.isStandalone());

            // Ventana emergente para preparar el uso sin conexión e instalar la app
            openOfflineModal() {
                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">

                            <h3 class="font-bold text-base text-white pr-6"><i class="fa-solid fa-mobile-screen-button text-lasalle-yellow mr-1"></i> Descarga la app</h3>
                            <p class="text-[11px] text-slate-400">Son 3 pasos y se hacen una sola vez, con internet. Después la app funciona también sin cobertura.</p>
                            <div id="offline-card-wrap">${this.renderOfflineCard()}</div>
                        </div>
                    </div>`;
                this.refreshOfflineStatus();
            }

            setOfflineMsg(msg) {
                if (this.offline) this.offline.msg = msg;
                this.updateOfflineUI();
            }

            async prepareOffline() {
                if (!navigator.onLine) { alert('Necesitas conexión a internet para preparar el uso sin conexión.'); return; }
                if (!this.offlineSupported()) return;
                this.setOfflineMsg('Guardando recursos en el dispositivo…');
                try {
                    const reg = await navigator.serviceWorker.getRegistration();
                    if (reg) { await reg.update().catch(() => {}); }
                    const worker = reg && (reg.active || reg.waiting || reg.installing);
                    if (worker) worker.postMessage('REFRESH_ASSETS');
                    if (navigator.storage && navigator.storage.persist) {
                        this.offline.persisted = await navigator.storage.persist().catch(() => null);
                    }
                } catch (e) { console.error(e); }
                for (let i = 0; i < 12; i++) {
                    await new Promise(r => setTimeout(r, 1500));
                    await this.refreshOfflineStatus();
                    if (this.offline.ready) break;
                }
                this.setOfflineMsg(this.offline.ready ? '¡Listo! Ya puedes usarla sin conexión.' : 'No se ha podido guardar todo. Comprueba la conexión e inténtalo de nuevo.');
            }

            async installApp() {
                const ev = this.deferredInstall;
                if (!ev) return;
                ev.prompt();
                try { await ev.userChoice; } catch (e) { /* se ignora */ }
                this.deferredInstall = null;
                this.updateOfflineUI();
            }

            // ============================ HISTÓRICO ============================
            loadHistory() {
                if (this.history) return this.history;
                let list = [];
                try {
                    const raw = localStorage.getItem(HISTORY_KEY);
                    if (raw) {
                        const arr = JSON.parse(raw);
                        if (Array.isArray(arr)) list = arr.slice(0, MAX_HISTORY).map(sanitizeHistoryEntry).filter(Boolean);
                    }
                } catch (e) { console.error('Histórico no válido', e); }
                this.history = list;
                if (this.migrateHistoryPids()) {
                    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch (e) { /* se ignora */ }
                }
                return list;
            }

            persistHistory() {
                this.migrateHistoryPids();
                try {
                    localStorage.setItem(HISTORY_KEY, JSON.stringify(this.history));
                    return true;
                } catch (e) {
                    alert('No se ha podido guardar el histórico (almacenamiento lleno). Exporta una copia y elimina partidos antiguos.');
                    return false;
                }
            }

            buildHistoryEntry() {
                const m = this.state.match;
                return {
                    id: m.matchId,
                    savedAt: Date.now(),
                    match: { homeTeam: m.homeTeam, awayTeam: m.awayTeam, isHome: m.isHome, date: m.date, matchday: m.matchday, competition: m.competition, halfDuration: m.halfDuration, teamId: this.state.teamId },
                    homeGoals: this.homeScore(),
                    awayGoals: this.awayScore(),
                    windows: { home: this.state.windows.home.used, away: this.state.windows.away.used },
                    players: this.state.squad.filter(p => p.status !== 'unconvoked').map(p => ({
                        pid: p.pid, number: p.number, name: p.name, position: p.position, captain: p.captain,
                        mins: this.calculatePlayerMinutes(p), goals: p.goals, assists: p.assists,
                        yellow: p.yellowCards, red: p.redCard, inMinute: p.inMinute, outMinute: p.outMinute
                    })),
                    events: this.state.events.map(e => ({ id: e.id, minute: e.minute, type: e.type, team: e.team, title: e.title, detail: e.detail }))
                };
            }

            saveMatchToHistory(silent) {
                const m = this.state.match;
                if (!m.matchId) m.matchId = newId('m');
                const entry = sanitizeHistoryEntry(this.buildHistoryEntry());
                if (!entry) return false;
                const list = this.loadHistory();
                const i = list.findIndex(e => e.id === entry.id);
                if (i >= 0) list[i] = entry;
                else {
                    if (list.length >= MAX_HISTORY) {
                        alert(`El histórico está lleno (${MAX_HISTORY} partidos). Exporta una copia y elimina partidos antiguos.`);
                        return false;
                    }
                    list.unshift(entry);
                }
                const ok = this.persistHistory();
                if (ok && !silent) this.showToast(i >= 0 ? 'Partido actualizado en el histórico' : 'Partido guardado en el histórico');
                this.saveToStorage();
                return ok;
            }

            renderHistoryDetail(e) {

            deleteHistory(id) {

                    this.persistHistory();
                    this.historyDetailId = null;
                    this.render();
                    this.showToast('Partido eliminado del histórico');
                }, 'Eliminar');

            exportHistoryCSV(id) {
                const e = this.loadHistory().find(x => x.id === id);
                if (!e) return;
                const m = e.match;
                const header = ['Competicion', 'EquipoLocal', 'EquipoVisitante', 'Jornada', 'Fecha', 'Jugador', 'Dorsal', 'Posicion',
                    'Capitan', 'MinutosJugados', 'Goles', 'Asistencias', 'TarjetasAmarillas', 'TarjetaRoja', 'IDJugador', 'IDEquipo'].join(',');
                const rows = e.players.map(p => [
                    csvCell(m.competition), csvCell(m.homeTeam), csvCell(m.awayTeam), csvCell(m.matchday), csvCell(m.date),
                    csvCell(p.name), p.number, p.position, p.captain ? 'Sí' : 'No', p.mins, p.goals, p.assists, p.yellow, p.red ? 'Sí' : 'No', csvCell(p.pid), csvCell(m.teamId)
                ].join(','));
                const fileName = 'Historico_' + safeFile(m.date) + '_' + safeFile(m.homeTeam) + '_vs_' + safeFile(m.awayTeam) + '.csv';
                this.downloadCSV(fileName, [header, ...rows].join('\r\n') + '\r\n');
            }

            exportHistoryJSON() {
                const list = this.loadHistory();
                if (list.length === 0) { alert('No hay partidos en el histórico para exportar.'); return; }
                const data = { app: 'StatBench360', version: 1, exportedAt: new Date().toISOString(), matches: list };
                this.downloadFile('historico_statbench_' + localDate() + '.json', JSON.stringify(data, null, 1), 'application/json');
            }

            importHistoryJSON(event) {
                const input = event.target;
                const file = input.files && input.files[0];
                input.value = '';
                if (!file) return;
                if (file.size > 5 * 1024 * 1024) { alert('El archivo es demasiado grande (máximo 5 MB).'); return; }
                const reader = new FileReader();
                reader.onerror = () => alert('No se pudo leer el archivo.');
                reader.onload = e => {
                    let incoming;
                    try {
                        const data = JSON.parse(String(e.target.result));
                        incoming = Array.isArray(data) ? data : data && data.matches;
                    } catch (err) { incoming = null; }
                    if (!Array.isArray(incoming)) { alert('El archivo no es una copia válida del histórico de StatBench360.'); return; }
                    const list = this.loadHistory();
                    const ids = new Set(list.map(x => x.id));
                    let added = 0;
                    incoming.slice(0, MAX_HISTORY).map(sanitizeHistoryEntry).filter(Boolean).forEach(entry => {
                        if (!ids.has(entry.id) && list.length < MAX_HISTORY) { list.push(entry); ids.add(entry.id); added++; }
                    });
                    if (added > 0) this.persistHistory();
                    this.render();
                    this.showToast(added > 0 ? `Se han importado ${added} partidos` : 'No había partidos nuevos que importar');
                };
                reader.readAsText(file);
            }

            // ============================ IMPORTAR LISTA PEGADA ============================
            isMatchLive() { return this.state.match.status !== 'setup'; }

            openPasteSquadModal() {
                if (this.isMatchLive()) {

                            <a href="https://www.ffib.es/Fed/NPcd/NFG_LstEquipos?cod_primaria=1000109&amp;Sch_Activas=1" target="_blank" rel="noopener noreferrer" class="text-xs text-lasalle-yellow underline"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>Abrir la web de la FFIB para copiar la lista</a>

                            <div class="grid grid-cols-2 gap-2">

                            </div>

                    </div>`;
            }

            reviewPastedSquad() {
                const ta = document.getElementById('paste-squad');
                const src = ta ? ta.value : '';
                if (!src || src.trim().length < 3) { alert('Pega primero la lista de jugadores.'); return; }
                this.startImport(src);
            }

            // ---- Identificación permanente de jugadores ----
            nameKey(n) {
                return String(n || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
                    .replace(/[^a-z0-9 ]+/g, ' ').split(/\s+/).filter(Boolean).sort().join(' ');
            }

            shortId(id) { return id ? '…' + String(id).slice(-5) : ''; }

            // Registro de jugadores conocidos: plantilla actual + histórico (mismo nombre, sin importar el orden de apellidos)
            playerRegistry() {
                const byKey = new Map(), byPid = new Map();
                const add = (pid, name, src) => {
                    if (!pid) return;
                    const k = this.nameKey(name);
                    if (!byPid.has(pid)) byPid.set(pid, { pid, name, src });
                    if (k && !byKey.has(k)) byKey.set(k, { pid, name, src });
                };
                this.state.squad.forEach(p => add(p.pid, p.name, 'plantilla'));
                this.loadHistory().slice().sort((a, b) => b.savedAt - a.savedAt)
                    .forEach(e => e.players.forEach(p => add(p.pid, p.name, 'histórico')));
                return { byKey, byPid };
            }

            // Asigna ID a jugadores de partidos antiguos que no lo tenían: mismo nombre = mismo ID (y el de la plantilla si existe)
            migrateHistoryPids() {
                const list = this.history || [];
                let changed = false;
                const keyPid = new Map();
                this.state.squad.forEach(p => { const k = this.nameKey(p.name); if (k && !keyPid.has(k)) keyPid.set(k, p.pid); });
                list.forEach(e => e.players.forEach(p => { const k = this.nameKey(p.name); if (p.pid && k && !keyPid.has(k)) keyPid.set(k, p.pid); }));
                list.forEach(e => {
                    if (!e.match.teamId) { e.match.teamId = this.state.teamId; changed = true; }
                    e.players.forEach(p => {
                        if (p.pid) return;
                        const k = this.nameKey(p.name) || ('dorsal' + p.number);
                        if (!keyPid.has(k)) keyPid.set(k, newId('pl'));
                        p.pid = keyPid.get(k);
                        changed = true;
                    });
                });
                return changed;
            }

            // Separa los ID (pl_… y tm_…) que traen los archivos exportados por la app del resto del texto
            extractIds(src) {
                let teamId = '';
                const pidByKey = new Map();
                const PID = /\bpl_[A-Za-z0-9]{4,36}\b/, TID = /\btm_[A-Za-z0-9]{4,36}\b/;
                const lines = String(src).replace(/^﻿/, '').split(/\r?\n/).slice(0, 400).map(line => {
                    const mp = line.match(PID), mt = line.match(TID);
                    if (!mp && !mt) return line;
                    if (mt && !teamId) teamId = mt[0];
                    const clean = line.replace(PID, '').replace(TID, '').replace(/[,;\t\s]+$/, '');
                    if (mp) {
                        const one = parseSquadText(clean)[0];
                        if (one) pidByKey.set(this.nameKey(one.name), mp[0]);
                    }
                    return clean;
                });
                return { text: lines.join('\n'), pidByKey, teamId };
            }

            startImport(src) {
                const ex = this.extractIds(src);
                const players = parseSquadText(ex.text);
                if (players.length === 0) {
                    alert('No se han encontrado jugadores. Escribe un jugador por línea, por ejemplo: Juan Pérez (el dorsal es opcional).');
                    return;
                }
                const reg = this.playerRegistry();
                const used = new Set();
                players.forEach(p => {
                    const k = this.nameKey(p.name);
                    let hit = null;
                    const filePid = ex.pidByKey.get(k);
                    if (filePid) hit = { pid: filePid, src: reg.byPid.has(filePid) ? 'tus registros' : 'el archivo' };
                    else if (reg.byKey.has(k)) { const r = reg.byKey.get(k); hit = { pid: r.pid, src: r.src }; }
                    if (hit && !used.has(hit.pid)) { used.add(hit.pid); p.match = hit; } else p.match = null;
                });
                this._pendingSquad = players;
                this._pendingTeamId = ex.teamId;
                const auto = players.some(p => p.auto);
                const nMatch = players.filter(p => p.match).length;
                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 flex items-center justify-center p-3">
                        <div class="bg-slate-900 border border-lasalle-yellow/40 w-full max-w-md max-h-[92vh] rounded-3xl p-5 shadow-2xl flex flex-col space-y-3">
                            <h3 class="font-bold text-base text-white">Confirmar importación</h3>
                            <p class="text-xs text-slate-300">Se han detectado <b class="text-lasalle-yellow">${players.length} jugadores</b>. Revisa nombres y dorsales:</p>
                            ${nMatch ? `<p class="text-[11px] text-emerald-300 bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-2">Hay <b>${nMatch}</b> jugador(es) que ya existen en tus registros. Con la casilla marcada se <b>conserva su ID</b> (y se acumulan sus estadísticas); desmárcala si es otra persona y se creará un ID nuevo.</p>` : ''}
                            <div class="flex-1 overflow-y-auto space-y-1 min-h-[6rem]">
                                ${players.map((p, i) => `
                                    <div class="bg-slate-950 px-2.5 py-1.5 rounded-xl text-xs space-y-1">
                                        <div class="flex items-center justify-between">
                                            <span class="font-bold ${p.auto ? 'text-amber-300' : 'text-lasalle-yellow'} w-9">#${p.num}${p.auto ? '*' : ''}</span>
                                            <span class="flex-1 text-slate-200 truncate font-semibold">${esc(p.name)}</span>
                                            <span class="text-[10px] ${p.posGiven ? 'text-slate-400' : 'text-amber-300'}">${p.posGiven ? esc(p.pos) : 'sin posición'}</span>
                                        </div>
                                        ${p.match ? `<label class="flex items-center gap-1.5 text-[10px] text-emerald-300"><input type="checkbox" class="pid-chk" data-i="${i}" checked> Mantener ID existente ${esc(this.shortId(p.match.pid))} (de ${esc(p.match.src)})</label>`
                                                  : '<div class="text-[10px] text-slate-500">ID nuevo</div>'}
                                    </div>`).join('')}
                            </div>
                            ${auto ? '<p class="text-[10px] text-amber-300">* Dorsal provisional (la lista no lo traía o estaba repetido). Antes de iniciar el partido, edita cada jugador (lápiz) para poner su dorsal y posición reales.</p>' : ''}
                            <div class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-[11px] text-slate-300 leading-relaxed">
                                <b>Sustituir</b>: reemplaza los ${this.state.squad.length} jugadores actuales y deja a los nuevos en el banquillo.${ex.teamId ? ' Se adopta el ID de equipo del archivo.' : ''}<br>
                                <b>Añadir</b>: suma solo los que aún no estén en la plantilla actual.
                            </div>
                            <div class="grid grid-cols-1 gap-2">
                                <button onclick="app.applyPastedSquad('replace')" class="bg-lasalle-yellow text-lasalle-darkblue font-black py-2.5 rounded-xl text-sm">Sustituir plantilla</button>
                                <button onclick="app.applyPastedSquad('add')" class="bg-slate-800 text-lasalle-yellow font-bold py-2.5 rounded-xl text-sm">Añadir a la plantilla actual</button>
                                <button onclick="app.cancelPastedSquad()" class="bg-slate-900 border border-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-sm">Cancelar</button>
                            </div>
                        </div>
                    </div>`;
            }

            // Pregunta con dos respuestas (Sí / No)
            askChoice(message, yesLabel, noLabel, onYes, onNo) {
                this._choice = { onYes, onNo };
                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl">
                            <p class="text-sm text-white mb-4">${esc(message)}</p>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="app.runChoice(false)" class="bg-slate-800 text-slate-200 font-bold py-2.5 rounded-xl text-sm">${esc(noLabel)}</button>
                                <button onclick="app.runChoice(true)" class="bg-lasalle-yellow text-lasalle-darkblue font-black py-2.5 rounded-xl text-sm">${esc(yesLabel)}</button>
                            </div>
                        </div>
                    </div>`;
            }

            runChoice(yes) {
                const c = this._choice;
                this._choice = null;
                this.closeModal();
                if (c) (yes ? c.onYes : c.onNo)();
            }

            cancelPastedSquad() {
                this._pendingSquad = null;
                this.closeModal();
            }

            applyPastedSquad(mode) {
                const pending = this._pendingSquad;
                const teamFromFile = this._pendingTeamId;
                const keep = new Set(Array.from(document.querySelectorAll('.pid-chk')).filter(c => c.checked).map(c => parseInt(c.dataset.i, 10)));
                this._pendingSquad = null;
                this._pendingTeamId = null;
                this.closeModal();
                if (!pending) return;
                if (this.isMatchLive()) { alert('No se puede cambiar la plantilla con un partido en curso o terminado.'); return; }
                const taken = new Set(mode === 'replace' ? [] : this.state.squad.map(x => x.pid));
                pending.forEach((p, i) => {
                    let pid = (p.match && keep.has(i)) ? p.match.pid : newId('pl');
                    if (taken.has(pid)) pid = newId('pl');
                    taken.add(pid);
                    p.pid = pid;
                });
                const make = (p, num, status) => ({
                    id: newId('p'), pid: p.pid, name: p.name, number: num, position: p.pos, status,
                    inMinute: null, outMinute: null, goals: 0, goalMinutes: [], goalTypes: [], assists: 0, yellowCards: 0, redCard: false, captain: false,
                    pending: !!p.auto || !p.posGiven
                });

                if (mode === 'replace') {
                    if (teamFromFile && isSafeId(teamFromFile)) this.state.teamId = teamFromFile;
                    this.state.squad = pending.map(p => make(p, p.num, 'bench'));
                    this.state.selectedPlayerIds.clear();
                    this.render();
                    const todo = pending.filter(p => p.auto || !p.posGiven).length;
                    this.showToast(`Plantilla sustituida: ${pending.length} jugadores.` + (todo ? ` Completa dorsal y posición (⚠) editando cada jugador.` : ' Elige ahora los titulares.'));
                    return;
                }

                const names = new Set(this.state.squad.map(p => p.name.toLowerCase()));
                const pids = new Set(this.state.squad.map(p => p.pid));
                const used = new Set(this.state.squad.map(p => p.number));
                let added = 0, already = 0, renumbered = 0;
                pending.forEach(p => {
                    if (names.has(p.name.toLowerCase()) || pids.has(p.pid)) { already++; return; }
                    if (this.state.squad.length >= 100) return;
                    let num = p.num;
                    if (used.has(num)) {
                        num = 1;
                        while (used.has(num) && num <= 99) num++;
                        if (num > 99) return;
                        renumbered++;
                    }
                    used.add(num);
                    names.add(p.name.toLowerCase());
                    this.state.squad.push(make(p, num, 'unconvoked'));
                    added++;
                });
                this.render();
                this.showToast(`Añadidos ${added} jugadores` + (already ? ` · ${already} ya estaban` : '') + (renumbered ? ` · ${renumbered} con dorsal nuevo` : ''));
            }

            downloadSquadCSV() {
                if (this.state.squad.length === 0) {
                    alert('No hay jugadores en la plantilla para descargar.');
                    return;
                }
                // dorsal, nombre, posición, ID de jugador, ID de equipo (los ID permiten reconocer al jugador al volver a importarlo)
                const csv = this.state.squad.map(p => [p.number, csvCell(p.name), p.position, p.pid, this.state.teamId].join(',')).join('\r\n') + '\r\n';
                this.downloadCSV('plantilla_statbench_' + (safeFile(this.state.match.homeTeam) || 'equipo') + '.csv', csv);
            }

            downloadCSV(fileName, csv) {
                this.downloadFile(fileName, '\uFEFF' + csv, 'text/csv;charset=utf-8;');
            }

            updateAudioSettings() {
                const enabledEl = document.getElementById('audio-enabled');
                const intervalEl = document.getElementById('audio-interval');
                if (enabledEl) this.state.audioAlerts.enabled = enabledEl.value === 'true';
                if (intervalEl) this.state.audioAlerts.intervalMinutes = parseInt(intervalEl.value);
                this.saveToStorage();
            }

            updateMatchMeta() {
                const val = id => { const el = document.getElementById(id); return el ? el.value : null; };
                const m = this.state.match;
                const home = val('set-home'), away = val('set-away'), comp = val('set-competition');
                const day = val('set-matchday'), date = val('set-date'), dur = val('set-duration');
                if (home !== null) m.homeTeam = cleanText(home, 40);
                if (away !== null) m.awayTeam = cleanText(away, 40);
                if (comp !== null) m.competition = cleanText(comp, 60);
                if (day !== null) m.matchday = cleanText(day, 10);
                if (date !== null && /^\d{4}-\d{2}-\d{2}$/.test(date)) m.date = date;
                if (dur !== null) {
                    const d = parseInt(dur, 10);
                    if (d >= 1 && d <= 120) m.halfDuration = d;
                }
                this.saveToStorage();
            }

            setMatchCondition(isHome) {
                this.state.match.isHome = isHome;
                this.render();
            }

            startMatch() {
                if (!this.state.matchResetted) {
                    alert('Debes resetear los valores o iniciar un nuevo partido antes de continuar.');
                    return;
                }

                const todo = this.state.squad.filter(p => p.pending && p.status !== 'unconvoked');
                if (todo.length > 0 && !this._skipPending) {
                    this.askConfirm(`${todo.length} jugador(es) convocado(s) tienen el dorsal o la posición sin completar (marcados con ⚠): ${todo.slice(0, 5).map(p => p.name).join(', ')}${todo.length > 5 ? '…' : ''}. ¿Iniciar el partido igualmente?`, () => {
                        this._skipPending = true;
                        try { this.startMatch(); } finally { this._skipPending = false; }
                    }, 'Iniciar igualmente');
                    return;
                }

                const startersCount = this.state.squad.filter(p => p.status === 'starter').length;
                if (startersCount !== 11) {
                    if (!confirm(`Atención: Hay ${startersCount} jugadores titulares seleccionados en lugar de 11. ¿Deseas iniciar el partido de todas formas?`)) {
                        return;
                    }
                }

                const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
                const duration = parseInt(val('set-duration'), 10);
                const date = val('set-date');
                const m = this.state.match;

                m.homeTeam = cleanText(val('set-home'), 40) || 'Equipo Local';
                m.awayTeam = cleanText(val('set-away'), 40) || 'Equipo Visitante';
                m.competition = cleanText(val('set-competition'), 60) || 'Liga Oficial';
                m.matchday = cleanText(val('set-matchday'), 10) || '1';
                m.date = /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : localDate();
                m.halfDuration = (duration >= 1 && duration <= 120) ? duration : 45;
                m.status = 'first_half';
                m.currentHalf = 1;
                m.timerSeconds = 0;
                m.halftimeSeconds = 0;
                m.halftimeStartMs = null;
                m.timerRunning = true;
                m.lastTickMs = Date.now();
                this.state.matchResetted = false;
                this.state.plannedSubs = [];
                m.matchId = newId('m');
                // Guarda la convocatoria inicial para poder empezar otro partido con la misma plantilla
                this.state.squad.forEach(p => { p.initialStatus = p.status; });
                this.autoBackup('inicio de partido');

                this.startTimerInterval();
                this.switchTab('dashboard');
            }

            // El cronómetro se calcula con la hora real (Date.now) y no cuenta "ticks":
            // así no se desfasa si el móvil ralentiza el temporizador o bloquea la pantalla.
            syncTimer() {
                const m = this.state.match;
                if (!m.timerRunning || m.status === 'setup' || m.status === 'halftime' || m.status === 'finished') {
                    m.lastTickMs = null;
                    return;
                }
                const now = Date.now();
                if (!m.lastTickMs || now < m.lastTickMs) { m.lastTickMs = now; return; }
                const delta = Math.floor((now - m.lastTickMs) / 1000);
                if (delta <= 0) return;
                m.lastTickMs += delta * 1000;
                const prev = m.timerSeconds;
                m.timerSeconds += delta;
                this.checkAudioAlerts(prev);
                this.checkPlanned();
            }

            syncHalftime() {
                const m = this.state.match;
                if (m.status !== 'halftime') return;
                if (!m.halftimeStartMs) m.halftimeStartMs = Date.now() - m.halftimeSeconds * 1000;
                m.halftimeSeconds = Math.max(0, Math.floor((Date.now() - m.halftimeStartMs) / 1000));
            }

            refreshTimerDisplay() {
                if (this._needRender) {
                    const mc = document.getElementById('modal-container');
                    if (mc && !mc.innerHTML.trim()) { this._needRender = false; this.render(); return; }
                }
                const t = document.getElementById('match-timer');
                if (t) t.textContent = this.formatTime(this.state.match.timerSeconds);
                const h = document.getElementById('halftime-timer');
                if (h) {
                    this.syncHalftime();
                    h.textContent = this.formatTime(this.state.match.halftimeSeconds);
                }
            }

            startTimerInterval() {
                if (this.timerHandle) clearInterval(this.timerHandle);
                this.timerHandle = setInterval(() => {
                    this.syncTimer();
                    this.refreshTimerDisplay();
                    if (this.state.match.timerRunning) this.saveToStorage();
                }, 1000);
            }

            goToHalftime() {
                const m = this.state.match;
                if (m.status !== 'first_half') return;
                this.syncTimer();
                m.status = 'halftime';
                m.timerRunning = false;
                m.lastTickMs = null;
                if (this.timerHandle) { clearInterval(this.timerHandle); this.timerHandle = null; }
                // El cronómetro del descanso arranca automáticamente
                m.halftimeSeconds = 0;
                m.halftimeStartMs = Date.now();
                this.startHalftimeInterval();
                this.saveToStorage();
                this.render();
            }

            // Por si se pulsa "Ir al descanso" por error: vuelve a la 1ª parte donde se quedó
            cancelHalftime() {
                const m = this.state.match;
                if (m.status !== 'halftime') return;
                if (this.halftimeHandle) { clearInterval(this.halftimeHandle); this.halftimeHandle = null; }
                m.status = 'first_half';
                m.currentHalf = 1;
                m.halftimeSeconds = 0;
                m.halftimeStartMs = null;
                m.timerRunning = true;
                m.lastTickMs = Date.now();
                this.startTimerInterval();
                this.saveToStorage();
                this.render();
            }

            startHalftimeInterval() {
                if (this.halftimeHandle) clearInterval(this.halftimeHandle);
                this.halftimeHandle = setInterval(() => {
                    this.refreshTimerDisplay();
                    this.saveToStorage();
                }, 1000);
            }

            startSecondHalf() {
                this.askConfirm('¿Iniciar la 2ª parte?', () => {
                    if (this.halftimeHandle) { clearInterval(this.halftimeHandle); this.halftimeHandle = null; }
                    const m = this.state.match;
                    m.status = 'second_half';
                    m.currentHalf = 2;
                    m.timerSeconds = m.halfDuration * 60;
                    m.timerRunning = true;
                    m.lastTickMs = Date.now();
                    m.halftimeStartMs = null;
                    this.startTimerInterval();
                    this.render();
                }, 'Iniciar 2ª parte');
            }

            toggleTimer() {
                const m = this.state.match;
                if (m.timerRunning) {
                    this.syncTimer();
                    m.timerRunning = false;
                    m.lastTickMs = null;
                } else {
                    m.timerRunning = true;
                    m.lastTickMs = Date.now();
                    if (!this.timerHandle) this.startTimerInterval();
                }
                this.render();
            }

            finishMatch() {
                this.askConfirm('¿Finalizar el encuentro definitivamente?', () => {
                    this.syncTimer();
                    const m = this.state.match;
                    m.status = 'finished';
                    m.timerRunning = false;
                    m.lastTickMs = null;
                    this.stopTimers();
                    const saved = this.saveMatchToHistory(true);
                    this.autoBackup('fin de partido');
                    if (this.state.prefs.autoDl) this.exportFullBackup(true);
                    this.switchTab('stats');
                    if (saved) this.showToast('Partido guardado en el histórico');
                }, 'Finalizar');
            }

            openCustomAlarmModal() {
                const currentMin = Math.floor(this.state.match.timerSeconds / 60);
                const container = document.getElementById('modal-container');
                container.innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl relative">
                            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            <h3 class="font-bold text-base text-white mb-2 flex items-center gap-1.5"><i class="fa-solid fa-bell text-lasalle-yellow"></i> Alarma de Voz en Partido</h3>
                            <p class="text-xs text-slate-400 mb-3">La aplicación avisará mediante voz al alcanzar el minuto especificado.</p>
                            <div class="space-y-3">
                                <div>
                                    <label class="text-xs text-slate-400">Avisar en el Minuto Exacto</label>
                                    <input type="number" id="alarm-target-min" value="${currentMin + 5}" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1">
                                </div>
                                <button onclick="app.submitCustomAlarm()" class="w-full bg-lasalle-yellow text-lasalle-darkblue font-black py-3 rounded-xl text-sm uppercase">Programar Alarma</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            submitCustomAlarm() {
                const min = parseInt(document.getElementById('alarm-target-min').value);
                if (isNaN(min) || min < 0) {
                    alert('Minuto no válido');
                    return;
                }
                const secTarget = min * 60;
                if (min > 200 || secTarget <= this.state.match.timerSeconds) {
                    alert('El minuto debe ser posterior al momento actual del partido.');
                    return;
                }
                if (!this.state.audioAlerts.customAlarms) this.state.audioAlerts.customAlarms = [];
                this.state.audioAlerts.customAlarms.push(secTarget);
                this.saveToStorage();
                alert(`Alarma de voz fijada para el minuto ${min}.`);
                this.closeModal();
            }

            handleSquadFile(event) {
                const input = event.target;
                const file = input.files && input.files[0];
                input.value = '';
                if (!file) return;
                const isText = /\.(txt|csv)$/i.test(file.name) || file.type === 'text/plain' || file.type === 'text/csv';
                if (!isText) {
                    alert('Formato no admitido. Usa un archivo .txt o .csv, o pega la lista con "Pegar lista de jugadores".');
                    return;
                }
                if (file.size > 1024 * 1024) {
                    alert('El archivo es demasiado grande (máximo 1 MB).');
                    return;
                }
                const reader = new FileReader();
                reader.onload = e => this.parseOCRTextToSquad(String(e.target.result));
                reader.onerror = () => alert('No se pudo leer el archivo.');
                reader.readAsText(file);
            }

            parseOCRTextToSquad(text) {
                if (this.isMatchLive()) { alert('No se puede cambiar la plantilla con un partido en curso o terminado.'); return; }
                this.startImport(text);
            }

                container.innerHTML = `

                                        <i class="fa-solid fa-download"></i> Descargar
                                    </button>
                                    <button onclick="app.openPlayerModal()" class="bg-lasalle-yellow text-lasalle-darkblue font-black px-3 py-1.5 rounded-xl text-xs flex items-center gap-1 shadow">
                                        <i class="fa-solid fa-plus"></i> Añadir
                                    </button>
                                    <button onclick="app.deleteSelectedPlayers()" class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1">
                                        <i class="fa-solid fa-trash"></i> Borrar (${this.state.selectedPlayerIds.size})
                                    </button>
                                </div>
                            </div>

                            <div class="flex-1 overflow-y-auto space-y-2 pr-1" id="squad-list-container">
                                ${this.renderSquadChecklist()}

                            <div class="pt-3 border-t border-slate-800 mt-2">
                                <button onclick="app.closeModal(); app.render();" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl text-xs uppercase">
                                    Guardar y Cerrar
                                </button>
                            </div>
                        </div>
                    </div>
                `;
