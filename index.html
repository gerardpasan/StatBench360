    <script>
        // ===== Utilidades de seguridad y validación =====
        const STORAGE_KEY = 'statbench360_global_v3';
        const POSITIONS = ['POR', 'DEF', 'MED', 'DEL'];
        const PLAYER_STATUSES = ['starter', 'bench', 'unconvoked', 'substituted', 'out'];

        const TABS = ['setup', 'dashboard', 'lineup', 'timeline', 'stats', 'history', 'field'];
        const GOAL_TYPES = ['normal', 'penalty', 'own', 'freekick'];
        const CARD_TYPES = ['yellow', 'second_yellow', 'red'];
        const AWAY_CARD_TYPES = ['Amarilla', 'Roja Directa'];
        // Tipos de evento que modifican marcador, jugadores o ventanas (necesitan datos estructurados para recalcular)
        const EFFECT_TYPES = new Set(['goal', 'own_goal', 'goal_away', 'own_goal_away', 'card', 'sub', 'sub_away']);
        const FORMATIONS = { '4-4-2': [4, 4, 2], '4-3-3': [4, 3, 3], '4-2-3-1': [4, 2, 3, 1], '3-5-2': [3, 5, 2],
            '3-4-3': [3, 4, 3], '4-5-1': [4, 5, 1], '5-3-2': [5, 3, 2], '4-1-4-1': [4, 1, 4, 1] };

        // Escapa texto antes de insertarlo en HTML (contenido y atributos)
        const esc = s => String(s ?? '').replace(/[&<>"']/g,
            c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        // Normaliza texto libre: sin caracteres de control, espacios colapsados y longitud limitada
        const cleanText = (s, max = 60) => String(s ?? '')
            .replace(/[\u0000-\u001F\u007F]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max);

        const toInt = (v, def = 0, min = 0, max = 100000) => {
            const n = Math.floor(Number(v));
            return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : def;
        };

        // Fecha local (toISOString devuelve UTC y falla cerca de medianoche)
        const localDate = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        const newId = prefix => `${prefix}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
        const isSafeId = s => typeof s === 'string' && /^[A-Za-z0-9_-]{1,40}$/.test(s);

        // Celda CSV segura: comillas escapadas y protección contra inyección de fórmulas
        const csvCell = v => {
            let s = String(v ?? '');
            if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
            return '"' + s.replace(/"/g, '""') + '"';
        };

        const safeFile = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40);

        function sanitizePlayer(p) {
            if (!p || typeof p !== 'object') return null;
            const minute = v => (v === null || v === undefined) ? null : toInt(v, 0, 0, 300);
            const nums = a => Array.isArray(a) ? a.slice(0, 50).map(x => toInt(x, 0, 0, 300)) : [];
            return {
                id: isSafeId(p.id) ? p.id : newId('p'),
                pid: isSafeId(p.pid) ? p.pid : newId('pl'),
                name: cleanText(p.name, 40) || 'Jugador',
                number: toInt(p.number, 0, 0, 99),
                position: POSITIONS.includes(p.position) ? p.position : 'MED',
                status: PLAYER_STATUSES.includes(p.status) ? p.status : 'unconvoked',
                initialStatus: PLAYER_STATUSES.includes(p.initialStatus) ? p.initialStatus : undefined,
                inMinute: minute(p.inMinute),
                outMinute: minute(p.outMinute),
                goals: toInt(p.goals, 0, 0, 99),
                goalMinutes: nums(p.goalMinutes),
                goalTypes: Array.isArray(p.goalTypes)
                    ? p.goalTypes.slice(0, 50).map(t => GOAL_TYPES.includes(t) ? t : 'normal') : [],
                assists: toInt(p.assists, 0, 0, 99),
                yellowCards: toInt(p.yellowCards, 0, 0, 2),
                redCard: !!p.redCard,
                captain: !!p.captain,
                pending: !!p.pending,
                subIn: !!p.subIn,
                subInHt: !!p.subInHt,
                subOutHt: !!p.subOutHt
            };
        }

        // Datos estructurados de cada evento (ids de jugador, tipo...). Con ellos se pueden editar/borrar eventos y recalcular.
        function sanitizeEventData(type, d) {
            if (!d || typeof d !== 'object') return null;
            const id = v => isSafeId(v) ? v : '';
            const gt = v => (['normal', 'penalty', 'freekick'].includes(v) ? v : 'normal');
            switch (type) {
                case 'goal': return { scorer: id(d.scorer), assist: id(d.assist), gtype: gt(d.gtype) };
                case 'own_goal': return { scorer: id(d.scorer) };
                case 'goal_away': return { num: cleanText(d.num, 3), gtype: gt(d.gtype) };
                case 'own_goal_away': return { num: cleanText(d.num, 3) };
                case 'card': return { player: id(d.player), ctype: CARD_TYPES.includes(d.ctype) ? d.ctype : 'yellow' };
                case 'card_away': return { num: cleanText(d.num, 3), ctype: AWAY_CARD_TYPES.includes(d.ctype) ? d.ctype : 'Amarilla' };
                case 'sub': return {
                    pairs: (Array.isArray(d.pairs) ? d.pairs.slice(0, 11) : []).map(x => ({ o: id(x && x.o), i: id(x && x.i) })).filter(x => x.o && x.i),
                    counts: !!d.counts, ht: !!d.ht };
                case 'sub_away': return {
                    pairs: (Array.isArray(d.pairs) ? d.pairs.slice(0, 11) : []).map(x => ({ o: cleanText(x && x.o, 3), i: cleanText(x && x.i, 3) })),
                    counts: !!d.counts, ht: !!d.ht };
                case 'note': return { text: cleanText(d.text, 300) };
            }
            return null;
        }

        function sanitizeEvent(e) {
            if (!e || typeof e !== 'object') return null;
            const type = cleanText(e.type, 20);
            return {
                id: isSafeId(e.id) ? e.id : newId('ev'),
                minute: toInt(e.minute, 0, 0, 300),
                type,
                team: cleanText(e.team, 10),
                title: cleanText(e.title, 500),
                detail: cleanText(e.detail, 600),
                d: sanitizeEventData(type, e.d)
            };
        }

        const sanitizeScore = s => ({ local: toInt(s && s.local, 0, 0, 99), rival: toInt(s && s.rival, 0, 0, 99) });
        const sanitizeWindows = w => ({
            home: { used: toInt(w && w.home && w.home.used, 0, 0, 3), max: 3 },
            away: { used: toInt(w && w.away && w.away.used, 0, 0, 3), max: 3 }
        });
        const sanitizeSquad = arr => {
            const seen = new Set();
            const seenPid = new Set();
            return (Array.isArray(arr) ? arr.slice(0, 100) : []).map(sanitizePlayer).filter(Boolean).map(p => {
                if (seen.has(p.id)) p.id = newId('p');
                seen.add(p.id);
                if (seenPid.has(p.pid)) p.pid = newId('pl');
                seenPid.add(p.pid);
                return p;
            });
        };

        // Valida y reconstruye todo el estado leído de localStorage (nunca se confía en él)
        function sanitizeState(raw) {
            if (!raw || typeof raw !== 'object') return null;
            const m = (raw.match && typeof raw.match === 'object') ? raw.match : {};
            const a = (raw.audioAlerts && typeof raw.audioAlerts === 'object') ? raw.audioAlerts : {};
            const ts = v => (Number.isFinite(Number(v)) && Number(v) > 0) ? Number(v) : null;
            const squad = sanitizeSquad(raw.squad);
            const ids = new Set(squad.map(p => p.id));
            const pr = (raw.prefs && typeof raw.prefs === 'object') ? raw.prefs : {};
            const plannedSubs = (Array.isArray(raw.plannedSubs) ? raw.plannedSubs.slice(0, 20) : [])
                .map(x => (x && typeof x === 'object') ? {
                    id: isSafeId(x.id) ? x.id : newId('ps'), min: toInt(x.min, 0, 0, 200),
                    out: isSafeId(x.out) ? x.out : '', in: isSafeId(x.in) ? x.in : '',
                    counts: x.counts !== false, status: x.status === 'due' ? 'due' : 'pending' } : null)
                .filter(x => x && x.out && x.in);
            return {
                currentTab: TABS.includes(raw.currentTab) ? raw.currentTab : 'setup',
                selectedPlayerIds: new Set((Array.isArray(raw.selectedPlayerIds) ? raw.selectedPlayerIds : []).filter(id => ids.has(id))),
                matchResetted: raw.matchResetted !== false,
                audioAlerts: {
                    enabled: a.enabled !== false,
                    intervalMinutes: toInt(a.intervalMinutes, 5, 1, 60),
                    customAlarms: (Array.isArray(a.customAlarms) ? a.customAlarms.slice(0, 50) : []).map(x => toInt(x, 0, 0, 20000))
                },
                match: {
                    isHome: m.isHome !== false,
                    homeTeam: cleanText(m.homeTeam, 40) || 'Equipo Local',
                    awayTeam: cleanText(m.awayTeam, 40) || 'Equipo Visitante',
                    date: /^\d{4}-\d{2}-\d{2}$/.test(m.date) ? m.date : localDate(),
                    matchday: cleanText(m.matchday, 10) || '1',
                    competition: cleanText(m.competition, 60) || 'Liga Oficial',
                    halfDuration: toInt(m.halfDuration, 45, 1, 120),
                    status: MATCH_STATUSES.includes(m.status) ? m.status : 'setup',
                    currentHalf: m.currentHalf === 2 ? 2 : 1,
                    timerSeconds: toInt(m.timerSeconds, 0, 0, 20000),
                    halftimeSeconds: toInt(m.halftimeSeconds, 0, 0, 20000),
                    timerRunning: !!m.timerRunning,
                    lastTickMs: ts(m.lastTickMs),
                    halftimeStartMs: ts(m.halftimeStartMs),
                    matchId: isSafeId(m.matchId) ? m.matchId : null
                },
                score: sanitizeScore(raw.score),
                windows: sanitizeWindows(raw.windows),
                squad,
                teamId: isSafeId(raw.teamId) ? raw.teamId : newId('tm'),
                events: (Array.isArray(raw.events) ? raw.events.slice(0, 500) : []).map(sanitizeEvent).filter(Boolean),

                formation: FORMATIONS[raw.formation] ? raw.formation : '4-4-2',
                prefs: { wake: pr.wake !== false, vibrate: pr.vibrate !== false, autoDl: !!pr.autoDl }
            };
        }

        // ===== Histórico de partidos =====
        const HISTORY_KEY = 'statbench360_history_v1';
        const MAX_HISTORY = 200;
        const PIN_KEY = 'statbench360_pin_v1';
        const TOUR_KEY = 'statbench360_tour_v1';

            { icon: 'fa-users', title: '1. Prepara la plantilla', text: 'En Inicio añade tus jugadores: pega una lista (basta con los nombres), sube un archivo .txt/.csv, o créalos a mano. Después completa dorsal y posición con el lápiz y elige titulares y suplentes.' },

            { icon: 'fa-bolt', title: '3. Registro rápido', text: 'En Directo, un toque en Gol nuestro, Gol rival o Tarjeta lo guarda con el minuto actual. Si te equivocas, el aviso te deja Deshacer o añadir asistencia y detalles.' },

            { icon: 'fa-right-left', title: '5. Cambios y ventanas', text: 'Puedes hacer varios cambios en una sola ventana, o cambios que no cuentan ventana. Con "Planificar cambio" la app te avisa al llegar al minuto elegido y lo confirmas con un toque.' },
            { icon: 'fa-mug-hot', title: '6. Descanso y final', text: '"Ir al Descanso" cuenta el tiempo de descanso y reanuda la 2ª parte. Al finalizar, el partido se guarda solo en el histórico.' },
            { icon: 'fa-timeline', title: '7. Cronología editable', text: 'Todos los sucesos aparecen en la Cronología. Puedes editar o borrar cualquiera (no solo el último) y el marcador y las estadísticas se recalculan solos.' },

        ];
        const BACKUP_KEY = 'statbench360_backups_v1';

        function sanitizeHistoryEntry(e) {
            if (!e || typeof e !== 'object' || !isSafeId(e.id)) return null;
            const m = (e.match && typeof e.match === 'object') ? e.match : {};
            return {
                id: e.id,
                savedAt: toInt(e.savedAt, Date.now(), 0, 8.64e15),
                match: {
                    homeTeam: cleanText(m.homeTeam, 40) || 'Equipo Local',
                    awayTeam: cleanText(m.awayTeam, 40) || 'Equipo Visitante',

                },

                players: (Array.isArray(e.players) ? e.players.slice(0, 100) : []).filter(p => p && typeof p === 'object').map(p => ({
                    pid: isSafeId(p.pid) ? p.pid : '',
                    number: toInt(p.number, 0, 0, 99),
                    name: cleanText(p.name, 40) || 'Jugador',
                    position: POSITIONS.includes(p.position) ? p.position : 'MED',
                    captain: !!p.captain,
                    mins: toInt(p.mins, 0, 0, 300),
                    goals: toInt(p.goals, 0, 0, 99),
                    assists: toInt(p.assists, 0, 0, 99),
                    yellow: toInt(p.yellow, 0, 0, 2),
                    red: !!p.red,
                    inMinute: (p.inMinute === null || p.inMinute === undefined) ? null : toInt(p.inMinute, 0, 0, 300),
                    outMinute: (p.outMinute === null || p.outMinute === undefined) ? null : toInt(p.outMinute, 0, 0, 300)
                })),
                events: (Array.isArray(e.events) ? e.events.slice(0, 500) : []).map(sanitizeEvent).filter(Boolean)
            };
        }

        // ---------- Lectura de listas de jugadores pegadas (el texto externo NUNCA se inserta como HTML) ----------
        const LETTERS = /[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]{2,}/;
        const looksLikeHtml = s => /<\s*(html|body|table|tr|td|a|div|ul|li)\b/i.test(s);

        function prettyName(s) {
            let n = cleanText(s, 60);
            if (/^[^,]+,[^,]+$/.test(n)) { const [a, b] = n.split(','); n = b.trim() + ' ' + a.trim(); }
            if (n === n.toUpperCase()) {
                n = n.toLocaleLowerCase('es').replace(/(^|[\s\-'’])(\p{L})/gu, (m, p, c) => p + c.toLocaleUpperCase('es'));
            }
            return cleanText(n, 40);
        }

        // Líneas de texto -> filas de celdas (con tabuladores se respetan las celdas vacías para no desplazar columnas)
        function textRows(str) {
            const rows = [];
            String(str).replace(/^\uFEFF/, '').split(/\r?\n/).slice(0, 3000).forEach(line => {
                const cells = (line.includes('\t') ? line.split('\t') : line.split(/ {2,}/)).map(c => cleanText(c, 120));
                if (!line.includes('\t')) { for (let i = cells.length - 1; i >= 0; i--) if (!cells[i]) cells.splice(i, 1); }
                if (cells.some(Boolean)) rows.push({ cells, header: false });
            });
            return rows;
        }

        // Convierte lo pegado (texto, tabla copiada o HTML) en filas de celdas; DOMParser no ejecuta scripts ni carga recursos
        function extractRows(src) {
            if (!looksLikeHtml(src)) return textRows(src);
            const doc = new DOMParser().parseFromString(src, 'text/html');
            const rows = [];
            doc.querySelectorAll('tr').forEach(tr => {
                if (tr.querySelector('table')) return;
                const cells = Array.from(tr.querySelectorAll('th,td'));
                if (!cells.length) return;
                rows.push({ cells: cells.map(c => cleanText(c.textContent, 120)), header: cells.every(c => c.tagName === 'TH') });
            });
            return rows.length ? rows : textRows(doc.body ? doc.body.textContent : '');
        }

        function parseSquadText(src) {
            const rows = extractRows(src);
            const POS_MAP = [[/porter[oa]|guardameta|\bPOR\b/i, 'POR'], [/defensa|central|lateral|\bDEF\b/i, 'DEF'],
                [/centrocamp|medio|pivote|\bMED\b/i, 'MED'], [/delanter[oa]|extrem[oa]|punta|\bDEL\b/i, 'DEL']];
            const posOf = t => { for (const [re, v] of POS_MAP) if (re.test(t)) return v; return null; };
            const STAFF = /entrenador|delegad|auxiliar|t[eé]cnico|fisio|preparador|m[eé]dico|utiller/i;
            const NOT_NAME = /^(total|jugadores?|jugadoras?|plantilla|equipo|nombre|dorsal|posici[oó]n|licencia|fecha|baja|alta|activo|activa)$/i;
            const players = [];
            const seenNames = new Set();
            let cols = null;

            const push = (num, rawName, pos) => {
                if (!rawName || NOT_NAME.test(rawName) || /\d{2}[\/.-]\d{2}[\/.-]\d{2,4}/.test(rawName)) return;
                const name = prettyName(rawName);
                if (name.length < 3 || !LETTERS.test(name)) return;
                const key = name.toLowerCase();
                if (seenNames.has(key)) return;
                seenNames.add(key);
                players.push({ num, name, pos, posGiven: !!pos });
            };

            rows.forEach(r => {
                const cells = r.cells;
                const iName = cells.findIndex(t => /^(jugador|jugadora|nombre|nombre y apellidos|apellidos y nombre|apellidos)$/i.test(t));
                if (iName >= 0) {
                    cols = {
                        name: iName,
                        num: cells.findIndex(t => /^(dorsal|n[º°o]\.?|n[úu]m(ero)?\.?|#)$/i.test(t)),
                        pos: cells.findIndex(t => /posici[oó]n|demarcaci[oó]n/i.test(t))
                    };
                    return;
                }
                if (r.header || cells.some(t => STAFF.test(t))) return;

                if (cells.length === 1) {   // "9 Juan Pérez"  o solo el nombre: "Juan Pérez"
                    const line = cells[0].replace(/^[\-•*·–—▪●]+\s*/, '');
                    const m = line.match(/^(\d{1,2})(?!\d)\s*[.\-,;)]?\s*(.+)$/);
                    if (m) push(parseInt(m[1], 10), m[2], posOf(m[2]));
                    else if (line.length <= 50 && !/[:@\/]/.test(line)) push(null, line, posOf(line));
                    return;
                }
                let num = null, name = '', pos = null;
                if (cols && cells.length > cols.name) {
                    if (cols.num >= 0 && /^\d{1,2}$/.test(cells[cols.num] || '')) num = parseInt(cells[cols.num], 10);
                    name = cells[cols.name];
                    if (cols.pos >= 0) pos = posOf(cells[cols.pos] || '');
                } else {
                    const iN = cells.findIndex(t => /^\d{1,2}$/.test(t));
                    if (iN >= 0) num = parseInt(cells[iN], 10);
                    const cand = cells.filter((t, i) => i !== iN && LETTERS.test(t) && !posOf(t) && !/^\d/.test(t));
                    name = cand.sort((a, b) => b.length - a.length)[0] || '';
                    for (const t of cells) pos = pos || posOf(t);
                }
                push(num, name, pos);
            });

            // Dorsales: se respetan los de la lista; si faltan o se repiten se asignan los primeros libres
            const used = new Set();
            const out = players.slice(0, 60);
            out.forEach(p => { p.auto = false; if (p.num !== null && p.num <= 99 && !used.has(p.num)) used.add(p.num); else p.num = null; });
            let next = 1;
            out.forEach(p => {
                if (p.num === null) {
                    while (used.has(next) && next < 99) next++;
                    p.num = next; used.add(next); p.auto = true;
                }
                if (!p.pos) p.pos = (!p.auto && p.num === 1) ? 'POR' : 'MED';
            });
            return out;
        }

        class FutStatApp {
            constructor() {
                this.state = {
                    currentTab: 'setup',
                    selectedPlayerIds: new Set(),
                    matchResetted: true,
                    audioAlerts: {
                        enabled: true,
                        intervalMinutes: 5,
                        customAlarms: []
                    },
                    match: {
                        isHome: true,
                        homeTeam: 'Equipo Local',
                        awayTeam: 'Equipo Visitante',
                        date: localDate(),
                        matchday: '1',
                        competition: 'Liga Oficial',
                        halfDuration: 45,
                        status: 'setup',
                        currentHalf: 1,
                        timerSeconds: 0,
                        halftimeSeconds: 0,
                        timerRunning: false,
                        lastTickMs: null,
                        halftimeStartMs: null,
                        matchId: null
                    },
                    score: { local: 0, rival: 0 },
                    windows: {
                        home: { used: 0, max: 3 },
                        away: { used: 0, max: 3 }
                    },
                    squad: [],
                    teamId: newId('tm'),
                    events: [],
                    plannedSubs: [],
                    formation: '4-4-2',
                    prefs: { wake: true, vibrate: true, autoDl: false }
                };

                this.timerHandle = null;
                this.halftimeHandle = null;
                // Al volver a la app (pantalla bloqueada, otra pestaña) el cronómetro se pone al día
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) { this.syncTimer(); this.refreshTimerDisplay(); this.updateWake(); }
                });

                this.loadFromStorage();
                this.initApp();
            }

            initApp() {
                this.initLock();
                const st = this.state.match.status;
                if (st !== 'setup') {
                    this.switchTab(st === 'finished' ? 'stats' : 'dashboard');
                    if (st === 'first_half' || st === 'second_half') this.startTimerInterval();
                    if (st === 'halftime') this.startHalftimeInterval();
                } else {
                    this.switchTab('setup');
                }
                setTimeout(() => this.maybeStartTour(), 700);
            }

            saveToStorage() {
                try {
                    const toSave = { ...this.state, selectedPlayerIds: Array.from(this.state.selectedPlayerIds) };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
                } catch (e) { console.error(e); }
            }

            loadFromStorage() {
                try { localStorage.removeItem('statbench360_ffib_v1'); } catch (e) { /* se ignora */ }
                let saved = null;
                try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) { console.error(e); }
                if (saved) {
                    try {
                        const clean = sanitizeState(JSON.parse(saved));
                        if (clean) { this.state = clean; return; }
                    } catch (e) { console.error('Datos guardados no válidos, se usan los de ejemplo.', e); }
                }
                this.state.selectedPlayerIds = new Set();
                this.loadDefaultData();
            }

            loadDefaultData() {
                const defaultNames = Array.from({length: 22}, (_, i) => ({
                    name: `Jugador ${i + 1}`,
                    pos: i === 0 ? 'POR' : (i < 5 ? 'DEF' : (i < 12 ? 'MED' : 'DEL')),
                    num: i + 1
                }));

                this.state.squad = defaultNames.map((p, i) => ({
                    id: 'p_' + i,
                    pid: newId('pl'),
                    name: p.name,
                    number: p.num,
                    position: p.pos,
                    status: i < 11 ? 'starter' : (i < 18 ? 'bench' : 'unconvoked'),
                    inMinute: i < 11 ? 0 : null,
                    outMinute: null,
                    goals: 0, 
                    goalMinutes: [], 
                    goalTypes: [],
                    assists: 0, 
                    yellowCards: 0, 
                    redCard: false, 
                    captain: i === 0
                }));
                this.state.match.homeTeam = 'Equipo Local';
                this.state.match.awayTeam = 'Equipo Visitante';
                this.state.match.matchday = '1';
                this.state.match.competition = 'Liga Oficial';
                this.state.matchResetted = true;
            }

            speak(text) {
                if (!('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }

            checkAudioAlerts(prevSecs) {
                const m = this.state.match;
                if (m.status === 'setup' || m.status === 'halftime') return;

                const cur = m.timerSeconds;
                const alerts = this.state.audioAlerts;
                const messages = [];

                // Aviso periódico: se dispara al cruzar un minuto múltiplo del intervalo (aunque se pierda algún tick)
                const curMin = Math.floor(cur / 60);
                const interval = parseInt(alerts.intervalMinutes) || 5;
                if (alerts.enabled && curMin > 0 && curMin !== Math.floor(prevSecs / 60) && curMin % interval === 0) {
                    messages.push(`Minuto ${curMin}`);
                }

                // Alarmas puntuales: se disparan al alcanzar o superar el segundo programado
                if (Array.isArray(alerts.customAlarms) && alerts.customAlarms.length > 0) {
                    const due = alerts.customAlarms.filter(s => s <= cur);
                    if (due.length > 0) {
                        alerts.customAlarms = alerts.customAlarms.filter(s => s > cur);
                        messages.push(`Atención. Alerta programada en el minuto ${Math.floor(Math.max(...due) / 60)}`);
                    }
                }

                if (messages.length > 0) this.speak(messages.join('. '));
            }

            goHomeTab() {
                this.state.currentTab = 'setup';
                this.render();
            }

            resetCurrentValues() {
                if (!confirm('¿Resetear el partido actual (marcador, eventos, cronómetro y estadísticas)?')) return;
                const keepSquad = !confirm('¿Quieres también BORRAR la plantilla y volver a la de ejemplo?\n\nAceptar = borrar la plantilla\nCancelar = mantener la plantilla');

                this.autoBackup('antes de resetear');
                this.stopTimers();
                const m = this.state.match;
                m.status = 'setup';
                m.currentHalf = 1;
                m.timerSeconds = 0;
                m.halftimeSeconds = 0;
                m.timerRunning = false;
                m.lastTickMs = null;
                m.halftimeStartMs = null;
                m.matchId = null;

                this.state.score = { local: 0, rival: 0 };
                this.state.windows = { home: { used: 0, max: 3 }, away: { used: 0, max: 3 } };
                this.state.events = [];
                this.state.plannedSubs = [];
                this.state.audioAlerts.customAlarms = [];
                m.homeTeam = 'Equipo Local';
                m.awayTeam = 'Equipo Visitante';
                m.matchday = '1';
                m.competition = 'Liga Oficial';
                m.date = localDate();
                this.state.selectedPlayerIds.clear();
                this.state.matchResetted = true;

                if (keepSquad) this.resetSquadStats();
                else this.loadDefaultData();
                this.switchTab('setup');
            }

            // Nuevo partido conservando la plantilla: vuelve a la convocatoria inicial y pone las estadísticas a cero
            resetSquadStats() {
                this.state.squad.forEach(p => {
                    const status = p.initialStatus || (['substituted', 'out'].includes(p.status) ? 'bench' : p.status);
                    p.status = status;
                    p.inMinute = status === 'starter' ? 0 : null;
                    p.outMinute = null;
                    p.subIn = false;
                    p.subInHt = false;
                    p.subOutHt = false;
                    p.goals = 0;
                    p.goalMinutes = [];
                    p.goalTypes = [];
                    p.assists = 0;
                    p.yellowCards = 0;
                    p.redCard = false;
                    delete p.initialStatus;
                });
            }

            askConfirm(message, onYes, yesLabel = 'Aceptar') {
                this._confirmCb = onYes;
                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl">
                            <p class="text-sm text-white mb-4">${esc(message)}</p>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="app.closeModal()" class="bg-slate-800 text-slate-200 font-bold py-2.5 rounded-xl text-sm">Cancelar</button>
                                <button onclick="app.runConfirm()" class="bg-lasalle-yellow text-lasalle-darkblue font-black py-2.5 rounded-xl text-sm">${esc(yesLabel)}</button>
                            </div>
                        </div>
                    </div>`;
            }

            runConfirm() {
                const cb = this._confirmCb;
                this._confirmCb = null;
                this.closeModal();
                if (cb) cb();
            }

            stopTimers() {
                if (this.timerHandle) { clearInterval(this.timerHandle); this.timerHandle = null; }
                if (this.halftimeHandle) { clearInterval(this.halftimeHandle); this.halftimeHandle = null; }
            }

            // ============================ EVENTOS (núcleo) ============================
            curMin() { return Math.floor(this.state.match.timerSeconds / 60); }

            pName(id) {
                const p = this.state.squad.find(x => x.id === id);
                return p ? `#${p.number} ${p.name}` : 'jugador eliminado';
            }

            whoRival(num) { return `${this.rivalName()} ${num ? '(#' + num + ')' : ''}`.trim(); }

            goalLabel(g) { return g === 'penalty' ? ' (Penalti)' : (g === 'freekick' ? ' (Falta Directa)' : ''); }

            hasLegacyEvents() { return this.state.events.some(e => EFFECT_TYPES.has(e.type) && !e.d); }

            canModify(ev) {
                if (!EFFECT_TYPES.has(ev.type)) return true;
                return !!ev.d && !this.hasLegacyEvents();
            }

            // Aplica un evento al estado y (re)genera su texto. Se usa tanto al registrar como al recalcular.
            applyEvent(ev) {
                const s = this.state, d = ev.d;
                if (!d) return;
                const P = id => s.squad.find(p => p.id === id);
                const min = ev.minute;
                let title = '', detail = `Minuto ${min}'`;
                switch (ev.type) {
                    case 'goal': {
                        const sc = P(d.scorer), as = P(d.assist);
                        if (sc) { sc.goals++; sc.goalMinutes.push(min); sc.goalTypes.push(d.gtype); }
                        if (as && as.id !== d.scorer) as.assists++;
                        s.score.local++;
                        title = `Gol ${this.pName(d.scorer)}${this.goalLabel(d.gtype)}`;
                        detail = as ? `Asistencia: ${this.pName(d.assist)}` : 'Sin asistencia';
                        break;
                    }
                    case 'own_goal':
                        s.score.rival++;
                        title = `Gol en propia puerta de ${this.pName(d.scorer)} (suma para el rival)`;
                        break;
                    case 'goal_away':
                        s.score.rival++;
                        title = `Gol de ${this.whoRival(d.num)}${this.goalLabel(d.gtype)}`;
                        break;
                    case 'own_goal_away':
                        s.score.local++;
                        title = `Gol en propia puerta de ${this.whoRival(d.num)} (suma para nuestro equipo)`;
                        break;
                    case 'card': {
                        const p = P(d.player);
                        if (p) {
                            if (d.ctype === 'yellow') p.yellowCards++;
                            else if (d.ctype === 'second_yellow') { p.yellowCards++; p.redCard = true; p.status = 'out'; p.outMinute = min; }
                            else { p.redCard = true; p.status = 'out'; p.outMinute = min; }
                        }
                        const label = d.ctype === 'second_yellow' ? 'Doble Amarilla (Expulsión)' : (d.ctype === 'red' ? 'Roja Directa' : 'Tarjeta Amarilla');
                        title = `${label} a ${this.pName(d.player)}`;
                        break;
                    }
                    case 'card_away':
                        title = `Tarjeta ${d.ctype} a ${this.whoRival(d.num)}`;
                        break;
                    case 'sub': {
                        d.pairs.forEach(({ o, i }) => {
                            const po = P(o), pi = P(i);
                            if (po) { po.status = 'substituted'; po.outMinute = min; po.subOutHt = !!d.ht; }
                            if (pi) { pi.status = 'starter'; pi.inMinute = min; pi.subIn = true; pi.subInHt = !!d.ht; }
                        });
                        if (d.counts) s.windows.home.used++;
                        const lines = d.pairs.map(({ o, i }) => `Entra ${this.pName(i)} / Sale ${this.pName(o)}`);
                        const ht = d.ht ? ' en el descanso' : '';
                        title = lines.length === 1 ? `Cambio${ht}: ${lines[0]}` : `Cambio múltiple${ht} (${lines.length}): ${lines.join(' · ')}`;
                        detail = d.counts ? `${d.ht ? 'Descanso · ' : ''}Ventana Local #${s.windows.home.used}` : (d.ht ? 'Descanso (sin ventana)' : 'Cambio sin ventana');
                        break;
                    }
                    case 'sub_away': {
                        if (d.counts) s.windows.away.used++;
                        const lines = d.pairs.map(x => `Entra #${x.i || '?'} / Sale #${x.o || '?'}`);
                        const ht = d.ht ? ' en el descanso' : '';
                        title = lines.length <= 1
                            ? `Cambio${ht} ${this.rivalName()}: ${lines[0] || 'Entra #? / Sale #?'}`
                            : `Cambio múltiple${ht} ${this.rivalName()} (${lines.length}): ${lines.join(' · ')}`;
                        if (d.counts) detail = d.ht ? `Descanso · Ventana Rival #${s.windows.away.used}` : `Ventana Rival #${s.windows.away.used} (Min ${min}')`;
                        else detail = d.ht ? 'Descanso (sin ventana)' : `Cambio sin ventana (Min ${min}')`;
                        break;
                    }
                    case 'note':
                        title = 'Nota / Comentario';
                        detail = `${d.text} (Min ${min}')`;
                        break;
                    default: return;
                }
                ev.title = title;
                ev.detail = detail;
            }

            // Vuelve a calcular marcador, ventanas y estadísticas de jugadores repitiendo todos los eventos
            recompute() {
                const s = this.state;
                s.squad.forEach(p => {
                    const st = p.initialStatus || (p.status === 'unconvoked' ? 'unconvoked' : 'bench');
                    p.status = st;
                    p.inMinute = st === 'starter' ? 0 : null;
                    p.outMinute = null;
                    p.subIn = false; p.subInHt = false; p.subOutHt = false;
                    p.goals = 0; p.goalMinutes = []; p.goalTypes = []; p.assists = 0;
                    p.yellowCards = 0; p.redCard = false;
                });
                s.score = { local: 0, rival: 0 };
                s.windows = { home: { used: 0, max: 3 }, away: { used: 0, max: 3 } };
                s.events.map((e, i) => [e, i]).sort((a, b) => a[0].minute - b[0].minute || a[1] - b[1])
                    .forEach(([e]) => this.applyEvent(e));
            }

            addEvent(type, team, minute, d) {
                const ev = { id: newId('ev'), minute: toInt(minute, 0, 0, 300), type, team, title: '', detail: '', d };
                const legacy = this.hasLegacyEvents();
                this.state.events.push(ev);
                if (legacy) this.applyEvent(ev); else this.recompute();
                this.afterEventChange();
                return ev;
            }

            afterEventChange() {
                this.vibrate(35);
                if (this.state.match.status === 'finished') this.saveMatchToHistory(true);
            }

            // ----- Deshacer / borrar -----
            lastEvent() { return this.state.events[this.state.events.length - 1] || null; }

            renderUndoButton() {
                const last = this.lastEvent();
                if (!last || this.state.match.status === 'finished') return '';
                return `<button onclick="app.undoLastEvent()" class="w-full bg-slate-900 border border-rose-500/40 text-rose-300 font-bold py-2 px-3 rounded-xl text-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-left"></i> Deshacer último: <span class="truncate max-w-[200px]">${esc(last.title || 'evento')}</span>
                </button>`;
            }

            undoLastEvent() {
                const last = this.lastEvent();
                if (!last) return;
                this.deleteEvent(last.id);
            }

            undoEventNow(id) {
                this.hideActionToast();
                this.removeEvent(id);
            }

            deleteEvent(id) {
                const ev = this.state.events.find(e => e.id === id);
                if (!ev) return;
                if (!this.canModify(ev)) {
                    alert('Este suceso se registró con una versión anterior de la app y no se puede borrar de forma segura. Puedes dejarlo tal cual o resetear el partido.');
                    return;
                }
                this.askConfirm(`¿Borrar "${ev.title}"? Se recalcularán el marcador y las estadísticas.`, () => this.removeEvent(id), 'Borrar');
            }

            removeEvent(id) {
                const ev = this.state.events.find(e => e.id === id);
                if (!ev || !this.canModify(ev)) return;
                this.state.events = this.state.events.filter(e => e.id !== id);
                if (!this.hasLegacyEvents()) this.recompute();
                this.afterEventChange();
                this.render();
            }

            // ----- Editar un suceso -----
            openEditEvent(id) {
                const ev = this.state.events.find(e => e.id === id);
                if (!ev) return;
                if (!ev.d || this.hasLegacyEvents()) {
                    alert('Este suceso se registró con una versión anterior de la app y no se puede editar. Puedes borrarlo si no afecta al marcador, o resetear el partido.');
                    return;
                }
                const d = ev.d;
                const convoked = this.state.squad.filter(p => (p.initialStatus || p.status) !== 'unconvoked').sort((a, b) => a.number - b.number);
                const opts = sel => convoked.map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>#${esc(p.number)} ${esc(p.name)}</option>`).join('');
                const cls = 'w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1';
                const sel = (idn, label, html) => `<div><label class="text-xs text-slate-400">${label}</label><select id="${idn}" class="${cls}">${html}</select></div>`;
                const gtypes = cur => [['normal', 'Jugada Normal'], ['penalty', 'Penalti'], ['freekick', 'Falta Directa']]
                    .map(([v, l]) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${l}</option>`).join('');
                const numIn = v => `<div><label class="text-xs text-slate-400">Dorsal del rival (opcional)</label><input type="text" id="ee-num" maxlength="3" value="${esc(v)}" class="${cls}"></div>`;
                let fields = '';
                switch (ev.type) {
                    case 'goal':
                        fields = sel('ee-scorer', 'Goleador', opts(d.scorer))
                            + sel('ee-assist', 'Asistencia', `<option value="">Sin asistencia</option>${opts(d.assist)}`)
                            + sel('ee-gtype', 'Tipo de gol', gtypes(d.gtype));
                        break;
                    case 'own_goal': fields = sel('ee-scorer', 'Jugador (propia puerta)', opts(d.scorer)); break;
                    case 'goal_away': fields = numIn(d.num) + sel('ee-gtype', 'Tipo de gol', gtypes(d.gtype)); break;
                    case 'own_goal_away': fields = numIn(d.num); break;
                    case 'card':
                        fields = sel('ee-player', 'Jugador', opts(d.player))
                            + sel('ee-ctype', 'Tarjeta', [['yellow', 'Amarilla'], ['second_yellow', 'Doble Amarilla (Expulsión)'], ['red', 'Roja Directa']]
                                .map(([v, l]) => `<option value="${v}" ${d.ctype === v ? 'selected' : ''}>${l}</option>`).join(''));
                        break;
                    case 'card_away':
                        fields = numIn(d.num) + sel('ee-ctype', 'Tarjeta', AWAY_CARD_TYPES.map(v => `<option value="${v}" ${d.ctype === v ? 'selected' : ''}>${v}</option>`).join(''));
                        break;
                    case 'sub':
                    case 'sub_away':
                        fields = `<p class="text-[11px] text-slate-400">Para cambiar los jugadores del cambio, bórralo y regístralo de nuevo.</p>
                            <label class="flex items-start gap-2 text-xs text-slate-300 bg-slate-950 border border-slate-800 rounded-xl p-2.5">
                                <input type="checkbox" id="ee-counts" class="mt-0.5" ${d.counts ? 'checked' : ''}><span>Cuenta como ventana de cambios</span></label>`;
                        break;
                    case 'note':
                        fields = `<div><label class="text-xs text-slate-400">Comentario</label><textarea id="ee-text" maxlength="300" class="${cls} h-24 resize-none">${esc(d.text)}</textarea></div>`;
                        break;
                }
                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm max-h-[92vh] overflow-y-auto rounded-3xl p-5 shadow-2xl relative space-y-3">
                            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            <h3 class="font-bold text-base text-white pr-6">Editar suceso</h3>
                            <p class="text-[11px] text-slate-400">${esc(ev.title)}</p>
                            ${fields}
                            <div><label class="text-xs text-slate-400">Minuto</label><input type="number" id="ee-min" value="${ev.minute}" min="0" max="200" class="${cls}"></div>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="app.closeModal(); app.deleteEvent('${ev.id}')" class="bg-rose-600/30 text-rose-300 border border-rose-500/40 font-bold py-2.5 rounded-xl text-sm">Borrar</button>
                                <button onclick="app.submitEditEvent('${ev.id}')" class="bg-lasalle-yellow text-lasalle-darkblue font-black py-2.5 rounded-xl text-sm">Guardar</button>
                            </div>
                        </div>
                    </div>`;
            }

            submitEditEvent(id) {
                const ev = this.state.events.find(e => e.id === id);
                if (!ev || !ev.d || this.hasLegacyEvents()) return;
                const v = i => { const el = document.getElementById(i); return el ? el.value : ''; };
                const d = ev.d;
                switch (ev.type) {
                    case 'goal':
                        if (v('ee-assist') && v('ee-assist') === v('ee-scorer')) { alert('Un jugador no puede anotar el gol y darse la asistencia a sí mismo.'); return; }
                        d.scorer = v('ee-scorer'); d.assist = v('ee-assist'); d.gtype = ['normal', 'penalty', 'freekick'].includes(v('ee-gtype')) ? v('ee-gtype') : 'normal';
                        break;
                    case 'own_goal': d.scorer = v('ee-scorer'); break;
                    case 'goal_away': d.num = cleanText(v('ee-num'), 3); d.gtype = ['normal', 'penalty', 'freekick'].includes(v('ee-gtype')) ? v('ee-gtype') : 'normal'; break;
                    case 'own_goal_away': d.num = cleanText(v('ee-num'), 3); break;
                    case 'card': d.player = v('ee-player'); d.ctype = CARD_TYPES.includes(v('ee-ctype')) ? v('ee-ctype') : 'yellow'; break;
                    case 'card_away': d.num = cleanText(v('ee-num'), 3); d.ctype = AWAY_CARD_TYPES.includes(v('ee-ctype')) ? v('ee-ctype') : 'Amarilla'; break;
                    case 'sub':
                    case 'sub_away': {
                        const counts = !!(document.getElementById('ee-counts') || {}).checked;
                        const key = ev.type === 'sub' ? 'home' : 'away';
                        const used = this.state.events.filter(e => e.type === ev.type && e.id !== ev.id && e.d && e.d.counts).length;
                        if (counts && !d.counts && used >= 3) { alert('Ya hay 3 ventanas usadas: no se puede contar otra.'); return; }
                        d.counts = counts;
                        break;
                    }
                    case 'note': { const txt = cleanText(v('ee-text'), 300); if (!txt) { alert('Escribe el comentario.'); return; } d.text = txt; break; }
                }
                ev.minute = toInt(v('ee-min'), ev.minute, 0, 200);
                this.recompute();
                this.afterEventChange();
                this.closeModal();
                this.render();
            }

            // ============================ AVISO CON ACCIONES ============================
            showActionToast(msg, evId) {
                let el = document.getElementById('toast-action');
                if (!el) {
                    el = document.createElement('div');
                    el.id = 'toast-action';
                    el.className = 'fixed left-1/2 -translate-x-1/2 bottom-24 z-[60] bg-slate-800 border border-lasalle-yellow/50 text-white text-xs rounded-2xl shadow-2xl w-[92vw] max-w-sm p-3 space-y-2';
                    document.body.appendChild(el);
