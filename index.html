                el.innerHTML = `<div class="font-bold">${esc(msg)}</div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="app.hideActionToast(); app.openEditEvent('${evId}')" class="bg-slate-700 py-2 rounded-xl font-bold">Añadir detalle / editar</button>
                        <button onclick="app.undoEventNow('${evId}')" class="bg-rose-700/80 py-2 rounded-xl font-bold">Deshacer</button>
                    </div>`;
                el.style.display = 'block';
                clearTimeout(this._atTimer);
                this._atTimer = setTimeout(() => this.hideActionToast(), 8000);
            }

            hideActionToast() {
                const el = document.getElementById('toast-action');
                if (el) el.style.display = 'none';
            }

            // ============================ TOQUES RÁPIDOS ============================
            isLive() { return ['first_half', 'second_half', 'halftime'].includes(this.state.match.status); }

            quickGoal(playerId) {
                const p = this.state.squad.find(x => x.id === playerId);
                if (!p || p.status !== 'starter') return;
                this.closeModal();
                const ev = this.addEvent('goal', 'local', this.curMin(), { scorer: p.id, assist: '', gtype: 'normal' });
                this.render();
                this.showActionToast(`⚽ Gol de #${p.number} ${p.name} (min ${ev.minute}')`, ev.id);
            }

            quickGoalRival() {
                if (!this.isLive()) { this.showToast('El partido no está en juego'); return; }
                const ev = this.addEvent('goal_away', 'rival', this.curMin(), { num: '', gtype: 'normal' });
                this.render();
                this.showActionToast(`⚽ Gol de ${this.rivalName()} (min ${ev.minute}')`, ev.id);
            }

            quickCard(playerId, kind) {
                const p = this.state.squad.find(x => x.id === playerId);
                if (!p || p.status !== 'starter') return;
                const ctype = kind === 'red' ? 'red' : (p.yellowCards > 0 ? 'second_yellow' : 'yellow');
                this.closeModal();
                const ev = this.addEvent('card', 'home', this.curMin(), { player: p.id, ctype });
                this.render();
                const icon = ctype === 'yellow' ? '🟨' : (ctype === 'second_yellow' ? '🟨🟨' : '🟥');
                this.showActionToast(`${icon} #${p.number} ${p.name} (min ${ev.minute}')`, ev.id);
            }

            // Selector de jugador de un toque (goles y tarjetas)
            openQuickPicker(kind) {
                if (!this.isLive()) { this.showToast('El partido no está en juego'); return; }
                const starters = this.state.squad.filter(p => p.status === 'starter').sort((a, b) => a.number - b.number);
                if (starters.length === 0) { alert('No hay titulares en el campo.'); return; }
                this._pickKind = kind;
                if (kind === 'card' && !this._cardKind) this._cardKind = 'yellow';
                const isGoal = kind === 'goal';
                const toggle = isGoal ? '' : `
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <button onclick="app._cardKind='yellow'; app.openQuickPicker('card')" class="py-2 rounded-xl font-black text-xs ${this._cardKind === 'yellow' ? 'bg-amber-400 text-slate-950' : 'bg-slate-800 text-slate-300'}">🟨 Amarilla</button>
                        <button onclick="app._cardKind='red'; app.openQuickPicker('card')" class="py-2 rounded-xl font-black text-xs ${this._cardKind === 'red' ? 'bg-rose-600 text-white' : 'bg-slate-800 text-slate-300'}">🟥 Roja</button>
                    </div>`;
                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm max-h-[92vh] overflow-y-auto rounded-3xl p-5 shadow-2xl relative">
                            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            <h3 class="font-bold text-base text-white mb-3 pr-6">${isGoal ? '⚽ ¿Quién marca?' : '¿A quién se saca la tarjeta?'}</h3>
                            ${toggle}
                            <div class="grid grid-cols-3 gap-2">
                                ${starters.map(p => `
                                    <button onclick="app.${isGoal ? 'quickGoal' : 'quickCard'}('${p.id}'${isGoal ? '' : ', app._cardKind'})" class="bg-slate-950 border border-slate-700 active:bg-lasalle-yellow active:text-lasalle-darkblue rounded-2xl py-3 px-1 text-center min-h-[64px]">
                                        <div class="text-lg font-black text-lasalle-yellow leading-none">${esc(p.number)}</div>
                                        <div class="text-[10px] text-slate-300 truncate mt-1">${esc(p.name)}</div>
                                    </button>`).join('')}
                            </div>
                            <button onclick="app.openModal('${isGoal ? 'goal_home' : 'card_home'}')" class="w-full mt-3 text-[11px] text-lasalle-yellow underline">Registrar con más detalle…</button>
                        </div>
                    </div>`;
            }

            // Menú del jugador: se abre al tocarlo en Directo o en la vista de campo
            openPlayerMenu(id) {
                const p = this.state.squad.find(x => x.id === id);
                if (!p) return;
                if (!this.isLive()) { this.showToast(this.state.match.status === 'finished' ? 'Partido finalizado: corrige desde Cronología' : 'El partido aún no ha empezado'); return; }
                if (p.status === 'bench') { this.openModal('sub_home', { in: id }); return; }
                if (p.status !== 'starter') { this.showToast('Este jugador ya no está en el campo'); return; }
                const btn = (cls, icon, label, fn) => `<button onclick="${fn}" class="${cls} rounded-2xl py-3 px-2 font-black text-xs flex flex-col items-center justify-center gap-1 min-h-[64px] active:scale-95"><span class="text-lg leading-none">${icon}</span>${label}</button>`;
                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl relative space-y-3">
                            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            <div class="pr-6">
                                <h3 class="font-black text-base text-white">#${esc(p.number)} ${esc(p.name)} ${p.captain ? '<span class="text-lasalle-yellow">(C)</span>' : ''}</h3>
                                <p class="text-[11px] text-slate-400">${esc(p.position)} · ${this.calculatePlayerMinutes(p)}' · ⚽ ${p.goals} · 🅰 ${p.assists} · 🟨 ${p.yellowCards}</p>
                            </div>
                            <div class="grid grid-cols-3 gap-2">
                                ${btn('bg-emerald-600 text-white', '⚽', 'Gol', `app.quickGoal('${p.id}')`)}
                                ${btn('bg-amber-500 text-slate-950', p.yellowCards > 0 ? '🟨🟨' : '🟨', p.yellowCards > 0 ? 'Doble amarilla' : 'Amarilla', `app.quickCard('${p.id}', 'yellow')`)}
                                ${btn('bg-rose-600 text-white', '🟥', 'Roja', `app.quickCard('${p.id}', 'red')`)}
                                ${btn('bg-teal-600 text-white', '🔁', 'Cambiar', `app.openModal('sub_home', { out: '${p.id}' })`)}
                                ${btn('bg-slate-800 text-white', '⚽+', 'Gol con detalle', `app.openModal('goal_home', { scorer: '${p.id}' })`)}
                                ${btn('bg-slate-800 text-white', '🅰', 'Dio asistencia', `app.openModal('goal_home', { assist: '${p.id}' })`)}
                            </div>
                        </div>
                    </div>`;
            }


            // ============================ AJUSTES: pantalla, vibración ============================
            vibrate(p) {
                try { if (this.state.prefs.vibrate && navigator.vibrate) navigator.vibrate(p); } catch (e) { /* se ignora */ }
            }

            updateWake() {
                try {
                    const want = this.state.prefs.wake && this.isLive() && !document.hidden;
                    if (want && !this._wake && !this._wakePending && navigator.wakeLock) {
                        this._wakePending = true;
                        navigator.wakeLock.request('screen').then(l => {
                            this._wakePending = false;
                            this._wake = l;
                            l.addEventListener('release', () => { if (this._wake === l) this._wake = null; });
                        }).catch(() => { this._wakePending = false; });
                    } else if (!want && this._wake) {
                        const l = this._wake; this._wake = null;
                        l.release().catch(() => {});
                    }
                } catch (e) { /* se ignora */ }
            }

            setPref(key, value) {
                if (!['wake', 'vibrate', 'autoDl'].includes(key)) return;
                this.state.prefs[key] = value === true || value === 'true';
                if (key === 'vibrate' && this.state.prefs.vibrate) this.vibrate(80);
                this.saveToStorage();
                this.updateWake();
            }

            renderToolsCard() {
                const pr = this.state.prefs;
                const hasPin = this.hasPin();
                const sel = (key, val) => `<select class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-white" onchange="app.setPref('${key}', this.value)">
                    <option value="true" ${val ? 'selected' : ''}>Sí</option><option value="false" ${!val ? 'selected' : ''}>No</option></select>`;
                const nBack = this.loadBackups().length;
                return `
                    <div class="bg-slate-900 border border-lasalle-yellow/30 rounded-2xl p-4 space-y-3">
                        <h2 class="text-xs font-black text-lasalle-yellow uppercase tracking-wider flex items-center gap-1.5"><i class="fa-solid fa-mobile-screen"></i> Uso en el banquillo</h2>
                        <div class="grid grid-cols-3 gap-2">
                            <div><label class="text-[11px] text-slate-300 font-bold">Pantalla encendida</label>${sel('wake', pr.wake)}</div>
                            <div><label class="text-[11px] text-slate-300 font-bold">Vibración</label>${sel('vibrate', pr.vibrate)}</div>
                            <div><label class="text-[11px] text-slate-300 font-bold">Copia al finalizar</label>${sel('autoDl', pr.autoDl)}</div>
                        </div>
                        <p class="text-[10px] text-slate-500">"Copia al finalizar" descarga un archivo de copia completa al terminar cada partido.</p>
                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <button onclick="app.openPinModal()" class="bg-slate-800 text-lasalle-yellow font-bold py-2 rounded-xl text-xs"><i class="fa-solid fa-lock mr-1"></i> ${hasPin ? 'PIN activo · cambiar' : 'Poner PIN'}</button>
                            ${hasPin ? `<button onclick="app.lockNow()" class="bg-slate-800 text-lasalle-yellow font-bold py-2 rounded-xl text-xs"><i class="fa-solid fa-key mr-1"></i> Bloquear ahora</button>` : `<button onclick="app.exportFullBackup()" class="bg-slate-800 text-lasalle-yellow font-bold py-2 rounded-xl text-xs"><i class="fa-solid fa-download mr-1"></i> Copia completa</button>`}
                            ${hasPin ? `<button onclick="app.exportFullBackup()" class="bg-slate-800 text-lasalle-yellow font-bold py-2 rounded-xl text-xs"><i class="fa-solid fa-download mr-1"></i> Copia completa</button>` : '<span></span>'}
                            <label class="bg-slate-800 text-lasalle-yellow font-bold py-2 rounded-xl text-xs text-center cursor-pointer"><i class="fa-solid fa-upload mr-1"></i> Restaurar copia
                                <input type="file" accept=".json,application/json" class="hidden" onchange="app.importFullBackup(event)"></label>
                        </div>
                        <button onclick="app.startTour()" class="w-full bg-slate-800 text-lasalle-yellow font-bold py-2 rounded-xl text-xs"><i class="fa-solid fa-route mr-1"></i> Recorrido guiado de la app</button>
                        <div class="grid grid-cols-2 gap-2"><button onclick="app.openBackupsModal()" class="text-[11px] text-lasalle-yellow underline">Copias automáticas (${nBack})</button><button onclick="app.openDataInfo()" class="text-[11px] text-lasalle-yellow underline">¿Dónde se guardan mis datos?</button></div>
                    </div>`;
            }

            // ============================ PIN ============================
            hasPin() { try { return !!localStorage.getItem(PIN_KEY); } catch (e) { return false; } }

            async hashPin(pin, salt) {
                const data = salt + ':' + pin;
                try {
                    if (window.crypto && crypto.subtle) {
                        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
                        return 's256:' + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
                    }
                } catch (e) { /* se usa el alternativo */ }
                let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
                for (let i = 0; i < data.length; i++) {
                    const c = data.charCodeAt(i);
                    h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677);
                }
                h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
                h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
                return 'f:' + (h2 >>> 0).toString(16) + (h1 >>> 0).toString(16);
            }

            initLock() {
                if (this.hasPin()) this.showLock();
            }

            lockNow() { if (this.hasPin()) this.showLock(); }

            showLock() {
                let el = document.getElementById('lock-screen');
                if (!el) {
                    el = document.createElement('div');
                    el.id = 'lock-screen';
                    el.className = 'fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-6';
                    document.body.appendChild(el);
                }
                el.style.display = 'flex';
                el.innerHTML = `
                    <div class="w-full max-w-xs text-center space-y-4">
                        <div class="text-lasalle-yellow text-4xl"><i class="fa-solid fa-lock"></i></div>
                        <h2 class="text-white font-black text-lg">StatBench360</h2>
                        <p class="text-xs text-slate-400">Introduce tu PIN</p>
                        <input id="lock-pin" type="password" inputmode="numeric" autocomplete="off" maxlength="6" class="w-full text-center tracking-[0.5em] text-2xl bg-slate-900 border border-slate-700 rounded-2xl p-3 text-white" onkeydown="if(event.key==='Enter') app.tryUnlock()">
                        <div id="lock-msg" class="text-xs text-rose-400 min-h-[1rem]"></div>
                        <button onclick="app.tryUnlock()" class="w-full bg-lasalle-yellow text-lasalle-darkblue font-black py-3 rounded-2xl">Entrar</button>
                        <details class="text-[11px] text-slate-500"><summary class="cursor-pointer">He olvidado el PIN</summary>
                            <p class="mt-2">Solo se puede recuperar el acceso <b>borrando todos los datos de la app en este dispositivo</b> (partido, plantilla e histórico).</p>
                            <button onclick="app.forgotPin()" class="mt-2 w-full bg-rose-700 text-white font-bold py-2 rounded-xl">Borrar todo y entrar</button>
                        </details>
                    </div>`;
                setTimeout(() => { const i = document.getElementById('lock-pin'); if (i) i.focus(); }, 50);
            }

            async tryUnlock() {
                const inp = document.getElementById('lock-pin');
                const msg = document.getElementById('lock-msg');
                if (!inp) return;
                let rec = null;
                try { rec = JSON.parse(localStorage.getItem(PIN_KEY)); } catch (e) { /* se ignora */ }
                if (!rec || !rec.salt) { this.hideLock(); return; }
                const now = Date.now();
                if (this._lockUntil && now < this._lockUntil) { msg.textContent = `Espera ${Math.ceil((this._lockUntil - now) / 1000)} s`; return; }
                const h = await this.hashPin(inp.value, rec.salt);
                if (h === rec.hash) { this._fails = 0; this.hideLock(); return; }
                this._fails = (this._fails || 0) + 1;
                inp.value = '';
                if (this._fails >= 5) { this._lockUntil = Date.now() + 30000; this._fails = 0; msg.textContent = 'Demasiados intentos. Espera 30 s'; }
                else msg.textContent = 'PIN incorrecto';
            }

            hideLock() {
                const el = document.getElementById('lock-screen');
                if (el) { el.style.display = 'none'; el.innerHTML = ''; }
                setTimeout(() => this.maybeStartTour(), 300);
            }

            forgotPin() {
                try {
                    [PIN_KEY, STORAGE_KEY, HISTORY_KEY, BACKUP_KEY].forEach(k => localStorage.removeItem(k));
                } catch (e) { /* se ignora */ }
                location.reload();
            }

            openPinModal() {
                const has = this.hasPin();
                const cls = 'w-full text-center tracking-[0.4em] text-lg bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white mt-1';
                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl relative space-y-3">
                            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            <h3 class="font-bold text-base text-white pr-6">${has ? 'Cambiar o quitar el PIN' : 'Poner un PIN'}</h3>
                            <p class="text-[11px] text-slate-400">Es una barrera sencilla para que nadie abra la app sin querer. <b>No cifra los datos</b>. Si lo olvidas, tendrás que borrar los datos de la app.</p>
                            ${has ? `<div><label class="text-xs text-slate-400">PIN actual</label><input id="pin-old" type="password" inputmode="numeric" maxlength="6" class="${cls}"></div>` : ''}
                            <div><label class="text-xs text-slate-400">Nuevo PIN (4 a 6 cifras)</label><input id="pin-new" type="password" inputmode="numeric" maxlength="6" class="${cls}"></div>
                            <div><label class="text-xs text-slate-400">Repite el nuevo PIN</label><input id="pin-new2" type="password" inputmode="numeric" maxlength="6" class="${cls}"></div>
                            <div id="pin-msg" class="text-xs text-rose-400 min-h-[1rem]"></div>
                            <div class="grid ${has ? 'grid-cols-2' : 'grid-cols-1'} gap-2">
                                ${has ? `<button onclick="app.savePin(true)" class="bg-rose-600/30 text-rose-300 border border-rose-500/40 font-bold py-2.5 rounded-xl text-sm">Quitar PIN</button>` : ''}
                                <button onclick="app.savePin(false)" class="bg-lasalle-yellow text-lasalle-darkblue font-black py-2.5 rounded-xl text-sm">Guardar</button>
                            </div>
                        </div>
                    </div>`;
            }

            async savePin(remove) {
                const v = i => { const el = document.getElementById(i); return el ? el.value : ''; };
                const msg = document.getElementById('pin-msg');
                if (this.hasPin()) {
                    let rec = null;
                    try { rec = JSON.parse(localStorage.getItem(PIN_KEY)); } catch (e) { /* se ignora */ }
                    const h = rec ? await this.hashPin(v('pin-old'), rec.salt) : '';
                    if (!rec || h !== rec.hash) { msg.textContent = 'El PIN actual no es correcto.'; return; }
                    if (remove) {
                        try { localStorage.removeItem(PIN_KEY); } catch (e) { /* se ignora */ }
                        this.closeModal(); this.render(); this.showToast('PIN eliminado');
                        return;
                    }
                }
                const a = v('pin-new'), b = v('pin-new2');
                if (!/^\d{4,6}$/.test(a)) { msg.textContent = 'El PIN debe tener entre 4 y 6 cifras.'; return; }
                if (a !== b) { msg.textContent = 'Los dos PIN no coinciden.'; return; }
                const salt = newId('s');
                const hash = await this.hashPin(a, salt);
                try { localStorage.setItem(PIN_KEY, JSON.stringify({ salt, hash })); }
                catch (e) { msg.textContent = 'No se ha podido guardar el PIN.'; return; }
                this.closeModal(); this.render(); this.showToast('PIN guardado');
            }

            // ============================ COPIAS DE SEGURIDAD ============================
            serializeState() {
                return JSON.stringify({ ...this.state, selectedPlayerIds: [] });
            }

            loadBackups() {
                try {
                    const arr = JSON.parse(localStorage.getItem(BACKUP_KEY));
                    return Array.isArray(arr) ? arr.filter(b => b && typeof b.state === 'string' && typeof b.at === 'number') : [];
                } catch (e) { return []; }
            }

            autoBackup(reason) {
                try {
                    const list = this.loadBackups();
                    list.unshift({ at: Date.now(), reason: cleanText(reason, 40), state: this.serializeState() });
                    let keep = list.slice(0, 5);
                    while (keep.length) {
                        try { localStorage.setItem(BACKUP_KEY, JSON.stringify(keep)); return; }
                        catch (e) { keep = keep.slice(0, -1); }
                    }
                } catch (e) { /* una copia que falla no debe parar el partido */ }
            }

            openBackupsModal() {
                const list = this.loadBackups();
                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm max-h-[90vh] overflow-y-auto rounded-3xl p-5 shadow-2xl relative space-y-3">
                            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            <h3 class="font-bold text-base text-white pr-6">Copias automáticas</h3>
                            <p class="text-[11px] text-slate-400">Se guardan en este mismo dispositivo y navegador: si borras los datos del navegador, desaparecen. Para tener una copia segura, usa "Copia completa".</p>
                            ${list.length === 0 ? '<p class="text-xs text-slate-500">Todavía no hay copias.</p>' : list.map((b, i) => `
                                <div class="bg-slate-950 border border-slate-800 rounded-xl p-2.5 flex items-center justify-between gap-2 text-xs">
                                    <div><div class="font-bold text-white">${esc(new Date(b.at).toLocaleString('es-ES'))}</div><div class="text-slate-400">${esc(b.reason)}</div></div>
                                    <button onclick="app.restoreBackup(${i})" class="bg-lasalle-yellow text-lasalle-darkblue font-black px-3 py-1.5 rounded-lg">Restaurar</button>
                                </div>`).join('')}
                        </div>
                    </div>`;
            }

            restoreBackup(i) {
                const b = this.loadBackups()[i];
                if (!b) return;
                this.askConfirm('¿Restaurar esta copia? Se sustituirá el partido y la plantilla actuales (el histórico no se toca).', () => {
                    try {
                        const clean = sanitizeState(JSON.parse(b.state));
                        if (!clean) throw new Error('copia no válida');
                        this.autoBackup('antes de restaurar');
                        this.stopTimers();
                        this.state = clean;
                        this.state.selectedPlayerIds = new Set();
                        this.initApp();
                        this.showToast('Copia restaurada');
                    } catch (e) { alert('La copia no es válida.'); }
                }, 'Restaurar');
            }

            exportFullBackup(plain) {
                const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
                const data = { app: 'StatBench360', kind: 'full-backup', exportedAt: new Date().toISOString(),
                    state: JSON.parse(this.serializeState()), history: this.loadHistory() };
                return this.saveFile(`statbench360_copia_${stamp}.json`, JSON.stringify(data), 'application/json', !!plain);
            }

            importFullBackup(event) {
                const input = event.target;
                const file = input.files && input.files[0];
                input.value = '';
                if (!file) return;
                if (file.size > 10 * 1024 * 1024) { alert('El archivo es demasiado grande (máximo 10 MB).'); return; }
                const reader = new FileReader();
                reader.onerror = () => alert('No se pudo leer el archivo.');
                reader.onload = e => {
                    let data, clean, hist;
                    try {
                        data = JSON.parse(String(e.target.result));
                        if (!data || data.kind !== 'full-backup') throw new Error('formato');
                        clean = sanitizeState(data.state);
                        if (!clean) throw new Error('estado');
                        hist = (Array.isArray(data.history) ? data.history.slice(0, MAX_HISTORY) : []).map(sanitizeHistoryEntry).filter(Boolean);
                    } catch (err) { alert('El archivo no es una copia completa válida de StatBench360.'); return; }
                    this.askConfirm(`¿Restaurar la copia? Se sustituirán el partido, la plantilla y el histórico actuales (${hist.length} partidos en la copia).`, () => {
                        this.autoBackup('antes de restaurar copia');
                        this.stopTimers();
                        this.state = clean;
                        this.state.selectedPlayerIds = new Set();
                        this.history = hist;
                        this.persistHistory();
                        this.initApp();
                        this.showToast('Copia restaurada');
                    }, 'Restaurar');
                };
                reader.readAsText(file);
            }

            // ============================ PLANIFICADOR DE CAMBIOS ============================
            renderDueBanners() {
                const due = this.state.plannedSubs.filter(x => x.status === 'due');
                if (!due.length) return '';
                return due.map(x => `
                    <div class="bg-amber-500/20 border-2 border-amber-400 rounded-2xl p-3 space-y-2 animate-pulse-slow">
                        <div class="text-xs font-black text-amber-300 uppercase"><i class="fa-solid fa-bell mr-1"></i> Cambio previsto (min ${x.min}')</div>
                        <div class="text-sm font-bold text-white">Sale ${esc(this.pName(x.out))} · Entra ${esc(this.pName(x.in))}</div>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="app.confirmPlanned('${x.id}')" class="bg-emerald-500 text-slate-950 font-black py-2 rounded-xl text-xs">Confirmar</button>
                            <button onclick="app.postponePlanned('${x.id}')" class="bg-slate-800 text-white font-bold py-2 rounded-xl text-xs">+5 min</button>
                            <button onclick="app.discardPlanned('${x.id}')" class="bg-slate-800 text-rose-300 font-bold py-2 rounded-xl text-xs">Descartar</button>
                        </div>
                    </div>`).join('');
            }

            renderPlannerCard() {
                const list = this.state.plannedSubs.filter(x => x.status === 'pending').sort((a, b) => a.min - b.min);
                return `
                    <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl space-y-2">
                        <div class="flex items-center justify-between">
                            <div class="text-xs font-bold text-slate-300"><i class="fa-solid fa-calendar-check text-lasalle-yellow mr-1"></i> Cambios planificados</div>
                            <button onclick="app.openPlanModal()" class="bg-lasalle-yellow text-lasalle-darkblue font-extrabold px-3 py-1.5 rounded-xl text-xs">+ Planificar</button>
                        </div>
                        ${list.length === 0 ? '<p class="text-[11px] text-slate-500">Sin cambios planificados. Te avisaré al llegar al minuto elegido.</p>' : list.map(x => `
                            <div class="flex items-center justify-between gap-2 bg-slate-950 rounded-xl px-2.5 py-2 text-xs border border-slate-800">
                                <span class="min-w-0 truncate"><b class="text-lasalle-yellow">${x.min}'</b> sale ${esc(this.pName(x.out))} → entra ${esc(this.pName(x.in))}</span>
                                <button onclick="app.discardPlanned('${x.id}')" class="text-rose-400 shrink-0" aria-label="Quitar"><i class="fa-solid fa-xmark"></i></button>
                            </div>`).join('')}
                    </div>`;
            }

            openPlanModal() {
                const starters = this.state.squad.filter(p => p.status === 'starter').sort((a, b) => a.number - b.number);
                const bench = this.state.squad.filter(p => p.status === 'bench').sort((a, b) => a.number - b.number);
                if (!starters.length || !bench.length) { alert('Necesitas titulares y suplentes para planificar un cambio.'); return; }
                const opts = l => l.map(p => `<option value="${p.id}">#${esc(p.number)} ${esc(p.name)} (${esc(p.position)})</option>`).join('');
                const cls = 'w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white mt-1';
                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm max-h-[92vh] overflow-y-auto rounded-3xl p-5 shadow-2xl relative space-y-3">
                            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            <h3 class="font-bold text-base text-white pr-6">Planificar un cambio</h3>
                            <div><label class="text-xs text-slate-400">Avisarme en el minuto</label><input type="number" id="plan-min" min="1" max="200" value="${Math.min(200, this.curMin() + 10)}" class="${cls}"></div>
                            <div><label class="text-xs text-slate-400">Sale</label><select id="plan-out" class="${cls}">${opts(starters)}</select></div>
                            <div><label class="text-xs text-slate-400">Entra</label><select id="plan-in" class="${cls}">${opts(bench)}</select></div>
                            <label class="flex items-start gap-2 text-xs text-slate-300 bg-slate-950 border border-slate-800 rounded-xl p-2.5"><input type="checkbox" id="plan-counts" class="mt-0.5" checked><span>Cuenta como ventana de cambios</span></label>
                            <button onclick="app.submitPlan()" class="w-full bg-lasalle-yellow text-lasalle-darkblue font-black py-2.5 rounded-xl text-sm">Guardar plan</button>
                        </div>
                    </div>`;
            }

            submitPlan() {
                const v = i => document.getElementById(i).value;
                const out = v('plan-out'), inn = v('plan-in');
                if (!this.state.squad.some(p => p.id === out) || !this.state.squad.some(p => p.id === inn)) return;
                if (this.state.plannedSubs.length >= 20) { alert('Hay demasiados cambios planificados.'); return; }
                this.state.plannedSubs.push({ id: newId('ps'), min: toInt(v('plan-min'), 10, 0, 200), out, in: inn, counts: !!document.getElementById('plan-counts').checked, status: 'pending' });
                this.closeModal();
                this.render();
            }

            checkPlanned() {
                const m = this.state.match;
                if (!this.state.plannedSubs.length || (m.status !== 'first_half' && m.status !== 'second_half')) return;
                const cur = Math.floor(m.timerSeconds / 60);
                const fresh = this.state.plannedSubs.filter(x => x.status === 'pending' && x.min <= cur);
                if (!fresh.length) return;
                fresh.forEach(x => { x.status = 'due'; });
                this.vibrate([250, 120, 250, 120, 250]);
                this.speak(`Cambio previsto. Sale ${this.nameOnly(fresh[0].out)}. Entra ${this.nameOnly(fresh[0].in)}.`);
                this._needRender = true;
            }

            nameOnly(id) { const p = this.state.squad.find(x => x.id === id); return p ? p.name : 'jugador'; }

            confirmPlanned(id) {
                const x = this.state.plannedSubs.find(p => p.id === id);
                if (!x) return;
                const po = this.state.squad.find(p => p.id === x.out), pi = this.state.squad.find(p => p.id === x.in);
                if (!po || !pi || po.status !== 'starter' || pi.status !== 'bench') {
                    this.state.plannedSubs = this.state.plannedSubs.filter(p => p.id !== id);
                    this.showToast('El cambio ya no es posible (los jugadores han cambiado). Plan descartado.');
                    this.render();
                    return;
                }
                if (!this.registerHomeSub([{ o: x.out, i: x.in }], x.counts, this.curMin())) return;
                this.state.plannedSubs = this.state.plannedSubs.filter(p => p.id !== id);
                this.render();
                this.showToast('Cambio registrado');
            }

            postponePlanned(id) {
                const x = this.state.plannedSubs.find(p => p.id === id);
                if (!x) return;
                x.min = Math.min(200, this.curMin() + 5);
                x.status = 'pending';
                this.render();
            }

            discardPlanned(id) {
                this.state.plannedSubs = this.state.plannedSubs.filter(p => p.id !== id);
                this.render();
            }

            // ============================ VISTA DE CAMPO (opcional) ============================
            setFormation(f) {
                if (!FORMATIONS[f]) return;
                this.state.formation = f;
                this.render();
            }

            fieldLayout() {
                const lines = FORMATIONS[this.state.formation] || FORMATIONS['4-4-2'];
                const starters = this.state.squad.filter(p => p.status === 'starter').sort((a, b) => a.number - b.number);
                const rows = [{ type: 'POR', n: 1 }, { type: 'DEF', n: lines[0] }];
                lines.slice(1, -1).forEach(n => rows.push({ type: 'MED', n }));
                rows.push({ type: 'DEL', n: lines[lines.length - 1] });
                rows.forEach(r => { r.players = []; });
                const left = [];
                ['POR', 'DEF', 'MED', 'DEL'].forEach(pos => {
                    starters.filter(p => p.position === pos).forEach(p => {
                        const r = rows.find(x => x.type === pos && x.players.length < x.n);
                        if (r) r.players.push(p); else left.push(p);
                    });
                });
                left.forEach(p => {
                    const r = rows.find(x => x.players.length < x.n);
                    if (r) r.players.push(p); else rows[rows.length - 1].players.push(p);
                });
                return rows;
            }

            renderFieldScreen() {
                const rows = this.fieldLayout().slice().reverse();
                const bench = this.state.squad.filter(p => p.status === 'bench');
                const chip = p => `<button onclick="app.openPlayerMenu('${p.id}')" class="flex flex-col items-center w-16 active:scale-95">
                        <span class="w-11 h-11 rounded-full bg-lasalle-yellow text-lasalle-darkblue font-black flex items-center justify-center text-base border-2 ${p.yellowCards ? 'border-amber-300' : 'border-white/70'} shadow">${esc(p.number)}</span>
                        <span class="text-[10px] text-white font-bold truncate w-full text-center mt-0.5 drop-shadow">${esc(p.name)}</span>
                        <span class="text-[10px] text-white/90 leading-none">${p.goals ? '⚽' + p.goals : ''}${p.yellowCards ? '🟨' : ''}${p.subIn ? '↑' : ''}</span>
                    </button>`;
                return `
                <div class="p-4 space-y-3 pb-16">
                    <div class="flex items-center justify-between gap-2">
                        <h2 class="text-base font-extrabold text-lasalle-yellow">Vista de campo</h2>
                        <button onclick="app.switchTab('dashboard')" class="bg-slate-800 text-lasalle-yellow px-2.5 py-1 rounded-lg text-xs font-bold border border-lasalle-yellow/30"><i class="fa-solid fa-arrow-left"></i> Directo</button>
                    </div>
                    <div class="flex items-center gap-2 text-xs text-slate-300">
                        <label class="font-bold">Formación</label>
                        <select onchange="app.setFormation(this.value)" class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-white">
                            ${Object.keys(FORMATIONS).map(f => `<option value="${f}" ${f === this.state.formation ? 'selected' : ''}>${f}</option>`).join('')}
                        </select>
                        <span class="text-[10px] text-slate-500">Solo orientativo: los jugadores se colocan por su posición.</span>
                    </div>
                    <div class="rounded-3xl border-2 border-white/30 py-5 space-y-5" style="background:linear-gradient(180deg,#15803d,#166534)">
                        ${rows.map(r => `<div class="flex justify-around items-start px-1">${r.players.map(chip).join('') || '<span class="text-[10px] text-white/60">—</span>'}</div>`).join('')}
                    </div>
                    ${bench.length ? `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3">
                        <h4 class="text-[10px] font-bold text-slate-400 uppercase mb-2">Banquillo</h4>
                        <div class="flex flex-wrap gap-2">${bench.map(p => `<button onclick="app.openPlayerMenu('${p.id}')" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-200"><b class="text-lasalle-yellow">${esc(p.number)}</b> ${esc(p.name)}</button>`).join('')}</div>
                    </div>` : ''}
                </div>`;
            }

            // ============================ SECCIONES PLEGABLES EN INICIO ============================
            loadSectionState() {
                try {
                    const o = JSON.parse(localStorage.getItem(SECTIONS_KEY));
                    return (o && typeof o === 'object') ? o : {};
                } catch (e) { return {}; }
            }

            saveSectionState(o) {
                try { localStorage.setItem(SECTIONS_KEY, JSON.stringify(o)); } catch (e) { /* se ignora */ }
            }

            // Convierte las tarjetas de Inicio en secciones que se pliegan y despliegan (el estado se recuerda)
            enhanceSetup(main) {
                const root = main.firstElementChild;
                if (!root) return;
                const saved = this.loadSectionState();
                const sections = [];
                Array.from(root.children).forEach(card => {
                    if (!/rounded-2xl/.test(card.className) || card.id === 'offline-card-wrap') return;
                    const head = card.firstElementChild;
                    if (!head || !/^H[23]$/.test(head.tagName)) return;
                    const key = head.textContent.replace(/\s+/g, ' ').trim().toLowerCase().slice(0, 60);
                    if (!key) return;
                    const open = key in saved ? !!saved[key] : SECTIONS_DEFAULT_OPEN.includes(key);

                    const bar = document.createElement('div');
                    bar.className = 'flex items-center justify-between gap-2 cursor-pointer select-none';
                    bar.setAttribute('role', 'button');
                    bar.setAttribute('tabindex', '0');
                    const chev = document.createElement('i');
                    chev.className = 'fa-solid fa-chevron-down text-lasalle-yellow text-xs transition-transform shrink-0';
                    const body = document.createElement('div');
                    body.className = 'space-y-3';
                    while (head.nextSibling) body.appendChild(head.nextSibling);
                    card.insertBefore(bar, head);
                    bar.appendChild(head);
                    bar.appendChild(chev);
                    card.appendChild(body);

                    const apply = o => {
                        body.style.display = o ? '' : 'none';
                        chev.style.transform = o ? 'rotate(180deg)' : '';
                        bar.setAttribute('aria-expanded', o ? 'true' : 'false');
                    };
                    apply(open);
                    const toggle = () => {
                        const now = body.style.display === 'none';
                        apply(now);
                        const s = this.loadSectionState(); s[key] = now; this.saveSectionState(s);
                    };
                    bar.addEventListener('click', toggle);
                    bar.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); } });
                    sections.push({ key, apply });
                });
                if (!sections.length) return;
                const tools = document.createElement('div');
                tools.className = 'flex justify-end gap-3 text-[11px] text-lasalle-yellow -mb-2';
                const mk = (label, val) => {
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'underline';
                    b.textContent = label;
                    b.addEventListener('click', () => {
                        const s = this.loadSectionState();
                        sections.forEach(x => { x.apply(val); s[x.key] = val; });
                        this.saveSectionState(s);
                    });
                    return b;
                };
                tools.appendChild(mk('Desplegar todo', true));
                tools.appendChild(mk('Plegar todo', false));
                const firstCard = root.querySelector('[role="button"]');
                const anchor = firstCard && firstCard.parentElement;
                if (anchor) root.insertBefore(tools, anchor);
            }

            // ============================ RECORRIDO GUIADO ============================
            tourNever() { try { return localStorage.getItem(TOUR_KEY) === 'never'; } catch (e) { return false; } }

            maybeStartTour() {
                const lock = document.getElementById('lock-screen');
                if (this.tourNever() || this.state.match.status !== 'setup' || (lock && lock.style.display !== 'none') || document.getElementById('tour-overlay')) return;
                this.startTour(false);
            }

            startTour() {
                this._tourStep = 0;
                this.renderTour();
            }

            renderTour() {
                let el = document.getElementById('tour-overlay');
                if (!el) {
                    el = document.createElement('div');
                    el.id = 'tour-overlay';
                    el.className = 'fixed inset-0 z-[90] bg-slate-950/90 backdrop-blur-sm flex items-end sm:items-center justify-center p-4';
                    document.body.appendChild(el);
                }
                const i = this._tourStep, n = TOUR_STEPS.length, s = TOUR_STEPS[i];
                const never = el.querySelector('#tour-never') ? el.querySelector('#tour-never').checked : this.tourNever();
                el.innerHTML = `
                    <div class="bg-slate-900 border border-lasalle-yellow/40 w-full max-w-sm rounded-3xl p-5 shadow-2xl space-y-4 mb-6" role="dialog" aria-label="Recorrido guiado">
                        <div class="flex items-center justify-between text-[11px] text-slate-400">
                            <span>Paso ${i + 1} de ${n}</span>
                            <button onclick="app.closeTour()" class="underline">Saltar recorrido</button>
                        </div>
                        <div class="text-center space-y-2">
                            <div class="w-16 h-16 mx-auto rounded-2xl bg-lasalle-yellow text-lasalle-darkblue flex items-center justify-center text-3xl"><i class="fa-solid ${esc(s.icon)}"></i></div>
                            <h3 class="text-lg font-black text-white">${esc(s.title)}</h3>
                            <p class="text-sm text-slate-300 leading-relaxed">${esc(s.text)}</p>
                        </div>
                        <div class="flex justify-center gap-1">${TOUR_STEPS.map((_, k) => `<span class="h-1.5 rounded-full ${k === i ? 'w-5 bg-lasalle-yellow' : 'w-1.5 bg-slate-700'}"></span>`).join('')}</div>
                        <label class="flex items-center gap-2 text-xs text-slate-300 bg-slate-950 border border-slate-800 rounded-xl p-2.5">
                            <input type="checkbox" id="tour-never" ${never ? 'checked' : ''}> No mostrar más este recorrido al abrir la app
                        </label>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="app.tourMove(-1)" ${i === 0 ? 'disabled' : ''} class="bg-slate-800 text-slate-200 font-bold py-2.5 rounded-xl text-sm ${i === 0 ? 'opacity-40' : ''}">Anterior</button>
                            <button onclick="app.tourMove(1)" class="bg-lasalle-yellow text-lasalle-darkblue font-black py-2.5 rounded-xl text-sm">${i === n - 1 ? 'Terminar' : 'Siguiente'}</button>
                        </div>
                    </div>`;
            }

            tourMove(d) {
                const n = TOUR_STEPS.length;
                const next = this._tourStep + d;
                if (next < 0) return;
                if (next >= n) { this.closeTour(); return; }
                this._tourStep = next;
                this.renderTour();
            }

            closeTour() {
                const el = document.getElementById('tour-overlay');
                const chk = el && el.querySelector('#tour-never');
                try {
                    if (chk && chk.checked) localStorage.setItem(TOUR_KEY, 'never');
                    else localStorage.removeItem(TOUR_KEY);
                } catch (e) { /* se ignora */ }
                if (el) el.remove();
            }

            // ============================ BORRADO DE DATOS Y DÓNDE SE GUARDAN ============================
            storageInfo() {
                const size = k => { try { const v = localStorage.getItem(k); return v ? new Blob([v]).size : 0; } catch (e) { return 0; } };
                const kb = n => n < 1024 ? n + ' B' : (n / 1024).toFixed(1) + ' KB';
                return [
                    ['Partido actual, plantilla y ajustes', STORAGE_KEY, kb(size(STORAGE_KEY))],
                    ['Histórico de partidos y estadísticas de jugadores', HISTORY_KEY, kb(size(HISTORY_KEY)) + ' · ' + this.loadHistory().length + ' partidos'],
                    ['Copias automáticas (máx. 5)', BACKUP_KEY, kb(size(BACKUP_KEY)) + ' · ' + this.loadBackups().length + ' copias'],
                    ['PIN (solo su huella, no el PIN)', PIN_KEY, kb(size(PIN_KEY))]
                ];
            }

            openDataInfo() {
                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm max-h-[92vh] overflow-y-auto rounded-3xl p-5 shadow-2xl relative space-y-3">
                            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            <h3 class="font-bold text-base text-white pr-6">¿Dónde se guardan mis datos?</h3>
                            <div class="text-xs text-slate-300 leading-relaxed space-y-2">
                                <p><b class="text-lasalle-yellow">En este dispositivo y navegador</b> (almacenamiento local del navegador). No se envía nada a ningún servidor ni a internet.</p>
                                ${this.storageInfo().map(r => `<div class="bg-slate-950 border border-slate-800 rounded-xl p-2"><div class="font-bold text-white">${esc(r[0])}</div><div class="text-[10px] text-slate-400">${esc(r[1])} · ${esc(r[2])}</div></div>`).join('')}
                                <p><b class="text-amber-300">Importante:</b> el histórico y las copias automáticas están en el mismo sitio. Si borras los datos del navegador, cambias de móvil o usas otro navegador, <b>se pierden</b> y no aparecen allí.</p>
                                <p>Las <b>copias descargadas</b> (botón "Copia completa") son archivos .json que tú eliges dónde guardar (en el móvil, en Archivos, Drive o donde prefieras; en el ordenador, en la carpeta que elijas). Esas son las copias realmente seguras: guárdalas también en tu nube o correo.</p>
                            </div>
                        </div>
                    </div>`;
            }

            // kind: 'history' | 'players' | 'player'
            askDeleteData(kind, pid) {
                this._del = { kind, pid: pid || '', copied: false };
                this.renderDeleteModal();
            }

            renderDeleteModal() {
                const d = this._del;
                if (!d) return;
                const list = this.loadHistory();
                let title = '', text = '';
                if (d.kind === 'history') {
                    title = 'Borrar todo el histórico';
                    text = `Se eliminarán los ${list.length} partidos guardados, con sus resultados, cronologías y las estadísticas de jugadores que contienen.`;
                } else if (d.kind === 'players') {
                    title = 'Borrar estadísticas de jugadores';
                    text = 'Se borrarán los acumulados de todos los jugadores (minutos, goles, asistencias y tarjetas) de todos los partidos del histórico. Los partidos y sus resultados se conservan.';
                } else {
                    let nm = 'este jugador';
                    list.forEach(e => e.players.forEach(p => { if (p.pid === d.pid) nm = p.name; }));
                    title = 'Borrar estadísticas de ' + nm;
                    text = `Se quitará a ${nm} de todos los partidos del histórico (sus minutos, goles, asistencias y tarjetas). Los resultados de los partidos se conservan.`;
                }
                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-rose-500/40 w-full max-w-sm rounded-3xl p-5 shadow-2xl space-y-3">
                            <h3 class="font-bold text-base text-white"><i class="fa-solid fa-triangle-exclamation text-rose-400 mr-1"></i> ${esc(title)}</h3>
                            <p class="text-sm text-slate-200">${esc(text)}</p>
                            <p class="text-xs text-amber-300">Esta acción no se puede deshacer. ¿Quieres guardar antes una copia de seguridad para poder recuperarla?</p>
                            <button onclick="app.deleteCopy()" class="w-full ${d.copied ? 'bg-emerald-600 text-white' : 'bg-lasalle-yellow text-lasalle-darkblue'} font-black py-2.5 rounded-xl text-sm">
                                <i class="fa-solid ${d.copied ? 'fa-check' : 'fa-download'} mr-1"></i> ${d.copied ? 'Copia descargada (revisa Descargas)' : 'Descargar copia de seguridad'}
                            </button>
                            <p class="text-[10px] text-slate-500">Se abrirá el selector para que elijas dónde guardar el archivo .json. Para recuperarlo: Inicio → "Restaurar copia".</p>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="app.cancelDelete()" class="bg-slate-800 text-slate-200 font-bold py-2.5 rounded-xl text-sm">Cancelar</button>
                                <button onclick="app.runDelete()" class="bg-rose-600 text-white font-black py-2.5 rounded-xl text-sm">${d.copied ? 'Borrar ahora' : 'Borrar sin copia'}</button>
                            </div>
                        </div>
                    </div>`;
            }

            async deleteCopy() {
                if (!this._del) return;
                const ok = await this.exportFullBackup();
                if (!this._del) return;
                this._del.copied = !!ok;
                this.renderDeleteModal();
            }

            cancelDelete() { this._del = null; this.closeModal(); }

            runDelete() {
                const d = this._del;
                this._del = null;
                this.closeModal();
                if (!d) return;
                const list = this.loadHistory();
                if (d.kind === 'history') this.history = [];
                else if (d.kind === 'players') list.forEach(e => { e.players = []; });
                else list.forEach(e => { e.players = e.players.filter(p => p.pid !== d.pid); });
                const ok = this.persistHistory();
                this.historyDetailId = null;
                this.render();
                this.showToast(ok ? 'Datos borrados' : 'No se pudo guardar el cambio');
            }

            // ============================ TEMPORADA ============================
            setHistView(v) { this.histView = v === 'season' ? 'season' : 'matches'; this.render(); }

            teamLabel(list, teamId) {
                const e = list.filter(x => x.match.teamId === teamId).sort((a, b) => b.match.date.localeCompare(a.match.date) || b.savedAt - a.savedAt)[0];
                if (!e) return 'Equipo';
                return (e.match.isHome ? e.match.homeTeam : e.match.awayTeam) + ' (' + this.shortId(teamId) + ')';
            }

            seasonData(list) {
                const comp = this.seasonComp || '';
                const team = this.seasonTeam || this.state.teamId;
                const rows = list.filter(e => e.match.teamId === team && (!comp || e.match.competition === comp));
                const map = new Map();
                rows.slice().sort((a, b) => a.match.date.localeCompare(b.match.date) || a.savedAt - b.savedAt).forEach(e => e.players.forEach(p => {
                    const key = p.pid || ('n:' + this.nameKey(p.name));
                    const r = map.get(key) || { pid: p.pid, name: p.name, pj: 0, mins: 0, g: 0, a: 0, y: 0, r: 0, starts: 0 };
                    r.name = p.name; // se muestra el nombre más reciente
                    if (p.mins > 0) r.pj++;
                    if (p.mins > 0 && (p.inMinute === null || p.inMinute === 0)) r.starts++;
                    r.mins += p.mins; r.g += p.goals; r.a += p.assists; r.y += p.yellow; r.r += p.red ? 1 : 0;
                    map.set(key, r);
                }));
                return { rows, players: Array.from(map.values()) };
            }

            setSeasonTeam(v) { this.seasonTeam = isSafeId(v) ? v : ''; this.seasonComp = ''; this.render(); }

            setSeasonSort(k) { this.seasonSort = ['name', 'pj', 'mins', 'g', 'a', 'y', 'r'].includes(k) ? k : 'g'; this.render(); }
            setSeasonComp(v) { this.seasonComp = cleanText(v, 60); this.render(); }

            renderSeasonScreen(list) {
                const teams = Array.from(new Set(list.map(e => e.match.teamId).filter(Boolean)));
                if (!this.seasonTeam || !teams.includes(this.seasonTeam)) this.seasonTeam = teams.includes(this.state.teamId) ? this.state.teamId : (teams[0] || this.state.teamId);
                const comps = Array.from(new Set(list.filter(e => e.match.teamId === this.seasonTeam).map(e => e.match.competition)));
                if (this.seasonComp && !comps.includes(this.seasonComp)) this.seasonComp = '';
                const sortKey = this.seasonSort || 'g';
                const { rows, players } = this.seasonData(list);
                players.sort((a, b) => sortKey === 'name' ? a.name.localeCompare(b.name, 'es') : (b[sortKey] - a[sortKey]) || a.name.localeCompare(b.name, 'es'));
                let w = 0, d = 0, l = 0, gf = 0, gc = 0;
                rows.forEach(e => { const [a, b] = this.ownGoals(e); gf += a; gc += b; if (a > b) w++; else if (a < b) l++; else d++; });
                const form = rows.slice().sort((a, b) => b.match.date.localeCompare(a.match.date) || b.savedAt - a.savedAt).slice(0, 5).map(e => {
                    const [a, b] = this.ownGoals(e);
                    return a > b ? ['V', 'bg-emerald-600'] : (a < b ? ['D', 'bg-rose-600'] : ['E', 'bg-amber-500']);
                });
                const maxG = Math.max(1, ...players.map(p => p.g)), maxA = Math.max(1, ...players.map(p => p.a)), maxM = Math.max(1, ...players.map(p => p.mins));
                const bar = (val, max, cls) => `<div class="h-1.5 bg-slate-800 rounded"><div class="h-1.5 rounded ${cls}" style="width:${Math.round(val / max * 100)}%"></div></div>`;
                const th = (k, label) => `<th class="px-1 py-1 cursor-pointer ${sortKey === k ? 'text-lasalle-yellow' : ''}" onclick="app.setSeasonSort('${k}')">${label}</th>`;
                return `
                <div class="p-4 space-y-4 pb-16">
                    <div class="flex items-center justify-between gap-2">
                        <h2 class="text-base font-extrabold text-lasalle-yellow"><i class="fa-solid fa-chart-column mr-1"></i> Temporada</h2>
                        <button onclick="app.switchTab('setup')" class="bg-slate-800 text-lasalle-yellow px-2.5 py-1 rounded-lg text-xs font-bold border border-lasalle-yellow/30"><i class="fa-solid fa-arrow-left"></i> Inicio</button>
                    </div>
                    <div class="grid grid-cols-2 gap-1 bg-slate-900 border border-slate-800 rounded-xl p-1">
                        <button onclick="app.setHistView('matches')" class="py-1.5 rounded-lg text-xs font-bold text-slate-300">Partidos</button>
                        <button class="py-1.5 rounded-lg text-xs font-black bg-lasalle-yellow text-lasalle-darkblue">Temporada</button>
                    </div>
                    ${list.length === 0 ? '<div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 text-center text-xs text-slate-400">Aún no hay partidos en el histórico.</div>' : `
                    ${teams.length > 1 ? `<select onchange="app.setSeasonTeam(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white">${teams.map(tm => `<option value="${esc(tm)}" ${tm === this.seasonTeam ? 'selected' : ''}>${esc(this.teamLabel(list, tm))}</option>`).join('')}</select>` : ''}
                    <select onchange="app.setSeasonComp(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white">
                        <option value="">Todas las competiciones</option>
                        ${comps.map(c => `<option value="${esc(c)}" ${c === this.seasonComp ? 'selected' : ''}>${esc(c)}</option>`).join('')}
                    </select>
                    <div class="grid grid-cols-5 gap-1.5 text-center">
                        ${[['PJ', rows.length, 'text-white'], ['V', w, 'text-emerald-400'], ['E', d, 'text-amber-400'], ['D', l, 'text-rose-400'], ['GF/GC', gf + '/' + gc, 'text-white']]
                            .map(([a, b, c]) => `<div class="bg-slate-900 border border-slate-800 rounded-xl py-2"><div class="text-base font-black ${c}">${b}</div><div class="text-[10px] text-slate-400">${a}</div></div>`).join('')}
                    </div>
                    <div class="flex items-center gap-1.5 text-[11px] text-slate-400">Últimos: ${form.map(f => `<span class="${f[1]} text-white font-black w-6 h-6 rounded flex items-center justify-center">${f[0]}</span>`).join('')}</div>
                    <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl">
                        <div class="overflow-x-auto">
                            <table class="w-full text-[11px] text-slate-300">
                                <thead><tr class="text-slate-400 text-left">${th('name', 'Jugador')}${th('pj', 'PJ')}${th('mins', 'Min')}${th('g', 'G')}${th('a', 'A')}${th('y', 'Am')}${th('r', 'Rj')}<th></th></tr></thead>
                                <tbody>${players.map(p => `<tr class="border-t border-slate-800 align-top">
                                    <td class="px-1 py-1.5 text-white font-bold">${esc(p.name)}<div class="text-[9px] font-normal text-slate-500">ID ${esc(this.shortId(p.pid))}</div></td><td class="px-1">${p.pj}</td>
                                    <td class="px-1 w-16">${p.mins}'${bar(p.mins, maxM, 'bg-sky-500')}</td>
                                    <td class="px-1 w-12">${p.g}${bar(p.g, maxG, 'bg-emerald-500')}</td>
                                    <td class="px-1 w-12">${p.a}${bar(p.a, maxA, 'bg-lasalle-yellow')}</td>
                                    <td class="px-1">${p.y}</td><td class="px-1">${p.r}</td><td class="px-1">${p.pid ? `<button onclick="app.askDeleteData('player','${esc(p.pid)}')" class="text-rose-400" aria-label="Borrar estadísticas de ${esc(p.name)}"><i class="fa-solid fa-trash"></i></button>` : ''}</td></tr>`).join('')}</tbody>
                            </table>
                        </div>
                        <p class="text-[10px] text-slate-500 mt-2">Los acumulados se agrupan por el ID permanente del jugador (no por dorsal ni por nombre). Toca una cabecera para ordenar.</p>
                        <div class="grid grid-cols-2 gap-2 mt-3">
                            <button onclick="app.askDeleteData('players')" class="bg-rose-600/20 text-rose-300 border border-rose-500/40 font-bold py-2 rounded-xl text-[11px]"><i class="fa-solid fa-trash mr-1"></i> Borrar estadísticas de jugadores</button>
                            <button onclick="app.openDataInfo()" class="bg-slate-800 text-lasalle-yellow font-bold py-2 rounded-xl text-[11px]"><i class="fa-solid fa-circle-info mr-1"></i> ¿Dónde se guardan?</button>
                        </div>
                    </div>`}
                </div>`;
            }

            // ============================ COMPARTIR RESUMEN ============================
            shareEntry(id) {
                if (id) return this.loadHistory().find(e => e.id === id) || null;
                return sanitizeHistoryEntry({ ...this.buildHistoryEntry(), id: this.state.match.matchId || newId('m') });
            }

            summaryLines(e) {
                const m = e.match;
                const [a, b] = this.ownGoals(e);
                const res = a > b ? 'Victoria' : (a < b ? 'Derrota' : 'Empate');
                const lines = [];
                lines.push(`${m.homeTeam} ${e.homeGoals} - ${e.awayGoals} ${m.awayTeam}`);
                lines.push(`${res} · Jornada ${m.matchday} · ${m.date} · ${m.competition}`);
                lines.push('');
                const evs = e.events.slice().sort((x, y) => x.minute - y.minute);
                const goals = evs.filter(x => ['goal', 'own_goal', 'goal_away', 'own_goal_away'].includes(x.type));
                if (goals.length) { lines.push('GOLES'); goals.forEach(x => lines.push(`${x.minute}' ${x.title}`)); lines.push(''); }
                const cards = evs.filter(x => x.type === 'card' || x.type === 'card_away');
                if (cards.length) { lines.push('TARJETAS'); cards.forEach(x => lines.push(`${x.minute}' ${x.title}`)); lines.push(''); }
                const subs = evs.filter(x => x.type === 'sub');
                if (subs.length) { lines.push('CAMBIOS'); subs.forEach(x => lines.push(`${x.minute}' ${x.title}`)); lines.push(''); }
                const asst = e.players.filter(p => p.assists > 0).map(p => `${p.name} (${p.assists})`);
                if (asst.length) { lines.push('ASISTENCIAS: ' + asst.join(', ')); lines.push(''); }
                const mins = e.players.filter(p => p.mins > 0).sort((x, y) => y.mins - x.mins).map(p => `${p.name} ${p.mins}'`);
                if (mins.length) lines.push('MINUTOS: ' + mins.join(' · '));
                return lines;
            }

            openShare(id) {
                const e = this.shareEntry(id);
                if (!e) return;
                this._shareId = id;
                const text = this.summaryLines(e).join('\n').trim() + '\n\n— StatBench360';
                this._shareText = text;
                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm max-h-[92vh] overflow-y-auto rounded-3xl p-5 shadow-2xl relative space-y-3">
                            <button onclick="app.closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                            <h3 class="font-bold text-base text-white pr-6">Compartir resumen</h3>
                            <pre class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-[11px] text-slate-200 whitespace-pre-wrap max-h-56 overflow-y-auto">${esc(text)}</pre>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="app.shareText()" class="bg-emerald-600 text-white font-black py-2.5 rounded-xl text-xs"><i class="fa-brands fa-whatsapp mr-1"></i> Enviar texto</button>
                                <button onclick="app.copyShare()" class="bg-slate-800 text-lasalle-yellow font-bold py-2.5 rounded-xl text-xs"><i class="fa-solid fa-copy mr-1"></i> Copiar</button>
                                <button onclick="app.shareImage()" class="bg-lasalle-yellow text-lasalle-darkblue font-black py-2.5 rounded-xl text-xs col-span-2"><i class="fa-solid fa-image mr-1"></i> Crear imagen</button>
                            </div>
                        </div>
                    </div>`;
            }

            shareText() {
                const text = this._shareText || '';
                if (navigator.share) { navigator.share({ text }).catch(() => {}); return; }
                const w = window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
                if (!w) this.copyShare();
            }

            copyShare() {
                const text = this._shareText || '';
                const fallback = () => {
                    const ta = document.createElement('textarea');
                    ta.value = text; document.body.appendChild(ta); ta.select();
                    try { document.execCommand('copy'); this.showToast('Resumen copiado'); } catch (e) { this.showToast('No se pudo copiar'); }
                    ta.remove();
                };
                if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => this.showToast('Resumen copiado'), fallback);
                else fallback();
            }

            shareImage() {
                const e = this.shareEntry(this._shareId);
                if (!e) return;
                const lines = this.summaryLines(e);
                const W = 1080, pad = 70;
                const cv = document.createElement('canvas');
                cv.width = W; cv.height = 1350;
                const c = cv.getContext('2d');
                c.fillStyle = '#0b1b3a'; c.fillRect(0, 0, W, cv.height);
                c.fillStyle = '#facc15'; c.fillRect(0, 0, W, 14);
                c.textBaseline = 'top';
                c.fillStyle = '#facc15'; c.font = 'bold 40px sans-serif';
                c.fillText('STATBENCH 360', pad, 50);
                let y = 130;
                const wrap = (txt, font, color, lh) => {
                    c.font = font; c.fillStyle = color;
                    let line = '';
                    txt.split(' ').forEach(word => {
                        const test = line ? line + ' ' + word : word;
                        if (c.measureText(test).width > W - pad * 2 && line) { c.fillText(line, pad, y); y += lh; line = word; }
                        else line = test;
                    });
                    c.fillText(line, pad, y); y += lh;
                };
                lines.forEach((ln, i) => {
                    if (y > cv.height - 100) return;
                    if (i === 0) wrap(ln, 'bold 56px sans-serif', '#ffffff', 70);
                    else if (i === 1) wrap(ln, '30px sans-serif', '#94a3b8', 44);
                    else if (ln === '') y += 14;
                    else if (/^[A-ZÁÉÍÓÚ]+(:|$)/.test(ln) && ln.length < 14) { y += 6; wrap(ln, 'bold 30px sans-serif', '#facc15', 42); }
                    else wrap(ln, '28px sans-serif', '#e2e8f0', 38);
                });
                c.fillStyle = '#64748b'; c.font = '24px sans-serif';
                c.fillText('Generado con StatBench360', pad, cv.height - 60);
                cv.toBlob(blob => {
                    if (!blob) { this.showToast('No se pudo crear la imagen'); return; }
                    const file = new File([blob], 'resumen_partido.png', { type: 'image/png' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        navigator.share({ files: [file] }).catch(() => {});
                    } else {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url; a.download = 'resumen_partido.png';
                        document.body.appendChild(a); a.click(); a.remove();
                        setTimeout(() => URL.revokeObjectURL(url), 1000);
                        this.showToast('Imagen descargada');
                    }
                }, 'image/png');
            }

            startNewMatch() {
                this.resetCurrentValues();
            }

            switchTab(tab) {
                this.state.currentTab = tab;
                this.render();
            }

            render() {
                this.syncTimer();
                const main = document.getElementById('main-content');
                const bottomNav = document.getElementById('bottom-nav');
                const subtitle = document.getElementById('header-match-subtitle');

                if (this.state.currentTab === 'setup') {
                    bottomNav.classList.add('hidden');
                    subtitle.textContent = 'Seguimiento & Estadisticas';
                    main.innerHTML = this.renderSetupScreen();
                    this.enhanceSetup(main);
                } else if (this.state.currentTab === 'history') {
                    bottomNav.classList.add('hidden');
                    subtitle.textContent = 'Histórico de partidos';
                    main.innerHTML = this.renderHistoryScreen();
                } else {
                    bottomNav.classList.remove('hidden');
                    subtitle.textContent = `J${this.state.match.matchday}: ${this.state.match.homeTeam} vs ${this.state.match.awayTeam}`;
                    
                    ['dashboard', 'lineup', 'timeline', 'stats'].forEach(t => {
                        const el = document.getElementById(`nav-${t}`);
                        if (el) {
                            el.className = t === this.state.currentTab 
                                ? "flex flex-col items-center text-lasalle-yellow py-1 px-3 rounded-xl font-bold scale-105"
                                : "flex flex-col items-center text-slate-300 hover:text-white py-1 px-3 rounded-xl";
                        }
                    });

                    if (this.state.currentTab === 'dashboard') main.innerHTML = this.renderDashboardScreen();
                    else if (this.state.currentTab === 'lineup') main.innerHTML = this.renderLineupScreen();
                    else if (this.state.currentTab === 'timeline') main.innerHTML = this.renderTimelineScreen();
                    else if (this.state.currentTab === 'stats') main.innerHTML = this.renderStatsScreen();
                    else if (this.state.currentTab === 'field') main.innerHTML = this.renderFieldScreen();
                }
                this.updateWake();
                this.saveToStorage();

            renderSetupScreen() {

                        <div>
                            <div class="text-xs font-bold text-lasalle-yellow mb-1">Banquillo (${subs.length})</div>
