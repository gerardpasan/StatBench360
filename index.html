    <!-- Application Logic -->  
    <script>  
    class FutStatApp {  
        constructor() {  
            this.state = {  
                currentTab: 'setup',  
                selectedPlayerIds: new Set(),  
                audioAlerts: {  
                    enabled: true,  
                    intervalMinutes: 5,  
                    customAlarms: []  
                },  
                match: {  
                    isHome: true,  
                    kitColor: 'Azul SD La Salle',  
                    homeTeam: '',  
                    awayTeam: '',  
                    date: new Date().toISOString().split('T')[0],  
                    matchday: '',  
                    competition: 'Liga Cadete Regional',  
                    stadium: 'Polideportivo La Salle',  
                    halfDuration: 40,  
                    status: 'setup',  
                    currentHalf: 1,  
                    timerSeconds: 0,  
                    halftimeSeconds: 0,  
                    timerRunning: false,  
                    timerInterval: null,  
                    halftimeInterval: null,  
                    halftimeScore: { lasalle: 0, rival: 0 }  
                },  
                score: { lasalle: 0, rival: 0 },  
                windows: {  
                    home: { used: 0, max: 3 },  
                    away: { used: 0, max: 3 }  
                },  
                squad: [],  
                staff: [],  
                events: []  
            };  
      
            this.loadFromStorage();  
            this.initApp();  
        }  
      
        initApp() {  
            if (this.state.match.status !== 'setup') {  
                this.switchTab(this.state.match.status === 'finished' ? 'stats' : 'dashboard');  
                if (this.state.match.timerRunning) this.startTimerInterval();  
                if (this.state.match.status === 'halftime') this.startHalftimeInterval();  
            } else {  
                this.switchTab('setup');  
            }  
        }  
      
        saveToStorage() {  
            try {  
                localStorage.setItem('salleapp360_v71126v8', JSON.stringify(this.state));  
            } catch(e) { console.error(e); }  
        }  
      
        loadFromStorage() {  
            const saved = localStorage.getItem('salleapp360_v71126v8');  
            if (saved) {  
                try {  
                    this.state = JSON.parse(saved);  
                    if (!this.state.selectedPlayerIds) {  
                        this.state.selectedPlayerIds = new Set();  
                    } else {  
                        this.state.selectedPlayerIds = new Set(Array.from(this.state.selectedPlayerIds));  
                    }  
                } catch(e) { console.error(e); }  
            } else {  
                this.state.selectedPlayerIds = new Set();  
                this.loadDefaultData();  
            }  
        }  
      
        loadDefaultData() {  
            const defaultNames = [  
                { name: 'Daniel Gándara Muñoz', pos: 'DEL', num: 9 },  
                { name: 'David Diéguez Peradejordi', pos: 'MED', num: 8 },  
                { name: 'Gabriel Morales Crespí', pos: 'DEF', num: 4 },  
                { name: 'Iván Carrasco Plamenov', pos: 'MED', num: 6 },  
                { name: 'Jaime Carbó Serra', pos: 'DEL', num: 11 },  
                { name: 'Joan Rubí Clar', pos: 'DEF', num: 3 },  
                { name: 'Jorge Ferreiro Castillo', pos: 'DEF', num: 5 },  
                { name: 'José Matheu Asensio (Pepo)', pos: 'DEL', num: 7 },  
                { name: 'Miquel Febrer Ventayol', pos: 'MED', num: 10 },  
                { name: 'Luis Morell Mir', pos: 'DEF', num: 2 },  
                { name: 'Luuk Krause', pos: 'MED', num: 14 },  
                { name: 'Marc Chanla La Hoz', pos: 'DEL', num: 15 },  
                { name: 'Marc Comas Martínez', pos: 'DEF', num: 12 },  
                { name: 'Miguel Bermúdez Rodríguez', pos: 'MED', num: 16 },  
                { name: 'Santiago Silva Giorgio', pos: 'DEL', num: 17 },  
                { name: 'Raúl Tejada Sabater', pos: 'DEF', num: 18 },  
                { name: 'Thiago Torres Gordenko', pos: 'MED', num: 19 },  
                { name: 'Gabriel Stevens Torres', pos: 'DEL', num: 20 },  
                { name: 'Alberto Torrens Matas', pos: 'POR', num: 1 },  
                { name: 'Muyz Olamide Usaman Salomon', pos: 'DEF', num: 21 },  
                { name: 'Álex Fuster Edwards', pos: 'MED', num: 22 },  
                { name: 'Yuhao Huang Xiang', pos: 'DEL', num: 23 }  
            ];  
      
            this.state.squad = defaultNames.map((p, i) => ({  
                id: 'p_' + i,  
                name: p.name,  
                number: p.num,  
                position: p.pos,  
                status: 'unconvoked',  
                inMinute: null,  
                outMinute: null,  
                goals: 0,   
                goalMinutes: [],   
                assists: 0,   
                yellowCards: 0,   
                redCard: false,   
                captain: false  
            }));  
            this.state.match.homeTeam = 'SD La Salle Cadete A';  
            this.state.match.awayTeam = 'Rival FC';  
            this.state.match.matchday = '1';  
            this.state.match.competition = 'Liga Cadete Regional';  
        }  
      
        speak(text) {  
            if (!('speechSynthesis' in window)) return;  
            window.speechSynthesis.cancel();  
            const utterance = new SpeechSynthesisUtterance(text);  
            utterance.lang = 'es-ES';  
            utterance.rate = 1.0;  
            window.speechSynthesis.speak(utterance);  
        }  
      
        checkAudioAlerts() {  
            if (this.state.match.status === 'setup' || this.state.match.status === 'halftime') return;  
            const currentSecs = this.state.match.timerSeconds;  
            const currentMins = Math.floor(currentSecs / 60);  
          
            if (this.state.audioAlerts.enabled && currentSecs > 0 && currentSecs % 60 === 0) {  
                const interval = parseInt(this.state.audioAlerts.intervalMinutes) || 5;  
                if (currentMins % interval === 0) {  
                    this.speak(`Minuto ${currentMins}`);  
                }  
            }  
          
            if (this.state.audioAlerts.customAlarms && this.state.audioAlerts.customAlarms.length > 0) {  
                const matchIndex = this.state.audioAlerts.customAlarms.findIndex(alarmSec => alarmSec === currentSecs);  
                if (matchIndex !== -1) {  
                    this.speak(`Atención. Alerta programada en el minuto ${currentMins}`);  
                    this.state.audioAlerts.customAlarms.splice(matchIndex, 1);  
                }  
            }  
        }  
      
        goHomeTab() {  
            this.state.currentTab = 'setup';  
            this.render();  
        }  
      
        resetCurrentValues() {  
            if (!confirm('¿Estás seguro de resetear todos los valores actuales de configuración y partido?')) return;   
            this.state.match.status = 'setup';  
            this.state.match.timerSeconds = 0;  
            this.state.match.halftimeSeconds = 0;  
            this.state.match.timerRunning = false;  
            if (this.state.match.timerInterval) clearInterval(this.state.match.timerInterval);  
            if (this.state.match.halftimeInterval) clearInterval(this.state.match.halftimeInterval);   
            this.state.score = { lasalle: 0, rival: 0 };  
            this.state.windows = { home: { used: 0, max: 3 }, away: { used: 0, max: 3 } };  
            this.state.events = [];  
            this.state.audioAlerts.customAlarms = [];  
            this.state.match.homeTeam = '';  
            this.state.match.awayTeam = '';  
            this.state.match.matchday = '';  
            this.state.match.competition = '';  
            this.state.selectedPlayerIds.clear();  
          
            this.state.squad.forEach(p => {  
                p.goals = 0;  
                p.goalMinutes = [];  
                p.assists = 0;  
                p.yellowCards = 0;  
                p.redCard = false;  
                p.captain = false;  
                p.status = 'unconvoked';  
                p.inMinute = null;  
                p.outMinute = null;  
            });  
          
            this.switchTab('setup');  
        }  
      
        startNewMatch() {  
            this.resetCurrentValues();  
        }  
      
        switchTab(tab) {   
            this.state.currentTab = tab;  
            this.render();  
        }  
      
        render() {  
            const main = document.getElementById('main-content');  
            const bottomNav = document.getElementById('bottom-nav');  
            const subtitle = document.getElementById('header-match-subtitle');  
          
            if (this.state.currentTab === 'setup') {  
                bottomNav.classList.add('hidden');  
                subtitle.textContent = 'Configuración y Convocatoria';  
                main.innerHTML = this.renderSetupScreen();  
            } else {  
                bottomNav.classList.remove('hidden');  
                subtitle.textContent = `J${this.state.match.matchday}: ${this.state.match.homeTeam} vs ${this.state.match.awayTeam}`;  
               
                ['dashboard', 'lineup', 'timeline', 'stats'].forEach(t => {  
                    const el = document.getElementById(`nav-${t}`);  
                    if (el) {  
                        el.className = t === this.state.currentTab   
                            ? "flex flex-col items-center text-lasalle-yellow py-1 px-3 rounded-xl font-bold scale-105"  
                            : "flex flex-col items-center text-slate-300 hover:text-white py-1 px-3 rounded-xl";  
                    }  
                });  
              
                if (this.state.currentTab === 'dashboard') main.innerHTML = this.renderDashboardScreen();  
                else if (this.state.currentTab === 'lineup') main.innerHTML = this.renderLineupScreen();  
                else if (this.state.currentTab === 'timeline') main.innerHTML = this.renderTimelineScreen();  
                else if (this.state.currentTab === 'stats') main.innerHTML = this.renderStatsScreen();  
            }  
            this.saveToStorage();  
        }  

        // [Nota: Aquí se integran los métodos de renderizado de pantallas de tu app original con los cambios solicitados]
        // ...
    }  
    </script>
