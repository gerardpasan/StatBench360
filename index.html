<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StatBench360</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lasalle: {
                            blue: '#002B66',
                            darkblue: '#001A40',
                            navy: '#00122E',
                            yellow: '#FFCC00',
                            yellowhover: '#E6B800',
                            gold: '#D4AF37'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF & Tesseract.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #00122E; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-lasalle-navy text-slate-100 min-h-screen flex flex-col selection:bg-lasalle-yellow selection:text-lasalle-darkblue">

    <!-- App Container -->
    <div id="app" class="flex-1 flex flex-col max-w-md mx-auto w-full bg-lasalle-darkblue shadow-2xl relative overflow-hidden border-x border-slate-800 pb-16">
        
        <!-- Header (Fijo / Sticky arriba) -->
        <header class="bg-lasalle-blue/95 backdrop-blur-md border-b border-lasalle-yellow/30 px-4 py-3 flex items-center justify-between sticky top-0 z-50 shadow-md">
            <div class="flex items-center space-x-3">
                <div class="bg-lasalle-yellow text-lasalle-darkblue p-2 rounded-xl font-black text-lg flex items-center justify-center w-10 h-10 shadow-lg shadow-lasalle-yellow/20 overflow-hidden border border-lasalle-gold">
                    <i class="fa-solid fa-shield-halved text-lasalle-darkblue"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-base tracking-tight leading-none text-white flex items-center gap-1.5">
                        STATBENCH <span class="text-lasalle-yellow text-[10px] font-black">360</span>
                    </h1>
                    <span id="header-match-subtitle" class="text-xs text-slate-300 font-medium">Seguimiento & Estadisticas</span>
                </div>
            </div>
            <div id="header-actions" class="flex items-center space-x-2">
                <button onclick="app.goHomeTab()" class="px-2.5 py-1.5 rounded-xl bg-lasalle-darkblue hover:bg-slate-800 text-lasalle-yellow text-xs font-bold transition-all border border-lasalle-yellow/30 flex items-center gap-1 shadow">
                    <i class="fa-solid fa-house"></i> Inicio
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="flex-1 overflow-y-auto pb-24">
            <!-- Rendered dynamically by JS -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav id="bottom-nav" class="hidden fixed bottom-6 left-0 right-0 max-w-md mx-auto bg-lasalle-blue/95 backdrop-blur-lg border-t border-lasalle-yellow/20 px-4 py-2 flex justify-around items-center z-40 shadow-2xl">
            <button onclick="app.switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center text-lasalle-yellow py-1 px-3 rounded-xl transition-all">
                <i class="fa-solid fa-gauge-high text-lg"></i>
                <span class="text-[10px] font-semibold mt-1">Directo</span>
            </button>
            <button onclick="app.switchTab('lineup')" id="nav-lineup" class="flex flex-col items-center text-slate-300 hover:text-white py-1 px-3 rounded-xl transition-all">
                <i class="fa-solid fa-users text-lg"></i>
                <span class="text-[10px] font-semibold mt-1">Plantilla</span>
            </button>
            <button onclick="app.switchTab('timeline')" id="nav-timeline" class="flex flex-col items-center text-slate-300 hover:text-white py-1 px-3 rounded-xl transition-all">
                <i class="fa-solid fa-timeline text-lg"></i>
                <span class="text-[10px] font-semibold mt-1">Cronología</span>
            </button>
            <button onclick="app.switchTab('stats')" id="nav-stats" class="flex flex-col items-center text-slate-300 hover:text-white py-1 px-3 rounded-xl transition-all">
                <i class="fa-solid fa-tv text-lg"></i>
                <span class="text-[10px] font-semibold mt-1">Acta / PDF</span>
            </button>
        </nav>

        <!-- Fixed Footer Signature -->
        <footer class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-lasalle-navy border-t border-slate-800 py-1.5 text-center text-[10px] text-slate-400 font-bold z-50 tracking-wider shadow-inner">
            Generated by GpM1978
        </footer>

        <!-- Modals Container -->
        <div id="modal-container"></div>
    </div>

    <!-- Application Logic -->
    <script>
        // ===== Utilidades de seguridad y validación =====
        const STORAGE_KEY = 'statbench360_global_v3';
        const POSITIONS = ['POR', 'DEF', 'MED', 'DEL'];
        const PLAYER_STATUSES = ['starter', 'bench', 'unconvoked', 'substituted', 'out'];
        const MATCH_STATUSES = ['setup', 'first_half', 'halftime', 'second_half', 'finished'];
        const TABS = ['setup', 'dashboard', 'lineup', 'timeline', 'stats'];
        const GOAL_TYPES = ['normal', 'penalty', 'own', 'freekick'];

        // Escapa texto antes de insertarlo en HTML (contenido y atributos)
        const esc = s => String(s ?? '').replace(/[&<>"']/g,
            c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        // Normaliza texto libre: sin caracteres de control, espacios colapsados y longitud limitada
        const cleanText = (s, max = 60) => String(s ?? '')
            .replace(/[\u0000-\u001F\u007F]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, max);

        const toInt = (v, def = 0, min = 0, max = 100000) => {
            const n = Math.floor(Number(v));
            return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : def;
        };

        // Fecha local (toISOString devuelve UTC y falla cerca de medianoche)
        const localDate = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        const newId = prefix => `${prefix}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`;
        const isSafeId = s => typeof s === 'string' && /^[A-Za-z0-9_-]{1,40}$/.test(s);

        // Celda CSV segura: comillas escapadas y protección contra inyección de fórmulas
        const csvCell = v => {
            let s = String(v ?? '');
            if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
            return '"' + s.replace(/"/g, '""') + '"';
        };

        const safeFile = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40);

        function sanitizePlayer(p) {
            if (!p || typeof p !== 'object') return null;
            const minute = v => (v === null || v === undefined) ? null : toInt(v, 0, 0, 300);
            const nums = a => Array.isArray(a) ? a.slice(0, 50).map(x => toInt(x, 0, 0, 300)) : [];
            return {
                id: isSafeId(p.id) ? p.id : newId('p'),
                name: cleanText(p.name, 40) || 'Jugador',
                number: toInt(p.number, 0, 0, 99),
                position: POSITIONS.includes(p.position) ? p.position : 'MED',
                status: PLAYER_STATUSES.includes(p.status) ? p.status : 'unconvoked',
                initialStatus: PLAYER_STATUSES.includes(p.initialStatus) ? p.initialStatus : undefined,
                inMinute: minute(p.inMinute),
                outMinute: minute(p.outMinute),
                goals: toInt(p.goals, 0, 0, 99),
                goalMinutes: nums(p.goalMinutes),
                goalTypes: Array.isArray(p.goalTypes)
                    ? p.goalTypes.slice(0, 50).map(t => GOAL_TYPES.includes(t) ? t : 'normal') : [],
                assists: toInt(p.assists, 0, 0, 99),
                yellowCards: toInt(p.yellowCards, 0, 0, 2),
                redCard: !!p.redCard,
                captain: !!p.captain
            };
        }

        function sanitizeEvent(e) {
            if (!e || typeof e !== 'object') return null;
            return {
                id: isSafeId(e.id) ? e.id : newId('ev'),
                minute: toInt(e.minute, 0, 0, 300),
                type: cleanText(e.type, 20),
                team: cleanText(e.team, 10),
                title: cleanText(e.title, 200),
                detail: cleanText(e.detail, 400)
            };
        }

        const sanitizeScore = s => ({ local: toInt(s && s.local, 0, 0, 99), rival: toInt(s && s.rival, 0, 0, 99) });
        const sanitizeWindows = w => ({
            home: { used: toInt(w && w.home && w.home.used, 0, 0, 3), max: 3 },
            away: { used: toInt(w && w.away && w.away.used, 0, 0, 3), max: 3 }
        });
        const sanitizeSquad = arr => {
            const seen = new Set();
            return (Array.isArray(arr) ? arr.slice(0, 100) : []).map(sanitizePlayer).filter(Boolean).map(p => {
                if (seen.has(p.id)) p.id = newId('p');
                seen.add(p.id);
                return p;
            });
        };

        // Valida y reconstruye todo el estado leído de localStorage (nunca se confía en él)
        function sanitizeState(raw) {
            if (!raw || typeof raw !== 'object') return null;
            const m = (raw.match && typeof raw.match === 'object') ? raw.match : {};
            const a = (raw.audioAlerts && typeof raw.audioAlerts === 'object') ? raw.audioAlerts : {};
            const ts = v => (Number.isFinite(Number(v)) && Number(v) > 0) ? Number(v) : null;
            const squad = sanitizeSquad(raw.squad);
            const ids = new Set(squad.map(p => p.id));
            const undoStack = (Array.isArray(raw.undoStack) ? raw.undoStack.slice(-10) : [])
                .filter(u => u && isSafeId(u.eventId) && u.snap && typeof u.snap === 'object')
                .map(u => ({
                    eventId: u.eventId,
                    snap: { squad: sanitizeSquad(u.snap.squad), score: sanitizeScore(u.snap.score), windows: sanitizeWindows(u.snap.windows) }
                }));
            return {
                currentTab: TABS.includes(raw.currentTab) ? raw.currentTab : 'setup',
                selectedPlayerIds: new Set((Array.isArray(raw.selectedPlayerIds) ? raw.selectedPlayerIds : []).filter(id => ids.has(id))),
                matchResetted: raw.matchResetted !== false,
                audioAlerts: {
                    enabled: a.enabled !== false,
                    intervalMinutes: toInt(a.intervalMinutes, 5, 1, 60),
                    customAlarms: (Array.isArray(a.customAlarms) ? a.customAlarms.slice(0, 50) : []).map(x => toInt(x, 0, 0, 20000))
                },
                match: {
                    isHome: m.isHome !== false,
                    homeTeam: cleanText(m.homeTeam, 40) || 'Equipo Local',
                    awayTeam: cleanText(m.awayTeam, 40) || 'Equipo Visitante',
                    date: /^\d{4}-\d{2}-\d{2}$/.test(m.date) ? m.date : localDate(),
                    matchday: cleanText(m.matchday, 10) || '1',
                    competition: cleanText(m.competition, 60) || 'Liga Oficial',
                    halfDuration: toInt(m.halfDuration, 45, 1, 120),
                    status: MATCH_STATUSES.includes(m.status) ? m.status : 'setup',
                    currentHalf: m.currentHalf === 2 ? 2 : 1,
                    timerSeconds: toInt(m.timerSeconds, 0, 0, 20000),
                    halftimeSeconds: toInt(m.halftimeSeconds, 0, 0, 20000),
                    timerRunning: !!m.timerRunning,
                    lastTickMs: ts(m.lastTickMs),
                    halftimeStartMs: ts(m.halftimeStartMs)
                },
                score: sanitizeScore(raw.score),
                windows: sanitizeWindows(raw.windows),
                squad,
                events: (Array.isArray(raw.events) ? raw.events.slice(0, 500) : []).map(sanitizeEvent).filter(Boolean),
                undoStack
            };
        }

        class FutStatApp {
            constructor() {
                this.state = {
                    currentTab: 'setup',
                    selectedPlayerIds: new Set(),
                    matchResetted: true,
                    audioAlerts: {
                        enabled: true,
                        intervalMinutes: 5,
                        customAlarms: []
                    },
                    match: {
                        isHome: true,
                        homeTeam: 'Equipo Local',
                        awayTeam: 'Equipo Visitante',
                        date: localDate(),
                        matchday: '1',
                        competition: 'Liga Oficial',
                        halfDuration: 45,
                        status: 'setup',
                        currentHalf: 1,
                        timerSeconds: 0,
                        halftimeSeconds: 0,
                        timerRunning: false,
                        lastTickMs: null,
                        halftimeStartMs: null
                    },
                    score: { local: 0, rival: 0 },
                    windows: {
                        home: { used: 0, max: 3 },
                        away: { used: 0, max: 3 }
                    },
                    squad: [],
                    events: [],
                    undoStack: []
                };

                this.timerHandle = null;
                this.halftimeHandle = null;
                // Al volver a la app (pantalla bloqueada, otra pestaña) el cronómetro se pone al día
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) { this.syncTimer(); this.refreshTimerDisplay(); }
                });

                this.loadFromStorage();
                this.initApp();
            }

            initApp() {
                const st = this.state.match.status;
                if (st !== 'setup') {
                    this.switchTab(st === 'finished' ? 'stats' : 'dashboard');
                    if (st === 'first_half' || st === 'second_half') this.startTimerInterval();
                    if (st === 'halftime') this.startHalftimeInterval();
                } else {
                    this.switchTab('setup');
                }
            }

            saveToStorage() {
                try {
                    const toSave = { ...this.state, selectedPlayerIds: Array.from(this.state.selectedPlayerIds) };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
                } catch (e) { console.error(e); }
            }

            loadFromStorage() {
                let saved = null;
                try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) { console.error(e); }
                if (saved) {
                    try {
                        const clean = sanitizeState(JSON.parse(saved));
                        if (clean) { this.state = clean; return; }
                    } catch (e) { console.error('Datos guardados no válidos, se usan los de ejemplo.', e); }
                }
                this.state.selectedPlayerIds = new Set();
                this.loadDefaultData();
            }

            loadDefaultData() {
                const defaultNames = Array.from({length: 22}, (_, i) => ({
                    name: `Jugador ${i + 1}`,
                    pos: i === 0 ? 'POR' : (i < 5 ? 'DEF' : (i < 12 ? 'MED' : 'DEL')),
                    num: i + 1
                }));

                this.state.squad = defaultNames.map((p, i) => ({
                    id: 'p_' + i,
                    name: p.name,
                    number: p.num,
                    position: p.pos,
                    status: i < 11 ? 'starter' : (i < 18 ? 'bench' : 'unconvoked'),
                    inMinute: i < 11 ? 0 : null,
                    outMinute: null,
                    goals: 0, 
                    goalMinutes: [], 
                    goalTypes: [],
                    assists: 0, 
                    yellowCards: 0, 
                    redCard: false, 
                    captain: i === 0
                }));
                this.state.match.homeTeam = 'Equipo Local';
                this.state.match.awayTeam = 'Equipo Visitante';
                this.state.match.matchday = '1';
                this.state.match.competition = 'Liga Oficial';
                this.state.matchResetted = true;
            }

            speak(text) {
                if (!('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }

            checkAudioAlerts(prevSecs) {
                const m = this.state.match;
                if (m.status === 'setup' || m.status === 'halftime') return;

                const cur = m.timerSeconds;
                const alerts = this.state.audioAlerts;
                const messages = [];

                // Aviso periódico: se dispara al cruzar un minuto múltiplo del intervalo (aunque se pierda algún tick)
                const curMin = Math.floor(cur / 60);
                const interval = parseInt(alerts.intervalMinutes) || 5;
                if (alerts.enabled && curMin > 0 && curMin !== Math.floor(prevSecs / 60) && curMin % interval === 0) {
                    messages.push(`Minuto ${curMin}`);
                }

                // Alarmas puntuales: se disparan al alcanzar o superar el segundo programado
                if (Array.isArray(alerts.customAlarms) && alerts.customAlarms.length > 0) {
                    const due = alerts.customAlarms.filter(s => s <= cur);
                    if (due.length > 0) {
                        alerts.customAlarms = alerts.customAlarms.filter(s => s > cur);
                        messages.push(`Atención. Alerta programada en el minuto ${Math.floor(Math.max(...due) / 60)}`);
                    }
                }

                if (messages.length > 0) this.speak(messages.join('. '));
            }

            goHomeTab() {
                this.state.currentTab = 'setup';
                this.render();
            }

            resetCurrentValues() {
                if (!confirm('¿Resetear el partido actual (marcador, eventos, cronómetro y estadísticas)?')) return;
                const keepSquad = !confirm('¿Quieres también BORRAR la plantilla y volver a la de ejemplo?\n\nAceptar = borrar la plantilla\nCancelar = mantener la plantilla');

                this.stopTimers();
                const m = this.state.match;
                m.status = 'setup';
                m.currentHalf = 1;
                m.timerSeconds = 0;
                m.halftimeSeconds = 0;
                m.timerRunning = false;
                m.lastTickMs = null;
                m.halftimeStartMs = null;

                this.state.score = { local: 0, rival: 0 };
                this.state.windows = { home: { used: 0, max: 3 }, away: { used: 0, max: 3 } };
                this.state.events = [];
                this.state.undoStack = [];
                this.state.audioAlerts.customAlarms = [];
                m.homeTeam = 'Equipo Local';
                m.awayTeam = 'Equipo Visitante';
                m.matchday = '1';
                m.competition = 'Liga Oficial';
                m.date = localDate();
                this.state.selectedPlayerIds.clear();
                this.state.matchResetted = true;

                if (keepSquad) this.resetSquadStats();
                else this.loadDefaultData();
                this.switchTab('setup');
            }

            // Nuevo partido conservando la plantilla: vuelve a la convocatoria inicial y pone las estadísticas a cero
            resetSquadStats() {
                this.state.squad.forEach(p => {
                    const status = p.initialStatus || (['substituted', 'out'].includes(p.status) ? 'bench' : p.status);
                    p.status = status;
                    p.inMinute = status === 'starter' ? 0 : null;
                    p.outMinute = null;
                    p.goals = 0;
                    p.goalMinutes = [];
                    p.goalTypes = [];
                    p.assists = 0;
                    p.yellowCards = 0;
                    p.redCard = false;
                    delete p.initialStatus;
                });
            }

            askConfirm(message, onYes, yesLabel = 'Aceptar') {
                this._confirmCb = onYes;
                document.getElementById('modal-container').innerHTML = `
                    <div class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl">
                            <p class="text-sm text-white mb-4">${esc(message)}</p>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="app.closeModal()" class="bg-slate-800 text-slate-200 font-bold py-2.5 rounded-xl text-sm">Cancelar</button>
                                <button onclick="app.runConfirm()" class="bg-lasalle-yellow text-lasalle-darkblue font-black py-2.5 rounded-xl text-sm">${esc(yesLabel)}</button>
                            </div>
                        </div>
                    </div>`;
            }

            runConfirm() {
                const cb = this._confirmCb;
                this._confirmCb = null;
                this.closeModal();
                if (cb) cb();
            }

            stopTimers() {
                if (this.timerHandle) { clearInterval(this.timerHandle); this.timerHandle = null; }
                if (this.halftimeHandle) { clearInterval(this.halftimeHandle); this.halftimeHandle = null; }
            }

            // ----- Deshacer -----
            takeSnapshot() {
                return {
                    squad: JSON.parse(JSON.stringify(this.state.squad)),
                    score: { ...this.state.score },
                    windows: JSON.parse(JSON.stringify(this.state.windows))
                };
            }

            commitEvent(ev, snap) {
                this.state.events.push(ev);
                this.state.undoStack.push({ eventId: ev.id, snap });
                if (this.state.undoStack.length > 10) this.state.undoStack.shift();
            }

            renderUndoButton() {
                const last = this.state.undoStack[this.state.undoStack.length - 1];
                if (!last || this.state.match.status === 'finished') return '';
                const ev = this.state.events.find(e => e.id === last.eventId);
                return `<button onclick="app.undoLastEvent()" class="w-full bg-slate-900 border border-rose-500/40 text-rose-300 font-bold py-2 px-3 rounded-xl text-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-left"></i> Deshacer último: <span class="truncate max-w-[200px]">${esc(ev ? ev.title : 'evento')}</span>
                </button>`;
            }

            undoLastEvent() {
                const last = this.state.undoStack[this.state.undoStack.length - 1];
                if (!last) return;
                const ev = this.state.events.find(e => e.id === last.eventId);
                this.askConfirm(`¿Deshacer "${ev ? ev.title : 'el último evento'}"?`, () => {
                    this.state.undoStack.pop();
                    this.state.squad = last.snap.squad;
                    this.state.score = last.snap.score;
                    this.state.windows = last.snap.windows;
                    this.state.events = this.state.events.filter(e => e.id !== last.eventId);
                    this.render();
                }, 'Deshacer');
            }

            startNewMatch() {
                this.resetCurrentValues();
            }

            switchTab(tab) {
                this.state.currentTab = tab;
                this.render();
            }

            render() {
                this.syncTimer();
                const main = document.getElementById('main-content');
                const bottomNav = document.getElementById('bottom-nav');
                const subtitle = document.getElementById('header-match-subtitle');

                if (this.state.currentTab === 'setup') {
                    bottomNav.classList.add('hidden');
                    subtitle.textContent = 'Seguimiento & Estadisticas';
                    main.innerHTML = this.renderSetupScreen();
                } else {
                    bottomNav.classList.remove('hidden');
                    subtitle.textContent = `J${this.state.match.matchday}: ${this.state.match.homeTeam} vs ${this.state.match.awayTeam}`;
                    
                    ['dashboard', 'lineup', 'timeline', 'stats'].forEach(t => {
                        const el = document.getElementById(`nav-${t}`);
                        if (el) {
                            el.className = t === this.state.currentTab 
                                ? "flex flex-col items-center text-lasalle-yellow py-1 px-3 rounded-xl font-bold scale-105"
                                : "flex flex-col items-center text-slate-300 hover:text-white py-1 px-3 rounded-xl";
                        }
                    });

                    if (this.state.currentTab === 'dashboard') main.innerHTML = this.renderDashboardScreen();
                    else if (this.state.currentTab === 'lineup') main.innerHTML = this.renderLineupScreen();
                    else if (this.state.currentTab === 'timeline') main.innerHTML = this.renderTimelineScreen();
                    else if (this.state.currentTab === 'stats') main.innerHTML = this.renderStatsScreen();
                }
                this.saveToStorage();
            }

            renderSetupScreen() {
                const starters = this.state.squad.filter(p => p.status === 'starter');
                const subs = this.state.squad.filter(p => p.status === 'bench');
                const unconv = this.state.squad.filter(p => p.status === 'unconvoked');
                const isMatchActive = this.state.match.status !== 'setup' && this.state.match.status !== 'finished';
                const isFinished = this.state.match.status === 'finished';

                        <div class="grid grid-cols-2 gap-2">

                            <div>
                                <label class="text-[11px] text-slate-300 font-bold">Equipo Visitante</label>

                            </div>
                        </div>
                        <div>
                            <label class="text-[11px] text-slate-300 font-bold">Liga / Competición</label>
                            <input type="text" id="set-competition" maxlength="60" value="${esc(this.state.match.competition)}" placeholder="Liga Oficial" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-white mt-1" oninput="app.updateMatchMeta()">
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="text-[11px] text-slate-300 font-bold">Jornada</label>
                                <input type="text" id="set-matchday" maxlength="10" value="${esc(this.state.match.matchday)}" placeholder="1" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-white" oninput="app.updateMatchMeta()">

                                <input type="date" id="set-date" value="${esc(this.state.match.date || todayFormatted)}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-white" onchange="app.updateMatchMeta()">

                                <label class="text-[11px] text-slate-300 font-bold">Duración (min)</label>

                                    </div>

                                        <span class="flex-1 text-slate-300 truncate">${esc(p.name)}</span>

                                        </div>

                                <div class="text-xs font-bold text-slate-300 truncate">${esc(rightTeamName)}</div>

                                </button>
                                <button onclick="app.cancelHalftime()" class="w-full text-slate-400 text-[11px] underline">Volver a la 1ª parte (deshacer descanso)</button>
                            </div>
                        ` : `
                            <div class="flex items-center gap-2 mt-3 pt-3 border-t border-slate-800">
                                <button onclick="app.toggleTimer()" class="flex-1 bg-slate-800 text-white py-2 rounded-xl text-xs font-bold">
                                    <i class="fa-solid ${this.state.match.timerRunning ? 'fa-pause text-amber-400' : 'fa-play text-emerald-400'}"></i>
                                    ${this.state.match.timerRunning ? 'Pausar' : 'Reanudar'}

                                        <i class="fa-solid fa-mug-hot mr-1"></i> Ir al Descanso
                                    </button>
                                ` : `
                                    <button onclick="app.finishMatch()" class="flex-1 bg-rose-600/30 text-rose-300 border border-rose-500/40 py-2 rounded-xl text-xs font-bold">

                                <div class="text-[10px] uppercase font-bold text-slate-400">Ventanas Visitante</div>

                                    <span class="font-bold text-lasalle-yellow">#${esc(p.number)} ${esc(p.name)} ${p.captain ? '(C)' : ''}</span>

            renderLineupScreen() {
                const starters = this.state.squad.filter(p => p.status === 'starter');
                const subs = this.state.squad.filter(p => p.status === 'bench');
                const outPlayers = this.state.squad.filter(p => p.status === 'substituted' || p.status === 'out');

            downloadSquadCSV() {
                if (this.state.squad.length === 0) {
                    alert('No hay jugadores en la plantilla para descargar.');
                    return;
                }
                const csv = this.state.squad.map(p => [p.number, csvCell(p.name)].join(',')).join('\r\n') + '\r\n';
                this.downloadCSV('plantilla_statbench_' + (safeFile(this.state.match.homeTeam) || 'equipo') + '.csv', csv);
            }

            downloadCSV(fileName, csv) {
                const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }

            updateAudioSettings() {
                const enabledEl = document.getElementById('audio-enabled');
                const intervalEl = document.getElementById('audio-interval');
                if (enabledEl) this.state.audioAlerts.enabled = enabledEl.value === 'true';
                if (intervalEl) this.state.audioAlerts.intervalMinutes = parseInt(intervalEl.value);
                this.saveToStorage();
            }

            updateMatchMeta() {
                const val = id => { const el = document.getElementById(id); return el ? el.value : null; };
                const m = this.state.match;
                const home = val('set-home'), away = val('set-away'), comp = val('set-competition');
                const day = val('set-matchday'), date = val('set-date'), dur = val('set-duration');
                if (home !== null) m.homeTeam = cleanText(home, 40);
                if (away !== null) m.awayTeam = cleanText(away, 40);
                if (comp !== null) m.competition = cleanText(comp, 60);
                if (day !== null) m.matchday = cleanText(day, 10);
                if (date !== null && /^\d{4}-\d{2}-\d{2}$/.test(date)) m.date = date;
                if (dur !== null) {
                    const d = parseInt(dur, 10);
                    if (d >= 1 && d <= 120) m.halfDuration = d;
                }
                this.saveToStorage();
            }

            setMatchCondition(isHome) {
                this.state.match.isHome = isHome;
                this.render();
            }

            startMatch() {
                if (!this.state.matchResetted) {
                    alert('Debes resetear los valores o iniciar un nuevo partido antes de continuar.');
                    return;
                }

                const startersCount = this.state.squad.filter(p => p.status === 'starter').length;
                if (startersCount !== 11) {
                    if (!confirm(`Atención: Hay ${startersCount} jugadores titulares seleccionados en lugar de 11. ¿Deseas iniciar el partido de todas formas?`)) {
                        return;
                    }
                }

                const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
                const duration = parseInt(val('set-duration'), 10);
                const date = val('set-date');
                const m = this.state.match;

                m.homeTeam = cleanText(val('set-home'), 40) || 'Equipo Local';
                m.awayTeam = cleanText(val('set-away'), 40) || 'Equipo Visitante';
                m.competition = cleanText(val('set-competition'), 60) || 'Liga Oficial';
                m.matchday = cleanText(val('set-matchday'), 10) || '1';
                m.date = /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : localDate();
                m.halfDuration = (duration >= 1 && duration <= 120) ? duration : 45;
                m.status = 'first_half';
                m.currentHalf = 1;
                m.timerSeconds = 0;
                m.halftimeSeconds = 0;
                m.halftimeStartMs = null;
                m.timerRunning = true;
                m.lastTickMs = Date.now();
                this.state.matchResetted = false;
                this.state.undoStack = [];
                // Guarda la convocatoria inicial para poder empezar otro partido con la misma plantilla
                this.state.squad.forEach(p => { p.initialStatus = p.status; });

                this.startTimerInterval();
                this.switchTab('dashboard');
            }

            // El cronómetro se calcula con la hora real (Date.now) y no cuenta "ticks":
            // así no se desfasa si el móvil ralentiza el temporizador o bloquea la pantalla.
            syncTimer() {
                const m = this.state.match;
                if (!m.timerRunning || m.status === 'setup' || m.status === 'halftime' || m.status === 'finished') {
                    m.lastTickMs = null;
                    return;
                }
                const now = Date.now();
                if (!m.lastTickMs || now < m.lastTickMs) { m.lastTickMs = now; return; }
                const delta = Math.floor((now - m.lastTickMs) / 1000);
                if (delta <= 0) return;
                m.lastTickMs += delta * 1000;
                const prev = m.timerSeconds;
                m.timerSeconds += delta;
                this.checkAudioAlerts(prev);
            }

            syncHalftime() {
                const m = this.state.match;
                if (m.status !== 'halftime') return;
                if (!m.halftimeStartMs) m.halftimeStartMs = Date.now() - m.halftimeSeconds * 1000;
                m.halftimeSeconds = Math.max(0, Math.floor((Date.now() - m.halftimeStartMs) / 1000));
            }

            refreshTimerDisplay() {
                const t = document.getElementById('match-timer');
                if (t) t.textContent = this.formatTime(this.state.match.timerSeconds);
                const h = document.getElementById('halftime-timer');
                if (h) {
                    this.syncHalftime();
                    h.textContent = this.formatTime(this.state.match.halftimeSeconds);
                }
            }

            startTimerInterval() {
                if (this.timerHandle) clearInterval(this.timerHandle);
                this.timerHandle = setInterval(() => {
                    this.syncTimer();
                    this.refreshTimerDisplay();
                    if (this.state.match.timerRunning) this.saveToStorage();
                }, 1000);
            }

            goToHalftime() {
                const m = this.state.match;
                if (m.status !== 'first_half') return;
                this.syncTimer();
                m.status = 'halftime';
                m.timerRunning = false;
                m.lastTickMs = null;
                if (this.timerHandle) { clearInterval(this.timerHandle); this.timerHandle = null; }
                // El cronómetro del descanso arranca automáticamente
                m.halftimeSeconds = 0;
                m.halftimeStartMs = Date.now();
                this.startHalftimeInterval();
                this.saveToStorage();
                this.render();
            }

            // Por si se pulsa "Ir al descanso" por error: vuelve a la 1ª parte donde se quedó
            cancelHalftime() {
                const m = this.state.match;
                if (m.status !== 'halftime') return;
                if (this.halftimeHandle) { clearInterval(this.halftimeHandle); this.halftimeHandle = null; }
                m.status = 'first_half';
                m.currentHalf = 1;
                m.halftimeSeconds = 0;
                m.halftimeStartMs = null;
                m.timerRunning = true;
                m.lastTickMs = Date.now();
                this.startTimerInterval();
                this.saveToStorage();
                this.render();
            }

            startHalftimeInterval() {
                if (this.halftimeHandle) clearInterval(this.halftimeHandle);
                this.halftimeHandle = setInterval(() => {
                    this.refreshTimerDisplay();
                    this.saveToStorage();
                }, 1000);
            }

            startSecondHalf() {
                this.askConfirm('¿Iniciar la 2ª parte?', () => {
                    if (this.halftimeHandle) { clearInterval(this.halftimeHandle); this.halftimeHandle = null; }
                    const m = this.state.match;
                    m.status = 'second_half';
                    m.currentHalf = 2;
                    m.timerSeconds = m.halfDuration * 60;
                    m.timerRunning = true;
                    m.lastTickMs = Date.now();
                    m.halftimeStartMs = null;
                    this.startTimerInterval();
                    this.render();
                }, 'Iniciar 2ª parte');
            }

            toggleTimer() {
                const m = this.state.match;
                if (m.timerRunning) {
                    this.syncTimer();
                    m.timerRunning = false;
                    m.lastTickMs = null;
                } else {
                    m.timerRunning = true;
                    m.lastTickMs = Date.now();
                    if (!this.timerHandle) this.startTimerInterval();
                }
                this.render();
            }

            finishMatch() {
                this.askConfirm('¿Finalizar el encuentro definitivamente?', () => {
                    this.syncTimer();
                    const m = this.state.match;
                    m.status = 'finished';
                    m.timerRunning = false;
                    m.lastTickMs = null;
                    this.stopTimers();
                    this.switchTab('stats');
                }, 'Finalizar');
            }

                const secTarget = min * 60;

                if (!this.state.audioAlerts.customAlarms) this.state.audioAlerts.customAlarms = [];
                this.state.audioAlerts.customAlarms.push(secTarget);
                this.saveToStorage();
                alert(`Alarma de voz fijada para el minuto ${min}.`);
                this.closeModal();
            }

            handleFileOCR(event) {
                const input = event.target;
                const file = input.files && input.files[0];
                input.value = '';
                if (!file) return;

                const isImage = file.type.startsWith('image/');
                const isText = /\.(txt|csv)$/i.test(file.name) || file.type === 'text/plain' || file.type === 'text/csv';
                if (!isImage && !isText) {
                    alert('Formato no admitido. Usa un archivo .txt, .csv o una imagen.');
                    return;
                }
                if (file.size > (isImage ? 8 : 1) * 1024 * 1024) {
                    alert(`El archivo es demasiado grande (máximo ${isImage ? 8 : 1} MB).`);
                    return;
                }

                const loadingEl = document.getElementById('ocr-loading');
                const done = () => { if (loadingEl) loadingEl.classList.add('hidden'); };
                if (loadingEl) loadingEl.classList.remove('hidden');

                if (isImage) {
                    if (typeof Tesseract === 'undefined') {
                        done();
                        alert('El lector de imágenes (OCR) no está disponible. Comprueba tu conexión.');
                        return;
                    }
                    Tesseract.recognize(file, 'spa').then(({ data: { text } }) => {
                        done();
                        this.parseOCRTextToSquad(text);
                    }).catch(() => {
                        done();
                        alert('Error al procesar la imagen.');
                    });
                } else {
                    const reader = new FileReader();
                    reader.onload = (e) => { done(); this.parseOCRTextToSquad(String(e.target.result)); };
                    reader.onerror = () => { done(); alert('No se pudo leer el archivo.'); };
                    reader.readAsText(file);
                }
            }

            parseOCRTextToSquad(text) {
                const taken = new Set(this.state.squad.map(p => p.number));
                const found = [];
                String(text).replace(/^\uFEFF/, '').split(/\r?\n/).slice(0, 300).forEach(line => {
                    const match = line.match(/^\s*(\d{1,2})(?!\d)\s*[\.\-,;\t]?\s*(.+)/);
                    if (!match) return;
                    const num = parseInt(match[1], 10);
                    let name = match[2].trim().replace(/^[,;]+/, '').trim();
                    name = name.replace(/^"(.*)"$/, '$1').replace(/""/g, '"').replace(/^'(?=[=+\-@])/, '');
                    name = cleanText(name, 40);
                    if (name.length > 2 && !taken.has(num)) {
                        taken.add(num);
                        found.push({ num, name });
                    }
                });
                found.length = Math.min(found.length, Math.max(0, 100 - this.state.squad.length));

                if (found.length === 0) {
                    alert('No se han detectado jugadores nuevos. Formato esperado: dorsal y nombre en cada línea (ej: 9 Juan Pérez).');
                    return;
                }
                const preview = found.slice(0, 25).map(f => `#${f.num} ${f.name}`).join('\n')
                    + (found.length > 25 ? `\n… y ${found.length - 25} más` : '');
                if (!confirm(`Se han detectado ${found.length} jugadores nuevos:\n\n${preview}\n\n¿Añadirlos a la plantilla?`)) return;

                found.forEach(f => {
                    this.state.squad.push({
                        id: newId('p'),
                        name: f.name, number: f.num, position: f.num === 1 ? 'POR' : 'MED',
                        status: 'unconvoked',
                        inMinute: null, outMinute: null, goals: 0, goalMinutes: [], goalTypes: [], assists: 0, yellowCards: 0, redCard: false, captain: false
                    });
                });
                alert(`¡Plantilla actualizada! Se han incorporado ${found.length} jugadores.`);
                this.render();
            }

            submitGoalLasalle() {
                const scorerEl = document.getElementById('goal-scorer');
                const scorer = this.state.squad.find(p => p.id === (scorerEl ? scorerEl.value : ''));
                if (!scorer) {
                    alert('No hay ningún titular disponible para anotar el gol.');
                    return;
                }
                const typeVal = document.getElementById('goal-type').value;
                const goalType = GOAL_TYPES.includes(typeVal) ? typeVal : 'normal';
                const isOwn = goalType === 'own';
                const assistId = isOwn ? '' : document.getElementById('goal-assist').value;
                const min = this.readMinute('goal-min');

                if (assistId && scorer.id === assistId) {
                    alert('Error: Un mismo jugador no puede anotar el gol y darse la asistencia a sí mismo.');
                    return;
                }
                const assist = assistId ? this.state.squad.find(p => p.id === assistId) : null;
                const snap = this.takeSnapshot();

                let ev;
                if (isOwn) {
                    // Gol en propia puerta: suma para el rival y no cuenta como gol del jugador
                    this.state.score.rival++;
                    ev = {
                        id: newId('ev'), minute: min, type: 'own_goal', team: 'rival',
                        title: `Gol en propia puerta de #${scorer.number} ${scorer.name} (suma para el rival)`,
                        detail: `Minuto ${min}'`
                    };
                } else {
                    scorer.goals++;
                    scorer.goalMinutes.push(min);
                    scorer.goalTypes.push(goalType);
                    if (assist) assist.assists++;
                    this.state.score.local++;

                    let typeLabel = '';
                    if (goalType === 'penalty') typeLabel = ' (Penalti)';
                    else if (goalType === 'freekick') typeLabel = ' (Falta Directa)';

                    ev = {
                        id: newId('ev'), minute: min, type: 'goal', team: 'local',
                        title: `Gol #${scorer.number} ${scorer.name}${typeLabel}`,
                        detail: assist ? `Asistencia: #${assist.number} ${assist.name}` : 'Sin asistencia'
                    };
                }
                this.commitEvent(ev, snap);
                this.closeModal();
                this.render();
            }

            submitGoalRival() {
                const num = cleanText(document.getElementById('away-goal-num').value, 3);
                const typeVal = document.getElementById('away-goal-type').value;
                const goalType = GOAL_TYPES.includes(typeVal) ? typeVal : 'normal';

                const snap = this.takeSnapshot();
                const who = `${this.rivalName()} ${num ? '(#' + num + ')' : ''}`.trim();

                    this.state.score.local++;
                    ev = {
                        id: newId('ev'), minute: min, type: 'own_goal_away', team: 'local',
                        title: `Gol en propia puerta de ${who} (suma para nuestro equipo)`,

                } else {

                    let typeLabel = '';
                    if (goalType === 'penalty') typeLabel = ' (Penalti)';
                    else if (goalType === 'freekick') typeLabel = ' (Falta Directa)';
                    ev = {
                        id: newId('ev'), minute: min, type: 'goal_away', team: 'rival',
                        title: `Gol de ${who}${typeLabel}`,

            submitSubHome() {
                const isHalftime = this.state.match.status === 'halftime';
                const countsEl = document.getElementById('sub-counts');
                const counts = !!(countsEl && countsEl.checked);
                if (counts && this.state.windows.home.used >= 3) {
                    alert('Ya se han usado las 3 ventanas de cambios. Si este cambio no debe contar como ventana, desmarca "Cuenta como ventana de cambios".');
                    return;
                }

                const rows = Array.from(document.querySelectorAll('#sub-rows .sub-row'));
                const pairs = rows.map(r => ({
                    pOut: this.state.squad.find(p => p.id === r.querySelector('.sub-out').value),
                    pIn: this.state.squad.find(p => p.id === r.querySelector('.sub-in').value)
                }));
                const outIds = pairs.map(x => x.pOut && x.pOut.id);
                const inIds = pairs.map(x => x.pIn && x.pIn.id);
                if (pairs.length === 0 || pairs.some(x => !x.pOut || !x.pIn)
                    || new Set(outIds).size !== outIds.length || new Set(inIds).size !== inIds.length) {
                    alert('Revisa los cambios: cada fila necesita un jugador que sale y otro que entra, sin repetir jugadores.');
                    return;
                }
                const min = this.readMinute('sub-min');
                const snap = this.takeSnapshot();

                pairs.forEach(({ pOut, pIn }) => {
                    pOut.status = 'substituted';
                    pOut.outMinute = min;
                    pIn.status = 'starter';
                    pIn.inMinute = min;
                });
                if (counts) this.state.windows.home.used++;

                const lines = pairs.map(({ pOut, pIn }) => `Entra #${pIn.number} ${pIn.name} / Sale #${pOut.number} ${pOut.name}`);
                const title = pairs.length === 1 ? `Cambio: ${lines[0]}` : `Cambio múltiple (${pairs.length}): ${lines.join(' · ')}`;
                let detail;
                if (counts) detail = `${isHalftime ? 'Descanso · ' : ''}Ventana Local #${this.state.windows.home.used}`;
                else detail = isHalftime ? 'Descanso (sin ventana)' : 'Cambio sin ventana';

                this.commitEvent({ id: newId('ev'), minute: min, type: 'sub', team: 'home', title, detail }, snap);
                this.closeModal();
                this.render();
            }

            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }

            calculatePlayerMinutes(p) {
                if (p.status === 'unconvoked') return 0;
                let total = 0;
                const totalMatchDuration = this.state.match.halfDuration * 2;
                
                if (p.status === 'starter') {
                    const outMin = p.outMinute !== null ? p.outMinute : totalMatchDuration;
                    const inMin = p.inMinute !== null ? p.inMinute : 0;
                    total += (outMin - inMin);
                } else if (p.status === 'substituted' || p.status === 'out') {
                    const outMin = p.outMinute !== null ? p.outMinute : 0;
                    const inMin = p.inMinute !== null ? p.inMinute : 0;
                    total += (outMin - inMin);
                } else if (p.status === 'bench' && p.inMinute !== null) {
                    const outMin = p.outMinute !== null ? p.outMinute : totalMatchDuration;
                    total += (outMin - p.inMinute);
                }
                return Math.max(0, total);
            }

            async generateWhatsAppPDF() {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                doc.setFillColor(0, 43, 102);
                doc.rect(0, 0, 210, 40, 'F');
                
                doc.setTextColor(255, 204, 0);
                doc.setFontSize(18);
                doc.text("STATBENCH 360", 20, 25);
                
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(11);
                doc.text(`ACTA OFICIAL - ${this.state.match.competition || 'LIGA'} (JORNADA ${this.state.match.matchday})`, 75, 25);

                doc.setTextColor(30, 30, 30);
                doc.setFontSize(11);
                doc.text(`Encuentro: ${this.state.match.homeTeam} vs ${this.state.match.awayTeam}`, 14, 50);
                doc.text(`Fecha: ${this.state.match.date} | Competición: ${this.state.match.competition}`, 14, 57);
                doc.text(`Resultado Final: ${this.state.match.homeTeam} ${this.homeScore()} - ${this.awayScore()} ${this.state.match.awayTeam}`, 14, 64);

                doc.setFontSize(12);
                doc.setTextColor(0, 43, 102);
                doc.text("ESTADÍSTICAS DETALLADAS DE JUGADORES", 14, 78);

                let y = 86;
                doc.setFontSize(9);
                doc.setTextColor(50, 50, 50);

                const activePlayers = this.state.squad.filter(p => p.status !== 'unconvoked');
                activePlayers.forEach(p => {
                    if (y > 270) { doc.addPage(); y = 20; }
                    const mins = this.calculatePlayerMinutes(p);
                    const capTxt = p.captain ? ' (Capitán)' : '';
                    const infoLine = `#${p.number} ${p.name}${capTxt} | Mins: ${mins}' | Goles: ${p.goals} | Asist: ${p.assists} | Amarillas: ${p.yellowCards} | Roja: ${p.redCard ? 'Sí' : 'No'}`;
                    doc.splitTextToSize(infoLine, 182).forEach(l => {
                        if (y > 280) { doc.addPage(); y = 20; }
                        doc.text(l, 14, y);
                        y += 5;
                    });
                    y += 2;
                });

                y += 5;
                if (y > 260) { doc.addPage(); y = 20; }
                doc.setFontSize(12);
                doc.setTextColor(0, 43, 102);
                doc.text("CRONOLOGÍA DE INCIDENCIAS", 14, y);
                y += 8;
                doc.setFontSize(9);
                doc.setTextColor(50, 50, 50);

                const sortedEvents = [...this.state.events].sort((a, b) => a.minute - b.minute);
                sortedEvents.forEach(ev => {
                    if (y > 270) { doc.addPage(); y = 20; }
                    doc.splitTextToSize(`[Minuto ${ev.minute}'] ${ev.title} - ${ev.detail}`, 182).forEach(l => {
                        if (y > 280) { doc.addPage(); y = 20; }
                        doc.text(l, 14, y);
                        y += 5;
                    });
                    y += 1;
                });

                const sanitizedHome = safeFile(this.state.match.homeTeam) || 'Local';
                const sanitizedAway = safeFile(this.state.match.awayTeam) || 'Rival';
                const jornadaNum = safeFile(this.state.match.matchday) || '1';
                const fechaStr = this.state.match.date || 'fecha';
                const pdfFileName = `Acta_${jornadaNum}_${fechaStr}_${sanitizedHome}_${sanitizedAway}.pdf`;

                const pdfBlob = doc.output('blob');
                const file = new File([pdfBlob], pdfFileName, { type: 'application/pdf' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            title: 'Acta StatBench360',
                            text: `Acta del partido ${this.state.match.homeTeam} vs ${this.state.match.awayTeam}. Resultado: ${this.homeScore()}-${this.awayScore()}`,
                            files: [file]
                        });
                        return;
                    } catch (error) {
                        console.log('Error en share nativo:', error);
                    }
                }

                const link = document.createElement('a');
                link.href = URL.createObjectURL(pdfBlob);
                link.download = pdfFileName;
                link.click();
                alert('Acta generada y descargada. Adjúntala manualmente en WhatsApp.');
            }

            exportGoogleDriveSheet() {
                const m = this.state.match;
                const header = ['Competicion', 'EquipoLocal', 'EquipoRival', 'Jornada', 'Fecha', 'Jugador', 'Dorsal', 'Posicion',
                    'Capitan', 'MinutosJugados', 'Goles', 'MinutosGoles', 'Asistencias', 'TarjetasAmarillas', 'TarjetaRoja'].join(',');
                const rows = this.state.squad.filter(p => p.status !== 'unconvoked').map(p => [
                    csvCell(m.competition), csvCell(m.homeTeam), csvCell(m.awayTeam), csvCell(m.matchday), csvCell(m.date),
                    csvCell(p.name), p.number, p.position, p.captain ? 'Sí' : 'No', this.calculatePlayerMinutes(p),
                    p.goals, csvCell(p.goalMinutes.join('-')), p.assists, p.yellowCards, p.redCard ? 'Sí' : 'No'
                ].join(','));

                const fileName = 'Estadisticas_' + safeFile(m.homeTeam) + '_vs_' + safeFile(m.awayTeam) + '_J' + safeFile(m.matchday) + '.csv';
                this.downloadCSV(fileName, [header, ...rows].join('\r\n') + '\r\n');
                alert('¡Estadísticas exportadas con éxito!');
            }
        }

        const app = new FutStatApp();
    </script>
</body>
